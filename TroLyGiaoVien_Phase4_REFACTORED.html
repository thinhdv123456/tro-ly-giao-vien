            {normalizing ? <><svg className="animate-spin w-5 h-5" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="3" strokeDasharray="30 60"/></svg> Đang chuẩn hoá...</> : <><Icon name="Wand2" size={20} /> 🪄 AI Chuẩn Hoá Văn Bản</>}
          </button>
        </div>
      )}

      {/* KẾT QUẢ */}
      {step === 2 && (
        <div className="space-y-4">
          {generating && (
            <div className="soft-card p-10 text-center">
              <svg className="animate-spin w-10 h-10 mx-auto text-rose-400 mb-4" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="3" strokeDasharray="30 60"/></svg>
              <p className="text-slate-600 font-medium">AI đang tạo ngữ liệu theo yêu cầu...</p>
              <p className="text-sm text-slate-400 mt-1 italic">Đang chọn tác giả đương đại, kiểm tra dung lượng, soạn câu hỏi gợi ý...</p>
            </div>
          )}
          {!generating && results.length > 0 && (
            <>
              <div className="flex items-center justify-between flex-wrap gap-3 mb-2">
                <div>
                  <h3 className="font-bold text-slate-800 text-lg">✅ {results.length} ngữ liệu cho đề {cfg?.label || ''}</h3>
                  <p className="text-sm text-slate-500">Nhấn "Thêm vào Kho" để lưu ngữ liệu cô chọn → dùng khi ra đề</p>
                </div>
                <button onClick={() => { setStep(1); setResults([]); setSavedIds([]); }} className="text-sm text-rose-500 hover:text-rose-700 flex items-center gap-1 border border-rose-100 px-3 py-1.5 rounded-lg hover:bg-rose-50 transition">
                  <Icon name="RefreshCw" size={14} /> Tạo lại
                </button>
              </div>
              {results.map((item, idx) => (
                <div key={idx} className={`soft-card p-5 border-l-4 transition ${savedIds.includes(idx) ? 'border-teal-400 bg-teal-50/20' : 'border-rose-300'}`}>
                  <div className="flex items-start justify-between gap-3 flex-wrap mb-3">
                    <div className="flex-1">
                      <h4 className="font-bold text-slate-800 text-base font-display">{item.title || 'Không tiêu đề'}</h4>
                      <p className="text-sm text-slate-500 mt-1 flex flex-wrap gap-2">
                        {item.author && <span>✍️ {item.author}</span>}
                        {item.source && <span>📌 {item.source}</span>}
                        <span className="bg-rose-100 text-rose-700 px-2 py-0.5 rounded-full text-xs font-medium">{item.wordCount || '?'} chữ</span>
                        {item.theme && <span className="bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full text-xs font-medium">{item.theme}</span>}
                        {item.suitableFor && <span className="bg-teal-100 text-teal-700 px-2 py-0.5 rounded-full text-xs font-medium">{item.suitableFor}</span>}
                      </p>
                    </div>
                    <div className="flex flex-col gap-2 flex-shrink-0">
                      {savedIds.includes(idx)
                        ? <span className="px-4 py-2 bg-teal-100 text-teal-700 rounded-xl font-semibold text-sm flex items-center gap-1.5"><Icon name="Check" size={14} /> Đã thêm vào Kho</span>
                        : <button onClick={() => handleSave(item, idx)} className="px-4 py-2 bg-gradient-to-r from-rose-500 to-pink-500 text-white rounded-xl font-semibold text-sm hover:shadow-md transition flex items-center gap-1.5"><Icon name="Plus" size={14} /> Thêm vào Kho</button>
                      }
                      {onCreateExam && (
                        <button
                          onClick={() => {
                            if (!savedIds.includes(idx)) handleSave(item, idx);
                            onCreateExam(item);
                          }}
                          className="px-4 py-2 bg-gradient-to-r from-teal-600 to-emerald-500 text-white rounded-xl font-semibold text-sm hover:shadow-md transition flex items-center gap-1.5"
                        >
                          <Icon name="FileCheck" size={14} /> Tạo đề thi ngay
                        </button>
                      )}
                    </div>
                  </div>
                  <details className="mb-3">
                    <summary className="text-sm font-semibold text-rose-600 cursor-pointer hover:text-rose-800 select-none py-1">📄 Xem toàn bộ nội dung ngữ liệu ▸</summary>
                    <div className="mt-3 p-4 bg-amber-50/60 rounded-xl border border-amber-100 text-sm text-slate-800 whitespace-pre-wrap leading-relaxed font-serif">{item.fullText}</div>
                  </details>
                  {item.excerpt && <div className="p-3 bg-rose-50 rounded-lg border-l-2 border-rose-300 text-sm italic text-rose-800 mb-3">"{item.excerpt}"</div>}
                  {item.suggestedQuestions && item.suggestedQuestions.length > 0 && (
                    <div className="bg-slate-50 rounded-xl p-4 border border-slate-100 mb-3">
                      <p className="text-xs font-bold text-slate-500 mb-2 uppercase tracking-wide">💡 Câu hỏi gợi ý</p>
                      <div className="space-y-1.5">
                        {item.suggestedQuestions.map((q, qi) => (
                          <div key={qi} className="flex items-start gap-2 text-sm text-slate-700">
                            <span className="font-bold text-rose-400 flex-shrink-0">C{qi+1}.</span><span>{q}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                  {item.whyGood && <p className="text-xs text-teal-700 italic bg-teal-50 px-3 py-2 rounded-lg border border-teal-100">✅ {item.whyGood}</p>}
                  {item.notes && <p className="text-xs text-amber-700 mt-2 italic bg-amber-50 px-3 py-2 rounded-lg border border-amber-100 mt-2">📌 {item.notes}</p>}
                </div>
              ))}
            </>
          )}
        </div>
      )}
    </div>
  );
};

// ============== 🤖 RA ĐỀ TỰ ĐỘNG (AUTO-GENERATE EXAM) ==============
const AutoGenExamView = ({ data, setData, selectedClass, teacherName, schoolName, onBack }) => {
  const [selectedGrade, setSelectedGrade] = useState(selectedClass || 6);
  const [selectedGenre, setSelectedGenre] = useState('van_hoc');
  const [selectedTheme, setSelectedTheme] = useState('');
  const [selectedExamType, setSelectedExamType] = useState('45p');
  const [questionType, setQuestionType] = useState('mix'); // 'mix' | 'tn' | 'tl' — chọn TRƯỚC khi tạo
  const [generating, setGenerating] = useState(false);
  const [generatedExam, setGeneratedExam] = useState(null);
  const [preview, setPreview] = useState(false);

  // Kết hợp kho tĩnh + kho người dùng
  const allPassages = [...PASSAGES_BANK, ...(data.passages || []).filter(p => p.approved)];
  const filteredByGradeGenre = allPassages.filter(p => p.class === selectedGrade && p.genre === selectedGenre);
  const themesForSelection = [...new Set(filteredByGradeGenre.map(p => p.theme).filter(Boolean))];
  const passagesForSelection = selectedTheme
    ? filteredByGradeGenre.filter(p => p.theme === selectedTheme)
    : filteredByGradeGenre;

  const generateExam = async () => {
    if (passagesForSelection.length === 0) {
      alert('Không có ngữ liệu phù hợp. Hãy thêm ngữ liệu vào Kho Ngữ Liệu trước!');
      return;
    }
    setGenerating(true);
    try {
      const passage = passagesForSelection[Math.floor(Math.random() * passagesForSelection.length)];
      const examConfig = LOAI_DE.find(l => l.id === selectedExamType) || LOAI_DE[0];
      const themeName = THEMES[passage.theme] || passage.theme || 'Chủ đề tổng hợp';
      const genreInfo = LOAI_VAN_BAN.find(l => l.id === selectedGenre);
      const loaiDe = examConfig.ten;
      const totalScore = examConfig.totalScore;

      // Prompt chuẩn GDPT 2018 — 2 phần: Đọc hiểu 3đ + Viết 7đ — JSON output
      const prompt = `Bạn là giáo viên Ngữ Văn THCS chuyên nghiệp. Hãy tạo đề kiểm tra "${loaiDe}" môn Ngữ văn lớp ${selectedGrade} theo chuẩn GDPT 2018.

NGỮ LIỆU (${genreInfo?.ten || 'Văn bản'} — NGOÀI SÁCH GIÁO KHOA):
Tiêu đề: ${passage.title}
Tác giả: ${passage.author || 'Không rõ'}
Nội dung:
"${(passage.fullText || passage.content || '').substring(0, 600)}"

YÊU CẦU CẤU TRÚC ĐỀ (${totalScore} điểm — 2 PHẦN):

PHẦN I. ĐỌC HIỂU (3.0 điểm) — 5 câu, câu hỏi gắn với ngữ liệu trên. ${buildQuestionTypeInstruction(questionType)}
  - Câu 1 (0.5đ) [Nhận biết]: Xác định thể loại/phương thức biểu đạt/ngôi kể
  - Câu 2 (0.5đ) [Nhận biết]: Chi tiết, hình ảnh, từ ngữ đặc sắc trong văn bản
  - Câu 3 (0.5đ) [Thông hiểu]: Ý nghĩa nội dung / biện pháp tu từ / cấu trúc câu
  - Câu 4 (0.5đ) [Thông hiểu]: Phân tích ý nghĩa chi tiết / giải thích ngôn ngữ
  - Câu 5 (1.0đ) [Vận dụng]: Rút ra bài học / liên hệ bản thân / nhận xét

PHẦN II. VIẾT (7.0 điểm) — 1 bài viết hoàn chỉnh:
  - Câu 6 (${selectedExamType === '15p' ? '3.0đ' : '7.0đ'}) [Vận dụng cao]: Viết ${selectedExamType === '15p' ? 'đoạn văn nghị luận (150-200 chữ)' : 'bài văn nghị luận (400-600 chữ)'} về chủ đề gợi ra từ văn bản hoặc phân tích tác phẩm văn học liên quan

ĐỊNH DẠNG OUTPUT (JSON thuần túy, KHÔNG markdown, KHÔNG backtick, xuống dòng trong chuỗi PHẢI viết là \\n):
{
  "cauHoi": "PHẦN I. ĐỌC HIỂU (3.0 điểm)\\nĐọc văn bản sau và thực hiện các yêu cầu:\\n${{
    tn: 'Câu 1 (0.5đ): [câu hỏi]\\\\nA. ... B. ... C. ... D. ...\\\\nCâu 2 (0.5đ): [câu hỏi]\\\\nA. ... B. ... C. ... D. ...\\\\nCâu 3 (0.5đ): [câu hỏi]\\\\nA. ... B. ... C. ... D. ...\\\\nCâu 4 (0.5đ): [câu hỏi]\\\\nA. ... B. ... C. ... D. ...\\\\nCâu 5 (1.0đ): [câu hỏi]\\\\nA. ... B. ... C. ... D. ...',
    tl: 'Câu 1 (0.5đ): [câu hỏi tự luận]\\\\nCâu 2 (0.5đ): [câu hỏi tự luận]\\\\nCâu 3 (0.5đ): [câu hỏi tự luận]\\\\nCâu 4 (0.5đ): [câu hỏi tự luận]\\\\nCâu 5 (1.0đ): [câu hỏi tự luận]',
    mix: 'Câu 1 (0.5đ): [câu hỏi]\\\\nA. ... B. ... C. ... D. ...\\\\nCâu 2 (0.5đ): [câu hỏi]\\\\nA. ... B. ... C. ... D. ...\\\\nCâu 3 (0.5đ): [câu hỏi]\\\\nA. ... B. ... C. ... D. ...\\\\nCâu 4 (0.5đ): [câu hỏi]\\\\nA. ... B. ... C. ... D. ...\\\\nCâu 5 (1.0đ): [câu hỏi tự luận]',
  }[questionType]}\\nPHẦN II. VIẾT (7.0 điểm)\\nCâu 6 (7.0đ): [đề bài viết]",
  "dapAn": "PHẦN I. ĐỌC HIỂU\\nCâu 1: [đáp án + giải thích]\\nCâu 2: [đáp án]\\nCâu 3: [đáp án]\\nCâu 4: [đáp án]\\nCâu 5: [gợi ý trả lời]\\nPHẦN II. VIẾT\\nCâu 6: [dàn ý gợi ý + tiêu chí chấm điểm]"
}

Chú ý: Câu hỏi Đọc hiểu PHẢI BÁM SÁT ngữ liệu. Câu trắc nghiệm (nếu có) phải có 4 lựa chọn A/B/C/D.`;

      const result = await callGroqAPI(prompt, 2000);
      if (result.error) { alert(result.error); setGenerating(false); return; }

      const parsed = parseAIExamJson(result.text, ['cauHoi', 'dapAn']);
      if (!parsed.ok) {
        alert('⚠️ AI trả về định dạng không đọc được. Cô bấm "🤖 Tạo Đề Tự Động" lại để thử lần nữa.');
        setGenerating(false);
        return;
      }
      const cauHoi = parsed.data.cauHoi || '';
      const dapAn = parsed.data.dapAn || cauHoi;

      const exam = {
        id: Date.now(),
        title: `Đề ${loaiDe} Ngữ văn ${selectedGrade} — ${themeName}`,
        grade: selectedGrade,
        theme: passage.theme || selectedTheme,
        examType: selectedExamType,
        duration: examConfig.duration,
        totalScore,
        passageTitle: passage.title,
        passageContent: passage.fullText || passage.content,
        passageAuthor: passage.author || '',
        passageGenre: selectedGenre,
        questions: [],
        questionText: cauHoi,
        answerKey: dapAn || cauHoi,
        aiGenerated: true,
        generatedWith: 'groq',
        createdAt: new Date().toISOString()
      };

      setGeneratedExam(exam);
      setPreview(true);
    } catch (e) {
      alert(`Lỗi tạo đề: ${e.message}`);
    } finally {
      setGenerating(false);
    }
  };

  const saveExam = () => {
    if (!generatedExam) return;
    const list = data.exams || [];
    setData({ ...data, exams: [...list, generatedExam] });
    alert('✅ Lưu đề thành công!');
    setGeneratedExam(null);
    setPreview(false);
  };

  return (
    <div className="space-y-6 fade-in">
      {onBack && <BackBtn onClick={onBack} label="← Đề kiểm tra" />}
      <div className="bg-gradient-to-r from-rose-50 via-amber-50 to-teal-50 border border-rose-200 rounded-xl p-5">
        <h3 className="text-lg font-bold text-rose-800 mb-2 flex items-center gap-2"><Icon name="Sparkles" size={20} /> 🤖 Ra Đề Tự Động — GDPT 2018</h3>
        <p className="text-sm text-rose-700">AI sẽ sinh đề kiểm tra theo <strong>chuẩn GDPT 2018 — 2 phần</strong> (PHẦN I: Đọc hiểu 3đ · PHẦN II: Viết 7đ) từ ngữ liệu NGOÀI sách giáo khoa.</p>
      </div>

      <div className="bg-white rounded-xl border p-6 space-y-4">
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div>
            <label className="block text-sm font-bold mb-2">Lớp *</label>
            <select value={selectedGrade} onChange={e => { setSelectedGrade(Number(e.target.value)); setSelectedTheme(''); }} className="w-full px-3 py-2.5 border rounded-lg bg-white">
              {[6,7,8,9].map(g => <option key={g} value={g}>Lớp {g}</option>)}
            </select>
          </div>
          <div>
            <label className="block text-sm font-bold mb-2">Loại văn bản</label>
            <select value={selectedGenre} onChange={e => { setSelectedGenre(e.target.value); setSelectedTheme(''); }} className="w-full px-3 py-2.5 border rounded-lg bg-white">
              {LOAI_VAN_BAN.map(l => <option key={l.id} value={l.id}>{l.icon} {l.ten}</option>)}
            </select>
          </div>
          <div>
            <label className="block text-sm font-bold mb-2">Chủ đề</label>
            <select value={selectedTheme} onChange={e => setSelectedTheme(e.target.value)} className="w-full px-3 py-2.5 border rounded-lg bg-white">
              <option value="">-- Tất cả ({passagesForSelection.length} ngữ liệu)</option>
              {themesForSelection.map(t => <option key={t} value={t}>{THEMES[t] || t}</option>)}
            </select>
          </div>
          <div>
            <label className="block text-sm font-bold mb-2">Loại đề *</label>
            <select value={selectedExamType} onChange={e => setSelectedExamType(e.target.value)} className="w-full px-3 py-2.5 border rounded-lg bg-white">
              {LOAI_DE.map(l => <option key={l.id} value={l.id}>{l.ten}</option>)}
            </select>
          </div>
        </div>

        <div>
          <label className="block text-sm font-bold mb-2">🔘 Loại câu hỏi Đọc hiểu</label>
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
            {QUESTION_TYPE_OPTIONS.map(opt => (
              <button key={opt.id} type="button" onClick={() => setQuestionType(opt.id)} title={opt.desc}
                className={`text-left px-3 py-2 rounded-lg border text-xs font-medium transition ${questionType === opt.id ? 'bg-rose-600 border-rose-600 text-white shadow' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'}`}>
                {opt.label}
              </button>
            ))}
          </div>
          <p className="text-[11px] text-slate-400 mt-1">{QUESTION_TYPE_OPTIONS.find(o => o.id === questionType)?.desc}</p>
        </div>

        {passagesForSelection.length === 0 && (
          <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 text-sm text-amber-800">
            ⚠️ Chưa có ngữ liệu cho lớp {selectedGrade} — loại <em>{LOAI_VAN_BAN.find(l => l.id === selectedGenre)?.ten}</em>. Hãy thêm vào tab <strong>📚 Kho Ngữ Liệu</strong>.
          </div>
        )}

        <button onClick={generateExam} disabled={passagesForSelection.length === 0 || generating}
          className="w-full bg-gradient-to-r from-rose-600 via-pink-500 to-amber-500 text-white px-6 py-3.5 rounded-xl font-bold flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed hover:shadow-lg text-base">
          <Icon name={generating ? 'Loader' : 'Sparkles'} size={20} />
          {generating ? '⏳ Đang tạo đề...' : '🤖 Tạo Đề Tự Động'}
        </button>

        {generatedExam && (
          <div className="pt-4 border-t space-y-3">

          <div className="text-center mb-6">
            <h1 className="text-xl font-bold uppercase">ĐỀ KIỂM TRA MÔN NGỮ VĂN - LỚP {generatedExam.grade}</h1>

            <p className="font-bold italic mb-2">📖 Đọc văn bản sau và thực hiện các yêu cầu:</p>
            <p className="font-semibold mb-1 text-center">{generatedExam.passageTitle}</p>
            <p style={{whiteSpace:'pre-wrap'}} className="text-sm">{generatedExam.passageContent}</p>
            {generatedExam.passageAuthor && <p className="text-right text-xs text-slate-500 mt-2 italic">— {generatedExam.passageAuthor}</p>}
          </div>
          <div className="border-t pt-4">
            <div style={{whiteSpace:'pre-wrap', fontFamily:'Times New Roman,serif', fontSize:'13pt', lineHeight:'1.8'}} className="text-sm">{generatedExam.questionText || generatedExam.answerKey}</div>
          </div>
          {generatedExam.questionText && generatedExam.answerKey && generatedExam.questionText !== generatedExam.answerKey && (
            <div className="border-t pt-4 mt-4">
              <h3 className="font-bold text-center uppercase mb-3" style={{fontFamily:'Times New Roman,serif'}}>HƯỚNG DẪN CHẤM VÀ BIỂU ĐIỂM</h3>

            </div>
          )}
          <p className="text-center italic mt-8">─────────────── HẾT ───────────────</p>
        </div>
      )}
    </div>
  );
};

      { id: 55, name: '🏛️ Tờ khai: Mẫu tờ khai thông tin cá nhân', size: '100 KB', uploadedAt: '2026-04-21', content: 'Mẫu tờ khai thông tin cá nhân chuẩn mực...' },

      // 💡 TÀI LIỆU THAM KHẢO (10 bài)
      { id: 56, name: '💡 Ngữ pháp: Quy tắc cơ bản tiếng Việt', size: '150 KB', uploadedAt: '2026-04-21', content: 'Tổng hợp các quy tắc ngữ pháp cơ bản của tiếng Việt...' },
      { id: 57, name: '💡 Từ vựng: Từ điển từ đồng nghĩa', size: '180 KB', uploadedAt: '2026-04-21', content: 'Danh sách những từ đồng nghĩa hay dùng trong tiếng Việt...' },
      { id: 58, name: '💡 Thành ngữ: 100 thành ngữ phổ biến', size: '140 KB', uploadedAt: '2026-04-21', content: 'Danh sách 100 thành ngữ phổ biến trong tiếng Việt cùng giải thích...' },
      { id: 59, name: '💡 Chính tả: Quy tắc viết hoa đúng', size: '110 KB', uploadedAt: '2026-04-21', content: 'Hướng dẫn chi tiết về quy tắc viết hoa trong tiếng Việt...' },
      { id: 60, name: '💡 Dấu câu: Hướng dẫn sử dụng dấu câu', size: '130 KB', uploadedAt: '2026-04-21', content: 'Hướng dẫn chi tiết về cách sử dụng dấu câu trong tiếng Việt...' },
      { id: 61, name: '💡 Từ Hán Việt: Những từ Hán Việt hay gặp', size: '160 KB', uploadedAt: '2026-04-21', content: 'Danh sách những từ Hán Việt hay gặp trong tiếng Việt...' },
      { id: 62, name: '💡 Biểu cảm: Cách dùng biểu hiện tình cảm', size: '125 KB', uploadedAt: '2026-04-21', content: 'Hướng dẫn cách dùng các biểu hiện tình cảm trong tiếng Việt...' },
      { id: 63, name: '💡 Viết lách: Kỹ năng viết đẹp chữ', size: '95 KB', uploadedAt: '2026-04-21', content: 'Hướng dẫn cách viết đẹp chữ và những lưu ý quan trọng...' },
      { id: 64, name: '💡 Kiểu cách: Phân biệt các kiểu cách viết', size: '140 KB', uploadedAt: '2026-04-21', content: 'Hướng dẫn phân biệt các kiểu cách viết: lách ngôn, chính thức, thân mật, v.v.' },
      { id: 65, name: '💡 Tài liệu: Danh sách sách Văn hay đọc', size: '130 KB', uploadedAt: '2026-04-21', content: 'Danh sách những cuốn sách Văn hay đọc bổ sung kiến thức cho học sinh...' }
    ]
  };

  const getLibraryData = () => {
    try {
      const data = JSON.parse(localStorage.getItem('_library') || '{}');
      // Nếu chưa có dữ liệu → tự động load mẫu
      if (!data.shared || data.shared.length === 0) {
        localStorage.setItem('_library', JSON.stringify(SAMPLE_DATA));
        return SAMPLE_DATA;
      }
      return data;
    } catch { return SAMPLE_DATA; }
  };
  const saveLibraryData = (data) => localStorage.setItem('_library', JSON.stringify(data));

  const lib = getLibraryData();
  const classData = lib[currentClass] || [];
  const filtered = classData.filter(f => f.name.toLowerCase().includes(search.toLowerCase()));

  const handleFileUpload = (e) => {
    const files = Array.from(e.target.files || []);
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = (evt) => {
        const newFile = {
          id: Date.now() + Math.random(),
          name: file.name,
          size: Math.round(file.size / 1024) + ' KB',
          type: file.type,
          uploadedAt: new Date().toLocaleString('vi-VN'),
          content: evt.target.result.substring(0, 5000)
        };
        const updated = { ...lib, [currentClass]: [...(lib[currentClass] || []), newFile] };
        saveLibraryData(updated);
        alert('✅ Tải tệp thành công: ' + file.name);
      };
      reader.readAsText(file, 'utf-8');
    });
    e.target.value = '';
  };

  const deleteFile = (fileId) => {
    if (confirm('Xóa tệp này?')) {
      const updated = { ...lib, [currentClass]: classData.filter(f => f.id !== fileId) };
      saveLibraryData(updated);
    }
  };

  const downloadFile = (file) => {
    try {
      const blob = new Blob([file.content], { type: 'text/plain;charset=utf-8' });
      const url = window.URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = file.name.replace(/[^a-z0-9]/gi, '_').toLowerCase() + '.txt';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      window.URL.revokeObjectURL(url);
      alert('✅ Tải tệp thành công: ' + file.name);
    } catch (err) {
      alert('❌ Lỗi tải tệp: ' + err.message);
    }
  };

  return (
    <div className="space-y-4 fade-in">
      {setActive && <Breadcrumb onHome={() => setActive('dashboard')} items={[{ label: 'Thư viện tài liệu', icon: 'BookOpen' }]} />}
      <div><h2 className="text-3xl font-bold text-slate-800 mb-1 font-display">📚 Thư Viện Tài Liệu</h2><p className="text-slate-600">Quản lý tài liệu SGK, bài giảng, truyện, bài báo...</p></div>

      <div className="grid grid-cols-5 gap-2">
        {CLASSES.map(c => (
          <button key={c} onClick={() => setCurrentClass(c)} className={`px-3 py-2 rounded-lg font-medium transition ${currentClass === c ? 'bg-teal-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}>
            {CLASS_LABELS[c]}
          </button>
        ))}
      </div>

      <div className="bg-white p-4 rounded-xl border space-y-3">
        <div className="flex gap-2">
          <input type="text" placeholder="🔍 Tìm kiếm tài liệu..." value={search} onChange={(e) => setSearch(e.target.value)} className="flex-1 px-3 py-2 border rounded-lg text-sm" />
          <label className="px-4 py-2 bg-teal-600 text-white rounded-lg hover:bg-teal-700 cursor-pointer font-medium text-sm">
            📤 Tải lên
            <input type="file" multiple accept=".pdf,.docx,.txt,.doc" onChange={handleFileUpload} className="hidden" />
          </label>
        </div>

        {filtered.length === 0 ? (
          <div className="text-center py-8 text-slate-500">
            <p>📭 {search ? 'Không tìm thấy tài liệu' : 'Chưa có tài liệu'}</p>
            <p className="text-xs mt-1">Nhấn "📤 Tải lên" để thêm tài liệu (PDF, Word, TXT)</p>
          </div>
        ) : (
          <div className="space-y-2">
            {filtered.map(f => (
              <div key={f.id} className="flex items-center justify-between bg-slate-50 p-3 rounded-lg border hover:bg-slate-100 cursor-pointer transition">
                <div className="flex-1" onClick={() => setSelectedFile(f)}>
                  <p className="font-medium text-slate-800 hover:text-teal-700 cursor-pointer">📄 {f.name}</p>
                  <p className="text-xs text-slate-500">{f.size} • {f.uploadedAt}</p>
                </div>
                <button onClick={() => deleteFile(f.id)} className="px-3 py-1 text-red-600 hover:bg-red-50 rounded-lg text-sm font-medium">
                  🗑️ Xóa
                </button>
              </div>
            ))}
          </div>
        )}

        {selectedFile && (
          <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4 modal-overlay">
            <div className="bg-white rounded-xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
              <div className="sticky top-0 bg-gradient-to-r from-teal-600 to-teal-700 text-white p-4 flex justify-between items-center">
                <h3 className="text-lg font-bold">{selectedFile.name}</h3>
                <button onClick={() => setSelectedFile(null)} className="text-white hover:bg-white/20 rounded-lg p-2">
                  ✕
                </button>
              </div>

              <div className="p-6 space-y-4">
                <div className="flex gap-4 text-sm text-slate-600">
                  <span>📦 {selectedFile.size}</span>
                  <span>📅 {selectedFile.uploadedAt}</span>
                </div>

                <div className="bg-slate-50 p-4 rounded-lg border border-slate-200 max-h-[50vh] overflow-y-auto font-mono text-sm whitespace-pre-wrap text-slate-700">
                  {selectedFile.content || '(Không có nội dung để hiển thị)'}
                </div>

                <div className="flex gap-2 justify-end">
                  <button onClick={() => downloadFile(selectedFile)} className="px-4 py-2 bg-teal-600 text-white rounded-lg hover:bg-teal-700 font-medium flex items-center gap-2">
                    📥 Tải về
                  </button>
                  <button onClick={() => setSelectedFile(null)} className="px-4 py-2 bg-slate-200 text-slate-800 rounded-lg hover:bg-slate-300 font-medium">
                    Đóng
                  </button>
                </div>
              </div>
            </div>
          </div>
        )}

        <div className="bg-teal-50 border-l-4 border-teal-600 p-3 rounded text-sm text-teal-900">
          <p className="font-medium">💡 Mẹo sử dụng:</p>
          <ul className="text-xs mt-1 space-y-1">
            <li>✓ Tải lên SGK, bài giảng, truyện, bài báo</li>
            <li>✓ AI sẽ đọc tài liệu để tạo bài tập, gợi ý</li>
            <li>✓ Sắp xếp riêng theo lớp hoặc dùng chung</li>
          </ul>
        </div>
      </div>
    </div>
  );
};

// ============== 🛟 THẺ AN TOÀN DỮ LIỆU ==============
const DataSafetyCard = ({ onRestoreData }) => {
  const [usage, setUsage] = useState(getStorageUsage());
  const [lastBackup, setLastBackup] = useState(localStorage.getItem('last_backup_at') || '');
  const [fsName, setFsName] = useState(fsDirHandle ? fsDirHandle.name : '');
  const [fsGranted, setFsGranted] = useState(false);
  const [fsBusy, setFsBusy] = useState(false);
  const [serverMode, setServerMode] = useState(false);
  const [serverFile, setServerFile] = useState('');
  const refresh = () => setUsage(getStorageUsage());
  useEffect(() => { const t = setInterval(refresh, 4000); return () => clearInterval(t); }, []);
  useEffect(() => { (async () => { if (fsDirHandle) { setFsName(fsDirHandle.name); setFsGranted((await fsQueryPermission(fsDirHandle)) === 'granted'); } })(); }, []);
  // Phát hiện chế độ tự động (máy chủ nội bộ đang chạy?)
  useEffect(() => { fetch('/api/health', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(j => { if (j && j.ok) { setServerMode(true); setServerFile(j.file || ''); } }).catch(() => {}); }, []);

  const connectFolder = async (forceNew) => {
    setFsBusy(true);
    try {
      if (forceNew) await fsForget();
      let handle = forceNew ? null : fsDirHandle;
      if (handle) { if ((await fsRequestPermission(handle)) !== 'granted') handle = null; }
      if (!handle) handle = await fsPickDirectory();
      setFsName(handle.name); setFsGranted(true);
      const fileData = await fsReadData();
      const hasFile = fileData && fileData.items && Object.keys(fileData.items).length > 0;
      const cur = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      const curHas = cur.items && Object.keys(cur.items).length > 0;
      if (hasFile && (!curHas || confirm('📂 Thư mục này ĐÃ CÓ dữ liệu từ trước.\n\n• Bấm OK: TẢI dữ liệu từ thư mục vào chương trình (nên chọn nếu đây là máy/trình duyệt mới, hoặc muốn lấy lại bản đã lưu).\n• Bấm Hủy: GIỮ dữ liệu hiện tại và ghi đè lên file trong thư mục.'))) {
        onRestoreData && onRestoreData(fileData);
        alert('✅ Đã kết nối và TẢI dữ liệu từ thư mục "' + handle.name + '" vào chương trình.');
      } else {
        await fsWriteData(cur);
        alert('✅ Đã kết nối thư mục "' + handle.name + '".\nTừ giờ mọi dữ liệu (đề thi, giáo án, lớp, điểm...) sẽ TỰ ĐỘNG lưu vào file trong thư mục này.');
      }
    } catch (e) {
      if (e && e.name === 'AbortError') { /* cô bấm hủy hộp thoại */ }
      else alert('❌ ' + (e.message || e));
    } finally { setFsBusy(false); }
  };

  const doExport = () => {
    if (exportAllData()) {
      const now = new Date().toISOString();
      localStorage.setItem('last_backup_at', now);
      setLastBackup(now);
    }
  };

  const pct = usage.percent;
  const barColor = pct >= 85 ? 'bg-rose-500' : pct >= 60 ? 'bg-amber-500' : 'bg-teal-500';
  const textColor = pct >= 85 ? 'text-rose-600' : pct >= 60 ? 'text-amber-600' : 'text-teal-700';
  const daysSince = lastBackup ? Math.floor((Date.now() - new Date(lastBackup).getTime()) / 86400000) : null;
  const needBackup = daysSince === null || daysSince >= 7;

  return (
    <div className="bg-white rounded-2xl p-6 mb-6 border-2 border-teal-200 shadow-sm">
      <h2 className="text-lg font-bold text-slate-800 mb-1 flex items-center gap-2">
        <span className="text-xl">🛟</span> An toàn dữ liệu
      </h2>
      <p className="text-sm text-slate-500 mb-4">Dữ liệu lưu ngay trên máy này. Hãy <strong>sao lưu ra file</strong> thường xuyên để không lo mất khi đổi máy hay xoá trình duyệt.</p>

      {/* ⚡ Chế độ tự động (máy chủ nội bộ) — hiện khi mở qua nút "Mở Trợ Lý" */}
      {serverMode && (
        <div className="mb-5 rounded-xl border-2 border-teal-300 bg-gradient-to-br from-teal-50 to-emerald-50 p-4">
          <div className="flex items-center gap-2 mb-1">
            <span className="text-lg">⚡</span>
            <h3 className="font-bold text-teal-900">Chế độ TỰ ĐỘNG đang bật ✅</h3>
          </div>
          <p className="text-sm text-teal-800">Mọi dữ liệu (đề thi, giáo án, học sinh, lớp, điểm...) đang được <strong>tự động lưu thẳng vào file thật trên máy</strong> — cô không cần bấm gì cả. Mở lại app là dữ liệu còn nguyên.</p>
          {serverFile && <p className="text-[11px] text-teal-600 mt-2 break-all">📁 Lưu tại: <code className="bg-white px-1 rounded">{serverFile}</code></p>}
          <p className="text-[11px] text-teal-600 mt-1">🛡️ Có bản dự phòng <code className="bg-white px-1 rounded">.bak</code> và ảnh chụp theo ngày trong thư mục <code className="bg-white px-1 rounded">DuLieu/</code>.</p>
        </div>
      )}

      {/* 💾 Lưu tự động ra thư mục trên máy (cách thủ công — chỉ hiện khi CHƯA có chế độ tự động) */}
      {!serverMode && (
      <div className="mb-5 rounded-xl border-2 border-teal-100 bg-teal-50/50 p-4">
        <div className="flex items-center gap-2 mb-1">
          <span className="text-lg">💾</span>
          <h3 className="font-bold text-teal-900">Lưu ra thư mục trên máy</h3>
        </div>
        <p className="text-xs text-slate-600 mb-3">💡 Mẹo: mở app bằng nút <strong>"▶️ Mở Trợ Lý (lưu trên máy)"</strong> để bật <strong>chế độ tự động</strong> (khỏi bấm gì). Hoặc chọn thủ công một thư mục bên dưới — dữ liệu sẽ lưu vào file <code className="bg-white px-1 rounded">{FS_FILE_NAME}</code>.</p>

        {!FS_SUPPORTED ? (
          <div className="text-sm bg-amber-50 border border-amber-200 text-amber-800 rounded-lg p-3">
            ⚠️ Trình duyệt hiện tại không hỗ trợ (hoặc cô đang mở app bằng cách nhấp đúp file). Hãy dùng <strong>Chrome / Cốc Cốc</strong> và mở app bằng nút <strong>"Mở Trợ Lý"</strong>.
          </div>
        ) : fsName && fsGranted ? (
          <div>
            <div className="flex items-center gap-2 text-sm bg-white border border-teal-200 rounded-lg px-3 py-2 mb-2">
              <span className="text-teal-600">✅</span>
              <span className="text-slate-700">Đang tự lưu vào: <strong className="text-teal-800">{fsName}</strong> / {FS_FILE_NAME}</span>
            </div>
            <button onClick={() => connectFolder(true)} disabled={fsBusy} className="text-xs px-3 py-1.5 rounded-lg bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 disabled:opacity-50">📁 Đổi thư mục khác</button>
          </div>
        ) : fsName && !fsGranted ? (
          <div>
            <div className="text-sm bg-amber-50 border border-amber-200 text-amber-800 rounded-lg px-3 py-2 mb-2">🔗 Đã chọn thư mục <strong>{fsName}</strong> từ trước — bấm nút dưới để kết nối lại (mỗi lần mở app cần bấm 1 lần).</div>
            <button onClick={() => connectFolder(false)} disabled={fsBusy} className="px-4 py-2.5 rounded-xl font-semibold bg-gradient-to-r from-teal-600 to-teal-700 text-white hover:shadow-md flex items-center gap-2 disabled:opacity-60">
              <Icon name="FolderOpen" size={16} /> {fsBusy ? 'Đang kết nối...' : 'Kết nối lại thư mục'}
            </button>
          </div>
        ) : (
          <button onClick={() => connectFolder(false)} disabled={fsBusy} className="px-4 py-2.5 rounded-xl font-semibold bg-gradient-to-r from-teal-600 to-teal-700 text-white hover:shadow-md flex items-center gap-2 disabled:opacity-60">
            <Icon name="FolderOpen" size={16} /> {fsBusy ? 'Đang mở...' : 'Chọn thư mục lưu trên máy'}
          </button>
        )}
      </div>
      )}

      {/* Thanh dung lượng */}
      <div className="mb-4">
        <div className="flex justify-between items-center mb-1.5 text-sm">
          <span className="font-medium text-slate-700">Dung lượng đã dùng</span>
          <span className={`font-bold ${textColor}`}>{formatBytes(usage.totalBytes)} / ~{formatBytes(usage.limitBytes)} ({pct}%)</span>
        </div>
        <div className="w-full h-3 bg-slate-100 rounded-full overflow-hidden">
          <div className={`h-full ${barColor} transition-all duration-500`} style={{ width: pct + '%' }}></div>
        </div>
        {pct >= 85 && <p className="text-xs text-rose-600 mt-1.5 font-medium">⚠️ Gần đầy! Hãy sao lưu rồi xoá bớt ảnh bài cũ để có chỗ trống.</p>}
        {pct >= 60 && pct < 85 && <p className="text-xs text-amber-600 mt-1.5">Dung lượng đang tăng — nhớ sao lưu định kỳ nhé cô 🌸</p>}
      </div>

      {/* Nút Sao lưu / Khôi phục */}
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <button onClick={doExport}
          className="px-4 py-3 rounded-xl font-semibold bg-gradient-to-r from-teal-600 to-teal-700 text-white hover:shadow-md flex items-center justify-center gap-2 transition">
          <Icon name="Download" size={18} /> Sao lưu ra file
        </button>
        <label className="px-4 py-3 rounded-xl font-semibold bg-white border-2 border-rose-300 text-rose-700 hover:bg-rose-50 flex items-center justify-center gap-2 cursor-pointer transition">
          <Icon name="Upload" size={18} /> Khôi phục từ file
          <input type="file" accept="application/json,.json" className="hidden"
            onChange={(e) => { const f = e.target.files?.[0]; if (f) importAllData(f); e.target.value = ''; }} />
        </label>
      </div>

      {/* Nhắc sao lưu */}
      <div className={`mt-4 rounded-xl p-3 text-sm border ${needBackup ? 'bg-amber-50 border-amber-200 text-amber-800' : 'bg-teal-50 border-teal-100 text-teal-800'}`}>
        {lastBackup
          ? (needBackup
              ? <span>🔔 Đã <strong>{daysSince} ngày</strong> chưa sao lưu — nên sao lưu lại để an toàn.</span>
              : <span>✅ Lần sao lưu gần nhất: <strong>{new Date(lastBackup).toLocaleString('vi-VN')}</strong>.</span>)
          : <span>🔔 Cô <strong>chưa sao lưu lần nào</strong>. Hãy bấm "Sao lưu ra file" để giữ một bản dự phòng an toàn.</span>}
      </div>
    </div>
  );
};

// ============== ☁️ THẺ TÀI KHOẢN ĐÁM MÂY ==============
const CloudAccountCard = ({ fbUser, onSignOut }) => {
  if (!fbUser) return null;
  return (
    <div className="bg-white rounded-2xl p-6 mb-6 border-2 border-teal-200 shadow-sm">
      <h2 className="text-lg font-bold text-slate-800 mb-1 flex items-center gap-2"><span className="text-xl">☁️</span> Tài khoản đám mây</h2>

const parseIntent = async (message) => {
  const prompt = `Phân tích ý định của giáo viên từ tin nhắn sau (Tiếng Việt):
"${message}"

Trả về JSON format:
{
  "action": "chat" hoặc "create_lesson" hoặc "create_exam" hoặc "create_slide",
  "lesson_name": "tên bài học nếu có",
  "grade": 6-9,
  "class": "tên lớp",
  "type": "lesson/exam/slide/advice",
  "details": "chi tiết bổ sung"
}

IMPORTANT: Chỉ trả JSON, không có text khác!`;

  const result = await callGroqAPI(prompt, 300);
  try {
    if (result.success) {
      return JSON.parse(result.text);
    }
  } catch (e) {
    return { action: 'chat', type: 'error' };
  }
  return { action: 'chat', type: 'help' };
};

// ============== SLASH COMMAND HELPERS ==============
const parseSlashCommand = (input) => {
  const match = input.match(/^\/(\S+)\s*(.*)/);
  if (!match) return null;
  return { command: match[1].toLowerCase(), args: match[2].trim() };
};

const generateExamContent = async (topic, type, count) => {
  const isEssayOnly = type === 'tln';
  const qTypeText = isEssayOnly
    ? 'Tất cả câu hỏi phần Đọc hiểu là dạng TỰ LUẬN (học sinh tự viết câu trả lời), KHÔNG dùng trắc nghiệm.'
    : 'Các câu hỏi phần Đọc hiểu là trắc nghiệm 4 lựa chọn A/B/C/D (viết rõ 4 phương án ngay dưới mỗi câu, nêu đáp án đúng trong phần đáp án).';
  const prompt = `Bạn là giáo viên Ngữ văn THCS chuyên nghiệp. Hãy soạn đề kiểm tra ${count} câu Đọc hiểu về chủ đề "${topic}", theo chuẩn GDPT 2018 gồm PHẦN I. ĐỌC HIỂU và PHẦN II. VIẾT (1 đề bài viết đoạn/bài văn liên quan chủ đề).
${qTypeText}

ĐỊNH DẠNG TRẢ LỜI (viết đúng 2 dấu mốc dưới đây, không dùng markdown, không dùng JSON):
=== CÂU HỎI ===
PHẦN I. ĐỌC HIỂU
[các câu hỏi, mỗi câu ghi rõ số điểm]
PHẦN II. VIẾT
[đề bài viết]

=== ĐÁP ÁN ===
[đáp án + hướng dẫn chấm chi tiết cho từng câu, kể cả câu viết]

Trả lời bằng tiếng Việt, chuyên nghiệp.`;

  let result = null;
  const useOllama = getUseOllama();
  if (useOllama) {
    result = await callOllamaAPI(prompt, 1500);
  }
  if (!result || !result.success) {
    const groqKey = getGroqApiKey();
    if (groqKey) {
      result = await callGroqAPI(prompt, 1500);
    }
  }
  if (!result || !result.success) return result;
  // Tách câu hỏi / đáp án bằng dấu mốc — nếu AI quên mốc, dùng nguyên văn cho cả 2 (không tệ hơn trước).
  const text = result.text || '';
  const marker = '=== ĐÁP ÁN ===';
  const idx = text.indexOf(marker);
  const cauHoi = (idx >= 0 ? text.slice(0, idx) : text).replace('=== CÂU HỎI ===', '').trim();
  const dapAn = (idx >= 0 ? text.slice(idx + marker.length) : text).trim();
  return { ...result, cauHoi, dapAn };
};

const AuthScreen = () => {
  const [mode, setMode] = useState('login'); // 'login' | 'signup'

  const [pass, setPass] = useState('');
  const [pass2, setPass2] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);

  const prettyErr = (code) => {
    const m = {
      'auth/invalid-email': 'Email không hợp lệ.',
      'auth/user-not-found': 'Chưa có tài khoản này. Hãy bấm "Tạo tài khoản mới".',
      'auth/wrong-password': 'Sai mật khẩu.',
      'auth/invalid-credential': 'Sai email hoặc mật khẩu.',
      'auth/email-already-in-use': 'Email này đã có tài khoản. Hãy đăng nhập.',
      'auth/weak-password': 'Mật khẩu quá ngắn (cần ít nhất 6 ký tự).',
      'auth/network-request-failed': 'Lỗi mạng. Kiểm tra kết nối internet.',
    };
    return m[code] || ('Có lỗi: ' + code);
  };

  const submit = async () => {
    setErr('');
    if (!email.trim() || !pass) { setErr('Cô nhập email và mật khẩu nhé.'); return; }
    if (mode === 'signup' && pass !== pass2) { setErr('Hai ô mật khẩu chưa giống nhau.'); return; }
    setBusy(true);
    try {
      if (mode === 'login') await fbAuth.signInWithEmailAndPassword(email.trim(), pass);
      else await fbAuth.createUserWithEmailAndPassword(email.trim(), pass);
      // onAuthStateChanged ở App sẽ tự nhận và vào chương trình
    } catch (e) {
      setErr(prettyErr(e.code || e.message));
    } finally { setBusy(false); }
  };

  return (
    <div className="flex items-center justify-center min-h-screen gradient-bg p-4">
      <div className="w-full max-w-md">
        <div className="text-center mb-6">
          <div className="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-teal-600 to-rose-500 flex items-center justify-center text-white text-3xl mb-3 shadow-lg">📖</div>
          <h1 className="text-2xl font-bold text-slate-800 font-display">Trợ Lý Giáo Viên Ngữ Văn</h1>
          <p className="text-slate-500 text-sm mt-1">{mode === 'login' ? 'Đăng nhập để mở dữ liệu của cô ở mọi nơi 🌸' : 'Tạo tài khoản để bắt đầu 🌸'}</p>
        </div>

        <div className="bg-white rounded-2xl shadow-xl border border-teal-100 p-6">
          <label className="block text-sm font-medium text-slate-700 mb-1">Email</label>
          <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="vd: thinhdv1@gmail.com"
            className="w-full px-3 py-2.5 border border-slate-200 rounded-xl mb-3 focus:border-teal-400 outline-none" autoFocus />

          <label className="block text-sm font-medium text-slate-700 mb-1">Mật khẩu</label>
          <input type="password" value={pass} onChange={e => setPass(e.target.value)} placeholder="Ít nhất 6 ký tự"
            onKeyDown={e => { if (e.key === 'Enter' && mode === 'login') submit(); }}
            className="w-full px-3 py-2.5 border border-slate-200 rounded-xl mb-3 focus:border-teal-400 outline-none" />

          {mode === 'signup' && (
            <>
              <label className="block text-sm font-medium text-slate-700 mb-1">Nhập lại mật khẩu</label>
              <input type="password" value={pass2} onChange={e => setPass2(e.target.value)} placeholder="Gõ lại mật khẩu"
                onKeyDown={e => { if (e.key === 'Enter') submit(); }}
                className="w-full px-3 py-2.5 border border-slate-200 rounded-xl mb-3 focus:border-teal-400 outline-none" />
            </>
          )}

          {err && <div className="text-sm bg-rose-50 border border-rose-200 text-rose-700 rounded-lg px-3 py-2 mb-3">⚠️ {err}</div>}

          <button onClick={submit} disabled={busy}
            className="w-full py-3 rounded-xl font-semibold text-white bg-gradient-to-r from-teal-600 to-teal-700 hover:shadow-md disabled:opacity-60 transition">
            {busy ? 'Đang xử lý...' : (mode === 'login' ? 'Đăng nhập' : 'Tạo tài khoản')}
          </button>

          <div className="text-center mt-4 text-sm text-slate-500">
            {mode === 'login' ? (
              <>Chưa có tài khoản? <button onClick={() => { setMode('signup'); setErr(''); }} className="text-teal-700 font-semibold hover:underline">Tạo tài khoản mới</button></>
            ) : (
              <>Đã có tài khoản? <button onClick={() => { setMode('login'); setErr(''); }} className="text-teal-700 font-semibold hover:underline">Đăng nhập</button></>
            )}
          </div>
        </div>
        <p className="text-center text-[11px] text-slate-400 mt-4">Dữ liệu được đồng bộ an toàn qua tài khoản này. Đăng nhập cùng email trên máy/điện thoại khác là thấy y nguyên.</p>
      </div>
    </div>
  );
};

const ocExamToText = (ex) => {
  let s='';
  if (ex.passageContent) { if (ex.passageTitle) s+=ex.passageTitle+'\n'; s+=ex.passageContent+'\n'; if (ex.passageAuthor) s+='— '+ex.passageAuthor+'\n'; s+='\n'; }

  return s.trim() || ex.title || '';
};

const OcGrade = ({ cls, asg, sub, onBack }) => {
  const [score,setScore]=useState(sub.finalScore??sub.autoScore??''); const [fb,setFb]=useState(sub.finalFeedback??sub.autoFeedback??''); const [grading,setGrading]=useState(false);
  const ref = fbDb.collection('classes').doc(cls.id).collection('submissions').doc(sub.id);
  const aiGrade = async () => {
    const hasImages = sub.images && sub.images.length > 0;
    // Bài nộp bằng ảnh chụp viết tay → cần Claude "nhìn" ảnh (Groq/Ollama không đọc được ảnh)
    if (hasImages && !getClaudeApiKey()) {
      alert('📷 Bài này nộp bằng ẢNH chụp bài viết tay.\n\nĐể AI đọc được chữ trong ảnh, cô cần dùng nguồn AI "Claude": vào ⚙️ Cài đặt AI → nhập Claude API Key → chọn Claude. (Groq/Ollama chưa đọc được ảnh ạ) 🌸');
      return;
    }
    setGrading(true);
    const prompt=`Bạn là giáo viên Ngữ văn THCS. Hãy CHẤM bài làm học sinh theo đề. Trả lời tiếng Việt.\n\n=== ĐỀ ===\n${asg.body}\n\n=== BÀI LÀM (phần gõ chữ) ===\n${sub.answer||'(học sinh không gõ chữ)'}\n${hasImages?'\n⚠️ Học sinh nộp bài bằng ẢNH CHỤP BÀI VIẾT TAY đính kèm bên dưới. Hãy ĐỌC KỸ chữ viết tay trong ảnh (đây mới là bài làm chính) rồi chấm theo đề. Nếu phần gõ chữ trống thì hoàn toàn dựa vào ảnh.\n':''}\nCho ĐIỂM thang 10 và NHẬN XÉT ngắn gọn cụ thể, giọng động viên (nêu nội dung em đã viết được).\nĐỊNH DẠNG JSON thuần (không markdown): {"diem": <số 0-10>, "nhanxet": "..."}`;
    const r = hasImages ? await callClaudeVisionAPI(prompt, sub.images, 1400) : await callGroqAPI(prompt, 1200);
    setGrading(false);
    if (r.error){alert('Lỗi AI: '+r.error);return;}
    try{ const t=r.text.replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'').trim(); const j=JSON.parse(t); setScore(j.diem); setFb(j.nhanxet); await ref.update({autoScore:j.diem,autoFeedback:j.nhanxet,status:'graded'}); }
    catch{ setFb(r.text); await ref.update({autoFeedback:r.text,status:'graded'}); }
  };
  const release = async (mode) => { if(score===''){alert('Cần có điểm.');return;} await ref.update({finalScore:Number(score),finalFeedback:fb,status:'released',releaseMode:mode,releasedAt:Date.now()});
    if(mode==='all'&&fb) await fbDb.collection('classes').doc(cls.id).collection('messages').add({fromRole:'teacher',fromName:'Cô',text:`📊 Kết quả "${asg.title}" của ${sub.studentName}: ${score}đ — ${fb}`,at:Date.now()});
    alert(mode==='private'?'✅ Đã gửi RIÊNG cho '+sub.studentName:'✅ Đã gửi cả lớp.'); onBack(); };
  return <div className="fade-in max-w-3xl mx-auto space-y-4">
    <button onClick={onBack} className="text-teal-700 text-sm">← Danh sách bài nộp</button>
    <h2 className="text-xl font-bold">Chấm bài · {sub.studentName}</h2>
    <div className="soft-card p-4"><p className="text-xs font-bold text-slate-500 uppercase mb-2">Bài làm của học sinh</p><div className="text-sm whitespace-pre-wrap">{sub.answer||<span className="text-slate-400 italic">(trống)</span>}</div>{sub.images&&sub.images.map((im,i)=><img key={i} src={im} className="mt-2 rounded-lg border max-w-full" alt="bài"/>)}</div>
    <div className="soft-card p-4 border-2 border-rose-200">
      <div className="flex items-center justify-between mb-2"><p className="text-xs font-bold text-rose-600 uppercase">🤖 AI chấm → cô duyệt</p><button onClick={aiGrade} disabled={grading} className="btn-accent text-sm">{grading?'Đang chấm...':'AI chấm nháp'}</button></div>
      <label className="block text-sm font-medium mb-1">Điểm (thang 10)</label>
      <input type="number" step="0.25" value={score} onChange={e=>setScore(e.target.value)} className="w-32 px-3 py-2 border rounded-xl mb-3" />
      <label className="block text-sm font-medium mb-1">Nhận xét (sửa được)</label>
      <textarea value={fb} onChange={e=>setFb(e.target.value)} rows={5} className="w-full px-3 py-2.5 border rounded-xl text-sm" />
    </div>
    <div className="grid grid-cols-2 gap-3">
      <button onClick={()=>release('private')} className="btn-primary">🔒 Gửi riêng cho em</button>
      <button onClick={()=>release('all')} className="btn-accent">📢 Gửi cả lớp</button>
    </div>
  </div>;
};
const OcMessages = ({ cls }) => {

const App = () => {
  const [active, setActive] = useState('dashboard');

  const [teacherName, setTeacherName] = useState('');
  const [schoolName, setSchoolName] = useState('');
  const [showChat, setShowChat] = useState(false);
  const [lastComposeTab, setLastComposeTab] = useState('planning');
  const [fbUser, setFbUser] = useState(null);        // ☁️ tài khoản đám mây đang đăng nhập
  const [authReady, setAuthReady] = useState(false);  // đã kiểm tra tình trạng đăng nhập xong chưa
  const dataLoadedRef = useRef(false); // 🛟 chốt an toàn: chỉ cho phép lưu SAU khi đã nạp xong dữ liệu cũ
  const cloudRef = useRef(false);      // đám mây có dùng được không
  const fbUserRef = useRef(null);      // giữ uid mới nhất cho hàm lưu

  // Nạp một gói dữ liệu vào chương trình (dùng khi khôi phục từ file/đám mây)
  const applyRestoredPayload = (payload) => {
    if (!payload) return;
    if (payload.items) setDataState(payload.items);
    if (payload.selectedClass) setSelectedClass(payload.selectedClass);
    if (payload.selectedBook) setSelectedBook(payload.selectedBook);
    if (payload.teacherName != null) setTeacherName(payload.teacherName);
    if (payload.schoolName != null) setSchoolName(payload.schoolName);
    // 🔑 Khôi phục chìa khóa AI đã đồng bộ -> AI chạy được trên máy mới mà không phải nhập lại
    if (payload.apiKeys) {
      if (payload.apiKeys.groq) saveGroqApiKey(payload.apiKeys.groq);
      if (payload.apiKeys.claude) saveClaudeApiKey(payload.apiKeys.claude);
      if (payload.apiKeys.provider) localStorage.setItem('selectedAIProvider', payload.apiKeys.provider);
    }
  };

  useEffect(() => {
    const saved = loadData();
    setDataState(saved.items || {});
    setSelectedClass(saved.selectedClass || 6);
    setSelectedBook(saved.selectedBook || 'ketnoi');
    setTeacherName(saved.teacherName || '');
    setSchoolName(saved.schoolName || '');
    fsRestoreDirectory();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {}

    const cloud = initFirebase();
    cloudRef.current = cloud;
    if (cloud) {
      // ☁️ Đám mây là BẢN CHÍNH. Sau khi đăng nhập sẽ nạp dữ liệu từ đám mây về.
      fbAuth.onAuthStateChanged(async (user) => {
        fbUserRef.current = user || null;
        setFbUser(user || null);
        setAuthReady(true);
        if (user) {
          const remote = await fbReadData(user.uid);
          if (remote && remote.items && Object.keys(remote.items).length > 0) {
            applyRestoredPayload(remote); // đám mây có dữ liệu -> dùng bản đám mây
          } else {
            // ☁️ trống. Dữ liệu "saved" đang có trong máy này có THẬT SỰ thuộc tài khoản đang
            // đăng nhập không? So với UID đã lưu lần đăng nhập gần nhất trên chính máy này.
            const lastUid = localStorage.getItem(LAST_CLOUD_UID_KEY);
            if (lastUid === user.uid) {
              // Đúng là dữ liệu của tài khoản này (vd: lần đầu chuyển từ máy cũ sang đám mây) -> đẩy lên.
              fbWriteDataNow(user.uid, { items: saved.items || {}, selectedClass: saved.selectedClass || 6, selectedBook: saved.selectedBook || 'ketnoi', teacherName: saved.teacherName || '', schoolName: saved.schoolName || '' });
            } else {
              // 🛟 Dữ liệu trên máy thuộc tài khoản KHÁC (hoặc chưa từng đăng nhập đám mây trên máy này)
              // -> KHÔNG đẩy lên, tránh làm bẩn tài khoản mới. Bắt đầu sạch cho tài khoản này.
              applyRestoredPayload({ items: {}, selectedClass: 6, selectedBook: 'ketnoi', teacherName: '', schoolName: '' });
            }
          }
          localStorage.setItem(LAST_CLOUD_UID_KEY, user.uid);
        }
      });
    } else {
      // Không có đám mây -> dùng máy chủ/localStorage như cũ
      setAuthReady(true);
      (async () => {
        const res = await serverLoadData();
        if (!res.available) return;
        if (res.data && res.data.items && Object.keys(res.data.items).length > 0) {
          applyRestoredPayload(res.data);
        } else {
          serverWriteData({ items: saved.items || {}, selectedClass: saved.selectedClass || 6, selectedBook: saved.selectedBook || 'ketnoi', teacherName: saved.teacherName || '', schoolName: saved.schoolName || '' });
        }
      })();
    }
  }, []);

  useEffect(() => {
    // Bỏ qua lần chạy ĐẦU TIÊN (lúc data còn rỗng, chưa nạp xong) để không ghi đè mất dữ liệu cũ
    if (!dataLoadedRef.current) { dataLoadedRef.current = true; return; }
    const payload = { items: data, selectedClass, selectedBook, teacherName, schoolName,
      apiKeys: { groq: getGroqApiKey(), claude: getClaudeApiKey(), provider: localStorage.getItem('selectedAIProvider') || '' } };
    saveData(payload);             // lưu vào trình duyệt (nhanh, luôn có - bản cache)
    fsWriteDataDebounced(payload);  // ghi ra file qua thư mục (nếu đã kết nối thủ công)
    serverWriteData(payload);       // ghi ra file qua máy chủ (nếu mở bằng nút Mở Trợ Lý)
    if (fbUserRef.current) fbWriteDataDebounced(fbUserRef.current.uid, payload); // ☁️ đồng bộ đám mây
  }, [data, selectedClass, selectedBook, teacherName, schoolName]);

  const setData = (d) => setDataState(d);
  const handleSignOut = async () => { try { if (fbAuth) await fbAuth.signOut(); } catch {} };
  const activeMenu = MENU_ITEMS.find(m => m.id === active);

  const handleNavAndClose = (id) => {
    setActive(id);
    if (['planning','lesson'].includes(id)) setLastComposeTab(id);
    setMobileMenuOpen(false);
  };

  const renderContent = () => {
    if (active === 'dashboard') return <Dashboard data={data} setData={setData} setActive={setActive} fbUser={fbUser} onSignOut={handleSignOut} />;
    if (active === 'planning') return <PlanningTab data={data} setData={setData} selectedClass={selectedClass} selectedBook={selectedBook} teacherName={teacherName} schoolName={schoolName} setActive={handleNavAndClose} />;
    if (active === 'lesson') return <LessonTab data={data} setData={setData} selectedClass={selectedClass} selectedBook={selectedBook} teacherName={teacherName} schoolName={schoolName} setActive={handleNavAndClose} />;
    if (active === 'exam') return <ExamTab data={data} setData={setData} selectedClass={selectedClass} selectedBook={selectedBook} teacherName={teacherName} schoolName={schoolName} setActive={handleNavAndClose} />;
    if (active === 'class-messages') return <ClassMessagesTab fbUser={fbUser} setActive={handleNavAndClose} />;
    if (active === 'online') return <OnlineClassTab fbUser={fbUser} data={data} setActive={handleNavAndClose} />;
    if (active === 'library') return <LibraryTab setActive={handleNavAndClose} />;
    if (active === 'settings') return <SettingsTab data={data} setData={setData} setActive={handleNavAndClose} onRestoreData={applyRestoredPayload} fbUser={fbUser} onSignOut={handleSignOut} />;
    return <PhasePlaceholder item={activeMenu} />;
  };

  // ☁️ Cổng đăng nhập đám mây: nếu bật đám mây mà chưa đăng nhập -> hiện màn hình đăng nhập
  if (cloudRef.current && !authReady) {
    return <div className="flex items-center justify-center h-screen gradient-bg"><div className="text-center"><div className="text-4xl mb-3 animate-pulse">🌸</div><p className="text-teal-700 font-medium">Đang tải Trợ Lý Giáo Viên...</p></div></div>;
  }
  if (cloudRef.current && authReady && !fbUser) {
    return <AuthScreen />;
  }

  return (
    <div className="flex h-screen bg-slate-50 overflow-hidden">
      {/* Sidebar desktop + mobile drawer */}
      <Sidebar active={active} setActive={handleNavAndClose} collapsed={collapsed} setCollapsed={setCollapsed}
        onChatOpen={() => { setShowChat(true); setMobileMenuOpen(false); }}
        mobileOpen={mobileMenuOpen} lastComposeTab={lastComposeTab} />

      {/* Overlay backdrop khi sidebar mở trên mobile */}
      {mobileMenuOpen && (
        <div className="sidebar-overlay" onClick={() => setMobileMenuOpen(false)} />
      )}

      <div className="flex-1 flex flex-col overflow-hidden">
        <Header selectedClass={selectedClass} setSelectedClass={setSelectedClass}
          selectedBook={selectedBook} setSelectedBook={setSelectedBook}
          teacherName={teacherName} setTeacherName={setTeacherName}
          schoolName={schoolName} setSchoolName={setSchoolName}
          onMobileMenuToggle={() => setMobileMenuOpen(o => !o)}
          setActive={handleNavAndClose} />
        <main className="flex-1 overflow-y-auto scrollbar p-6 main-content-area">{renderContent()}</main>
      </div>

      {/* Thanh tab dưới — chỉ hiện trên điện thoại */}
      <MobileTabBar active={active} setActive={handleNavAndClose} lastComposeTab={lastComposeTab} />

      {/* AI Chat Panel */}
      <AIChatPanel
        isOpen={showChat}
        onClose={() => setShowChat(false)}
        data={data}
        setData={setData}
        selectedClass={selectedClass}
        selectedBook={selectedBook}
      />

      {/* Hamburger full-screen overlay (mobile) */}
      {mobileMenuOpen && (
        <HamburgerOverlay active={active} setActive={handleNavAndClose} onChatOpen={() => setShowChat(true)} onClose={() => setMobileMenuOpen(false)} />
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>


<script>
// 💰 COST TRACKING SYSTEM
window.costHistory = [];
window.totalCostToday = 0;

window.recordCost = function(operation, inputTokens, outputTokens) {
  const INPUT_PRICE = 15;      // $15 per 1M tokens
  const OUTPUT_PRICE = 45;     // $45 per 1M tokens
  
  const inputCost = (inputTokens * INPUT_PRICE) / 1000000;
  const outputCost = (outputTokens * OUTPUT_PRICE) / 1000000;
  const totalCost = inputCost + outputCost;
  
  const now = new Date();
  const timeStr = now.getHours().toString().padStart(2, '0') + ':' + 
                  now.getMinutes().toString().padStart(2, '0') + ':' + 
                  now.getSeconds().toString().padStart(2, '0');
  
  const record = {
    time: timeStr,
    operation: operation,
    inputTokens: inputTokens,
    outputTokens: outputTokens,
    totalTokens: inputTokens + outputTokens,
    inputCost: inputCost,
    outputCost: outputCost,
    cost: totalCost
  };
  
  window.costHistory.push(record);
  window.totalCostToday += totalCost;
  
  // Update UI
  const costTodayEl = document.getElementById('costToday');
  if (costTodayEl) {
    costTodayEl.textContent = '$' + window.totalCostToday.toFixed(4);
  }
  
  // Update last operation
  const lastOpEl = document.getElementById('lastOperation');
  if (lastOpEl) {
    lastOpEl.innerHTML = 
      '<p style="margin: 2px 0; color: #333; font-weight: 600;">' + operation + '</p>' +
      '<p style="margin: 4px 0 2px 0; color: #666; font-size: 11px;">🔹 Input: ' + inputTokens.toLocaleString() + ' tokens</p>' +
      '<p style="margin: 2px 0; color: #666; font-size: 11px;">🔹 Output: ' + outputTokens.toLocaleString() + ' tokens</p>' +
      '<p style="margin: 4px 0 0 0; color: #0f766e; font-weight: 700; font-size: 13px;">💵 Cost: $' + totalCost.toFixed(4) + '</p>';
  }
  
  // Update history (last 5)
  const historyEl = document.getElementById('costHistory');
  if (historyEl) {
    const lastFive = window.costHistory.slice(-5).reverse();
    if (lastFive.length > 0) {
      historyEl.innerHTML = lastFive.map(r => 
        '<div style="padding: 8px; border-bottom: 1px solid #e5e7eb; margin-bottom: 4px;">' +
        '<div style="display: flex; justify-content: space-between; align-items: center;">' +
        '<span style="font-weight: 600; color: #333;">' + r.time + '</span>' +
        '<span style="color: #be185d; font-weight: 700;">$' + r.cost.toFixed(4) + '</span>' +
        '</div>' +
        '<p style="margin: 4px 0 0 0; color: #666; font-size: 10px;">' + r.operation + ' • ' + r.totalTokens.toLocaleString() + 'T</p>' +
        '</div>'
      ).join('');
    }
  }
  
  console.log('💰 [' + operation + '] Input: ' + inputTokens + ' tokens, Output: ' + outputTokens + ' tokens, Cost: $' + totalCost.toFixed(4));
};
</script>
