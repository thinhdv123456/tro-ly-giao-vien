<style>
  :root {
    /* Palette "Kem Hồng" — hồng + kem + đào + vàng (tông môn Văn) */
    --c-primary: #be185d;      /* Hồng đậm - chủ đạo */
    --c-primary-soft: #ec4899; /* Hồng tươi */
    --c-accent: #e11d48;       /* Hồng-đỏ - nhấn AI/chấm */
    --c-accent-soft: #fb7185;  /* Đào/coral */
    --c-gold: #d97706;         /* Vàng kem ấm */
    --c-cream: #fff7f4;        /* Kem hồng nhạt */
    --c-cream-deep: #fdeae2;   /* Kem đậm */
    --c-ink: #4a2530;          /* Nâu mận ấm */
    --c-ink-soft: #6a4552;
    --c-border: #f0dcd0;
    --app-fs: 17px;            /* 🔠 Cỡ chữ do cô Thu tự chỉnh (nút "Aa" trên thanh trên) */
  }
  * { box-sizing: border-box; }
  html { font-size: var(--app-fs); }
  body {
    font-family: 'Be Vietnam Pro', 'Segoe UI', Tahoma, sans-serif;
    background: #fff7f4;
    color: var(--c-ink);
    font-weight: 400;
    line-height: 1.55;
  }
  h1, h2, h3, h4 { font-family: 'Playfair Display', 'Be Vietnam Pro', serif; letter-spacing: -0.01em; }
  .font-display { font-family: 'Playfair Display', serif; }

  /* 🔍 Chữ dễ đọc hơn: tăng nhẹ cỡ chữ nhỏ + làm đậm màu chữ mờ (theo yêu cầu cô Thu) */
  .text-xs { font-size: 0.8125rem !important; line-height: 1.25rem !important; }
  .text-sm { font-size: 0.9375rem !important; line-height: 1.45rem !important; }
  [class*="text-[8px]"], [class*="text-[9px]"], [class*="text-[10px]"], [class*="text-[11px]"], [class*="text-[12px]"] { font-size: 0.75rem !important; }
  .text-slate-300 { color: #94a3b8 !important; }
  .text-slate-400 { color: #64748b !important; }
  .text-slate-500 { color: #475569 !important; }

  /* 🔠 Chế độ "Chữ đậm hơn" — bật/tắt bằng nút Aa trên thanh trên */
  html.text-strong { --c-ink-soft: #4a2530; }
  html.text-strong body { font-weight: 500; }
  html.text-strong h1, html.text-strong h2, html.text-strong h3, html.text-strong h4 { font-weight: 800; }
  html.text-strong .text-slate-300 { color: #64748b !important; }
  html.text-strong .text-slate-400 { color: #334155 !important; }
  html.text-strong .text-slate-500 { color: #1e293b !important; }

  /* Sidebar: Thơ văn — kem-hồng ấm áp, trang nhã */
  .gradient-bg {
    background: linear-gradient(160deg, #fffbf7 0%, #fef5ed 40%, #fdf0e8 70%, #fce8df 100%);
    border-right: 1px solid #f5ddd0;
    position: relative;
  }
  .gradient-bg::before {
    content: ''; position: absolute; inset: 0;
    background-image:
      radial-gradient(rgba(190,24,93,0.04) 1px, transparent 1px);
    background-size: 24px 24px;
    pointer-events: none;
  }
  /* Đường kẻ trang trí dọc sidebar */
  .gradient-bg::after {
    content: ''; position: absolute; top: 0; right: 0; bottom: 0; width: 3px;
    background: linear-gradient(180deg, transparent 0%, #f9a8d4 20%, #fca5a5 50%, #fcd34d 80%, transparent 100%);
    opacity: 0.5; pointer-events: none;
  }

  .card-hover { transition: all 0.35s cubic-bezier(.2,.8,.2,1); }
  .card-hover:hover { transform: translateY(-3px); box-shadow: 0 18px 36px -12px rgba(190,24,93,0.18), 0 8px 16px -6px rgba(15,118,110,0.12); border-color: #ec4899; }

  .sidebar-item { transition: all 0.25s ease; border-left: 4px solid transparent; position: relative; z-index: 1; color: #5c3d2e; }
  .sidebar-item:hover { background: rgba(190,24,93,0.06); border-left-color: #fca5a5; color: #be185d; }
  .sidebar-item.active {
    background: linear-gradient(90deg, rgba(190,24,93,0.10), rgba(217,119,6,0.05));
    border-left-color: #be185d;
    color: #9f1239;
    font-weight: 600;
    box-shadow: inset 0 0 16px rgba(190,24,93,0.06);
  }

  .fade-in { animation: fadeIn 0.45s cubic-bezier(.2,.8,.2,1); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  .scrollbar::-webkit-scrollbar { width: 8px; }
  .scrollbar::-webkit-scrollbar-thumb { background: #d4a29a; border-radius: 4px; }
  .scrollbar::-webkit-scrollbar-thumb:hover { background: #be185d; }
  .scrollbar::-webkit-scrollbar-track { background: transparent; }

  .matrix-table { border-radius: 10px; overflow: hidden; }
  .matrix-table td, .matrix-table th { border: 1px solid #e7dcd0; padding: 8px 10px; font-size: 13px; text-align: center; }
  .matrix-table th { background: linear-gradient(180deg, #fef3ea, #f5ede1); font-weight: 600; color: #3c2a21; }
  .matrix-table tbody tr:hover { background: #fef8f3; }
  .matrix-table input { width: 100%; text-align: center; background: transparent; outline: none; }

  .progress-bar { height: 10px; background: #f5ede1; border-radius: 999px; overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,0.05); }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #ec4899 0%, #f59e0b 50%, #be185d 100%); transition: width 0.4s cubic-bezier(.2,.8,.2,1); border-radius: 999px; }

  .score-circle { width: 100px; height: 100px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 700; box-shadow: 0 8px 20px -6px rgba(190,24,93,0.25), inset 0 2px 4px rgba(255,255,255,0.6); }

  /* Các button gradient mặc định */
  .btn-primary { background: linear-gradient(135deg, #be185d 0%, #ec4899 100%); color: white; transition: all 0.25s; }
  .btn-primary:hover { box-shadow: 0 10px 25px -5px rgba(190,24,93,0.4); transform: translateY(-1px); }
  .btn-accent  { background: linear-gradient(135deg, #be185d 0%, #ec4899 100%); color: white; transition: all 0.25s; }
  .btn-accent:hover { box-shadow: 0 10px 25px -5px rgba(190,24,93,0.4); transform: translateY(-1px); }
  .btn-gold    { background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%); color: white; transition: all 0.25s; }

  /* Nền gradient Kem Hồng cho khu nội dung + thẻ kính mờ (Liquid Glass) */
  .main-content-area { background: linear-gradient(165deg, #fff1f4 0%, #ffe0ea 44%, #ffdbc9 100%); background-attachment: local; }
  .soft-card { background: rgba(255,255,255,0.80); backdrop-filter: blur(9px) saturate(1.25); -webkit-backdrop-filter: blur(9px) saturate(1.25); border: 1px solid rgba(255,255,255,0.85); border-radius: 16px; box-shadow: 0 1px 3px rgba(60,42,33,0.04), 0 12px 26px -14px rgba(190,24,93,0.22); }
  .cream-card { background: linear-gradient(135deg, rgba(255,255,255,0.82) 0%, rgba(253,240,232,0.80) 100%); backdrop-filter: blur(9px) saturate(1.2); -webkit-backdrop-filter: blur(9px) saturate(1.2); border: 1px solid rgba(255,241,232,0.9); border-radius: 16px; }
  .teal-card { background: linear-gradient(135deg, #fff1f2 0%, #fde4ec 100%); border: 1px solid #fbcfe8; border-radius: 16px; }
  .rose-card { background: linear-gradient(135deg, #fff1f2 0%, #fce7f3 100%); border: 1px solid #fbcfe8; border-radius: 16px; }

  /* Pretty input focus */
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: #be185d;
    box-shadow: 0 0 0 3px rgba(190,24,93,0.12);
  }
  input, select, textarea { transition: all 0.2s; }

  /* Overrides chung cho Tailwind classes hay gặp — cho màu nhã hơn */
  .bg-slate-50 { background-color: #fdfaf6 !important; }
  .border-slate-200 { border-color: #e7dcd0 !important; }
  .text-slate-800 { color: #3c2a21 !important; }
  .text-slate-600 { color: #6b5a52 !important; }
  .text-slate-500 { color: #8c7568 !important; }
  .text-slate-400 { color: #b8a092 !important; }
  .bg-slate-100 { background-color: #f5ede1 !important; }
  .hover\:bg-slate-200:hover { background-color: #ecd9c6 !important; }
  .bg-slate-200 { background-color: #ecd9c6 !important; }

  /* ══════ KEM HỒNG: ánh xạ teal/cyan (xanh cũ) → hồng, đồng bộ toàn app ══════ */
  .bg-teal-50{background-color:#fff1f2!important}.bg-teal-100{background-color:#ffe4e6!important}.bg-teal-200{background-color:#fecdd3!important}.bg-teal-300{background-color:#fda4af!important}.bg-teal-500{background-color:#f43f5e!important}.bg-teal-600{background-color:#e11d48!important}.bg-teal-700{background-color:#be185d!important}.bg-teal-800{background-color:#9f1239!important}
  .text-teal-400{color:#fb7185!important}.text-teal-500{color:#f43f5e!important}.text-teal-600{color:#e11d48!important}.text-teal-700{color:#be185d!important}.text-teal-800{color:#9f1239!important}.text-teal-900{color:#881337!important}
  .border-teal-100{border-color:#ffe4e6!important}.border-teal-200{border-color:#fecdd3!important}.border-teal-300{border-color:#fda4af!important}.border-teal-400{border-color:#fb7185!important}.border-teal-500{border-color:#f43f5e!important}.border-teal-600{border-color:#e11d48!important}.border-teal-700{border-color:#be185d!important}
  .ring-teal-500{--tw-ring-color:#f43f5e!important}.ring-teal-600{--tw-ring-color:#e11d48!important}
  .hover\:bg-teal-50:hover{background-color:#fff1f2!important}.hover\:bg-teal-100:hover{background-color:#ffe4e6!important}.hover\:bg-teal-200:hover{background-color:#fecdd3!important}.hover\:bg-teal-300:hover{background-color:#fda4af!important}.hover\:bg-teal-700:hover{background-color:#be185d!important}.hover\:bg-teal-800:hover{background-color:#9f1239!important}
  .hover\:text-teal-700:hover{color:#be185d!important}.hover\:border-teal-200:hover{border-color:#fecdd3!important}.hover\:border-teal-300:hover{border-color:#fda4af!important}.hover\:border-teal-400:hover{border-color:#fb7185!important}
  .from-teal-50{--tw-gradient-from:#fff1f2 var(--tw-gradient-from-position)!important;--tw-gradient-to:rgb(255 241 242/0) var(--tw-gradient-to-position)!important;--tw-gradient-stops:var(--tw-gradient-from),var(--tw-gradient-to)!important}
  .from-teal-100{--tw-gradient-from:#ffe4e6 var(--tw-gradient-from-position)!important;--tw-gradient-to:rgb(255 228 230/0) var(--tw-gradient-to-position)!important;--tw-gradient-stops:var(--tw-gradient-from),var(--tw-gradient-to)!important}
  .from-teal-400{--tw-gradient-from:#fb7185 var(--tw-gradient-from-position)!important;--tw-gradient-to:rgb(251 113 133/0) var(--tw-gradient-to-position)!important;--tw-gradient-stops:var(--tw-gradient-from),var(--tw-gradient-to)!important}
  .from-teal-600{--tw-gradient-from:#e11d48 var(--tw-gradient-from-position)!important;--tw-gradient-to:rgb(225 29 72/0) var(--tw-gradient-to-position)!important;--tw-gradient-stops:var(--tw-gradient-from),var(--tw-gradient-to)!important}
  .from-teal-700{--tw-gradient-from:#be185d var(--tw-gradient-from-position)!important;--tw-gradient-to:rgb(190 24 93/0) var(--tw-gradient-to-position)!important;--tw-gradient-stops:var(--tw-gradient-from),var(--tw-gradient-to)!important}
  .to-teal-50{--tw-gradient-to:#fff1f2 var(--tw-gradient-to-position)!important}.to-teal-100{--tw-gradient-to:#ffe4e6 var(--tw-gradient-to-position)!important}.to-teal-500{--tw-gradient-to:#f43f5e var(--tw-gradient-to-position)!important}.to-teal-700{--tw-gradient-to:#be185d var(--tw-gradient-to-position)!important}
  .to-cyan-50{--tw-gradient-to:#fff1f2 var(--tw-gradient-to-position)!important}.to-cyan-100{--tw-gradient-to:#ffe4e6 var(--tw-gradient-to-position)!important}.to-cyan-400{--tw-gradient-to:#fb7185 var(--tw-gradient-to-position)!important}.to-cyan-500{--tw-gradient-to:#f43f5e var(--tw-gradient-to-position)!important}.to-cyan-600{--tw-gradient-to:#e11d48 var(--tw-gradient-to-position)!important}

  /* Glass effect cho header */
  .glass-header {
    background: rgba(255,255,255,0.85);
    backdrop-filter: saturate(180%) blur(12px);
    -webkit-backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid #f5ede1;
  }

  /* Pill button */
  .pill { border-radius: 999px; padding: 6px 14px; font-weight: 500; transition: all 0.2s; }

  /* Modern tab chip */
  .tab-chip { border-radius: 12px; padding: 10px 16px; font-weight: 500; font-size: 13px; transition: all 0.25s; white-space: nowrap; }
  .tab-chip:hover { background: #fef3ea; }
  .tab-chip.active { background: linear-gradient(135deg, #be185d 0%, #ec4899 100%); color: white; box-shadow: 0 6px 14px -4px rgba(190,24,93,0.3); }

  /* Decorative flourish */
  .flourish-underline { position: relative; display: inline-block; }
  .flourish-underline::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -4px; height: 3px;
    background: linear-gradient(90deg, transparent 0%, #ec4899 30%, #d97706 70%, transparent 100%);
    border-radius: 2px;
  }

  @media (max-width: 640px) { html { font-size: calc(var(--app-fs) * 0.94); } }
  .student-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; border: 1px solid #cbd5e1; margin: 2px; cursor: pointer; }
  .student-chip.submitted { background: #dcfce7; border-color: #86efac; color: #15803d; }
  .student-chip.pending { background: #fee2e2; border-color: #fca5a5; color: #b91c1c; }
  .student-chip.late { background: #fef3c7; border-color: #fcd34d; color: #92400e; }
  .student-chip.graded { background: #dbeafe; border-color: #93c5fd; color: #1e40af; }
  .image-annotation-wrapper { position: relative; display: inline-block; }
  .image-annotation-wrapper img { display: block; max-width: 100%; }
  .annotation-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  .annotation-mark { position: absolute; pointer-events: auto; cursor: pointer; }
  @media (max-width: 768px) { .hide-mobile { display: none; } }

  /* ══════ MOBILE RESPONSIVE ══════ */
  @media (max-width: 767px) {
    .modal-overlay { padding: 0 !important; align-items: flex-end !important; }
    .modal-box { max-width: 100vw !important; width: 100vw !important; max-height: 93vh !important; border-radius: 20px 20px 0 0 !important; }
    .subtab-bar { flex-wrap: nowrap !important; overflow-x: auto !important; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 6px !important; }
    .subtab-bar::-webkit-scrollbar { display: none; }
    .main-content-area { padding: 12px 12px 24px !important; }
    .header-book-select { display: none !important; }
    .header-school-input { display: none !important; }
    .glass-header { padding: 8px 12px !important; }
    .mobile-menu-btn { display: flex !important; }
    .desktop-sidebar { display: none !important; }
  }
  /* ══════ HAMBURGER FULL-SCREEN OVERLAY NAV ══════ */
  .hamburger-overlay {
    display: none; position: fixed; inset: 0; z-index: 60;
    background: linear-gradient(160deg, #fffbf7 0%, #fef5ed 40%, #fce8df 100%);
    flex-direction: column; overflow-y: auto;
    animation: slideUpOverlay 0.32s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes slideUpOverlay {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .hamburger-overlay.open { display: flex; }
  .hamburger-nav-item {
    display: flex; align-items: center; gap: 16px; padding: 16px 24px;
    border-bottom: 1px solid #f5ddd0; cursor: pointer; transition: all 0.2s;
    -webkit-tap-highlight-color: transparent; background: transparent; border-left: 4px solid transparent;
    text-align: left; width: 100%;
  }
  .hamburger-nav-item:hover { background: rgba(190,24,93,0.05); border-left-color: #fca5a5; }
  .hamburger-nav-item.active { background: linear-gradient(90deg, rgba(190,24,93,0.08), transparent); border-left-color: #be185d; }
  .hamburger-nav-item .nav-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .hamburger-nav-item .nav-label { font-size: 16px; font-weight: 600; color: #3c2a21; font-family: 'Be Vietnam Pro', sans-serif; }
  .hamburger-nav-item .nav-desc { font-size: 12px; color: #8c7568; margin-top: 1px; }
  .hamburger-nav-item.active .nav-label { color: #9f1239; }

  .sidebar-drawer {
    position: fixed !important; top: 0; bottom: 0; left: 0; z-index: 50;
    transform: translateX(-100%); transition: transform 0.28s ease;
    width: 280px !important; box-shadow: 4px 0 24px rgba(60,42,33,0.12);
  }
  .sidebar-drawer.open { transform: translateX(0); }
  /* Máy tính (màn rộng): menu cột trái LUÔN hiển thị, không giấu sau nút ☰ */
  @media (min-width: 768px) {
    .sidebar-drawer { position: relative !important; transform: none !important; z-index: 1; box-shadow: none !important; transition: width 0.28s ease; }
  }
  .sidebar-overlay {
    display: none; position: fixed; inset: 0; background: rgba(60,42,33,0.35); z-index: 49;
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  }
  @media (max-width: 767px) { .sidebar-overlay { display: block; } }
  .mobile-menu-btn { display: none; }

  /* ══════ THANH TAB DƯỚI (điện thoại) — kính mờ Kem Hồng ══════ */
  .mobile-tabbar { display: none; }
  .mtab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; background: none; border: none; padding: 6px 2px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .mtab-center { flex: 0 0 auto; }
  .mtab-fab { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: -22px; border: 3px solid #fff7f4; background: linear-gradient(135deg, #be185d, #ec4899); box-shadow: 0 6px 16px -4px rgba(190,24,93,0.5); }
  @media (max-width: 767px) {
    .mobile-tabbar {
      display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 45;

    fullText: 'Học tốt không chỉ phụ thuộc vào trí thông minh bẩm sinh mà còn đến từ phương pháp học đúng đắn. Theo nghiên cứu của các nhà tâm lý học giáo dục, có bốn yếu tố quyết định hiệu quả học tập: lập thời gian biểu khoa học, ôn bài trước khi ngủ, học theo nhóm và đặt câu hỏi chủ động. Đặc biệt, việc nghỉ ngơi đúng cách rất quan trọng — não bộ cần thời gian để xử lý và lưu trữ thông tin. Học sinh THCS nên ngủ đủ 8 tiếng mỗi đêm và tránh học nhồi nhét trước kỳ thi. Thay vào đó, hãy học đều đặn mỗi ngày, mỗi lần không quá 45 phút rồi nghỉ 10 phút.',

    fullText: 'Mỗi năm, khoảng 8 triệu tấn rác thải nhựa đổ ra đại dương — tương đương một xe tải rác đổ xuống biển mỗi phút. Những mảnh nhựa nhỏ li ti, gọi là vi nhựa, đã được tìm thấy trong cơ thể cá, trong muối ăn và thậm chí trong cơ thể người. Nhựa không phân hủy mà chỉ vỡ ra thành các mảnh nhỏ hơn, tồn tại hàng trăm năm trong môi trường. Việt Nam là một trong bốn quốc gia xả nhựa ra biển nhiều nhất thế giới, chủ yếu qua các con sông. Giải pháp không chỉ nằm ở luật pháp mà còn ở ý thức của từng người: hạn chế dùng đồ nhựa dùng một lần, phân loại rác trước khi bỏ, ủng hộ các sản phẩm thân thiện môi trường.',
  },
  {

    copyright_status: 'education_use', approved: true, wordCount: 145,
    excerpt: 'Trí tuệ nhân tạo (AI) đang thay đổi cách chúng ta học và làm việc với tốc độ chóng mặt...',
    fullText: 'Trí tuệ nhân tạo (AI) đang thay đổi cách chúng ta học và làm việc với tốc độ chóng mặt. Các công cụ AI như ChatGPT có thể giải bài tập, soạn thảo văn bản, giải thích khái niệm khó chỉ trong vài giây. Nhiều học sinh coi đây là "người gia sư" tiện lợi nhất từ trước đến nay. Tuy nhiên, giới chuyên gia lo ngại rằng việc phụ thuộc quá nhiều vào AI có thể làm giảm khả năng tư duy độc lập, sáng tạo và giải quyết vấn đề của học sinh. Chìa khóa là biết sử dụng AI như một công cụ hỗ trợ — tra cứu, kiểm tra, gợi ý — chứ không phải thay thế hoàn toàn quá trình suy nghĩ. Học sinh biết khai thác AI đúng cách sẽ có lợi thế lớn; ngược lại, lạm dụng AI là tự tước đi cơ hội phát triển bản thân.',

  {

    copyright_status: 'education_use', approved: true, wordCount: 155,
    excerpt: 'Theo khảo sát năm 2023, có đến 27% học sinh THCS tại Việt Nam từng trải qua các triệu chứng lo âu và căng thẳng học đường...',
    fullText: 'Theo khảo sát năm 2023, có đến 27% học sinh THCS tại Việt Nam từng trải qua các triệu chứng lo âu và căng thẳng học đường ở mức đáng lo ngại. Áp lực điểm số, kỳ vọng của gia đình, bạo lực học đường và sự cô đơn trên mạng xã hội là những nguyên nhân hàng đầu. Nhiều em không dám nói với ai vì sợ bị cho là "yếu đuối" hay bị hiểu lầm. Các chuyên gia khẳng định: sức khỏe tâm thần quan trọng không kém sức khỏe thể chất. Những dấu hiệu cần chú ý bao gồm: mất ngủ kéo dài, mất hứng học tập, thu mình khỏi bạn bè, hay cáu gắt hoặc buồn bã không rõ lý do. Nếu thấy những dấu hiệu này ở bản thân hoặc bạn bè, hãy tìm đến người tin tưởng để chia sẻ — đó là bước đầu tiên và can đảm nhất.',
  },
  {
    id: 'TT_8_003', title: 'Rác thải điện tử — Trách nhiệm của thế hệ số', author: 'Nguyễn Phương Linh', source: 'Báo Khoa học & Đời sống, 2025',
    class: 8, genre: 'thong_tin', subgenre: 'bai_bao', theme: 'moi_truong', difficulty: 'kho',
    copyright_status: 'education_use', approved: true, wordCount: 285,
    excerpt: 'Mỗi năm, thế giới thải ra hơn 53 triệu tấn rác điện tử — bao gồm điện thoại cũ, máy tính hỏng, tai nghe, pin lithium...',
    fullText: 'Mỗi năm, thế giới thải ra hơn 53 triệu tấn rác điện tử — bao gồm điện thoại cũ, máy tính hỏng, tai nghe, pin lithium. Tại Việt Nam, con số này tăng gần 20% chỉ trong vòng ba năm gần đây. Đáng lo ngại hơn, chưa đến 20% lượng rác đó được xử lý đúng cách.\n\nRác điện tử chứa nhiều kim loại độc hại: chì trong màn hình CRT, thủy ngân trong đèn huỳnh quang, cadmium trong pin sạc. Khi chôn lấp không đúng kỹ thuật, các chất này ngấm vào đất và nước ngầm, gây ô nhiễm nguồn nước sinh hoạt trong hàng chục năm. Một viên pin điện thoại có thể làm ô nhiễm 600.000 lít nước nếu không được tái chế đúng cách.\n\nTuy nhiên, vấn đề không chỉ nằm ở công nghệ xử lý. Thói quen tiêu dùng "thay máy mỗi năm" và áp lực từ các chiến dịch marketing công nghệ đang thúc đẩy vòng đời thiết bị ngày càng ngắn lại. Mỗi chiếc điện thoại mới tiêu thụ lượng điện đủ dùng cho một hộ gia đình trong hai tuần.\n\nThế hệ số — những người sinh ra cùng với internet — chính là thế hệ tạo ra nhiều rác điện tử nhất. Nhưng đây cũng là thế hệ có đủ kiến thức và công cụ để thay đổi. Mỗi quyết định mua sắm thông minh, mỗi lần sửa chữa thay vì vứt bỏ, mỗi thiết bị cũ được nộp vào điểm thu gom đều là một hành động cụ thể bảo vệ môi trường sống chung.',
  },
  {
    id: 'TT_9_002', title: 'Đô thị hóa và bảo tồn văn hóa truyền thống', author: 'PGS.TS. Trần Văn Hùng', source: 'Tạp chí Văn hóa Nghệ thuật, 2024',

    fullText: 'Tốc độ đô thị hóa tại Việt Nam đang diễn ra nhanh chưa từng có trong lịch sử. Chỉ trong hai thập kỷ qua, tỷ lệ dân số đô thị đã tăng từ 23% lên gần 40%. Những con phố cổ, làng nghề truyền thống, đình làng, hội hè bắt đầu nhường chỗ cho chung cư cao tầng và trung tâm thương mại. Một bộ phận người trẻ ngày nay không còn biết hát dân ca, không biết về phong tục tập quán của cha ông. Tuy nhiên, nhiều địa phương đã thành công trong việc kết hợp phát triển kinh tế với bảo tồn văn hóa. Hội An, Huế, Hà Nội phố cổ là những ví dụ điển hình. Điều quan trọng là mỗi người trẻ cần hiểu rằng: bảo tồn văn hóa không phải là cản trở phát triển, mà là cách để giữ gìn bản sắc dân tộc trong dòng chảy toàn cầu hóa.',

// 📊 Ước tính dung lượng đang dùng của kho dữ liệu này (byte). Giới hạn trình duyệt ~5MB.
const STORAGE_LIMIT_BYTES = 5 * 1024 * 1024;
const getStorageUsage = () => {
  try {
    let total = 0;
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      const v = localStorage.getItem(k) || '';
      total += (k.length + v.length) * 2; // UTF-16: 2 byte/ký tự
    }
    const appBytes = ((localStorage.getItem(STORAGE_KEY) || '').length) * 2;
    return { totalBytes: total, appBytes, limitBytes: STORAGE_LIMIT_BYTES, percent: Math.min(100, Math.round(total / STORAGE_LIMIT_BYTES * 100)) };
  } catch { return { totalBytes: 0, appBytes: 0, limitBytes: STORAGE_LIMIT_BYTES, percent: 0 }; }
};
const formatBytes = (b) => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : (b / 1048576).toFixed(2) + ' MB';

// 🗜️ Nén ảnh trước khi lưu: thu nhỏ + chuyển JPEG để không làm đầy bộ nhớ (ảnh 4MB → ~200-400KB)
const compressImageDataURL = (dataURL, maxDim = 1400, quality = 0.6) => new Promise((resolve) => {
  try {
    const img = new Image();
    img.onload = () => {
      try {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      } catch { resolve(dataURL); }
    };
    img.onerror = () => resolve(dataURL);
    img.src = dataURL;
  } catch { resolve(dataURL); }
});

// ============== 💾 LƯU RA FILE THẬT TRÊN MÁY (File System Access API) ==============
// Cho phép app ghi toàn bộ dữ liệu vào 1 file .json trong thư mục cô chọn trên máy này.
// Chạy trên Chrome / Cốc Cốc / Edge khi mở qua localhost hoặc web (không chạy khi mở bằng file://).
const FS_SUPPORTED = typeof window !== 'undefined' && 'showDirectoryPicker' in window;
const FS_FILE_NAME = 'TroLyGiaoVien_DuLieu.json';
let fsDirHandle = null;

// -- IndexedDB nhỏ để NHỚ thư mục cô đã chọn (giữ qua các lần mở lại app) --
const idbOpen = () => new Promise((resolve, reject) => {
  const req = indexedDB.open('trolygv_fs', 1);
  req.onupgradeneeded = () => req.result.createObjectStore('handles');
  req.onsuccess = () => resolve(req.result);
  req.onerror = () => reject(req.error);
});
const idbSet = async (key, val) => { const db = await idbOpen(); return new Promise((res, rej) => { const tx = db.transaction('handles', 'readwrite'); tx.objectStore('handles').put(val, key); tx.oncomplete = () => res(true); tx.onerror = () => rej(tx.error); }); };
const idbGet = async (key) => { const db = await idbOpen(); return new Promise((res, rej) => { const tx = db.transaction('handles', 'readonly'); const r = tx.objectStore('handles').get(key); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); };
const idbDel = async (key) => { const db = await idbOpen(); return new Promise((res) => { const tx = db.transaction('handles', 'readwrite'); tx.objectStore('handles').delete(key); tx.oncomplete = () => res(true); tx.onerror = () => res(false); }); };

const fsQueryPermission = async (handle) => { try { return await handle.queryPermission({ mode: 'readwrite' }); } catch { return 'prompt'; } };
const fsRequestPermission = async (handle) => { try { return await handle.requestPermission({ mode: 'readwrite' }); } catch { return 'denied'; } };

// Chọn thư mục lưu (cần cô bấm nút — trình duyệt bắt buộc)
const fsPickDirectory = async () => {
  if (!FS_SUPPORTED) throw new Error('Trình duyệt này không hỗ trợ lưu ra thư mục. Hãy dùng Chrome hoặc Cốc Cốc và mở app qua nút "Mở Trợ Lý".');
  const handle = await window.showDirectoryPicker({ id: 'trolygv', mode: 'readwrite' });
  const perm = (await fsQueryPermission(handle)) === 'granted' ? 'granted' : await fsRequestPermission(handle);
  if (perm !== 'granted') throw new Error('Cô chưa cho phép ghi vào thư mục.');
  fsDirHandle = handle;
  try { await idbSet('dataDir', handle); } catch {}
  return handle;
};

// Khôi phục thư mục đã chọn lần trước (không hiện hộp thoại — chỉ lấy lại "địa chỉ")
const fsRestoreDirectory = async () => {
  try { const h = await idbGet('dataDir'); if (h) { fsDirHandle = h; return h; } } catch {}
  return null;
};
const fsForget = async () => { fsDirHandle = null; try { await idbDel('dataDir'); } catch {} };

// Ghi dữ liệu ra file (chỉ ghi khi đã được cấp quyền)
const fsWriteData = async (payload) => {
  if (!fsDirHandle) return false;
  try {
    if ((await fsQueryPermission(fsDirHandle)) !== 'granted') return false;
    const fh = await fsDirHandle.getFileHandle(FS_FILE_NAME, { create: true });
    const w = await fh.createWritable();
    await w.write(JSON.stringify({ _meta: { app: 'TroLyGiaoVien', version: APP_VERSION, savedAt: new Date().toISOString() }, ...payload }, null, 2));
    await w.close();
    return true;
  } catch (e) { console.error('Lỗi ghi file trên máy:', e); return false; }
};
let __fsWriteTimer = null;
const fsWriteDataDebounced = (payload) => { if (__fsWriteTimer) clearTimeout(__fsWriteTimer); __fsWriteTimer = setTimeout(() => fsWriteData(payload), 800); };

// Đọc dữ liệu từ file (nếu cần quyền sẽ xin — nên gọi từ trong sự kiện bấm nút)
const fsReadData = async () => {
  if (!fsDirHandle) return null;
  try {
    if ((await fsQueryPermission(fsDirHandle)) !== 'granted') { if ((await fsRequestPermission(fsDirHandle)) !== 'granted') return null; }
    const fh = await fsDirHandle.getFileHandle(FS_FILE_NAME, { create: false });
    const file = await fh.getFile();
    const text = await file.text();
    return JSON.parse(text);
  } catch { return null; }
};

const initFirebase = () => {

// Ghi payload lên Firestore: chia JSON thành nhiều mảnh trong users/{uid}/chunks
let __fbWriteTimer = null, __fbLastJson = '';
const fbWriteDataNow = async (uid, payload) => {
  if (!fbReady || !uid) return false;
  try {
    const json = JSON.stringify(payload);
    __fbLastJson = json;
    const parts = [];
    for (let i = 0; i < json.length; i += FB_CHUNK) parts.push(json.slice(i, i + FB_CHUNK));
    const userRef = fbDb.collection('users').doc(uid);
    const batch = fbDb.batch();
    parts.forEach((s, i) => batch.set(userRef.collection('chunks').doc('c' + i), { s }));
    batch.set(userRef, { chunkCount: parts.length, updatedAt: Date.now(), size: json.length });
    await batch.commit();
    // dọn các mảnh cũ dư (nếu lần trước nhiều mảnh hơn)
    try {
      const old = await userRef.collection('chunks').get();
      const delBatch = fbDb.batch();
      old.forEach(d => { const n = parseInt(d.id.slice(1), 10); if (n >= parts.length) delBatch.delete(d.ref); });
      await delBatch.commit();
    } catch {}
    return true;
  } catch (e) { console.error('Lỗi ghi đám mây:', e); return false; }
};
const fbWriteDataDebounced = (uid, payload) => {
  if (!fbReady || !uid) return;
  if (__fbWriteTimer) clearTimeout(__fbWriteTimer);
  __fbWriteTimer = setTimeout(() => fbWriteDataNow(uid, payload), 900);
};

// Đọc payload từ Firestore (ghép các mảnh lại)
const fbReadData = async (uid) => {
  if (!fbReady || !uid) return null;
  try {
    const userRef = fbDb.collection('users').doc(uid);
    const meta = await userRef.get();
    if (!meta.exists) return null;
    const n = (meta.data() || {}).chunkCount || 0;
    if (!n) return null;
    let json = '';
    for (let i = 0; i < n; i++) {
      const c = await userRef.collection('chunks').doc('c' + i).get();
      json += (c.exists ? (c.data().s || '') : '');
    }
    if (!json) return null;
    __fbLastJson = json;
    return JSON.parse(json);
  } catch (e) { console.error('Lỗi đọc đám mây:', e); return null; }
};

// ============== GROQ + OLLAMA API INTEGRATION ==============
const GROQ_API_URL = 'https://api.groq.com/openai/v1/chat/completions';
const GROQ_MODEL = 'openai/gpt-oss-120b';

const getGroqApiKey = () => (localStorage.getItem('groq_api_key') || '').trim();
const saveGroqApiKey = (key) => localStorage.setItem('groq_api_key', (key || '').trim());
const getClaudeApiKey = () => (localStorage.getItem('claude_api_key') || '').trim();
const saveClaudeApiKey = (key) => localStorage.setItem('claude_api_key', (key || '').trim());
const CLAUDE_MODEL = 'claude-sonnet-5'; // model Claude cho tác vụ nặng
const getOllamaUrl = () => localStorage.getItem('ollama_url') || 'http://localhost:11434';
const saveOllamaUrl = (url) => localStorage.setItem('ollama_url', url);
const getUseOllama = () => localStorage.getItem('use_ollama') === 'true';
const setUseOllama = (val) => localStorage.setItem('use_ollama', val ? 'true' : 'false');

const callGroqAPI = async (prompt, maxTokens = 500) => {
  // 🔀 Tôn trọng NGUỒN AI cô đã chọn trong Cài đặt:
  //   - Chọn Claude  -> dùng Claude (chất lượng cao, chạy trên web qua cửa Netlify)
  //   - Chọn Ollama  -> dùng Ollama
  //   - Còn lại      -> dùng Groq (bên dưới)
  const provider = localStorage.getItem('selectedAIProvider') || '';
  if (provider === 'claude' && getClaudeApiKey()) return callClaudeAPI(prompt, maxTokens);

  const useOllama = getUseOllama();
  if (provider === 'ollama' || useOllama) return callOllamaAPI(prompt, maxTokens);

  const apiKey = getGroqApiKey();
  if (!apiKey) return { error: '❌ Chưa nhập Groq API Key' };

  try {
    const response = await fetch(GROQ_API_URL, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${apiKey}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: GROQ_MODEL,
        messages: [{ role: 'user', content: prompt }],
        max_tokens: maxTokens,
        temperature: 0.7
      })
    });

    if (!response.ok) {
      const errData = await response.json().catch(() => ({}));
      return { error: `❌ Groq API lỗi: ${errData.error?.message || 'Không xác định'}` };
    }
    const data = await response.json();
    return { success: true, text: data.choices[0].message.content };
  } catch (e) {
    return { error: `❌ Lỗi: ${e.message}` };
  }
};

// 🛟 Trích JSON từ phản hồi AI một cách AN TOÀN cho việc ra đề.
// AI hay quên escape dấu xuống dòng bên trong chuỗi JSON -> JSON.parse lỗi.
// Thay vì (như trước đây) đổ nguyên văn bản thô ra đề khi lỗi, hàm này cố cứu
// từng field bằng regex; nếu vẫn không cứu được field nào -> trả về { ok:false }
// để nơi gọi báo lỗi rõ ràng, KHÔNG BAO GIỜ để lộ JSON thô ra bài kiểm tra.
const parseAIExamJson = (rawText, keys) => {
  const txt = String(rawText || '').trim()
    .replace(/^```json\s*/i, '').replace(/^```\s*/, '').replace(/```\s*$/, '').trim();
  try {
    const json = JSON.parse(txt);
    if (keys.some(k => json[k] != null)) return { ok: true, data: json };
  } catch (e) { /* rơi xuống cách cứu dữ liệu bằng regex bên dưới */ }
  const data = {};
  let found = false;
  keys.forEach(key => {
    const re = new RegExp('"' + key + '"\\s*:\\s*"([\\s\\S]*?)"\\s*(?=,\\s*"[a-zA-Z]+"\\s*:|\\}\\s*,?\\s*"?[a-zA-Z]*"?\\s*:?|\\}\\s*$)');
    const m = txt.match(re);
    if (m) { data[key] = m[1].replace(/\\n/g, '\n').replace(/\\"/g, '"').trim(); found = true; }
  });
  return found ? { ok: true, data } : { ok: false };
};
// Trích 1 object lồng bên trong (vd "nguLieu": {...}) khi JSON.parse tổng thể đã lỗi.
const parseAINestedObject = (rawText, objectKey, innerKeys) => {
  const m = String(rawText || '').match(new RegExp('"' + objectKey + '"\\s*:\\s*\\{([\\s\\S]*?)\\}'));
  if (!m) return null;
  const inner = parseAIExamJson('{' + m[1] + '}', innerKeys);
  return inner.ok ? inner.data : null;
};

const callOllamaAPI = async (prompt, maxTokens = 500) => {
  const ollamaUrl = localStorage.getItem('ollama_url') || 'http://localhost:11434';
  const selectedModel = localStorage.getItem('ollama_model') || 'mistral:latest';

  try {
    console.log(`📡 Ollama: Gọi ${selectedModel} ở ${ollamaUrl}`);

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 120000); // 2 min timeout

    const response = await fetch(`${ollamaUrl}/api/generate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: selectedModel,
        prompt: prompt,
        stream: false,
        temperature: 0.7,
        num_predict: Math.min(maxTokens, 2000)
      }),
      mode: 'cors',
      signal: controller.signal
    });

    clearTimeout(timeoutId);

    if (!response.ok) {
      console.error(`❌ Ollama HTTP ${response.status}`);
      return { success: false, error: `❌ Ollama HTTP ${response.status}\n💡 Ollama có chạy ở ${ollamaUrl} không?` };
    }

    const data = await response.json();
    if (!data.response) {
      console.warn('⚠️ Ollama trả về response rỗng');
      return { success: false, error: '❌ Ollama không trả lời. Model có bị crash không?' };
    }

    console.log(`✅ Ollama OK: ${data.response.length} ký tự`);
    return { success: true, text: data.response };
  } catch (e) {
    console.error('Ollama error:', e.message);

    if (e.name === 'AbortError') {
      return { success: false, error: '⏱️ Timeout! Ollama chạy quá lâu (>2 phút). Model quá nặng?' };
    }

    return { success: false, error: `❌ Lỗi kết nối Ollama: ${e.message}\n✅ Chạy: ollama serve` };
  }
};

// ============== CLAUDE API ==============
// Gọi THẲNG Anthropic từ trình duyệt (header 'anthropic-dangerous-direct-browser-access').
// Ưu điểm: không qua máy chủ trung gian -> KHÔNG bị giới hạn 10 giây, chạy trên mọi máy.
const callClaudeAPI = async (prompt, maxTokens = 1024) => {
  const apiKey = getClaudeApiKey();
  if (!apiKey) return { error: '❌ Chưa nhập Claude API Key' };

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: CLAUDE_MODEL,
        max_tokens: maxTokens,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      const msg = (data && data.error && data.error.message) || ('HTTP ' + response.status);
      return { error: `❌ Claude API lỗi: ${msg}` };
    }
    const text = (data.content || [])
      .filter(b => b.type === 'text')
      .map(b => b.text)
      .join('')
      .trim();
    return { success: true, text: text || '(Claude không trả về nội dung)' };
  } catch (e) {
    return { error: `❌ Lỗi kết nối Claude: ${e.message}` };
  }
};

// 👁️ Claude ĐỌC ẢNH (vision): chấm bài chụp viết tay. images = mảng dataURL (data:image/...;base64,...)
const parseImageDataURL = (durl) => {
  const m = /^data:([^;]+);base64,(.*)$/s.exec(durl || '');
  if (!m) return null;
  return { media_type: m[1], data: m[2] };
};
const callClaudeVisionAPI = async (prompt, images = [], maxTokens = 1200) => {
  const apiKey = getClaudeApiKey();
  if (!apiKey) return { error: '❌ Chưa nhập Claude API Key' };
  const content = [{ type: 'text', text: prompt }];
  for (const im of images) {
    const p = parseImageDataURL(typeof im === 'string' ? im : (im && im.dataURL));
    if (p) content.push({ type: 'image', source: { type: 'base64', media_type: p.media_type, data: p.data } });
  }
  if (content.length === 1) return { error: '❌ Không đọc được ảnh đính kèm' };
  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({ model: CLAUDE_MODEL, max_tokens: maxTokens, messages: [{ role: 'user', content }] })
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      const msg = (data && data.error && data.error.message) || ('HTTP ' + response.status);
      return { error: `❌ Claude API lỗi: ${msg}` };
    }
    const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('').trim();
    return { success: true, text: text || '(Claude không trả về nội dung)' };
  } catch (e) {
    return { error: `❌ Lỗi kết nối Claude: ${e.message}` };
  }
};

const FONT_SIZE_KEY = 'tro_ly_gv_font_size';
const TEXT_BOLD_KEY = 'tro_ly_gv_text_bold';
const FONT_SIZE_DEFAULT = 17, FONT_SIZE_MIN = 14, FONT_SIZE_MAX = 24;
const FontSizeControl = () => {
  const [fs, setFs] = React.useState(() => parseInt(localStorage.getItem(FONT_SIZE_KEY) || String(FONT_SIZE_DEFAULT), 10));
  const [bold, setBold] = React.useState(() => localStorage.getItem(TEXT_BOLD_KEY) === '1');
  const [open, setOpen] = React.useState(false);
  React.useEffect(() => {
    document.documentElement.style.setProperty('--app-fs', fs + 'px');
    localStorage.setItem(FONT_SIZE_KEY, String(fs));
  }, [fs]);
  React.useEffect(() => {
    document.documentElement.classList.toggle('text-strong', bold);
    localStorage.setItem(TEXT_BOLD_KEY, bold ? '1' : '0');
  }, [bold]);
  return (
    <div className="relative">
      <button onClick={() => setOpen(o => !o)} title="Cỡ chữ & độ đậm nhạt"
        className="flex items-center gap-0.5 px-3 py-2 rounded-xl text-sm font-bold bg-amber-50 text-amber-800 border border-amber-200 hover:bg-amber-100 transition">
        <span style={{ fontSize: 11 }}>A</span><span>A</span>
      </button>
      {open && (
        <>
          <div className="fixed inset-0 z-30" onClick={() => setOpen(false)} />
          <div className="absolute right-0 mt-2 w-72 bg-white border border-amber-200 rounded-2xl shadow-2xl p-4 z-40">
            <p className="text-sm font-bold text-amber-900 mb-3 flex items-center gap-1.5"><Icon name="Type" size={16} /> Cỡ chữ &amp; độ đậm nhạt</p>
            <div className="flex items-center justify-between mb-3">
              <span className="text-sm" style={{ color: 'var(--c-ink-soft)' }}>Cỡ chữ</span>
              <div className="flex items-center gap-2">
                <button onClick={() => setFs(v => Math.max(FONT_SIZE_MIN, v - 1))} className="w-9 h-9 rounded-lg bg-slate-100 hover:bg-slate-200 font-bold">A−</button>
                <span className="text-sm font-mono w-6 text-center">{fs}</span>
                <button onClick={() => setFs(v => Math.min(FONT_SIZE_MAX, v + 1))} className="w-9 h-9 rounded-lg bg-slate-100 hover:bg-slate-200 font-bold text-lg">A+</button>
              </div>
            </div>
            <div className="flex items-center justify-between mb-3">
              <span className="text-sm" style={{ color: 'var(--c-ink-soft)' }}>Chữ đậm hơn</span>
              <button onClick={() => setBold(b => !b)}
                className={`px-3 py-1.5 rounded-full text-xs font-bold transition ${bold ? 'bg-teal-600 text-white' : 'bg-slate-100 text-slate-500'}`}>
                {bold ? '✓ Đang bật' : 'Đang tắt'}
              </button>
            </div>
            <button onClick={() => { setFs(FONT_SIZE_DEFAULT); setBold(false); }}
              className="w-full text-xs text-center font-medium text-rose-600 hover:underline pt-1 border-t border-slate-100">
              ↺ Về mặc định
            </button>
          </div>
        </>
      )}
    </div>
  );
};

// ============== BATCH GRADE VIEW (Chấm bài hàng loạt) ==============
const BatchGradeView = ({ cls, asg, fbUser, data, onBack }) => {
  const [subs, setSubs] = useState([]);
  const [grades, setGrades] = useState({});
  const [aiRunning, setAiRunning] = useState(false);
  const [aiIdx, setAiIdx] = useState(0);
  const [sending, setSending] = useState(false);
  const [expandedSub, setExpandedSub] = useState(null);

  useEffect(() => {
    const un = fbDb.collection('classes').doc(cls.id).collection('submissions')
      .where('assignmentId','==',asg.id)
      .onSnapshot(s => {
        const list = s.docs.map(d => ({ id: d.id, ...d.data() }))
          .filter(x => x.status !== 'in_progress')
          .sort((a,b) => (b.submittedAt||0) - (a.submittedAt||0));
        setSubs(list);
        const init = {};
        list.forEach(sub => {
          init[sub.id] = {
            score: sub.finalScore ?? sub.autoScore ?? '',
            feedback: sub.finalFeedback ?? sub.autoFeedback ?? '',
            status: sub.status || 'submitted'
          };
        });
        setGrades(prev => {
          const merged = { ...init };
          Object.keys(prev).forEach(k => {
            if (merged[k] && (prev[k].score !== '' || prev[k].feedback !== '')) {
              merged[k] = prev[k];
            }
          });
          return merged;
        });
      });
    return un;
  }, [cls.id, asg.id]);

  const updateGrade = (subId, field, val) => {
    setGrades(prev => ({ ...prev, [subId]: { ...prev[subId], [field]: val } }));
  };

  const aiGradeOne = async (sub) => {
    const hasImages = sub.images && sub.images.length > 0;
    if (hasImages && !getClaudeApiKey()) return { error: 'Cần Claude API Key để chấm bài ảnh' };
    const prompt = `Bạn là giáo viên Ngữ văn THCS. Hãy CHẤM bài làm học sinh theo đề. Trả lời tiếng Việt.\n\n=== ĐỀ ===\n${asg.body}\n\n=== BÀI LÀM ===\n${sub.answer||'(trống)'}${hasImages?'\n\n⚠️ HS nộp bằng ẢNH chụp bài viết tay đính kèm. Đọc kỹ chữ viết tay rồi chấm.':''}\nCho ĐIỂM thang 10 và NHẬN XÉT ngắn gọn, giọng động viên.\nJSON thuần: {"diem": <0-10>, "nhanxet": "..."}`;
    const r = hasImages ? await callClaudeVisionAPI(prompt, sub.images, 1400) : await callGroqAPI(prompt, 1200);
    if (r.error) return r;
    try {
      const t = r.text.replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'').trim();
      const j = JSON.parse(t);
      return { score: j.diem, feedback: j.nhanxet };
    } catch { return { score: '', feedback: r.text }; }
  };

  const aiGradeAll = async () => {
    const pending = subs.filter(s => !grades[s.id]?.score && grades[s.id]?.status !== 'released');
    if (pending.length === 0) { alert('Tất cả bài đã có điểm rồi.'); return; }
    setAiRunning(true); setAiIdx(0);
    for (let i = 0; i < pending.length; i++) {
      setAiIdx(i + 1);
      const sub = pending[i];
      const result = await aiGradeOne(sub);
      if (!result.error) {
        const ref = fbDb.collection('classes').doc(cls.id).collection('submissions').doc(sub.id);
        await ref.update({ autoScore: result.score, autoFeedback: result.feedback, status: 'graded' });
        setGrades(prev => ({ ...prev, [sub.id]: { score: result.score, feedback: result.feedback, status: 'graded' } }));
      }
    }
    setAiRunning(false);
  };

  const releaseAll = async () => {
    const ready = subs.filter(s => grades[s.id]?.score !== '' && grades[s.id]?.score !== undefined && grades[s.id]?.status !== 'released');
    if (ready.length === 0) { alert('Không có bài nào cần gửi.'); return; }
    if (!confirm(`Gửi kết quả ${ready.length} bài cho học sinh?`)) return;
    setSending(true);
    for (const sub of ready) {
      const g = grades[sub.id];
      const ref = fbDb.collection('classes').doc(cls.id).collection('submissions').doc(sub.id);
      await ref.update({ finalScore: Number(g.score), finalFeedback: g.feedback, status: 'released', releasedAt: Date.now() });
      await fbDb.collection('classes').doc(cls.id).collection('messages').add({
        fromRole: 'teacher', fromName: 'Cô',
        text: `📊 Kết quả "${asg.title}" của ${sub.studentName}: ${g.score}đ — ${g.feedback}`,
        at: Date.now()
      });
      setGrades(prev => ({ ...prev, [sub.id]: { ...prev[sub.id], status: 'released' } }));
    }
    setSending(false);
    alert(`✅ Đã gửi kết quả cho ${ready.length} học sinh!`);
  };

  const totalSubs = subs.length;
  const graded = subs.filter(s => grades[s.id]?.score !== '' && grades[s.id]?.score !== undefined).length;
  const released = subs.filter(s => grades[s.id]?.status === 'released').length;
  const expired = asg.deadline && Date.now() > asg.deadline;

  return (
    <div className="soft-card flex flex-col" style={{maxHeight:'580px'}}>
      <div className="flex items-center gap-2 px-3 py-2 border-b border-rose-100">
        <button onClick={onBack} className="text-rose-400 hover:text-rose-600"><Icon name="ArrowLeft" size={16} /></button>
        <div className="flex-1 min-w-0">
          <p className="text-xs font-semibold text-rose-900 truncate">{asg.title}</p>
          <p className="text-[9px]" style={{color:'var(--c-ink-soft)'}}>⏱ {asg.durationMin}' · {expired ? 'Đã đóng' : `Hạn ${ocFmt(asg.deadline)}`} · {totalSubs} bài nộp</p>
        </div>
      </div>

      <div className="flex items-center gap-2 px-3 py-1.5 bg-rose-50 border-b border-rose-100">
        <span className="text-[9px]" style={{color:'var(--c-ink-soft)'}}>{graded}/{totalSubs} đã chấm · {released} đã gửi</span>
        <div className="flex-1" />
        <button onClick={aiGradeAll} disabled={aiRunning}
          className="text-[10px] px-2.5 py-1 rounded-lg font-medium text-white" style={{background: aiRunning ? '#ccc' : '#be185d'}}>
          {aiRunning ? `🤖 Đang chấm ${aiIdx}/${subs.filter(s=>!grades[s.id]?.score&&grades[s.id]?.status!=='released').length}...` : '🤖 AI chấm tất cả'}
        </button>
        <button onClick={releaseAll} disabled={sending || graded === 0}
          className="text-[10px] px-2.5 py-1 rounded-lg font-medium text-white" style={{background: sending || graded === 0 ? '#ccc' : '#d97706'}}>
          {sending ? 'Đang gửi...' : `📤 Gửi tất cả (${graded - released})`}
        </button>
      </div>

      {aiRunning && (
        <div className="px-3 py-1">
          <div className="h-1.5 rounded-full overflow-hidden bg-rose-100">
            <div className="h-full rounded-full bg-rose-500 transition-all" style={{width:`${Math.round(aiIdx/Math.max(subs.filter(s=>!grades[s.id]?.score).length,1)*100)}%`}} />
          </div>
        </div>
      )}

      <div className="flex-1 overflow-y-auto px-2 py-1.5">
        {subs.length === 0 && <p className="text-center text-[10px] py-6" style={{color:'#d4aab8'}}>Chưa có bài nộp.</p>}
        {subs.map(sub => {
          const g = grades[sub.id] || {};
          const isReleased = g.status === 'released';
          return (
            <div key={sub.id} className="soft-card p-2.5 mb-1.5" style={isReleased ? {opacity:0.6} : {}}>
              <div className="flex items-center justify-between mb-1">
                <div className="flex items-center gap-1.5">
                  <span className="text-[11px] font-semibold text-rose-900">{sub.studentName}</span>
                  <span className="text-[8px]" style={{color:'var(--c-ink-soft)'}}>nộp {ocFmt(sub.submittedAt)}</span>
                </div>
                {isReleased
                  ? <span className="text-[8px] px-1.5 py-0.5 rounded-full bg-emerald-100 text-emerald-700">✓ Đã gửi</span>
                  : g.score !== '' && g.score !== undefined
                  ? <span className="text-[8px] px-1.5 py-0.5 rounded-full bg-amber-100 text-amber-700">Đã chấm</span>
                  : <span className="text-[8px] px-1.5 py-0.5 rounded-full bg-rose-100 text-rose-700">Chờ chấm</span>}
              </div>
              {expandedSub === sub.id ? (
                <div className="mb-1.5 p-2 rounded-lg bg-slate-50 border border-slate-100">
                  <div className="flex items-center justify-between mb-1">
                    <span className="text-[9px] font-semibold" style={{color:'#be185d'}}>📄 Bài làm đầy đủ</span>
                    <button onClick={() => setExpandedSub(null)} className="text-[8px] px-1.5 py-0.5 rounded bg-rose-100 text-rose-600">Thu gọn ▲</button>
                  </div>
                  {sub.answer ? <p className="text-[10px] whitespace-pre-wrap leading-relaxed" style={{color:'#3c2a21'}}>{sub.answer}</p> : <p className="text-[9px] italic" style={{color:'#d4aab8'}}>Không có phần gõ chữ.</p>}
                  {sub.images && sub.images.length > 0 && (
                    <div className="mt-2 space-y-2">{sub.images.map((im,i) => <img key={i} src={im} className="w-full rounded-lg border" />)}</div>
                  )}
                </div>
              ) : (
                <div className="flex items-center gap-1.5 mb-1.5">
                  {sub.answer && <p className="flex-1 text-[9px] p-1 rounded-lg bg-slate-50 border border-slate-100 truncate" style={{color:'#5a3a44'}}>{sub.answer.slice(0,80)}{sub.answer.length>80?'...':''}</p>}
                  {sub.images && sub.images.length > 0 && <span className="text-[9px] px-1.5 py-0.5 rounded bg-slate-100" style={{color:'var(--c-ink-soft)'}}>📷 {sub.images.length} ảnh</span>}
                  {(sub.answer || (sub.images && sub.images.length > 0)) && (
                    <button onClick={() => setExpandedSub(sub.id)} className="text-[8px] px-1.5 py-0.5 rounded bg-rose-50 text-rose-600 flex-shrink-0">Xem bài ▼</button>
                  )}
                </div>
              )}
              <div className="flex items-center gap-2">
                <div className="flex items-center gap-1">
                  <span className="text-[9px] font-medium" style={{color:'var(--c-ink-soft)'}}>Điểm:</span>
                  <input type="number" step="0.25" min="0" max="10" value={g.score ?? ''} disabled={isReleased}
                    onChange={e => updateGrade(sub.id, 'score', e.target.value)}
                    className="w-12 px-1.5 py-0.5 border border-rose-200 rounded-lg text-[10px] text-center" />
                </div>
                <input value={g.feedback ?? ''} disabled={isReleased}
                  onChange={e => updateGrade(sub.id, 'feedback', e.target.value)}
                  placeholder="Nhận xét..."
                  className="flex-1 px-2 py-0.5 border border-rose-200 rounded-lg text-[10px]" />
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
};

// ============== TIN NHẮN LỚP (Firebase, thời gian thực) ==============
const ClassMessagesTab = ({ fbUser, setActive }) => {
  const [fbClasses, setFbClasses] = useState([]);
  const [lastMsgs, setLastMsgs] = useState({});

  useEffect(() => {
    if (!fbReady || !fbUser) return;
    const un = fbDb.collection('classes').where('teacherUid','==',fbUser.uid).onSnapshot(snap => {
      setFbClasses(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (a.grade - b.grade) || (a.name > b.name ? 1 : -1)));
    });
    return un;
  }, [fbUser]);

  useEffect(() => {
    if (!fbReady || !fbUser || fbClasses.length === 0) return;
    const unsubs = fbClasses.map(cls => {
      const msgUn = fbDb.collection('classes').doc(cls.id).collection('messages')
        .orderBy('at','desc').limit(1).onSnapshot(s => {
          if (!s.empty) setLastMsgs(prev => ({ ...prev, [cls.id]: s.docs[0].data() }));
        });
      const cntUn = fbDb.collection('classes').doc(cls.id).collection('messages')
        .where('fromRole','==','student').onSnapshot(s => {
          setClsMsgCount(prev => ({ ...prev, [cls.id]: s.size }));
        });
      return [msgUn, cntUn];
    });
    return () => unsubs.flat().forEach(u => u());
  }, [fbUser, fbClasses.length]);

  useEffect(() => {
    if (!chatCls) return;
    const un = fbDb.collection('classes').doc(chatCls.id).collection('messages')
      .orderBy('at','asc').limitToLast(50).onSnapshot(s => {
        setChatMsgs(s.docs.map(d => ({ id: d.id, ...d.data() })));
        setTimeout(() => chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }), 100);
      });
    return un;
  }, [chatCls?.id]);

  const sendChat = async () => {
    if (!chatText.trim() || !chatCls) return;
    await fbDb.collection('classes').doc(chatCls.id).collection('messages').add({
      fromRole: 'teacher', fromName: 'Cô', text: chatText.trim(), at: Date.now()
    });
    setChatText('');
  };

  const fmtAgo = (t) => {
    if (!t) return '';
    const m = Math.round((Date.now() - t) / 6e4);
    if (m < 60) return `${m}'`;
    if (m < 1440) return `${Math.round(m/60)} giờ`;
    return `${Math.round(m/1440)} ngày`;

  const gradeColors = { 6: '#be185d', 7: '#d97706', 8: '#0f766e', 9: '#7c3aed' };

  if (!fbUser) return (
    <div className="fade-in max-w-xl mx-auto p-6">

        <div className="text-4xl mb-3">💬</div>

        <button onClick={() => setActive('settings')} className="btn-primary mt-3 px-4 py-2 rounded-xl text-sm">🔐 Đăng nhập</button>
      </div>
    </div>
  );

  return (
    <div className="fade-in">
      <div className="flex items-center gap-3 mb-4">
        <div className="w-10 h-10 rounded-2xl flex items-center justify-center text-xl text-white shadow"
          style={{background:'linear-gradient(135deg,#be185d,#ec4899)'}}>💬</div>
        <div>
          <h1 className="text-lg font-bold font-display" style={{color:'#9f1239'}}>Tin nhắn lớp</h1>
          <p className="text-[11px]" style={{color:'var(--c-ink-soft)'}}>{fbClasses.length} lớp · bấm vào lớp để nhắn tin</p>
        </div>
      </div>

      <div className="space-y-1.5">
        {fbClasses.map(cls => {
          const lm = lastMsgs[cls.id];
          const msgs = clsMsgCount[cls.id] || 0;
          const gColor = gradeColors[cls.grade] || '#be185d';
          return (
            <button key={cls.id} onClick={() => setChatCls(cls)}
              className="w-full flex items-center gap-3 p-3 rounded-2xl text-left hover:bg-rose-50 transition soft-card">
              <div className="w-11 h-11 rounded-xl flex items-center justify-center text-white text-xs font-semibold flex-shrink-0"
                style={{background:`linear-gradient(135deg,${gColor},${gColor}99)`}}>{(cls.name||'').replace(/[^0-9A-Za-z]/g,'')}</div>
              <div className="flex-1 min-w-0">
                <div className="flex justify-between items-center">
                  <span className="text-sm font-semibold text-rose-900 truncate">{cls.name}</span>
                  {lm && <span className="text-[10px] flex-shrink-0" style={{color:'var(--c-ink-soft)'}}>{fmtAgo(lm.at)}</span>}
                </div>
                <p className="text-xs truncate" style={{color:'var(--c-ink-soft)'}}>
                  {lm ? `${lm.fromName||''}: ${(lm.text||'').slice(0,40)}` : 'Chưa có tin nhắn'}
                </p>
              </div>
              {msgs > 0 && <span className="w-5 h-5 rounded-full bg-rose-600 text-white text-[9px] font-semibold flex items-center justify-center flex-shrink-0">{msgs}</span>}
            </button>
          );
        })}
        {fbClasses.length === 0 && (
          <div className="soft-card p-8 text-center">
            <div className="text-3xl mb-2">📭</div>
            <p className="text-sm" style={{color:'var(--c-ink-soft)'}}>Chưa có lớp nào. Tạo lớp ở Trang chủ để bắt đầu nhắn tin.</p>
          </div>
        )}
      </div>

      {chatCls && (
        <DashPopup title={`💬 ${chatCls.name}  ·  ${(chatCls.students||[]).length} thành viên`} onClose={() => { setChatCls(null); setChatMsgs([]); }} noPad>

            <div className="flex-1 overflow-y-auto px-4 py-3 space-y-2">
              {chatMsgs.length === 0 && <p className="text-center text-xs py-12" style={{color:'#d4aab8'}}>Chưa có tin nhắn nào trong lớp</p>}
              {chatMsgs.map(m => (
                <div key={m.id} className={`max-w-[80%] px-3 py-2 rounded-2xl text-sm leading-relaxed ${m.fromRole==='teacher' ? 'ml-auto bg-gradient-to-r from-rose-600 to-rose-500 text-white rounded-br-sm' : 'bg-rose-50 text-rose-900 rounded-bl-sm'}`}>

            <div className="flex gap-2 px-4 py-3 border-t border-rose-100 flex-shrink-0" style={{background:'#fff7f4'}}>
              <input value={chatText} onChange={e => setChatText(e.target.value)}

                placeholder="Nhắn cho lớp..." className="flex-1 px-3 py-2 border border-rose-200 rounded-xl text-sm bg-white" />
              <button onClick={sendChat} className="px-4 py-2 rounded-xl text-sm font-medium text-white" style={{background:'#be185d'}}>Gửi</button>
            </div>
          </div>
        </DashPopup>
      )}
    </div>
  );
};

        setChatMsgs(s.docs.map(d => ({ id: d.id, ...d.data() })));
