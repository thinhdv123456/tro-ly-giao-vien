    if (m < 60) return `${m}'`;
    if (m < 1440) return `${Math.round(m/60)} giờ`;
    return `${Math.round(m/1440)} ngày`;
  };

  const gradeColors = { 6: '#be185d', 7: '#d97706', 8: '#0f766e', 9: '#7c3aed' };

  useEffect(() => {
    if (!viewCls) { setViewAsgs([]); return; }
    const un = fbDb.collection('classes').doc(viewCls.id).collection('assignments')
      .onSnapshot(s => setViewAsgs(s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => b.createdAt - a.createdAt)));
    return un;
  }, [viewCls?.id]);

  const deleteCls = async (cls) => {
    if (!confirm(`Xoá lớp "${cls.name}"? Toàn bộ bài tập, bài nộp, tin nhắn sẽ bị xoá vĩnh viễn.`)) return;
    await fbDb.collection('classes').doc(cls.id).delete();
  };

  // Ước tính dung lượng Firestore
  useEffect(() => {
    if (!fbReady || !fbUser || fbClasses.length === 0) return;
    let cancel = false;
    (async () => {
      let totalSubs = 0, totalImgs = 0, totalMsgs = 0;
      for (const cls of fbClasses) {
        try {
          const subSnap = await fbDb.collection('classes').doc(cls.id).collection('submissions').get();
          totalSubs += subSnap.size;
          subSnap.forEach(d => {
            const imgs = d.data().images;
            if (imgs && imgs.length > 0) totalImgs += imgs.length;
          });
          const msgSnap = await fbDb.collection('classes').doc(cls.id).collection('messages').get();
          totalMsgs += msgSnap.size;
        } catch {}
      }
      const estImgKB = totalImgs * 80;
      const estTextKB = (totalSubs * 2) + (totalMsgs * 0.5);
      const estTotalKB = estImgKB + estTextKB;
      const limitKB = 1024 * 1024;
      if (!cancel) setStorageInfo({ totalSubs, totalImgs, totalMsgs, estTotalKB, limitKB, percent: Math.round(estTotalKB / limitKB * 100) });
    })();
    return () => { cancel = true; };
  }, [fbUser, fbClasses.length]);

  const doCleanup = async (months) => {
    const cutoff = Date.now() - months * 30 * 24 * 3600 * 1000;
    if (!confirm(`Xoá tất cả bài nộp và tin nhắn cũ hơn ${months} tháng?\n\nBài đã chấm và trả kết quả sẽ bị xoá. Thao tác không thể hoàn tác!`)) return;
    setCleanupBusy(true); setCleanupResult('');
    let delSubs = 0, delMsgs = 0;
    try {
      for (const cls of fbClasses) {
        const subSnap = await fbDb.collection('classes').doc(cls.id).collection('submissions').get();
        for (const doc of subSnap.docs) {
          const d = doc.data();
          const t = d.submittedAt || d.startedAt || 0;
          if (t > 0 && t < cutoff) { await doc.ref.delete(); delSubs++; }
        }
        const msgSnap = await fbDb.collection('classes').doc(cls.id).collection('messages').get();
        for (const doc of msgSnap.docs) {
          const t = doc.data().at || 0;
          if (t > 0 && t < cutoff) { await doc.ref.delete(); delMsgs++; }
        }
      }
      setCleanupResult(`✅ Đã xoá ${delSubs} bài nộp, ${delMsgs} tin nhắn cũ hơn ${months} tháng.`);
      setStorageInfo(null);
    } catch (e) { setCleanupResult('❌ Lỗi: ' + e.message); }
    setCleanupBusy(false);
  };

  // Chưa đăng nhập hoặc chưa có lớp
  if (!fbUser || (fbClasses.length === 0 && !loading)) return (
    <div className="fade-in">
      <div className="flex items-center gap-4 mb-6">
        <div className="w-12 h-12 rounded-2xl flex items-center justify-center text-2xl text-white shadow"
          style={{background:'linear-gradient(135deg,#be185d,#ec4899)'}}>🌐</div>
        <div>
          <h1 className="text-xl font-bold font-display" style={{color:'#9f1239'}}>Lớp Học Kết Nối</h1>
          <p className="text-xs" style={{color:'var(--c-ink-soft)'}}>Chào cô Thu · {dateStr}</p>
        </div>
        {fbUser && <button onClick={onSignOut}
          className="ml-auto px-3 py-1.5 rounded-xl text-xs font-medium border border-rose-200 text-rose-500 hover:bg-rose-50 transition">
          🚪 Đăng xuất ({fbUser.email || 'Anonymous'})
        </button>}
      </div>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
        {[
          { label: 'Kế hoạch bài dạy', val: plans.length, icon: '📋' },
          { label: 'Giáo án', val: lessons.length, icon: '📖' },
          { label: 'Đề kiểm tra', val: exams.length, icon: '📝' },
          { label: 'Bài đã chấm', val: gradings.length, icon: '✅' },
        ].map((k,i) => (
          <div key={i} className="soft-card p-4">
            <p className="text-xs" style={{color:'var(--c-ink-soft)'}}>{k.icon} {k.label}</p>
            <p className="text-2xl font-bold font-display mt-1" style={{color:'#4a2530'}}>{k.val}</p>
          </div>
        ))}
      </div>
      <div className="soft-card p-8 text-center mb-4" style={{borderColor:'#f7c9dc'}}>
        <div className="text-4xl mb-3">🏫</div>
        <h3 className="text-lg font-bold text-rose-900 mb-2 font-display">{!fbUser ? 'Đăng nhập để xem lớp' : 'Chưa có lớp học nào'}</h3>
        <p className="text-sm mb-5" style={{color:'var(--c-ink-soft)'}}>{!fbUser ? 'Vào Cài đặt → Đăng nhập đám mây để hiện các lớp của cô' : 'Tạo lớp trong Lớp Học Kết Nối để bảng điều khiển hiện số liệu thật'}</p>
        <button onClick={() => !fbUser ? setActive('settings') : setShowAddClass(true)} className="btn-primary px-6 py-2.5 rounded-xl font-medium text-sm">
          {!fbUser ? '🔐 Đăng nhập' : '＋ Tạo lớp đầu tiên'}
        </button>
      </div>
      <div className="grid grid-cols-2 gap-3">
        <button onClick={() => setActive('planning')} className="soft-card p-4 flex items-center gap-3 text-left hover:scale-[1.02] transition cursor-pointer">
          <Icon name="CalendarDays" size={20} className="text-rose-400" />
          <span className="text-sm font-medium text-rose-900">Lập kế hoạch bài dạy</span>
        </button>
        <button onClick={() => setActive('exam')} className="soft-card p-4 flex items-center gap-3 text-left hover:scale-[1.02] transition cursor-pointer">
          <Icon name="FileCheck" size={20} className="text-rose-400" />
          <span className="text-sm font-medium text-rose-900">Tạo đề kiểm tra</span>
        </button>
      </div>
    </div>
  );

  if (loading) return (
    <div className="fade-in flex items-center justify-center py-20">
      <div className="text-center"><div className="text-4xl mb-3 animate-pulse">🌸</div><p className="text-sm" style={{color:'var(--c-ink-soft)'}}>Đang tải bảng điều khiển...</p></div>
    </div>
  );

  const byGrade = {};
  fbClasses.forEach(c => { (byGrade[c.grade] = byGrade[c.grade] || []).push(c); });

  return (
    <div className="fade-in">
      {/* Header */}
      <div className="flex items-center gap-3 mb-4">
        <div className="w-11 h-11 rounded-2xl flex items-center justify-center text-xl text-white shadow"
          style={{background:'linear-gradient(135deg,#be185d,#ec4899)'}}>🌐</div>
        <div>
          <h1 className="text-lg md:text-xl font-bold font-display" style={{color:'#9f1239'}}>Lớp Học Kết Nối</h1>
          <p className="text-[11px]" style={{color:'var(--c-ink-soft)'}}>Chào cô Thu · {dateStr}</p>
        </div>
        <div className="ml-auto flex items-center gap-2">
          <button onClick={() => setShowAddClass(true)}
            className="btn-primary px-3 py-1.5 rounded-xl text-xs font-medium hidden sm:flex items-center gap-1">
            ＋ Thêm lớp
          </button>
          {fbUser && <button onClick={onSignOut}
            className="px-2.5 py-1.5 rounded-xl text-[10px] font-medium border border-rose-200 text-rose-500 hover:bg-rose-50 transition">
            🚪 Đăng xuất
          </button>}
        </div>
      </div>

      {/* 4 KPI */}
      <div className="grid grid-cols-2 md:grid-cols-4 gap-2 mb-3">
        {[
          { label: 'Lớp đang dạy', val: fbClasses.length, accent: false },
          { label: 'Bài đang giao', val: totalAsgs, accent: false },
          { label: 'Bài chờ chấm', val: totalPending, accent: totalPending > 0, color: '#be185d' },
          { label: 'Tin nhắn mới',  val: totalMsgs, accent: totalMsgs > 0, color: '#d97706' },
        ].map((k,i) => (
          <div key={i} className="soft-card p-3" style={k.accent ? {borderColor:'#f7c9dc'} : {}}>
            <p className="text-[10px]" style={{color: k.accent ? k.color : 'var(--c-ink-soft)'}}>{k.label}</p>
            <p className="text-xl font-bold font-display mt-0.5" style={{color: k.accent ? k.color : '#4a2530'}}>{k.val}</p>
          </div>
        ))}
      </div>

      {/* Cần xử lý ngay */}
      {(totalPending > 0 || totalMsgs > 0 || dueSoonCount > 0) && (
        <div className="soft-card p-3 mb-3" style={{borderColor:'#f7c9dc'}}>
          <p className="font-semibold text-xs mb-1 flex items-center gap-2 text-rose-700">⚠️ Cần xử lý ngay</p>
          {totalPending > 0 && (
            <div className="flex items-center justify-between gap-3 py-2 border-t border-rose-100">
              <span className="text-xs">📝 <b>{totalPending} bài</b> đang chờ cô chấm</span>
              <button onClick={() => setActive('online')} className="btn-primary px-2.5 py-1 rounded-lg text-[10px] font-medium flex-shrink-0">Chấm ngay</button>
            </div>
          )}
          {totalMsgs > 0 && (
            <div className="flex items-center justify-between gap-3 py-2 border-t border-rose-100">
              <span className="text-xs">💬 <b>{totalMsgs} tin nhắn</b> chưa trả lời</span>
              <button onClick={() => { const first = fbClasses.find(c => (clsStats[c.id]?.msgs||0) > 0); if (first) setChatCls(first); }} className="px-2.5 py-1 rounded-lg text-[10px] font-medium border border-rose-200 text-rose-700 flex-shrink-0">Trả lời</button>
            </div>
          )}
          {dueSoonCount > 0 && (
            <div className="flex items-center justify-between gap-3 py-2 border-t border-rose-100">
              <span className="text-xs">⏰ <b>{dueSoonCount} lớp</b> sắp hết hạn nộp</span>
              <button onClick={() => setActive('online')} className="px-2.5 py-1 rounded-lg text-[10px] font-medium border border-rose-200 text-rose-700 flex-shrink-0">Xem</button>
            </div>
          )}
        </div>
      )}

      {/* Link "Học Cùng Cô Thu" — chia sẻ cho học sinh */}
      <div className="soft-card p-3 mb-3 flex items-center gap-3">
        <div className="w-9 h-9 rounded-xl flex items-center justify-center text-lg text-white shrink-0" style={{background:'linear-gradient(135deg,#0f766e,#be185d)'}}>🎒</div>
        <div className="flex-1 min-w-0">
          <p className="text-xs font-semibold text-rose-900">Học Cùng Cô Thu</p>
          <p className="text-[10px] truncate" style={{color:'var(--c-ink-soft)'}}>trolygiaovien.netlify.app/cong</p>
        </div>
        <button onClick={() => {
          const url = 'https://trolygiaovien.netlify.app/cong';
          if (navigator.share) navigator.share({ title: 'Học Cùng Cô Thu', text: 'Vào lớp làm bài, xem điểm, trò chuyện với cô 🌸', url }).catch(() => {});
          else { navigator.clipboard.writeText(url).then(() => alert('Đã copy link!\nGửi link này cho học sinh để vào lớp.')).catch(() => {}); }
        }} className="btn-primary px-3 py-1.5 rounded-xl text-[10px] font-medium shrink-0 flex items-center gap-1">
          📤 Chia sẻ
        </button>
      </div>

      {/* Dung lượng (thu gọn) */}
      {storageInfo && (
        <div className="soft-card mb-3 overflow-hidden">
          <button onClick={() => setStorageOpen(!storageOpen)} className="w-full flex items-center gap-2 px-3 py-2 text-left hover:bg-rose-50/50 transition">
            <span className="text-[10px]">💾</span>
            <div className="flex-1 flex items-center gap-2">
              <div className="flex-1 h-1.5 rounded-full overflow-hidden" style={{background:'#fce4ec'}}>
                <div className="h-full rounded-full transition-all" style={{
                  width: Math.max(1, Math.min(storageInfo.percent, 100)) + '%',
                  background: storageInfo.percent > 80 ? '#e11d48' : storageInfo.percent > 50 ? '#d97706' : '#0f766e'
                }} />
              </div>
              <span className="text-[9px] font-mono flex-shrink-0" style={{color:'var(--c-ink-soft)'}}>{storageInfo.estTotalKB < 1024 ? storageInfo.estTotalKB + ' KB' : (storageInfo.estTotalKB / 1024).toFixed(1) + ' MB'} / 1 GiB</span>
            </div>
            <span className="text-[9px]" style={{color:'var(--c-ink-soft)'}}>{storageOpen ? '▲' : '▼'}</span>
          </button>
          {storageOpen && (
            <div className="px-3 pb-2.5 border-t border-rose-100">
              <div className="flex flex-wrap gap-3 text-[10px] mt-2 mb-2" style={{color:'var(--c-ink-soft)'}}>
                <span>📝 {storageInfo.totalSubs} bài nộp</span>
                <span>📷 {storageInfo.totalImgs} ảnh</span>
                <span>💬 {storageInfo.totalMsgs} tin nhắn</span>
              </div>
              {storageInfo.percent > 70 && <p className="text-[10px] text-rose-600 mb-2">⚠️ Nên dọn dẹp dữ liệu cũ.</p>}
              <div className="flex items-center gap-2">
                <button onClick={() => doCleanup(3)} disabled={cleanupBusy}
                  className="px-2.5 py-1 rounded-lg text-[10px] font-medium border border-rose-200 text-rose-700 hover:bg-rose-50 disabled:opacity-50">
                  {cleanupBusy ? '⏳...' : '🗑️ Xoá trước 3 tháng'}
                </button>
                <button onClick={() => doCleanup(6)} disabled={cleanupBusy}
                  className="px-2.5 py-1 rounded-lg text-[10px] font-medium border border-rose-200 text-rose-700 hover:bg-rose-50 disabled:opacity-50">
                  {cleanupBusy ? '⏳...' : '🗑️ Xoá trước 6 tháng'}
                </button>
              </div>
              {cleanupResult && <p className="text-[10px] mt-1.5 font-medium" style={{color: cleanupResult.startsWith('✅') ? '#0f766e' : '#e11d48'}}>{cleanupResult}</p>}
            </div>
          )}
        </div>
      )}

      {/* Main: Lớp theo Khối (trái) + Tin nhắn lớp (phải) */}
      <div className="grid lg:grid-cols-3 gap-4">
        {/* CỘT TRÁI: Lớp theo Khối */}
        <div className="lg:col-span-2">
          <p className="font-semibold text-sm mb-2 text-rose-900">Các lớp của cô</p>
          {Object.keys(byGrade).sort().map(g => {
            const gClasses = byGrade[g];
            const gColor = gradeColors[g] || '#be185d';
            const gStudents = gClasses.reduce((s, c) => s + (c.students?.length || 0), 0);
            const gPend = gClasses.reduce((s, c) => s + (clsStats[c.id]?.pending || 0), 0);
            return (
              <div key={g} className="mb-4">
                <div className="flex items-center gap-2 mb-2">
                  <div className="w-7 h-7 rounded-lg flex items-center justify-center text-white text-xs font-semibold" style={{background:gColor}}>{g}</div>
                  <span className="text-xs font-semibold">Khối {g}</span>
                  <span className="text-[10px] ml-auto" style={{color:'var(--c-ink-soft)'}}>{gClasses.length} lớp · {gStudents} HS</span>
                  {gPend > 0 && <span className="text-[10px] px-2 py-0.5 rounded-full bg-rose-100 text-rose-700 font-medium">{gPend} chờ chấm</span>}
                </div>
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                  {gClasses.map(cls => {
                    const st = clsStats[cls.id] || {};
                    const students = (cls.students || []).length;
                    const pend = st.pending || 0;
                    const asgs = st.asgs || 0;
                    const totalSubs = st.totalSubs || 0;
                    const pct = students > 0 ? totalSubs / students : 0;
                    const abbr = (cls.name||'').replace(/[^0-9A-Za-zÀ-ỹ]/g,'').toUpperCase() || String(cls.grade);
                    return (
                      <div key={cls.id} className="soft-card p-3 relative group">
                        <button onClick={() => deleteCls(cls)} title="Xoá lớp"
                          className="absolute top-1.5 right-1.5 w-5 h-5 rounded-full flex items-center justify-center text-[9px] text-rose-300 hover:text-white hover:bg-rose-500 opacity-0 group-hover:opacity-100 transition">✕</button>
                        <div className="flex items-center justify-between mb-1.5">
                          <div className="flex items-center gap-2">
                            <div className="w-8 h-8 rounded-lg flex items-center justify-center font-semibold text-xs"
                              style={{background: `${gColor}18`, color: gColor}}>{abbr}</div>
                            <div>
                              <p className="font-semibold text-xs text-rose-900">{cls.name}</p>
                              <p className="text-[10px]" style={{color:'var(--c-ink-soft)'}}>{students} HS · <span className="font-mono">{cls.id}</span></p>
                            </div>
                          </div>
                          {st.hasDue
                            ? <span className="text-[9px] font-semibold px-1.5 py-0.5 rounded-full bg-amber-100 text-amber-700">⏰</span>
                            : pend > 0
                            ? <span className="text-[9px] font-semibold px-1.5 py-0.5 rounded-full bg-rose-100 text-rose-700">{pend}</span>
                            : <span className="text-[9px] font-semibold px-1.5 py-0.5 rounded-full bg-emerald-100 text-emerald-700">✓</span>}
                        </div>
                        <div className="flex items-center gap-1.5 mb-2">
                          <div className="flex-1 h-1.5 rounded-full overflow-hidden" style={{background:`${gColor}15`}}>
                            <div className="h-full rounded-full" style={{width:`${Math.min(Math.round(pct*100),100)}%`, background:gColor}} />
                          </div>
                          <span className="text-[9px]" style={{color:'var(--c-ink-soft)'}}>{totalSubs}/{students}</span>
                        </div>
                        {(asgs > 0 || pend > 0) && (
                          <div className="flex gap-1 flex-wrap mb-2">
                            {asgs > 0 && <span className="text-[9px] px-1.5 py-0.5 rounded-full" style={{background:`${gColor}10`,color:gColor}}>📋 {asgs}</span>}
                            {pend > 0 && <span className="text-[9px] px-1.5 py-0.5 rounded-full bg-rose-100 text-rose-700">✅ {pend}</span>}
                          </div>
                        )}
                        <div className="flex gap-1">
                          {pend > 0
                            ? <button onClick={() => setViewCls(cls)} className="flex-1 py-1.5 rounded-lg text-[10px] font-medium text-white" style={{background:gColor}}>Chấm bài</button>
                            : <button onClick={() => setViewCls(cls)} className="flex-1 py-1.5 rounded-lg text-[10px] font-medium border hover:bg-rose-50" style={{borderColor:'#f0dcd0',color:gColor}}>Xem lớp</button>}
                          <button onClick={() => setAssignCls(cls)} className="flex-1 py-1.5 rounded-lg text-[10px] font-medium border hover:bg-rose-50" style={{borderColor:'#f0dcd0',color:gColor}}>Giao bài</button>
                          <button onClick={() => setChatCls(cls)} className="flex-1 py-1.5 rounded-lg text-[10px] font-medium border hover:bg-rose-50" style={{borderColor:'#f0dcd0',color:gColor}}>Nhắn</button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>

        {/* CỘT PHẢI: Chat list (luôn hiện) */}
        <div>
          <p className="font-semibold text-sm mb-2 text-rose-900">💬 Tin nhắn lớp</p>
          <div className="soft-card p-1 space-y-0.5" style={{maxHeight:'420px',overflowY:'auto'}}>
            {fbClasses.map(cls => {
              const lm = lastMsgs[cls.id];
              const msgs = clsStats[cls.id]?.msgs || 0;
              const gColor = gradeColors[cls.grade] || '#be185d';
              return (
                <button key={cls.id} onClick={() => setChatCls(cls)}
                  className="w-full flex items-center gap-2 p-2 rounded-xl text-left hover:bg-rose-50 transition">
                  <div className="w-9 h-9 rounded-xl flex items-center justify-center text-white text-[10px] font-semibold flex-shrink-0"
                    style={{background:`linear-gradient(135deg,${gColor},${gColor}99)`}}>{(cls.name||'').replace(/[^0-9A-Za-z]/g,'')}</div>
                  <div className="flex-1 min-w-0">
                    <div className="flex justify-between items-center">
                      <span className="text-xs font-semibold text-rose-900 truncate">{cls.name}</span>
                      {lm && <span className="text-[9px] flex-shrink-0" style={{color:'var(--c-ink-soft)'}}>{fmtAgo(lm.at)}</span>}
                    </div>
                    <p className="text-[10px] truncate" style={{color:'var(--c-ink-soft)'}}>
                      {lm ? `${lm.fromName||''}: ${(lm.text||'').slice(0,30)}` : 'Chưa có tin nhắn'}
                    </p>
                  </div>
                  {msgs > 0 && <span className="w-4 h-4 rounded-full bg-rose-600 text-white text-[8px] font-semibold flex items-center justify-center flex-shrink-0">{msgs}</span>}
                </button>
              );
            })}
          </div>
        </div>
      </div>

      {/* Popup: Xem lớp (chi tiết + chấm bài) */}
      {viewCls && (() => {
        const vc = viewCls;
        const vcStudents = vc.students || [];
        const gColor = gradeColors[vc.grade] || '#be185d';
        return (
          <DashPopup title={`Lớp ${vc.name}  ·  Mã: ${vc.id}`} onClose={() => { setViewCls(null); setViewOpenAsg(null); }}>
            <div className="flex items-center gap-2 mb-4">
              <div className="w-10 h-10 rounded-xl flex items-center justify-center text-white text-sm font-semibold"
                style={{background:gColor}}>{(vc.name||'').replace(/[^0-9A-Za-zÀ-ỹ]/g,'').toUpperCase()}</div>
              <div>
                <p className="font-semibold text-rose-900">{vc.name}</p>
                <p className="text-[11px]" style={{color:'var(--c-ink-soft)'}}>{vcStudents.length} học sinh · Mã lớp: <span className="font-mono">{vc.id}</span></p>
              </div>
              <button onClick={() => { navigator.clipboard.writeText(vc.id); alert('Đã copy mã lớp!'); }}

      {/* Popup: Giao bài */}
      {assignCls && !viewCls && (

      {/* Popup: Chat lớp */}
      {chatCls && (
        <DashPopup title={`💬 ${chatCls.name}  ·  ${(chatCls.students||[]).length} thành viên`} onClose={() => { setChatCls(null); setChatMsgs([]); }} noPad>

      )}

      {/* Modal: Thêm lớp */}
      {showAddClass && <OcNewClass fbUser={fbUser} onClose={() => setShowAddClass(false)} />}

};

      hoatDong3: `**HĐ3: LUYỆN TẬP (7p)**\nTrò chơi "Ai nhanh - Ai đúng".`,
      hoatDong4: `**HĐ4: VẬN DỤNG (3p)**\nViết đoạn 5-7 câu.`,
      phuLuc: `PHIẾU HỌC TẬP SỐ 1: Tác giả, thể loại, bố cục...`,
      slides: `Slide 1: Bìa\nSlide 2-4: Tác giả\nSlide 5-10: Phân tích\nSlide 11-13: Luyện tập`,
      worksheetContent: `PHIẾU HỌC TẬP\n1. PTBĐ? 2. Biện pháp tu từ? 3. Nội dung chính?`,
      activityContent: `HOẠT ĐỘNG TRẢI NGHIỆM (90p): Khai mạc → Vòng 1: Kiến thức → Vòng 2: Sân khấu hóa → Vòng 3: Viết → Tổng kết.` });
  };
  const generateAndExportPptx = async () => {
    if (!form.slides.trim()) { alert('Vui lòng nhập nội dung Outline trước'); return; }
    setIsGeneratingPptx(true);
    const prompt = `Bạn là một chuyên gia thiết kế slide. Hãy tạo nội dung cho ${pptxOptions.slideCount === 'auto' ? '5-7' : pptxOptions.slideCount} slide dựa trên outline sau:\n\n${form.slides}\n\nTRẢ VỀ ONLY JSON (KHÔNG CÓ MARKDOWN). Format:\n{"slides":[{"title":"Tiêu đề slide","bullets":["Điểm 1","Điểm 2"]}]}`;

    let aiResult = null;
    const useOllama = getUseOllama();
    if (useOllama) {
      aiResult = await callOllamaAPI(prompt, 800);
    }
    if (!aiResult || !aiResult.success) {
      const groqKey = getGroqApiKey();
      if (groqKey) {
        aiResult = await callGroqAPI(prompt, 800);
      }
    }

    if (aiResult && aiResult.success) {
      let slidesData = null;
      try {
        let jsonStr = aiResult.text.trim();
        const jsonMatch = jsonStr.match(/\{[\s\S]*\}/);
        if (jsonMatch) { jsonStr = jsonMatch[0]; }
        jsonStr = jsonStr.replace(/,(\s*[\]}])/g, '$1');
        slidesData = JSON.parse(jsonStr);
        if (!slidesData.slides || !Array.isArray(slidesData.slides)) { throw new Error('Format JSON không hợp lệ'); }

        const colorScheme = pptxOptions.style === 'colorful'
          ? { primary: '#0f766e', accent: '#be185d', bgFill: '#fdfaf6', textColor: '#333333' }
          : pptxOptions.style === 'minimalist'
          ? { primary: '#000000', accent: '#666666', bgFill: '#ffffff', textColor: '#000000' }
          : { primary: '#1a365d', accent: '#2c5282', bgFill: '#f7fafc', textColor: '#222222' };

        // ============ EXPORT PDF BẰNG jsPDF =============
        // Lấy jsPDF từ window
        const jsPDFLib = window.jspdf?.jsPDF || window.jsPDF;
        if (!jsPDFLib) {
          throw new Error('jsPDF không tìm thấy. Available: ' + Object.keys(window).filter(k => k.toLowerCase().includes('pdf')).join(', '));
        }

        const doc = new jsPDFLib('p', 'mm', 'a4');
        const pageWidth = doc.internal.pageSize.getWidth();
        const pageHeight = doc.internal.pageSize.getHeight();
        const margin = 15;
        let yPos = margin;

        // Set font
        doc.setFont('helvetica');

        // ===== SLIDE 1: TIÊU ĐỀ =====
        doc.setFillColor(parseInt(colorScheme.primary.slice(1, 3), 16), parseInt(colorScheme.primary.slice(3, 5), 16), parseInt(colorScheme.primary.slice(5, 7), 16));
        doc.rect(0, 0, pageWidth, pageHeight, 'F');

        // Tiêu đề
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(32);
        doc.text(form.title, pageWidth / 2, pageHeight / 2 - 20, { align: 'center' });

        // Subtitle
        doc.setFontSize(16);
        doc.text(form.subtitle || 'Outline Ngữ Văn', pageWidth / 2, pageHeight / 2 + 10, { align: 'center' });

        // ===== SLIDES NỘI DUNG =====
        slidesData.slides.forEach((slide, slideIdx) => {
          doc.addPage();
          yPos = margin;

          // Header màu
          const r = parseInt(colorScheme.primary.slice(1, 3), 16);
          const g = parseInt(colorScheme.primary.slice(3, 5), 16);
          const b = parseInt(colorScheme.primary.slice(5, 7), 16);
          doc.setFillColor(r, g, b);
          doc.rect(0, 0, pageWidth, 20, 'F');

          // Title
          doc.setTextColor(255, 255, 255);
          doc.setFontSize(18);
          doc.setFont('helvetica', 'bold');
          doc.text(slide.title || `Slide ${slideIdx + 2}`, margin, 14);
          yPos = 30;

          // Content
          doc.setTextColor(0, 0, 0);
          doc.setFontSize(12);
          doc.setFont('helvetica', 'normal');

          if (slide.bullets && Array.isArray(slide.bullets)) {
            slide.bullets.forEach(bullet => {
              if (yPos > pageHeight - margin - 10) {
                doc.addPage();
                yPos = margin;
              }
              const lines = doc.splitTextToSize('• ' + bullet, pageWidth - 2 * margin);
              doc.text(lines, margin, yPos);
              yPos += lines.length * 7 + 5;
            });
          }

          // Số slide
          if (pptxOptions.includeNumbers) {
            doc.setTextColor(100, 100, 100);
            doc.setFontSize(10);
            doc.text(`Slide ${slideIdx + 2}`, pageWidth - margin - 20, pageHeight - margin);
          }
        });

        // Download
        const fileName = `${form.title.replace(/\s+/g, '_')}_Outline.pdf`;
        doc.save(fileName);

        setShowPptxDialog(false);
        setIsGeneratingPptx(false);
        alert('✅ Slide PDF tạo thành công!\n\n📥 File đang tải về: ' + fileName);
      } catch (e) {
        setIsGeneratingPptx(false);
        console.error('Error details:', e);
        alert('❌ Lỗi: ' + e.message + '\n\nDebug: ' + JSON.stringify({aiSuccess: !!aiResult, slidesCount: slidesData?.slides?.length}));
      }
    } else {
      setIsGeneratingPptx(false);
      alert('❌ Lỗi AI: ' + (aiResult?.error || 'Không thể kết nối AI') + '\n\nUseOllama: ' + getUseOllama());
    }
  };
  const isLesson = subTab.id === 'lesson', isSlide = subTab.id === 'slide', isWorksheet = subTab.id === 'worksheet', isActivity = subTab.id === 'practice';
  return (
    <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50 modal-overlay">
      <div className="bg-white rounded-xl w-full max-w-6xl max-h-[95vh] overflow-hidden flex flex-col modal-box">
        <div className="p-5 border-b flex items-center justify-between">
          <h3 className="text-xl font-bold">{isEdit ? 'Sửa' : 'Tạo'} {subTab.label}</h3>
          <div className="flex items-center gap-2">
            <button onClick={() => setShowPreview(!showPreview)} className="px-3 py-1.5 bg-slate-100 rounded text-sm flex items-center gap-1"><Icon name={showPreview ? 'Edit' : 'Eye'} size={16} /> {showPreview ? 'Chỉnh sửa' : 'Xem trước'}</button>
            <button onClick={onClose} className="p-2 hover:bg-slate-100 rounded"><Icon name="X" size={20} /></button>
          </div>
        </div>
        <div className="flex-1 overflow-y-auto scrollbar p-5">
          <div style={{ display: showPreview ? 'none' : 'block' }} className="space-y-4">
            <div className="grid grid-cols-2 gap-4">
              <div><label className="block text-sm font-medium mb-1">Tiêu đề *</label><input value={form.title} onChange={e => setForm({ ...form, title: e.target.value })} className="w-full px-3 py-2 border rounded-lg" /></div>
              <div><label className="block text-sm font-medium mb-1">Lớp</label><select value={form.grade} onChange={e => setForm({ ...form, grade: Number(e.target.value) })} className="w-full px-3 py-2 border rounded-lg bg-white">{[6,7,8,9].map(c => <option key={c} value={c}>Lớp {c}</option>)}</select></div>
              <div><label className="block text-sm font-medium mb-1">Chủ đề</label><select value={form.theme} onChange={e => setForm({ ...form, theme: e.target.value })} className="w-full px-3 py-2 border rounded-lg bg-white"><option value="">--</option>{(CHU_DE_THEO_LOP[form.grade] || []).map(c => <option key={c} value={c}>{c}</option>)}</select></div>
              <div><label className="block text-sm font-medium mb-1">Tên bài</label><input value={form.lessonName} onChange={e => setForm({ ...form, lessonName: e.target.value })} className="w-full px-3 py-2 border rounded-lg" /></div>
              <div><label className="block text-sm font-medium mb-1">Thời lượng</label><input value={form.duration} onChange={e => setForm({ ...form, duration: e.target.value })} className="w-full px-3 py-2 border rounded-lg" /></div>
              <div><label className="block text-sm font-medium mb-1">Mô tả</label><input value={form.subtitle} onChange={e => setForm({ ...form, subtitle: e.target.value })} className="w-full px-3 py-2 border rounded-lg" /></div>
            </div>
            <button onClick={generate} className="bg-gradient-to-r from-emerald-500 to-teal-500 text-white px-4 py-2 rounded-lg flex items-center gap-2 font-medium"><Icon name="Sparkles" size={18} /> Tự động tạo theo CV 5512</button>
            {isLesson && ['mucTieu','thietBi','hoatDong1','hoatDong2','hoatDong3','hoatDong4','phuLuc'].map((f, i) => (
              <div key={f}><label className="block text-sm font-medium mb-1">{['I. MỤC TIÊU','II. THIẾT BỊ','III.1. MỞ ĐẦU','III.2. HÌNH THÀNH KT','III.3. LUYỆN TẬP','III.4. VẬN DỤNG','IV. PHỤ LỤC'][i]}</label><textarea value={form[f]} onChange={e => setForm({ ...form, [f]: e.target.value })} rows={4} className="w-full px-3 py-2 border rounded-lg font-mono text-sm" /></div>
            ))}
            {isSlide && <div><label className="block text-sm font-medium mb-1">CẤU TRÚC SLIDE</label><textarea value={form.slides} onChange={e => setForm({ ...form, slides: e.target.value })} rows={12} className="w-full px-3 py-2 border rounded-lg font-mono text-sm" /></div>}
            {isWorksheet && <div><label className="block text-sm font-medium mb-1">PHIẾU HỌC TẬP</label><textarea value={form.worksheetContent} onChange={e => setForm({ ...form, worksheetContent: e.target.value })} rows={12} className="w-full px-3 py-2 border rounded-lg font-mono text-sm" /></div>}
            {isActivity && <div><label className="block text-sm font-medium mb-1">HOẠT ĐỘNG TRẢI NGHIỆM</label><textarea value={form.activityContent} onChange={e => setForm({ ...form, activityContent: e.target.value })} rows={12} className="w-full px-3 py-2 border rounded-lg font-mono text-sm" /></div>}
          </div>
          <div id={'lesson-preview-' + form.id} className="bg-white p-8 border rounded-lg" style={{ fontFamily: 'Times New Roman, serif', display: showPreview ? 'block' : 'none' }}>
            <div className="text-center mb-6">
              <p className="font-bold">TRƯỜNG {schoolName?.toUpperCase() || 'THCS ...'}</p>
              <p className="italic text-sm">Giáo viên: {teacherName || '...'}</p>
              <h1 className="text-2xl font-bold mt-4 uppercase">{subTab.label.toUpperCase()}</h1>
              <p className="font-bold mt-1">{form.title}</p>
              <p className="text-sm mt-1">Ngữ văn {form.grade} - {form.duration}</p>
            </div>
            <div className="space-y-4 text-sm" style={{whiteSpace:'pre-wrap'}}>
              {isLesson && <>
                <section><h3 className="font-bold text-base">I. MỤC TIÊU</h3>{form.mucTieu}</section>
                <section><h3 className="font-bold text-base">II. THIẾT BỊ</h3>{form.thietBi}</section>
                <section><h3 className="font-bold text-base">III. TIẾN TRÌNH</h3>{form.hoatDong1}{"\n\n"}{form.hoatDong2}{"\n\n"}{form.hoatDong3}{"\n\n"}{form.hoatDong4}</section>
                <section><h3 className="font-bold text-base">IV. PHỤ LỤC</h3>{form.phuLuc}</section>
              </>}
              {isSlide && <section>{form.slides}</section>}
              {isWorksheet && <section>{form.worksheetContent}</section>}
              {isActivity && <section>{form.activityContent}</section>}
            </div>
          </div>
        </div>
        <div className="p-4 border-t flex items-center justify-between bg-slate-50">
          <div className="flex gap-2">
            <button onClick={() => exportToPDF('lesson-preview-' + form.id, `GiaoAn_${form.title.replace(/\s+/g, '_')}`)} className="px-4 py-2 bg-red-500 text-white rounded-lg flex items-center gap-2"><Icon name="FileText" size={16} /> PDF</button>
            <button onClick={() => exportToWord('lesson-preview-' + form.id, `GiaoAn_${form.title.replace(/\s+/g, '_')}`)} className="px-4 py-2 bg-blue-600 text-white rounded-lg flex items-center gap-2"><Icon name="FileDown" size={16} /> Word</button>
            {isSlide && <button onClick={() => setShowPptxDialog(true)} disabled={isGeneratingPptx} className="px-4 py-2 bg-orange-500 hover:bg-orange-600 disabled:bg-gray-400 text-white rounded-lg flex items-center gap-2"><Icon name="Presentation" size={16} /> {isGeneratingPptx ? '⏳ Đang tạo...' : '📊 PowerPoint'}</button>}
          </div>
          <div className="flex gap-2"><button onClick={onClose} className="px-4 py-2 bg-slate-200 rounded-lg">Hủy</button><button onClick={handleSave} className="px-4 py-2 bg-emerald-600 text-white rounded-lg flex items-center gap-2"><Icon name="Save" size={16} /> Lưu</button></div>
        </div>
      </div>
      {showPptxDialog && (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-[60] modal-overlay">
          <div className="bg-white rounded-xl w-full max-w-md p-6 space-y-4 modal-box">
            <h3 className="text-xl font-bold">📊 Tùy chọn PowerPoint</h3>
            <div>
              <label className="block text-sm font-medium mb-2">🎨 Style</label>
              <div className="space-y-2">
                {['professional', 'colorful', 'minimalist'].map(s => (
                  <label key={s} className="flex items-center gap-2 cursor-pointer">
                    <input type="radio" checked={pptxOptions.style === s} onChange={() => setPptxOptions({...pptxOptions, style: s})} />
                    <span className="capitalize">{s === 'professional' ? 'Professional' : s === 'colorful' ? 'Colorful' : 'Minimalist'}</span>
                  </label>
                ))}
              </div>
            </div>
            <div>
              <label className="block text-sm font-medium mb-2">📊 Số slide</label>
              <select value={pptxOptions.slideCount} onChange={e => setPptxOptions({...pptxOptions, slideCount: e.target.value})} className="w-full px-3 py-2 border rounded-lg bg-white">
                <option value="auto">Tự động</option>
                <option value="5">5 slides</option>
                <option value="7">7 slides</option>
                <option value="10">10 slides</option>
              </select>
            </div>
            <div className="space-y-2">
              <label className="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" checked={pptxOptions.includeNotes} onChange={e => setPptxOptions({...pptxOptions, includeNotes: e.target.checked})} />
                <span className="text-sm">Thêm speaker notes</span>
              </label>
              <label className="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" checked={pptxOptions.includeNumbers} onChange={e => setPptxOptions({...pptxOptions, includeNumbers: e.target.checked})} />
                <span className="text-sm">Thêm số slide</span>
              </label>
            </div>
            <div className="flex gap-2">
              <button onClick={() => setShowPptxDialog(false)} className="flex-1 px-4 py-2 bg-slate-200 rounded-lg">Hủy</button>
              <button onClick={generateAndExportPptx} disabled={isGeneratingPptx} className="flex-1 px-4 py-2 bg-orange-500 hover:bg-orange-600 disabled:bg-gray-400 text-white rounded-lg font-medium">
                {isGeneratingPptx ? '⏳ Đang tạo...' : '🚀 Tạo PowerPoint'}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

        {subTabs.map(t => <button key={t.id} onClick={() => setActiveSubTab(t.id)} className={`px-4 py-2 rounded-lg font-medium text-sm flex items-center gap-2 ${activeSubTab === t.id ? 'bg-rose-100 text-rose-700' : 'text-slate-600 hover:bg-slate-100'}`}>{t.label}</button>)}

              matrixConfig: { dochieu: { nb: 2, th: 2, vd: 1, vdc: 0 }, viet: { nb: 0, th: 0, vd: 1, vdc: 0 } },

        ) : activeSubTab === 'exams' ? (

const QuestionBankModal = ({ item, data, setData, selectedClass, onClose }) => {
  const isEdit = !!item;
  const defaultOptions = ['', '', '', ''];
  const [form, setForm] = useState(item || {
    id: Date.now(), title: '', grade: selectedClass, field: 'dochieu', level: 'nb',
    type: 'essay',  // 'essay' | 'mc'
    content: '', answer: '', theme: '',
    options: [...defaultOptions], correctAnswer: 'A',
    passageId: '', rubric: [],
    createdAt: new Date().toISOString()
  });
  const handleSave = () => {
    if (!form.content.trim()) { alert('Nhập nội dung câu hỏi'); return; }
    if (form.type === 'mc') {
      const filled = form.options.filter(o => o.trim());
      if (filled.length < 2) { alert('Câu trắc nghiệm cần ít nhất 2 lựa chọn'); return; }
    }
    const list = data.questionBank || [];
    setData({ ...data, questionBank: isEdit ? list.map(i => i.id === form.id ? form : i) : [...list, form] });
    onClose();
  };
  const optionLabels = ['A', 'B', 'C', 'D'];
  const updateOption = (idx, val) => {
    const opts = [...form.options]; opts[idx] = val;

          {form.type === 'mc' ? (
            <div className="space-y-3 bg-rose-50 p-4 rounded-lg border border-rose-200">
              <h4 className="font-semibold text-rose-800 text-sm">🔘 Các lựa chọn trả lời</h4>

                  <button onClick={() => setForm({ ...form, correctAnswer: label })}
                    className={`w-8 h-8 rounded-full font-bold text-sm flex-shrink-0 transition ${form.correctAnswer === label ? 'bg-teal-600 text-white' : 'bg-white border-2 border-slate-300 text-slate-600 hover:border-teal-400'}`}
                    title="Chọn làm đáp án đúng">
                    {label}
                  </button>
                  <input value={form.options[idx] || ''} onChange={e => updateOption(idx, e.target.value)}
                    className={`flex-1 px-3 py-2 border rounded-lg text-sm ${form.correctAnswer === label ? 'border-teal-400 bg-teal-50' : ''}`}
                    placeholder={`Lựa chọn ${label}...`} />
                  {form.correctAnswer === label && <span className="text-xs text-teal-600 font-medium">✓ Đúng</span>}
                </div>
              ))}
              <p className="text-xs text-rose-600">💡 Nhấn vào chữ cái (A/B/C/D) để đánh dấu đáp án đúng</p>
            </div>
          ) : (
            <div>
              <label className="block text-sm font-medium mb-1">Đáp án / Gợi ý chấm</label>
              <textarea value={form.answer} onChange={e => setForm({ ...form, answer: e.target.value })} rows={4} className="w-full px-3 py-2 border rounded-lg text-sm" placeholder="Nêu các ý cần có, gợi ý nội dung trả lời..." />
            </div>
          )}
        </div>
        <div className="p-4 border-t flex justify-end gap-2 bg-slate-50">
          <button onClick={onClose} className="px-4 py-2 bg-slate-200 rounded-lg">Hủy</button>
          <button onClick={handleSave} className="px-4 py-2 bg-rose-600 text-white rounded-lg flex items-center gap-2"><Icon name="Save" size={16} /> Lưu câu hỏi</button>
        </div>
      </div>
    </div>
  );
};

    ['https://www.thivien.net/T%E1%BA%BF-Hanh/Qu%C3%AA-h%C6%B0%C6%A1ng/poem-PR_rg4McBsM23XpRQUZbWw','Tế Hanh',8,'thơ tám chữ','quê hương - biển cả','education_use'],
    ['https://www.thivien.net/B%E1%BA%B1ng-Vi%E1%BB%87t/B%E1%BA%BFp-l%E1%BB%ADa/poem-lgCJ5h32csNKs00pNZOu3g','Bằng Việt',8,'thơ hỗn hợp','tình gia đình - bà cháu - ký ức','education_use'],

    ['https://www.thivien.net/Ch%C3%ADnh-H%E1%BB%AFu/%C4%90%E1%BB%93ng-ch%C3%AD/poem-xYZuhzmmmiLHd-0Syz9dHA','Chính Hữu',9,'thơ tự do','chiến tranh - tình đồng đội','education_use'],

    ['https://www.thivien.net/H%E1%BB%AFu-Th%E1%BB%89nh/Sang-thu/poem-aeKKUxGbZwOwpQZsyen76g','Hữu Thỉnh',9,'thơ năm chữ','thiên nhiên - giao mùa - triết lý','education_use'],
    ['https://www.thivien.net/Vi%E1%BB%85n-Ph%C6%B0%C6%A1ng/Vi%E1%BA%BFng-l%C4%83ng-B%C3%A1c/poem-ssM7VCNHXgctPBPvkDuAZw','Viễn Phương',9,'thơ tám chữ','yêu nước - lòng biết ơn - Bác Hồ','education_use'],
    ['https://www.thivien.net/Y-Ph%C6%B0%C6%A1ng/N%C3%B3i-v%E1%BB%9Bi-con/poem-XCSfSxC-AM_w5wx1OjDiww','Y Phương',9,'thơ tự do','tình gia đình - bản sắc dân tộc','education_use'],
    ['https://www.thivien.net/Nguy%E1%BB%85n-Duy/Tre-Vi%E1%BB%87t-Nam/poem-VkIfi7DKP2f1cM8JZZP8yA','Nguyễn Duy',9,'thơ lục bát','bản sắc dân tộc - sức sống Việt Nam','education_use'],
  ];

  const WIKISOURCE_TEXTS = [
    ['https://vi.wikisource.org/wiki/Ch%C3%AD_Ph%C3%A8o','Chí Phèo','Nam Cao',8,'van_hoc','truyện ngắn','số phận con người - bi kịch xã hội'],
    ['https://vi.wikisource.org/wiki/L%C3%A3o_H%E1%BA%A1c','Lão Hạc','Nam Cao',8,'van_hoc','truyện ngắn','số phận con người - tình cha con'],
    ['https://vi.wikisource.org/wiki/Nam_qu%E1%BB%91c_s%C6%A1n_h%C3%A0','Nam quốc sơn hà','Lý Thường Kiệt',7,'van_hoc','thơ cổ','yêu nước - chủ quyền dân tộc'],
  ];

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const CORS_PROXY = url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
  const WIKI_API = 'https://vi.wikipedia.org/w/api.php';
  const makeId = (pfx, grade, i) => `${pfx}_${grade}_A${String(i).padStart(3,'0')}`;

  const cleanText = (text, maxW = 600) => {
    text = text.replace(/\n{3,}/g,'\n\n').trim();
    const words = text.split(/\s+/);
    if (words.length <= maxW) return text;
    const cut = words.slice(0,maxW).join(' ');
    const last = Math.max(cut.lastIndexOf('.'), cut.lastIndexOf('!'), cut.lastIndexOf('?'));
    return last > maxW * 2 ? cut.slice(0, last+1) : cut + '...';
  };
  const excerptFrom = (text, n=40) => text.replace(/\n/g,' ').split(/\s+/).slice(0,n).join(' ') + '...';

  const addLog = (msg, type='ok') => {
    setLogs(prev => [...prev, {msg, type}]);
    setTimeout(() => { if (logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight; }, 50);
  };

  const existingRef = React.useRef(new Set([
    ...PASSAGES_BANK.map(p=>p.id), ...(data.passages||[]).map(p=>p.id)
  ]));
  const newPassRef = React.useRef([...(data.passages||[])]);

  const tryAdd = item => {
    if (!item.id || !item.title || !item.fullText) return false;
    if (existingRef.current.has(item.id)) return false;
    const key = item.title.toLowerCase()+'_'+(item.author||'').toLowerCase();
    if (newPassRef.current.some(p => (p.title.toLowerCase()+'_'+(p.author||'').toLowerCase())===key)) return false;
    existingRef.current.add(item.id);
    newPassRef.current.push(item);
    return true;
  };

  const fetchWikipedia = async () => {
    addLog('📘 Wikipedia API (Thông tin & Nghị luận)...', 'section');
    let added=0, skipped=0, errors=0;
    for (let i=0; i<WIKI_ARTICLES.length; i++) {
      if (abortRef.current) break;
      const [title_vi, grade, genre, subgenre, theme] = WIKI_ARTICLES[i];
      try {
        await sleep(600);
        const params = new URLSearchParams({action:'query',prop:'extracts',exintro:'1',explaintext:'1',titles:title_vi,format:'json',origin:'*'});
        const resp = await fetch(`${WIKI_API}?${params}`);
        const json = await resp.json();
        const page = Object.values(json?.query?.pages||{})[0];
        const rawText = page?.extract||'';
        if (rawText.length < 80) { errors++; addLog(`  ⚠️ ${title_vi}: không có nội dung`,'warn'); continue; }
        const fullText = cleanText(rawText, 500);
        const prefix = genre==='thong_tin'?'TT':'NL';
        const item = {
          id: makeId(prefix,grade,100+i), title:title_vi, author:'Wikipedia tiếng Việt',
          source:`https://vi.wikipedia.org/wiki/${encodeURIComponent(title_vi.replace(/ /g,'_'))}`,
          class:grade, genre, subgenre, theme, difficulty:'medium',
          copyright_status:'education_use', approved:false,
          wordCount:fullText.split(/\s+/).length,
          excerpt:excerptFrom(fullText), fullText, addedAt:new Date().toISOString(),
        };
        if (tryAdd(item)) { added++; addLog(`  ✅ [lớp ${grade}] ${title_vi}`,'ok'); }
        else { skipped++; addLog(`  ⏩ ${title_vi}: đã có`,'skip'); }
      } catch(e) { errors++; addLog(`  ❌ ${title_vi}: ${e.message}`,'error'); }
    }
    return {added,skipped,errors};
  };

  const fetchThivien = async () => {
    addLog('📗 thivien.net (Thơ lớp 6–9)...', 'section');
    let added=0, skipped=0, errors=0;
    for (let i=0; i<THIVIEN_POEMS.length; i++) {
      if (abortRef.current) break;
      const [url, author, grade, subgenre, theme, copyright_status] = THIVIEN_POEMS[i];
      try {
        await sleep(1500);
        const proxyResp = await fetch(CORS_PROXY(url));
        const proxyJson = await proxyResp.json();
        const html = proxyJson.contents;
        if (!html) { errors++; addLog(`  ⚠️ [lớp ${grade}] ${author}: proxy rỗng`,'warn'); continue; }
        const parser = new DOMParser();
        const doc = parser.parseFromString(html,'text/html');
        const h1 = doc.querySelector('h1.item-title')||doc.querySelector('h1');
        const title = (h1?.textContent||'').replace(/\s*[-–].*$/,'').trim()||author;
        const poemEl = doc.querySelector('div.poem-content');
        if (!poemEl) { errors++; addLog(`  ⚠️ ${title}: không tìm được nội dung`,'warn'); continue; }
        const fullText = cleanText((poemEl.textContent||'').trim(), 400);
        if (fullText.length < 30) { errors++; continue; }
        const item = {
          id: makeId('VH',grade,i+1), title, author,
          source:`thivien.net — ${url}`,
          class:grade, genre:'van_hoc', subgenre, theme, difficulty:'medium',
          copyright_status, approved:false,
          wordCount:fullText.split(/\s+/).length,
          excerpt:excerptFrom(fullText), fullText, addedAt:new Date().toISOString(),
        };
        if (tryAdd(item)) { added++; addLog(`  ✅ [lớp ${grade}] ${title} — ${author}`,'ok'); }
        else { skipped++; addLog(`  ⏩ ${title}: đã có`,'skip'); }
      } catch(e) { errors++; addLog(`  ❌ [thivien lớp ${grade}] ${author}: ${e.message}`,'error'); }
    }
    return {added,skipped,errors};
  };

  const fetchWikisource = async () => {
    addLog('📕 Wikisource (Văn xuôi cổ điển)...', 'section');
    let added=0, skipped=0, errors=0;
    for (let i=0; i<WIKISOURCE_TEXTS.length; i++) {
      if (abortRef.current) break;
      const [url,title,author,grade,genre,subgenre,theme] = WIKISOURCE_TEXTS[i];
      try {
        await sleep(1500);
        const proxyResp = await fetch(CORS_PROXY(url));
        const proxyJson = await proxyResp.json();
        const html = proxyJson.contents;
        if (!html) { errors++; continue; }
        const parser = new DOMParser();
        const doc = parser.parseFromString(html,'text/html');
        ['#toc','.toc','.mw-editsection','table','sup','.noprint','script','style'].forEach(sel =>
          doc.querySelectorAll(sel).forEach(el=>el.remove())
        );
        const content = doc.querySelector('div.mw-parser-output')||doc.querySelector('#mw-content-text');
        if (!content) { errors++; addLog(`  ⚠️ ${title}: không lấy được nội dung`,'warn'); continue; }
        const fullText = cleanText((content.textContent||'').trim(), 600);
        if (fullText.length < 60) { errors++; continue; }
        const prefix = genre==='van_hoc'?'VH':'NL';
        const item = {
          id: makeId(prefix,grade,50+i), title, author,
          source:`Wikisource — ${url}`,
          class:grade, genre, subgenre, theme, difficulty:'medium',
          copyright_status:'public_domain', approved:false,
          wordCount:fullText.split(/\s+/).length,
          excerpt:excerptFrom(fullText), fullText, addedAt:new Date().toISOString(),
        };
        if (tryAdd(item)) { added++; addLog(`  ✅ [lớp ${grade}] ${title} — ${author}`,'ok'); }
        else { skipped++; addLog(`  ⏩ ${title}: đã có`,'skip'); }
      } catch(e) { errors++; addLog(`  ❌ ${title}: ${e.message}`,'error'); }
    }
    return {added,skipped,errors};
  };

  const runAll = async () => {
    setPhase('running');
    abortRef.current = false;
    existingRef.current = new Set([...PASSAGES_BANK.map(p=>p.id),...(data.passages||[]).map(p=>p.id)]);
    newPassRef.current = [...(data.passages||[])];
    setLogs([]);
    addLog('🚀 Bắt đầu cập nhật tự động...','section');
    let tot = {added:0,skipped:0,errors:0};
    const merge = r => { tot.added+=r.added; tot.skipped+=r.skipped; tot.errors+=r.errors; };
    merge(await fetchWikipedia());
    if (!abortRef.current) merge(await fetchThivien());
    if (!abortRef.current) merge(await fetchWikisource());
    setData(prev => ({...prev, passages: newPassRef.current}));
    setStats(tot);
    addLog(`\n✅ Xong! +${tot.added} mới · ⏩ ${tot.skipped} bỏ qua · ❌ ${tot.errors} lỗi`,'done');
    setPhase('done');
  };

  const handleStop = () => { abortRef.current=true; addLog('⏹ Đã dừng.','warn'); setPhase('done'); };

  const LC = {ok:'text-green-700',warn:'text-amber-600',error:'text-red-600',skip:'text-slate-400',section:'text-blue-700 font-semibold mt-1',done:'text-teal-700 font-bold'};

  return (
    <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4 modal-overlay">
      <div className="bg-white rounded-2xl w-full max-w-2xl flex flex-col shadow-2xl modal-box" style={{maxHeight:'85vh'}}>
        <div className="flex items-center justify-between p-5 border-b">
          <div>
            <h3 className="text-lg font-bold text-slate-800">🔄 Cập nhật ngữ liệu tự động</h3>
            <p className="text-sm text-slate-500 mt-0.5">Wikipedia API · thivien.net · Wikisource</p>
          </div>
          {phase!=='running' && <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-2xl leading-none">×</button>}
        </div>

        {phase==='idle' && (
          <div className="p-6 flex-1 overflow-y-auto">
            <div className="grid grid-cols-3 gap-3 mb-5">
              {[
                {icon:'📘',name:'Wikipedia API',count:WIKI_ARTICLES.length,desc:'Thông tin + Nghị luận',c:'blue'},
                {icon:'📗',name:'thivien.net',count:THIVIEN_POEMS.length,desc:'Thơ lớp 6–9',c:'teal'},
                {icon:'📕',name:'Wikisource',count:WIKISOURCE_TEXTS.length,desc:'Văn xuôi cổ điển',c:'rose'},
              ].map(s=>(
                <div key={s.name} className={`bg-${s.c}-50 border border-${s.c}-200 rounded-xl p-3 text-center`}>
                  <div className="text-2xl mb-1">{s.icon}</div>
                  <div className={`text-xl font-bold text-${s.c}-700`}>{s.count}</div>
                  <div className="text-xs font-semibold text-slate-700">{s.name}</div>
                  <div className="text-xs text-slate-500">{s.desc}</div>
                </div>
              ))}
            </div>
            <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 text-sm text-amber-800 mb-5">
              ⚡ <strong>Lưu ý:</strong> Quá trình mất 3–5 phút. Ngữ liệu thu về sẽ vào <em>⏳ Chờ duyệt</em> để cô xem lại trước khi dùng. Không tắt app khi đang chạy.
            </div>
            <button onClick={runAll} className="w-full py-3 bg-teal-600 text-white rounded-xl font-semibold text-base hover:bg-teal-700 flex items-center justify-center gap-2">
              <Icon name="RefreshCw" size={18}/> Bắt đầu cập nhật ngay
            </button>
          </div>
        )}

        {(phase==='running'||phase==='done') && (
          <>
            <div ref={logRef} className="flex-1 overflow-y-auto p-4 bg-slate-950 font-mono text-xs space-y-0.5" style={{minHeight:'320px'}}>
              {logs.map((l,i)=>(
                <div key={i} className={LC[l.type]||'text-slate-300'}>{l.msg}</div>
              ))}
              {phase==='running' && (
                <div className="flex items-center gap-2 text-teal-400 mt-2 animate-pulse">
                  <svg className="animate-spin h-3 w-3" fill="none" viewBox="0 0 24 24">
                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/>
                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
                  </svg>
                  Đang xử lý...
                </div>
              )}
            </div>
            <div className="p-4 border-t flex items-center justify-between gap-3 bg-white">
              {phase==='done' ? (
                <>
                  <div className="text-sm text-slate-600">
                    ✅ <strong className="text-green-700">{stats.added} ngữ liệu mới</strong>
                    &nbsp;·&nbsp;⏩ {stats.skipped} bỏ qua
                    &nbsp;·&nbsp;❌ {stats.errors} lỗi
                  </div>
                  <button onClick={onClose} className="px-5 py-2 bg-teal-600 text-white rounded-lg text-sm font-medium hover:bg-teal-700">
                    Xong ✓
                  </button>
                </>
              ) : (
                <>
                  <div className="text-sm text-slate-500">Đang thu thập... Vui lòng không tắt app.</div>
                  <button onClick={handleStop} className="px-4 py-2 bg-red-100 text-red-700 rounded-lg text-sm hover:bg-red-200">
                    ⏹ Dừng lại
                  </button>
                </>
              )}
            </div>
          </>
        )}
      </div>
    </div>
  );
};

// ============== 📚 KHO NGỮ LIỆU — CORPUS MANAGER ==============
const KhoNguLieuTab = ({ data, setData, selectedClass, onBack }) => {
  const [filterGenre, setFilterGenre] = useState('all');
  const [filterGrade, setFilterGrade] = useState(selectedClass || 'all');
  const [filterStatus, setFilterStatus] = useState('all'); // all | approved | pending
  const [search, setSearch] = useState('');
  const [showModal, setShowModal] = useState(false);
  const [editingItem, setEditingItem] = useState(null);
  const [showPasteModal, setShowPasteModal] = useState(false);
  const [importResult, setImportResult] = useState(null); // { added, skipped, errors }
  const [showAutoUpdate, setShowAutoUpdate] = useState(false);

  const handleImportJSON = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const raw = JSON.parse(ev.target.result);
        const items = Array.isArray(raw) ? raw : raw.passages || raw.data || [];
        if (!items.length) { alert('❌ File JSON không có ngữ liệu nào!'); return; }
        const existing = new Set([...PASSAGES_BANK.map(p => p.id), ...(data.passages || []).map(p => p.id)]);
        let added = 0, skipped = 0, errors = 0;
        const newPassages = [...(data.passages || [])];
        items.forEach((item, idx) => {
          try {
            if (!item.id || !item.title) { errors++; return; }
            if (existing.has(item.id)) { skipped++; return; }
            const passage = {
              id: item.id,
              title: item.title || '',
              author: item.author || '',
              source: item.source || '',
              class: Number(item.class) || 6,
              genre: item.genre || 'van_hoc',
              subgenre: item.subgenre || '',
              theme: item.theme || '',
              difficulty: item.difficulty || 'medium',
              copyright_status: item.copyright_status || 'unknown',
              approved: item.approved !== undefined ? item.approved : false,
              wordCount: item.wordCount || (item.fullText || '').split(/\s+/).filter(Boolean).length,
              excerpt: item.excerpt || (item.fullText || '').slice(0, 200),
              fullText: item.fullText || item.excerpt || '',
              addedAt: item.addedAt || new Date().toISOString(),
            };
            newPassages.push(passage);
            existing.add(item.id);
            added++;
          } catch { errors++; }
        });
        setData({ ...data, passages: newPassages });
        setImportResult({ added, skipped, errors });
      } catch (err) {
        alert('❌ Lỗi đọc file JSON: ' + err.message);
      }
    };
    reader.readAsText(file, 'utf-8');
    e.target.value = ''; // reset input
  };

  // Kết hợp ngữ liệu tĩnh và ngữ liệu cô thêm vào
  const userPassages = data.passages || [];
  const allPassages = [...PASSAGES_BANK.map(p => ({ ...p, _static: true })), ...userPassages];

  const filtered = allPassages.filter(p => {
    if (filterGenre !== 'all' && p.genre !== filterGenre) return false;
    if (filterGrade !== 'all' && p.class !== Number(filterGrade)) return false;
    if (filterStatus === 'approved' && !p.approved) return false;
    if (filterStatus === 'pending' && p.approved) return false;
    if (search && !p.title.toLowerCase().includes(search.toLowerCase()) && !(p.author || '').toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });

  const genreColors = { van_hoc: 'teal', thong_tin: 'blue', nghi_luan: 'amber', hanh_chinh: 'rose' };
  const genreBadge = (genre) => {
    const g = LOAI_VAN_BAN.find(l => l.id === genre);
    const c = genreColors[genre] || 'slate';
    return <span className={`text-xs px-2 py-0.5 rounded-full bg-${c}-100 text-${c}-700 font-medium`}>{g?.icon} {g?.ten || genre}</span>;
  };

  const handleDelete = (id) => {
    if (!confirm('Xóa ngữ liệu này?')) return;
    setData({ ...data, passages: userPassages.filter(p => p.id !== id) });
  };
  const handleApprove = (id, val) => {
    setData({ ...data, passages: userPassages.map(p => p.id === id ? { ...p, approved: val } : p) });
  };
  const handleSavePassage = (passage) => {
    const list = userPassages;
    const exists = list.find(p => p.id === passage.id);
    setData({ ...data, passages: exists ? list.map(p => p.id === passage.id ? passage : p) : [...list, passage] });
    setShowModal(false);
    setEditingItem(null);
  };

  const stats = {
    total: allPassages.length,
    van_hoc: allPassages.filter(p => p.genre === 'van_hoc').length,
    thong_tin: allPassages.filter(p => p.genre === 'thong_tin').length,
    nghi_luan: allPassages.filter(p => p.genre === 'nghi_luan').length,
    hanh_chinh: allPassages.filter(p => p.genre === 'hanh_chinh').length,
    pending: userPassages.filter(p => !p.approved).length,
  };

  return (
    <div className="space-y-5 fade-in">
      {onBack && <BackBtn onClick={onBack} label="← Đề kiểm tra" />}
      {/* Header */}
      <div className="flex items-center justify-between">
        <div>
          <h3 className="text-2xl font-bold text-slate-800">📚 Kho Ngữ Liệu</h3>
          <p className="text-slate-500 text-sm mt-0.5">Quản lý văn bản dùng làm ngữ liệu đề kiểm tra — theo GDPT 2018</p>
        </div>
        <div className="flex gap-2 flex-wrap">
          <button onClick={() => setShowAutoUpdate(true)} className="px-4 py-2 bg-teal-700 text-white rounded-lg flex items-center gap-2 text-sm font-medium hover:bg-teal-800">
            <Icon name="RefreshCw" size={16} /> Cập nhật tự động
          </button>
          <label className="px-4 py-2 bg-amber-600 text-white rounded-lg flex items-center gap-2 text-sm font-medium hover:bg-amber-700 cursor-pointer">
            <Icon name="Upload" size={16} /> Nhập từ JSON
            <input type="file" accept=".json" className="hidden" onChange={handleImportJSON} />
          </label>
          <button onClick={() => { setShowPasteModal(true); }} className="px-4 py-2 bg-teal-600 text-white rounded-lg flex items-center gap-2 text-sm font-medium hover:bg-teal-700">
            <Icon name="ClipboardPaste" size={16} /> Dán văn bản
          </button>
          <button onClick={() => { setEditingItem(null); setShowModal(true); }} className="px-4 py-2 bg-rose-600 text-white rounded-lg flex items-center gap-2 text-sm font-medium hover:bg-rose-700">
            <Icon name="Plus" size={16} /> Thêm ngữ liệu
          </button>
        </div>
      </div>

      {/* Import result banner */}
      {importResult && (
        <div className="bg-green-50 border border-green-200 rounded-xl p-4 flex items-start gap-3">
          <Icon name="CheckCircle" size={20} className="text-green-600 mt-0.5 shrink-0" />
          <div className="flex-1 text-sm">
            <p className="font-semibold text-green-800">📥 Nhập JSON thành công!</p>
            <p className="text-green-700 mt-0.5">
              ✅ Đã thêm <strong>{importResult.added}</strong> ngữ liệu mới &nbsp;·&nbsp;
              ⏩ Bỏ qua <strong>{importResult.skipped}</strong> trùng lặp &nbsp;·&nbsp;
              {importResult.errors > 0 && <span>❌ Lỗi <strong>{importResult.errors}</strong> dòng &nbsp;·&nbsp;</span>}
              Vui lòng kiểm tra và duyệt các mục mới trong tab <em>⏳ Chờ duyệt</em>.
            </p>
          </div>
          <button onClick={() => setImportResult(null)} className="text-green-400 hover:text-green-600 text-lg leading-none">×</button>
        </div>
      )}

      {/* Stat cards */}
      <div className="grid grid-cols-3 md:grid-cols-6 gap-3">
        {[
          { label: 'Tổng cộng', val: stats.total, color: 'slate' },
          { label: '📖 Văn học', val: stats.van_hoc, color: 'teal' },
          { label: '📰 Thông tin', val: stats.thong_tin, color: 'blue' },
          { label: '💬 Nghị luận', val: stats.nghi_luan, color: 'amber' },
          { label: '📋 Hành chính', val: stats.hanh_chinh, color: 'rose' },
          { label: '⏳ Chờ duyệt', val: stats.pending, color: 'orange' },
        ].map(s => (
          <div key={s.label} className={`bg-white border rounded-xl p-3 text-center`}>
            <div className={`text-2xl font-bold text-${s.color}-600`}>{s.val}</div>
            <div className="text-xs text-slate-500 mt-0.5">{s.label}</div>
          </div>
        ))}
      </div>

      {/* Filters */}
      <div className="bg-white border rounded-xl p-4 flex flex-wrap gap-3 items-center">
        <input value={search} onChange={e => setSearch(e.target.value)} placeholder="🔍 Tìm tiêu đề, tác giả..." className="flex-1 min-w-48 px-3 py-2 border rounded-lg text-sm" />
        <select value={filterGenre} onChange={e => setFilterGenre(e.target.value)} className="px-3 py-2 border rounded-lg bg-white text-sm">
          <option value="all">Tất cả thể loại</option>
          {LOAI_VAN_BAN.map(l => <option key={l.id} value={l.id}>{l.icon} {l.ten}</option>)}
        </select>
        <select value={filterGrade} onChange={e => setFilterGrade(e.target.value)} className="px-3 py-2 border rounded-lg bg-white text-sm">
          <option value="all">Tất cả lớp</option>
          {[6,7,8,9].map(g => <option key={g} value={g}>Lớp {g}</option>)}
        </select>
        <select value={filterStatus} onChange={e => setFilterStatus(e.target.value)} className="px-3 py-2 border rounded-lg bg-white text-sm">
          <option value="all">Tất cả trạng thái</option>
          <option value="approved">✅ Đã duyệt</option>
          <option value="pending">⏳ Chờ duyệt</option>
        </select>
        <span className="text-sm text-slate-500">{filtered.length} kết quả</span>
      </div>

      {/* List */}
      {filtered.length === 0 ? (
        <div className="bg-white rounded-xl p-12 border border-dashed text-center">
          <Icon name="BookOpen" size={48} className="mx-auto text-slate-300 mb-3" />
          <p className="text-slate-500">Không tìm thấy ngữ liệu phù hợp</p>
        </div>
      ) : (
        <div className="space-y-3">
          {filtered.map(p => (
            <div key={p.id} className={`bg-white rounded-xl border p-4 flex gap-4 ${!p.approved && !p._static ? 'border-orange-200 bg-orange-50/30' : ''}`}>
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-2 flex-wrap mb-1">
                  {genreBadge(p.genre)}
                  <span className="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded">Lớp {p.class}</span>
                  {p.difficulty && <span className="text-xs bg-purple-50 text-purple-700 px-2 py-0.5 rounded">{{'de':'Dễ','vua':'Vừa','kho':'Khó','ratKho':'Rất khó'}[p.difficulty] || p.difficulty}</span>}
                  {p.wordCount && <span className="text-xs text-slate-400">~{p.wordCount} chữ</span>}
                  {!p.approved && !p._static && <span className="text-xs bg-orange-100 text-orange-600 px-2 py-0.5 rounded">⏳ Chờ duyệt</span>}
                  {p._static && <span className="text-xs bg-green-50 text-green-600 px-2 py-0.5 rounded">✅ Kho mặc định</span>}
                </div>
                <h4 className="font-semibold text-slate-800 text-sm">{p.title}</h4>
                <p className="text-xs text-slate-500">{p.author}{p.source ? ` — ${p.source}` : ''}</p>
                <p className="text-xs text-slate-400 mt-1 line-clamp-2">{p.excerpt || (p.fullText || '').substring(0, 100) + '...'}</p>
                <div className="flex items-center gap-2 mt-1">
                  <span className="text-xs text-slate-400">{p.copyright_status === 'public_domain' ? '🟢 Public domain' : p.copyright_status === 'nha_nuoc' ? '🟢 Văn bản Nhà nước' : p.copyright_status === 'education_use' ? '🟡 Dùng cho GD' : '⚪ Chưa xác định'}</span>
                  {p.theme && <span className="text-xs text-slate-400">· {THEMES[p.theme] || p.theme}</span>}
                </div>
              </div>
              <div className="flex flex-col gap-1 flex-shrink-0">
                {!p._static && (
                  <>
                    {!p.approved ? (
                      <button onClick={() => handleApprove(p.id, true)} className="text-xs px-3 py-1.5 bg-teal-600 text-white rounded-lg hover:bg-teal-700">✅ Duyệt</button>
                    ) : (
                      <button onClick={() => handleApprove(p.id, false)} className="text-xs px-3 py-1.5 bg-slate-100 text-slate-600 rounded-lg hover:bg-slate-200">↩ Bỏ duyệt</button>
                    )}
                    <button onClick={() => { setEditingItem(p); setShowModal(true); }} className="text-xs px-3 py-1.5 bg-slate-100 rounded-lg hover:bg-slate-200">✏️ Sửa</button>
                    <button onClick={() => handleDelete(p.id)} className="text-xs px-3 py-1.5 bg-red-50 text-red-600 rounded-lg hover:bg-red-100">🗑</button>
                  </>
                )}
                {p._static && (
                  <button onClick={() => {
                    const clone = { ...p, id: 'USR_' + Date.now(), _static: false, approved: true, addedAt: new Date().toISOString() };
                    delete clone._static;
                    handleSavePassage(clone);
                    alert('✅ Đã sao chép vào kho của bạn để chỉnh sửa!');
                  }} className="text-xs px-3 py-1.5 bg-teal-50 text-teal-700 rounded-lg hover:bg-teal-100">📋 Sao chép</button>
                )}
              </div>
            </div>
          ))}
        </div>
      )}

      {/* Modal thêm/sửa */}
      {showModal && (
        <PassageModal
          item={editingItem}
          onSave={handleSavePassage}
          onClose={() => { setShowModal(false); setEditingItem(null); }}
        />
      )}

      {/* Modal dán văn bản nhanh */}
      {showPasteModal && (
        <PastePassageModal
          onSave={(p) => { handleSavePassage(p); setShowPasteModal(false); }}
          onClose={() => setShowPasteModal(false)}
        />
      )}

      {/* Modal cập nhật tự động */}
      {showAutoUpdate && (
        <AutoUpdateModal
          data={data}
          setData={setData}
          onClose={() => { setShowAutoUpdate(false); setFilterStatus('pending'); }}
        />
      )}
    </div>
  );
};

const PassageModal = ({ item, onSave, onClose }) => {
  const isEdit = !!item;
  const [form, setForm] = useState(item || {
    id: 'USR_' + Date.now(), title: '', author: '', source: '',
    class: 6, genre: 'van_hoc', subgenre: '', theme: '', difficulty: 'vua',
    copyright_status: 'education_use', approved: false, wordCount: 0,
    excerpt: '', fullText: '', addedAt: new Date().toISOString()
  });
  const countWords = (text) => text.trim() ? text.trim().split(/\s+/).length : 0;
  const handleSave = () => {
    if (!form.title.trim() || !form.fullText.trim()) { alert('Nhập tiêu đề và nội dung văn bản'); return; }
    onSave({ ...form, wordCount: countWords(form.fullText), excerpt: form.excerpt || form.fullText.substring(0, 120) + '...' });
  };
  return (
    <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50 modal-overlay">
      <div className="bg-white rounded-xl w-full max-w-4xl max-h-[95vh] overflow-hidden flex flex-col">
        <div className="p-5 border-b flex items-center justify-between">
          <h3 className="text-xl font-bold">{isEdit ? 'Sửa' : 'Thêm'} ngữ liệu</h3>
          <button onClick={onClose} className="p-2 hover:bg-slate-100 rounded"><Icon name="X" size={20} /></button>
        </div>
        <div className="flex-1 overflow-y-auto p-5 space-y-4">
          <div className="grid grid-cols-2 gap-3">
            <div className="col-span-2"><label className="block text-sm font-medium mb-1">Tiêu đề văn bản *</label><input value={form.title} onChange={e => setForm({ ...form, title: e.target.value })} className="w-full px-3 py-2 border rounded-lg" placeholder="VD: Sang thu, Tinh thần yêu nước..." /></div>
            <div><label className="block text-sm font-medium mb-1">Tác giả</label><input value={form.author} onChange={e => setForm({ ...form, author: e.target.value })} className="w-full px-3 py-2 border rounded-lg" placeholder="Họ tên tác giả" /></div>
            <div><label className="block text-sm font-medium mb-1">Nguồn / xuất xứ</label><input value={form.source} onChange={e => setForm({ ...form, source: e.target.value })} className="w-full px-3 py-2 border rounded-lg" placeholder="NXB, báo, tạp chí..." /></div>
            <div><label className="block text-sm font-medium mb-1">Loại văn bản *</label><select value={form.genre} onChange={e => setForm({ ...form, genre: e.target.value })} className="w-full px-3 py-2 border rounded-lg bg-white">{LOAI_VAN_BAN.map(l => <option key={l.id} value={l.id}>{l.icon} {l.ten}</option>)}</select></div>
            <div><label className="block text-sm font-medium mb-1">Lớp *</label><select value={form.class} onChange={e => setForm({ ...form, class: Number(e.target.value) })} className="w-full px-3 py-2 border rounded-lg bg-white">{[6,7,8,9].map(g => <option key={g} value={g}>Lớp {g}</option>)}</select></div>

            <textarea value={customPrompt} onChange={e => setCustomPrompt(e.target.value)} placeholder="Ví dụ: ưu tiên tác giả nữ, chủ đề biến đổi khí hậu, phong cách thơ tự do hiện đại, ngữ liệu thời sự 2025-2026..." className="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm h-20 resize-none" />
          </div>
          <button onClick={handleGenerate} className="w-full py-4 bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 text-white rounded-xl font-bold text-base flex items-center justify-center gap-2 shadow-lg transition">
            <Icon name="Sparkles" size={20} /> 🤖 AI Tạo 4 Ngữ Liệu Hoàn Chỉnh
          </button>

      {/* CHẾ ĐỘ 2: CHUẨN HOÁ VĂN BẢN DÁN VÀO */}
      {pasteMode && step === 1 && (

          </div>
          <div>
            <label className="block text-sm font-semibold text-slate-700 mb-2">Nguồn (tuỳ chọn)</label>

          </div>
          <div>
            <label className="block text-sm font-semibold text-slate-700 mb-2">Dán văn bản vào đây</label>
            <textarea value={pasteText} onChange={e => setPasteText(e.target.value)} placeholder="Dán bài thơ, đoạn truyện, bài báo, lời bài hát, văn bản hành chính... bất kỳ. AI sẽ tự chuẩn hoá thành ngữ liệu đề thi." className="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm h-56 resize-none" />
            <p className="text-xs text-slate-400 mt-1">{pasteText.split(/\s+/).filter(Boolean).length} chữ</p>

          <button onClick={handleNormalize} disabled={normalizing || !pasteText.trim()}
