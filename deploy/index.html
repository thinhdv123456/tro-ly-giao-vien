    ['https://www.thivien.net/H%E1%BB%AFu-Th%E1%BB%89nh/Sang-thu/poem-aeKKUxGbZwOwpQZsyen76g','Hữu Thỉnh',9,'thơ năm chữ','thiên nhiên - giao mùa - triết lý','education_use'],
    ['https://www.thivien.net/Vi%E1%BB%85n-Ph%C6%B0%C6%A1ng/Vi%E1%BA%BFng-l%C4%83ng-B%C3%A1c/poem-ssM7VCNHXgctPBPvkDuAZw','Viễn Phương',9,'thơ tám chữ','yêu nước - lòng biết ơn - Bác Hồ','education_use'],
    ['https://www.thivien.net/Y-Ph%C6%B0%C6%A1ng/N%C3%B3i-v%E1%BB%9Bi-con/poem-XCSfSxC-AM_w5wx1OjDiww','Y Phương',9,'thơ tự do','tình gia đình - bản sắc dân tộc','education_use'],
    ['https://www.thivien.net/Nguy%E1%BB%85n-Duy/Tre-Vi%E1%BB%87t-Nam/poem-VkIfi7DKP2f1cM8JZZP8yA','Nguyễn Duy',9,'thơ lục bát','bản sắc dân tộc - sức sống Việt Nam','education_use'],
  ];

  const WIKISOURCE_TEXTS = [
    ['https://vi.wikisource.org/wiki/Ch%C3%AD_Ph%C3%A8o','Chí Phèo','Nam Cao',8,'van_hoc','truyện ngắn','số phận con người - bi kịch xã hội'],
    ['https://vi.wikisource.org/wiki/L%C3%A3o_H%E1%BA%A1c','Lão Hạc','Nam Cao',8,'van_hoc','truyện ngắn','số phận con người - tình cha con'],
    ['https://vi.wikisource.org/wiki/Nam_qu%E1%BB%91c_s%C6%A1n_h%C3%A0','Nam quốc sơn hà','Lý Thường Kiệt',7,'van_hoc','thơ cổ','yêu nước - chủ quyền dân tộc'],
  ];

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const CORS_PROXY = url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
  const WIKI_API = 'https://vi.wikipedia.org/w/api.php';
  const makeId = (pfx, grade, i) => `${pfx}_${grade}_A${String(i).padStart(3,'0')}`;

  const cleanText = (text, maxW = 600) => {
    text = text.replace(/\n{3,}/g,'\n\n').trim();
    const words = text.split(/\s+/);
    if (words.length <= maxW) return text;
    const cut = words.slice(0,maxW).join(' ');
    const last = Math.max(cut.lastIndexOf('.'), cut.lastIndexOf('!'), cut.lastIndexOf('?'));
    return last > maxW * 2 ? cut.slice(0, last+1) : cut + '...';
  };
  const excerptFrom = (text, n=40) => text.replace(/\n/g,' ').split(/\s+/).slice(0,n).join(' ') + '...';

  const addLog = (msg, type='ok') => {
    setLogs(prev => [...prev, {msg, type}]);
    setTimeout(() => { if (logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight; }, 50);
  };

  const existingRef = React.useRef(new Set([
    ...PASSAGES_BANK.map(p=>p.id), ...(data.passages||[]).map(p=>p.id)
  ]));
  const newPassRef = React.useRef([...(data.passages||[])]);

  const tryAdd = item => {
    if (!item.id || !item.title || !item.fullText) return false;
    if (existingRef.current.has(item.id)) return false;
    const key = item.title.toLowerCase()+'_'+(item.author||'').toLowerCase();
    if (newPassRef.current.some(p => (p.title.toLowerCase()+'_'+(p.author||'').toLowerCase())===key)) return false;
    existingRef.current.add(item.id);
    newPassRef.current.push(item);
    return true;
  };

  const fetchWikipedia = async () => {
    addLog('📘 Wikipedia API (Thông tin & Nghị luận)...', 'section');
    let added=0, skipped=0, errors=0;
    for (let i=0; i<WIKI_ARTICLES.length; i++) {
      if (abortRef.current) break;
      const [title_vi, grade, genre, subgenre, theme] = WIKI_ARTICLES[i];
      try {
        await sleep(600);
        const params = new URLSearchParams({action:'query',prop:'extracts',exintro:'1',explaintext:'1',titles:title_vi,format:'json',origin:'*'});
        const resp = await fetch(`${WIKI_API}?${params}`);
        const json = await resp.json();
        const page = Object.values(json?.query?.pages||{})[0];
        const rawText = page?.extract||'';
        if (rawText.length < 80) { errors++; addLog(`  ⚠️ ${title_vi}: không có nội dung`,'warn'); continue; }
        const fullText = cleanText(rawText, 500);
        const prefix = genre==='thong_tin'?'TT':'NL';
        const item = {
          id: makeId(prefix,grade,100+i), title:title_vi, author:'Wikipedia tiếng Việt',
          source:`https://vi.wikipedia.org/wiki/${encodeURIComponent(title_vi.replace(/ /g,'_'))}`,
          class:grade, genre, subgenre, theme, difficulty:'medium',
          copyright_status:'education_use', approved:false,
          wordCount:fullText.split(/\s+/).length,
          excerpt:excerptFrom(fullText), fullText, addedAt:new Date().toISOString(),
        };
        if (tryAdd(item)) { added++; addLog(`  ✅ [lớp ${grade}] ${title_vi}`,'ok'); }
        else { skipped++; addLog(`  ⏩ ${title_vi}: đã có`,'skip'); }
      } catch(e) { errors++; addLog(`  ❌ ${title_vi}: ${e.message}`,'error'); }
    }
    return {added,skipped,errors};
  };

  const fetchThivien = async () => {
    addLog('📗 thivien.net (Thơ lớp 6–9)...', 'section');
    let added=0, skipped=0, errors=0;
    for (let i=0; i<THIVIEN_POEMS.length; i++) {
      if (abortRef.current) break;
      const [url, author, grade, subgenre, theme, copyright_status] = THIVIEN_POEMS[i];
      try {
        await sleep(1500);
        const proxyResp = await fetch(CORS_PROXY(url));
        const proxyJson = await proxyResp.json();
        const html = proxyJson.contents;
        if (!html) { errors++; addLog(`  ⚠️ [lớp ${grade}] ${author}: proxy rỗng`,'warn'); continue; }
        const parser = new DOMParser();
        const doc = parser.parseFromString(html,'text/html');
        const h1 = doc.querySelector('h1.item-title')||doc.querySelector('h1');
        const title = (h1?.textContent||'').replace(/\s*[-–].*$/,'').trim()||author;
        const poemEl = doc.querySelector('div.poem-content');
        if (!poemEl) { errors++; addLog(`  ⚠️ ${title}: không tìm được nội dung`,'warn'); continue; }
        const fullText = cleanText((poemEl.textContent||'').trim(), 400);
        if (fullText.length < 30) { errors++; continue; }
        const item = {
          id: makeId('VH',grade,i+1), title, author,
          source:`thivien.net — ${url}`,
          class:grade, genre:'van_hoc', subgenre, theme, difficulty:'medium',
          copyright_status, approved:false,
          wordCount:fullText.split(/\s+/).length,
          excerpt:excerptFrom(fullText), fullText, addedAt:new Date().toISOString(),
        };
        if (tryAdd(item)) { added++; addLog(`  ✅ [lớp ${grade}] ${title} — ${author}`,'ok'); }
        else { skipped++; addLog(`  ⏩ ${title}: đã có`,'skip'); }
      } catch(e) { errors++; addLog(`  ❌ [thivien lớp ${grade}] ${author}: ${e.message}`,'error'); }
    }
    return {added,skipped,errors};
  };

  const fetchWikisource = async () => {
    addLog('📕 Wikisource (Văn xuôi cổ điển)...', 'section');
    let added=0, skipped=0, errors=0;
    for (let i=0; i<WIKISOURCE_TEXTS.length; i++) {
      if (abortRef.current) break;
      const [url,title,author,grade,genre,subgenre,theme] = WIKISOURCE_TEXTS[i];
      try {
        await sleep(1500);
        const proxyResp = await fetch(CORS_PROXY(url));
        const proxyJson = await proxyResp.json();
        const html = proxyJson.contents;
        if (!html) { errors++; continue; }
        const parser = new DOMParser();
        const doc = parser.parseFromString(html,'text/html');
        ['#toc','.toc','.mw-editsection','table','sup','.noprint','script','style'].forEach(sel =>
          doc.querySelectorAll(sel).forEach(el=>el.remove())
        );
        const content = doc.querySelector('div.mw-parser-output')||doc.querySelector('#mw-content-text');
        if (!content) { errors++; addLog(`  ⚠️ ${title}: không lấy được nội dung`,'warn'); continue; }
        const fullText = cleanText((content.textContent||'').trim(), 600);
        if (fullText.length < 60) { errors++; continue; }
        const prefix = genre==='van_hoc'?'VH':'NL';
        const item = {
          id: makeId(prefix,grade,50+i), title, author,
          source:`Wikisource — ${url}`,
          class:grade, genre, subgenre, theme, difficulty:'medium',
          copyright_status:'public_domain', approved:false,
          wordCount:fullText.split(/\s+/).length,
          excerpt:excerptFrom(fullText), fullText, addedAt:new Date().toISOString(),
        };
        if (tryAdd(item)) { added++; addLog(`  ✅ [lớp ${grade}] ${title} — ${author}`,'ok'); }
        else { skipped++; addLog(`  ⏩ ${title}: đã có`,'skip'); }
      } catch(e) { errors++; addLog(`  ❌ ${title}: ${e.message}`,'error'); }
    }
    return {added,skipped,errors};
  };

  const runAll = async () => {
    setPhase('running');
    abortRef.current = false;
    existingRef.current = new Set([...PASSAGES_BANK.map(p=>p.id),...(data.passages||[]).map(p=>p.id)]);
    newPassRef.current = [...(data.passages||[])];
    setLogs([]);
    addLog('🚀 Bắt đầu cập nhật tự động...','section');
    let tot = {added:0,skipped:0,errors:0};
    const merge = r => { tot.added+=r.added; tot.skipped+=r.skipped; tot.errors+=r.errors; };
    merge(await fetchWikipedia());
    if (!abortRef.current) merge(await fetchThivien());
    if (!abortRef.current) merge(await fetchWikisource());
    setData(prev => ({...prev, passages: newPassRef.current}));
    setStats(tot);
    addLog(`\n✅ Xong! +${tot.added} mới · ⏩ ${tot.skipped} bỏ qua · ❌ ${tot.errors} lỗi`,'done');
    setPhase('done');
  };

  const handleStop = () => { abortRef.current=true; addLog('⏹ Đã dừng.','warn'); setPhase('done'); };

  const LC = {ok:'text-green-700',warn:'text-amber-600',error:'text-red-600',skip:'text-slate-400',section:'text-blue-700 font-semibold mt-1',done:'text-teal-700 font-bold'};

  return (
    <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4 modal-overlay">
      <div className="bg-white rounded-2xl w-full max-w-2xl flex flex-col shadow-2xl modal-box" style={{maxHeight:'85vh'}}>
        <div className="flex items-center justify-between p-5 border-b">
          <div>
            <h3 className="text-lg font-bold text-slate-800">🔄 Cập nhật ngữ liệu tự động</h3>
            <p className="text-sm text-slate-500 mt-0.5">Wikipedia API · thivien.net · Wikisource</p>
          </div>
          {phase!=='running' && <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-2xl leading-none">×</button>}
        </div>

        {phase==='idle' && (
          <div className="p-6 flex-1 overflow-y-auto">
            <div className="grid grid-cols-3 gap-3 mb-5">
              {[
                {icon:'📘',name:'Wikipedia API',count:WIKI_ARTICLES.length,desc:'Thông tin + Nghị luận',c:'blue'},
                {icon:'📗',name:'thivien.net',count:THIVIEN_POEMS.length,desc:'Thơ lớp 6–9',c:'teal'},
                {icon:'📕',name:'Wikisource',count:WIKISOURCE_TEXTS.length,desc:'Văn xuôi cổ điển',c:'rose'},
              ].map(s=>(
                <div key={s.name} className={`bg-${s.c}-50 border border-${s.c}-200 rounded-xl p-3 text-center`}>
                  <div className="text-2xl mb-1">{s.icon}</div>
                  <div className={`text-xl font-bold text-${s.c}-700`}>{s.count}</div>
                  <div className="text-xs font-semibold text-slate-700">{s.name}</div>
                  <div className="text-xs text-slate-500">{s.desc}</div>
                </div>
              ))}
            </div>
            <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 text-sm text-amber-800 mb-5">
              ⚡ <strong>Lưu ý:</strong> Quá trình mất 3–5 phút. Ngữ liệu thu về sẽ vào <em>⏳ Chờ duyệt</em> để cô xem lại trước khi dùng. Không tắt app khi đang chạy.
            </div>
            <button onClick={runAll} className="w-full py-3 bg-teal-600 text-white rounded-xl font-semibold text-base hover:bg-teal-700 flex items-center justify-center gap-2">
              <Icon name="RefreshCw" size={18}/> Bắt đầu cập nhật ngay
            </button>
          </div>
        )}

        {(phase==='running'||phase==='done') && (
          <>
            <div ref={logRef} className="flex-1 overflow-y-auto p-4 bg-slate-950 font-mono text-xs space-y-0.5" style={{minHeight:'320px'}}>
              {logs.map((l,i)=>(
                <div key={i} className={LC[l.type]||'text-slate-300'}>{l.msg}</div>
              ))}
              {phase==='running' && (
                <div className="flex items-center gap-2 text-teal-400 mt-2 animate-pulse">
                  <svg className="animate-spin h-3 w-3" fill="none" viewBox="0 0 24 24">
                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/>
                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
                  </svg>
                  Đang xử lý...
                </div>
              )}
            </div>
            <div className="p-4 border-t flex items-center justify-between gap-3 bg-white">
              {phase==='done' ? (
                <>
                  <div className="text-sm text-slate-600">
                    ✅ <strong className="text-green-700">{stats.added} ngữ liệu mới</strong>
                    &nbsp;·&nbsp;⏩ {stats.skipped} bỏ qua
                    &nbsp;·&nbsp;❌ {stats.errors} lỗi
                  </div>
                  <button onClick={onClose} className="px-5 py-2 bg-teal-600 text-white rounded-lg text-sm font-medium hover:bg-teal-700">
                    Xong ✓
                  </button>
                </>
              ) : (
                <>
                  <div className="text-sm text-slate-500">Đang thu thập... Vui lòng không tắt app.</div>
                  <button onClick={handleStop} className="px-4 py-2 bg-red-100 text-red-700 rounded-lg text-sm hover:bg-red-200">
                    ⏹ Dừng lại
                  </button>
                </>
              )}
            </div>
          </>
        )}
      </div>
    </div>
  );
};

// ============== 📚 KHO NGỮ LIỆU — CORPUS MANAGER ==============
const KhoNguLieuTab = ({ data, setData, selectedClass, onBack }) => {
  const [filterGenre, setFilterGenre] = useState('all');
  const [filterGrade, setFilterGrade] = useState(selectedClass || 'all');
  const [filterStatus, setFilterStatus] = useState('all'); // all | approved | pending
  const [search, setSearch] = useState('');
  const [showModal, setShowModal] = useState(false);
  const [editingItem, setEditingItem] = useState(null);
  const [showPasteModal, setShowPasteModal] = useState(false);
  const [importResult, setImportResult] = useState(null); // { added, skipped, errors }
  const [showAutoUpdate, setShowAutoUpdate] = useState(false);

  const handleImportJSON = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const raw = JSON.parse(ev.target.result);
        const items = Array.isArray(raw) ? raw : raw.passages || raw.data || [];
        if (!items.length) { alert('❌ File JSON không có ngữ liệu nào!'); return; }
        const existing = new Set([...PASSAGES_BANK.map(p => p.id), ...(data.passages || []).map(p => p.id)]);
        let added = 0, skipped = 0, errors = 0;
        const newPassages = [...(data.passages || [])];
        items.forEach((item, idx) => {
          try {
            if (!item.id || !item.title) { errors++; return; }
            if (existing.has(item.id)) { skipped++; return; }
            const passage = {
              id: item.id,
              title: item.title || '',
              author: item.author || '',
              source: item.source || '',
              class: Number(item.class) || 6,
              genre: item.genre || 'van_hoc',
              subgenre: item.subgenre || '',
              theme: item.theme || '',
              difficulty: item.difficulty || 'medium',
              copyright_status: item.copyright_status || 'unknown',
              approved: item.approved !== undefined ? item.approved : false,
              wordCount: item.wordCount || (item.fullText || '').split(/\s+/).filter(Boolean).length,
              excerpt: item.excerpt || (item.fullText || '').slice(0, 200),
              fullText: item.fullText || item.excerpt || '',
              addedAt: item.addedAt || new Date().toISOString(),
            };
            newPassages.push(passage);
            existing.add(item.id);
            added++;
          } catch { errors++; }
        });
        setData({ ...data, passages: newPassages });
        setImportResult({ added, skipped, errors });
      } catch (err) {
        alert('❌ Lỗi đọc file JSON: ' + err.message);
      }
    };
    reader.readAsText(file, 'utf-8');
    e.target.value = ''; // reset input
  };

  // Kết hợp ngữ liệu tĩnh và ngữ liệu cô thêm vào
  const userPassages = data.passages || [];
  const allPassages = [...PASSAGES_BANK.map(p => ({ ...p, _static: true })), ...userPassages];

  const filtered = allPassages.filter(p => {
    if (filterGenre !== 'all' && p.genre !== filterGenre) return false;
    if (filterGrade !== 'all' && p.class !== Number(filterGrade)) return false;
    if (filterStatus === 'approved' && !p.approved) return false;
    if (filterStatus === 'pending' && p.approved) return false;
    if (search && !p.title.toLowerCase().includes(search.toLowerCase()) && !(p.author || '').toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });

  const genreColors = { van_hoc: 'teal', thong_tin: 'blue', nghi_luan: 'amber', hanh_chinh: 'rose' };
  const genreBadge = (genre) => {
    const g = LOAI_VAN_BAN.find(l => l.id === genre);
    const c = genreColors[genre] || 'slate';
    return <span className={`text-xs px-2 py-0.5 rounded-full bg-${c}-100 text-${c}-700 font-medium`}>{g?.icon} {g?.ten || genre}</span>;
  };

  const handleDelete = (id) => {
    if (!confirm('Xóa ngữ liệu này?')) return;
    setData({ ...data, passages: userPassages.filter(p => p.id !== id) });
  };
  const handleApprove = (id, val) => {
    setData({ ...data, passages: userPassages.map(p => p.id === id ? { ...p, approved: val } : p) });
  };
  const handleSavePassage = (passage) => {
    const list = userPassages;
    const exists = list.find(p => p.id === passage.id);
    setData({ ...data, passages: exists ? list.map(p => p.id === passage.id ? passage : p) : [...list, passage] });
    setShowModal(false);
    setEditingItem(null);
  };

  const stats = {
    total: allPassages.length,
    van_hoc: allPassages.filter(p => p.genre === 'van_hoc').length,
    thong_tin: allPassages.filter(p => p.genre === 'thong_tin').length,
    nghi_luan: allPassages.filter(p => p.genre === 'nghi_luan').length,
    hanh_chinh: allPassages.filter(p => p.genre === 'hanh_chinh').length,
    pending: userPassages.filter(p => !p.approved).length,
  };

  return (
    <div className="space-y-5 fade-in">
      {onBack && <BackBtn onClick={onBack} label="← Đề kiểm tra" />}
      {/* Header */}
      <div className="flex items-center justify-between">
        <div>
          <h3 className="text-2xl font-bold text-slate-800">📚 Kho Ngữ Liệu</h3>
          <p className="text-slate-500 text-sm mt-0.5">Quản lý văn bản dùng làm ngữ liệu đề kiểm tra — theo GDPT 2018</p>
        </div>
        <div className="flex gap-2 flex-wrap">
          <button onClick={() => setShowAutoUpdate(true)} className="px-4 py-2 bg-teal-700 text-white rounded-lg flex items-center gap-2 text-sm font-medium hover:bg-teal-800">
            <Icon name="RefreshCw" size={16} /> Cập nhật tự động
          </button>
          <label className="px-4 py-2 bg-amber-600 text-white rounded-lg flex items-center gap-2 text-sm font-medium hover:bg-amber-700 cursor-pointer">
            <Icon name="Upload" size={16} /> Nhập từ JSON
            <input type="file" accept=".json" className="hidden" onChange={handleImportJSON} />
          </label>
          <button onClick={() => { setShowPasteModal(true); }} className="px-4 py-2 bg-teal-600 text-white rounded-lg flex items-center gap-2 text-sm font-medium hover:bg-teal-700">
            <Icon name="ClipboardPaste" size={16} /> Dán văn bản
          </button>
          <button onClick={() => { setEditingItem(null); setShowModal(true); }} className="px-4 py-2 bg-rose-600 text-white rounded-lg flex items-center gap-2 text-sm font-medium hover:bg-rose-700">
            <Icon name="Plus" size={16} /> Thêm ngữ liệu
          </button>
        </div>
      </div>

      {/* Import result banner */}
      {importResult && (
        <div className="bg-green-50 border border-green-200 rounded-xl p-4 flex items-start gap-3">
          <Icon name="CheckCircle" size={20} className="text-green-600 mt-0.5 shrink-0" />
          <div className="flex-1 text-sm">
            <p className="font-semibold text-green-800">📥 Nhập JSON thành công!</p>
            <p className="text-green-700 mt-0.5">
              ✅ Đã thêm <strong>{importResult.added}</strong> ngữ liệu mới &nbsp;·&nbsp;
              ⏩ Bỏ qua <strong>{importResult.skipped}</strong> trùng lặp &nbsp;·&nbsp;
              {importResult.errors > 0 && <span>❌ Lỗi <strong>{importResult.errors}</strong> dòng &nbsp;·&nbsp;</span>}
              Vui lòng kiểm tra và duyệt các mục mới trong tab <em>⏳ Chờ duyệt</em>.
            </p>
          </div>
          <button onClick={() => setImportResult(null)} className="text-green-400 hover:text-green-600 text-lg leading-none">×</button>
        </div>
      )}

      {/* Stat cards */}
      <div className="grid grid-cols-3 md:grid-cols-6 gap-3">
        {[
          { label: 'Tổng cộng', val: stats.total, color: 'slate' },
          { label: '📖 Văn học', val: stats.van_hoc, color: 'teal' },
          { label: '📰 Thông tin', val: stats.thong_tin, color: 'blue' },
          { label: '💬 Nghị luận', val: stats.nghi_luan, color: 'amber' },
          { label: '📋 Hành chính', val: stats.hanh_chinh, color: 'rose' },
          { label: '⏳ Chờ duyệt', val: stats.pending, color: 'orange' },
        ].map(s => (
          <div key={s.label} className={`bg-white border rounded-xl p-3 text-center`}>
            <div className={`text-2xl font-bold text-${s.color}-600`}>{s.val}</div>
            <div className="text-xs text-slate-500 mt-0.5">{s.label}</div>
          </div>
        ))}
      </div>

      {/* Filters */}
      <div className="bg-white border rounded-xl p-4 flex flex-wrap gap-3 items-center">
        <input value={search} onChange={e => setSearch(e.target.value)} placeholder="🔍 Tìm tiêu đề, tác giả..." className="flex-1 min-w-48 px-3 py-2 border rounded-lg text-sm" />
        <select value={filterGenre} onChange={e => setFilterGenre(e.target.value)} className="px-3 py-2 border rounded-lg bg-white text-sm">
          <option value="all">Tất cả thể loại</option>
          {LOAI_VAN_BAN.map(l => <option key={l.id} value={l.id}>{l.icon} {l.ten}</option>)}
        </select>
        <select value={filterGrade} onChange={e => setFilterGrade(e.target.value)} className="px-3 py-2 border rounded-lg bg-white text-sm">
          <option value="all">Tất cả lớp</option>
          {[6,7,8,9].map(g => <option key={g} value={g}>Lớp {g}</option>)}
        </select>
        <select value={filterStatus} onChange={e => setFilterStatus(e.target.value)} className="px-3 py-2 border rounded-lg bg-white text-sm">
          <option value="all">Tất cả trạng thái</option>
          <option value="approved">✅ Đã duyệt</option>
          <option value="pending">⏳ Chờ duyệt</option>
        </select>
        <span className="text-sm text-slate-500">{filtered.length} kết quả</span>
      </div>

      {/* List */}
      {filtered.length === 0 ? (
        <div className="bg-white rounded-xl p-12 border border-dashed text-center">
          <Icon name="BookOpen" size={48} className="mx-auto text-slate-300 mb-3" />
          <p className="text-slate-500">Không tìm thấy ngữ liệu phù hợp</p>
        </div>
      ) : (
        <div className="space-y-3">
          {filtered.map(p => (
            <div key={p.id} className={`bg-white rounded-xl border p-4 flex gap-4 ${!p.approved && !p._static ? 'border-orange-200 bg-orange-50/30' : ''}`}>
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-2 flex-wrap mb-1">
                  {genreBadge(p.genre)}
                  <span className="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded">Lớp {p.class}</span>
                  {p.difficulty && <span className="text-xs bg-purple-50 text-purple-700 px-2 py-0.5 rounded">{{'de':'Dễ','vua':'Vừa','kho':'Khó','ratKho':'Rất khó'}[p.difficulty] || p.difficulty}</span>}
                  {p.wordCount && <span className="text-xs text-slate-400">~{p.wordCount} chữ</span>}
                  {!p.approved && !p._static && <span className="text-xs bg-orange-100 text-orange-600 px-2 py-0.5 rounded">⏳ Chờ duyệt</span>}
                  {p._static && <span className="text-xs bg-green-50 text-green-600 px-2 py-0.5 rounded">✅ Kho mặc định</span>}
                </div>
                <h4 className="font-semibold text-slate-800 text-sm">{p.title}</h4>
                <p className="text-xs text-slate-500">{p.author}{p.source ? ` — ${p.source}` : ''}</p>
                <p className="text-xs text-slate-400 mt-1 line-clamp-2">{p.excerpt || (p.fullText || '').substring(0, 100) + '...'}</p>
                <div className="flex items-center gap-2 mt-1">
                  <span className="text-xs text-slate-400">{p.copyright_status === 'public_domain' ? '🟢 Public domain' : p.copyright_status === 'nha_nuoc' ? '🟢 Văn bản Nhà nước' : p.copyright_status === 'education_use' ? '🟡 Dùng cho GD' : '⚪ Chưa xác định'}</span>
                  {p.theme && <span className="text-xs text-slate-400">· {THEMES[p.theme] || p.theme}</span>}
                </div>
              </div>
              <div className="flex flex-col gap-1 flex-shrink-0">
                {!p._static && (
                  <>
                    {!p.approved ? (
                      <button onClick={() => handleApprove(p.id, true)} className="text-xs px-3 py-1.5 bg-teal-600 text-white rounded-lg hover:bg-teal-700">✅ Duyệt</button>
                    ) : (
                      <button onClick={() => handleApprove(p.id, false)} className="text-xs px-3 py-1.5 bg-slate-100 text-slate-600 rounded-lg hover:bg-slate-200">↩ Bỏ duyệt</button>
                    )}
                    <button onClick={() => { setEditingItem(p); setShowModal(true); }} className="text-xs px-3 py-1.5 bg-slate-100 rounded-lg hover:bg-slate-200">✏️ Sửa</button>
                    <button onClick={() => handleDelete(p.id)} className="text-xs px-3 py-1.5 bg-red-50 text-red-600 rounded-lg hover:bg-red-100">🗑</button>
                  </>
                )}
                {p._static && (
                  <button onClick={() => {
                    const clone = { ...p, id: 'USR_' + Date.now(), _static: false, approved: true, addedAt: new Date().toISOString() };
                    delete clone._static;
                    handleSavePassage(clone);
                    alert('✅ Đã sao chép vào kho của bạn để chỉnh sửa!');
                  }} className="text-xs px-3 py-1.5 bg-teal-50 text-teal-700 rounded-lg hover:bg-teal-100">📋 Sao chép</button>
                )}
              </div>
            </div>
          ))}
        </div>
      )}

      {/* Modal thêm/sửa */}
      {showModal && (
        <PassageModal
          item={editingItem}
          onSave={handleSavePassage}
          onClose={() => { setShowModal(false); setEditingItem(null); }}
        />
      )}

      {/* Modal dán văn bản nhanh */}
      {showPasteModal && (
        <PastePassageModal
          onSave={(p) => { handleSavePassage(p); setShowPasteModal(false); }}
          onClose={() => setShowPasteModal(false)}
        />
      )}

      {/* Modal cập nhật tự động */}
      {showAutoUpdate && (
        <AutoUpdateModal
          data={data}
          setData={setData}

// ============== 🤖 RA ĐỀ TỰ ĐỘNG (AUTO-GENERATE EXAM) ==============
const AutoGenExamView = ({ data, setData, selectedClass, teacherName, schoolName, onBack }) => {
  const [selectedGrade, setSelectedGrade] = useState(selectedClass || 6);
  const [selectedGenre, setSelectedGenre] = useState('van_hoc');
  const [selectedTheme, setSelectedTheme] = useState('');
  const [selectedExamType, setSelectedExamType] = useState('45p');
  const [generating, setGenerating] = useState(false);
  const [generatedExam, setGeneratedExam] = useState(null);
  const [preview, setPreview] = useState(false);

  // Kết hợp kho tĩnh + kho người dùng
  const allPassages = [...PASSAGES_BANK, ...(data.passages || []).filter(p => p.approved)];
  const filteredByGradeGenre = allPassages.filter(p => p.class === selectedGrade && p.genre === selectedGenre);
  const themesForSelection = [...new Set(filteredByGradeGenre.map(p => p.theme).filter(Boolean))];
  const passagesForSelection = selectedTheme
    ? filteredByGradeGenre.filter(p => p.theme === selectedTheme)
    : filteredByGradeGenre;

  const generateExam = async () => {
    if (passagesForSelection.length === 0) {
      alert('Không có ngữ liệu phù hợp. Hãy thêm ngữ liệu vào Kho Ngữ Liệu trước!');
      return;
    }
    setGenerating(true);
    try {
      const passage = passagesForSelection[Math.floor(Math.random() * passagesForSelection.length)];
      const examConfig = LOAI_DE.find(l => l.id === selectedExamType) || LOAI_DE[0];
      const themeName = THEMES[passage.theme] || passage.theme || 'Chủ đề tổng hợp';
      const genreInfo = LOAI_VAN_BAN.find(l => l.id === selectedGenre);
      const loaiDe = examConfig.ten;
      const totalScore = examConfig.totalScore;

      // Prompt chuẩn GDPT 2018 — 2 phần: Đọc hiểu 3đ + Viết 7đ
      const prompt = `Bạn là giáo viên Ngữ Văn THCS chuyên nghiệp. Hãy tạo đề kiểm tra "${loaiDe}" môn Ngữ văn lớp ${selectedGrade} theo chuẩn GDPT 2018.

NGỮ LIỆU (${genreInfo?.ten || 'Văn bản'} — NGOÀI SÁCH GIÁO KHOA):
Tiêu đề: ${passage.title}
Tác giả: ${passage.author || 'Không rõ'}
Nội dung:
"${(passage.fullText || passage.content || '').substring(0, 600)}"

YÊU CẦU CẤU TRÚC ĐỀ (${totalScore} điểm — 2 PHẦN):

PHẦN I. ĐỌC HIỂU (3.0 điểm) — 5 câu, câu hỏi gắn với ngữ liệu trên:
  - Câu 1 (0.5đ) [Nhận biết — Trắc nghiệm]: Xác định thể loại/phương thức biểu đạt/ngôi kể
  - Câu 2 (0.5đ) [Nhận biết — Trắc nghiệm]: Chi tiết, hình ảnh, từ ngữ đặc sắc trong văn bản
  - Câu 3 (0.5đ) [Thông hiểu — Trắc nghiệm]: Ý nghĩa nội dung / biện pháp tu từ / cấu trúc câu
  - Câu 4 (0.5đ) [Thông hiểu — Trắc nghiệm]: Phân tích ý nghĩa chi tiết / giải thích ngôn ngữ
  - Câu 5 (1.0đ) [Vận dụng — Tự luận ngắn]: Rút ra bài học / liên hệ bản thân / nhận xét

PHẦN II. VIẾT (7.0 điểm) — 1 bài viết hoàn chỉnh:
  - Câu 6 (${selectedExamType === '15p' ? '3.0đ' : '7.0đ'}) [Vận dụng cao]: Viết ${selectedExamType === '15p' ? 'đoạn văn nghị luận (150-200 chữ)' : 'bài văn nghị luận (400-600 chữ)'} về chủ đề gợi ra từ văn bản hoặc phân tích tác phẩm văn học liên quan

ĐỊNH DẠNG TRẢ LỜI — Liệt kê đầy đủ câu hỏi + đáp án gợi ý:
PHẦN I: ĐỌC HIỂU
Câu 1 (0.5đ) [Nhận biết — TN]:
→ Câu hỏi: ...
→ A. ... B. ... C. ... D. ...
→ Đáp án: ...
─────
Câu 2 (0.5đ) [Nhận biết — TN]:
→ Câu hỏi: ...
→ Đáp án: ...
─────
Câu 3 (0.5đ) [Thông hiểu — TN]:
→ Câu hỏi: ...
→ Đáp án: ...
─────
Câu 4 (0.5đ) [Thông hiểu — TN]:
→ Câu hỏi: ...
→ Đáp án: ...
─────
Câu 5 (1.0đ) [Vận dụng — TL]:
→ Câu hỏi: ...
→ Gợi ý đáp án: ...
─────
PHẦN II: VIẾT
Câu 6 (${selectedExamType === '15p' ? '3.0' : '7.0'}đ) [Vận dụng cao]:
→ Đề bài: ...
→ Gợi ý dàn ý: Mở bài... Thân bài... Kết bài...`;

      const result = await callGroqAPI(prompt, 1200);
      if (result.error) { alert(result.error); setGenerating(false); return; }

      const exam = {
        id: Date.now(),
        title: `Đề ${loaiDe} Ngữ văn ${selectedGrade} — ${themeName}`,
        grade: selectedGrade,
        theme: passage.theme || selectedTheme,
        examType: selectedExamType,
        duration: examConfig.duration,
        totalScore,
        passageTitle: passage.title,
        passageContent: passage.fullText || passage.content,
        passageAuthor: passage.author || '',
        passageGenre: selectedGenre,
        questions: [],
        answerKey: result.text || 'Tự tạo',
        aiGenerated: true,
        generatedWith: 'groq',
        createdAt: new Date().toISOString()
      };

      setGeneratedExam(exam);
      setPreview(true);
    } catch (e) {
      alert(`Lỗi tạo đề: ${e.message}`);
    } finally {
      setGenerating(false);
    }
  };

  const saveExam = () => {
    if (!generatedExam) return;
    const list = data.exams || [];
    setData({ ...data, exams: [...list, generatedExam] });
    alert('✅ Lưu đề thành công!');
    setGeneratedExam(null);
    setPreview(false);
  };

  return (
    <div className="space-y-6 fade-in">
      {onBack && <BackBtn onClick={onBack} label="← Đề kiểm tra" />}
      <div className="bg-gradient-to-r from-rose-50 via-amber-50 to-teal-50 border border-rose-200 rounded-xl p-5">
        <h3 className="text-lg font-bold text-rose-800 mb-2 flex items-center gap-2"><Icon name="Sparkles" size={20} /> 🤖 Ra Đề Tự Động — GDPT 2018</h3>
        <p className="text-sm text-rose-700">AI sẽ sinh đề kiểm tra theo <strong>chuẩn GDPT 2018 — 2 phần</strong> (PHẦN I: Đọc hiểu 3đ · PHẦN II: Viết 7đ) từ ngữ liệu NGOÀI sách giáo khoa.</p>
      </div>

      <div className="bg-white rounded-xl border p-6 space-y-4">
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div>
            <label className="block text-sm font-bold mb-2">Lớp *</label>
            <select value={selectedGrade} onChange={e => { setSelectedGrade(Number(e.target.value)); setSelectedTheme(''); }} className="w-full px-3 py-2.5 border rounded-lg bg-white">
              {[6,7,8,9].map(g => <option key={g} value={g}>Lớp {g}</option>)}
            </select>
          </div>
          <div>
            <label className="block text-sm font-bold mb-2">Loại văn bản</label>
            <select value={selectedGenre} onChange={e => { setSelectedGenre(e.target.value); setSelectedTheme(''); }} className="w-full px-3 py-2.5 border rounded-lg bg-white">
              {LOAI_VAN_BAN.map(l => <option key={l.id} value={l.id}>{l.icon} {l.ten}</option>)}
            </select>
          </div>
          <div>
            <label className="block text-sm font-bold mb-2">Chủ đề</label>
            <select value={selectedTheme} onChange={e => setSelectedTheme(e.target.value)} className="w-full px-3 py-2.5 border rounded-lg bg-white">
              <option value="">-- Tất cả ({passagesForSelection.length} ngữ liệu)</option>
              {themesForSelection.map(t => <option key={t} value={t}>{THEMES[t] || t}</option>)}
            </select>
          </div>
          <div>
            <label className="block text-sm font-bold mb-2">Loại đề *</label>
            <select value={selectedExamType} onChange={e => setSelectedExamType(e.target.value)} className="w-full px-3 py-2.5 border rounded-lg bg-white">
              {LOAI_DE.map(l => <option key={l.id} value={l.id}>{l.ten}</option>)}
            </select>
          </div>
        </div>

        {passagesForSelection.length === 0 && (
          <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 text-sm text-amber-800">
            ⚠️ Chưa có ngữ liệu cho lớp {selectedGrade} — loại <em>{LOAI_VAN_BAN.find(l => l.id === selectedGenre)?.ten}</em>. Hãy thêm vào tab <strong>📚 Kho Ngữ Liệu</strong>.
          </div>
        )}

        <button onClick={generateExam} disabled={passagesForSelection.length === 0 || generating}
          className="w-full bg-gradient-to-r from-rose-600 via-pink-500 to-amber-500 text-white px-6 py-3.5 rounded-xl font-bold flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed hover:shadow-lg text-base">
          <Icon name={generating ? 'Loader' : 'Sparkles'} size={20} />
          {generating ? '⏳ Đang tạo đề...' : '🤖 Tạo Đề Tự Động'}

const GradingStats = ({ items }) => {
  if (items.length === 0) return <div className="bg-white p-8 rounded-xl border text-center text-slate-500">Chưa có dữ liệu thống kê</div>;
  const xepLoaiCount = { 'Giỏi': 0, 'Khá': 0, 'Trung bình': 0, 'Yếu': 0 };
  items.forEach(i => { if (i.result?.xepLoai) xepLoaiCount[i.result.xepLoai]++; });
  const total = items.length;
  const avgScore = items.reduce((s, i) => s + (i.result?.tongDiem || 0), 0) / total;
  return (
    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div className="bg-white rounded-xl p-6 border">
        <h3 className="font-bold mb-4">📊 Phân bố xếp loại</h3>
        {Object.entries(xepLoaiCount).map(([xl, count]) => {
          const pct = total > 0 ? (count / total * 100).toFixed(0) : 0;
          const color = xl === 'Giỏi' ? 'bg-emerald-500' : xl === 'Khá' ? 'bg-blue-500' : xl === 'Trung bình' ? 'bg-amber-500' : 'bg-red-500';
          return (
            <div key={xl} className="mb-3">
              <div className="flex justify-between text-sm mb-1"><span className="font-medium">{xl}</span><span>{count} HS ({pct}%)</span></div>
              <div className="progress-bar"><div className={`progress-fill ${color}`} style={{width: pct + '%'}}></div></div>
            </div>
          );
        })}
      </div>
      <div className="bg-white rounded-xl p-6 border">
        <h3 className="font-bold mb-4">🎯 Thống kê tổng quan</h3>
        <div className="space-y-3">
          <div className="flex justify-between"><span className="text-slate-600">Tổng bài đã chấm:</span><span className="font-bold">{total}</span></div>
          <div className="flex justify-between"><span className="text-slate-600">Điểm trung bình:</span><span className="font-bold text-rose-700">{avgScore.toFixed(2)}</span></div>
          <div className="flex justify-between"><span className="text-slate-600">HS giỏi:</span><span className="font-bold text-emerald-600">{xepLoaiCount['Giỏi']}</span></div>
          <div className="flex justify-between"><span className="text-slate-600">HS yếu cần hỗ trợ:</span><span className="font-bold text-red-600">{xepLoaiCount['Yếu']}</span></div>

};

// ============== ⭐ PHASE 3.1: SỔ THEO DÕI HỌC SINH (PORTFOLIO) ==============
const StudentPortfolio = ({ items, selectedClass, teacherName, schoolName }) => {
  const [filterGrade, setFilterGrade] = useState(0);
  const [selectedStudent, setSelectedStudent] = useState('');

  const filtered = items.filter(i => filterGrade === 0 || i.grade === filterGrade);
  const studentMap = {};
  filtered.forEach(i => {
    const key = (i.studentName || 'Chưa đặt tên').trim();
    if (!studentMap[key]) studentMap[key] = [];
    studentMap[key].push(i);
  });
  const students = Object.keys(studentMap).sort((a, b) => a.localeCompare(b, 'vi'));

  const selected = selectedStudent ? studentMap[selectedStudent] : null;

  const computeTrend = (arr) => {
    if (!arr || arr.length < 2) return { trend: 'neutral', diff: 0 };
    const sorted = [...arr].sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
    const first = sorted[0].result?.tongDiem || 0;
    const last = sorted[sorted.length - 1].result?.tongDiem || 0;
    const diff = last - first;
    return { trend: diff > 0.5 ? 'up' : diff < -0.5 ? 'down' : 'neutral', diff };
  };

  if (items.length === 0) return <div className="bg-white p-8 rounded-xl border text-center text-slate-500">Chưa có dữ liệu. Hãy chấm bài để xem sổ theo dõi.</div>;

  return (
    <div className="space-y-4">
      <div className="bg-white rounded-xl p-4 border flex gap-3 flex-wrap items-center">
        <label className="text-sm font-medium">Lọc lớp:</label>
        <select value={filterGrade} onChange={e => { setFilterGrade(Number(e.target.value)); setSelectedStudent(''); }} className="px-3 py-2 border rounded-lg bg-white text-sm">
          <option value={0}>Tất cả</option>
          {[6,7,8,9].map(c => <option key={c} value={c}>Lớp {c}</option>)}
        </select>
        <div className="text-sm text-slate-600">Tổng: <strong>{students.length}</strong> học sinh | <strong>{filtered.length}</strong> bài chấm</div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        {/* DS học sinh */}
        <div className="bg-white rounded-xl border p-4 lg:col-span-1">
          <h3 className="font-bold mb-3 flex items-center gap-2"><Icon name="Users" size={18} /> Danh sách học sinh</h3>
          <div className="max-h-[500px] overflow-y-auto scrollbar space-y-1">
            {students.map(s => {
              const arr = studentMap[s];
              const avg = arr.reduce((sum, i) => sum + (i.result?.tongDiem || 0), 0) / arr.length;
              const { trend } = computeTrend(arr);
              const trendIcon = trend === 'up' ? '📈' : trend === 'down' ? '📉' : '➖';
              return (
                <button key={s} onClick={() => setSelectedStudent(s)} className={`w-full text-left px-3 py-2 rounded-lg text-sm flex justify-between items-center ${selectedStudent === s ? 'bg-rose-50 border-rose-300 border' : 'hover:bg-slate-50'}`}>
                  <span className="truncate"><strong>{s}</strong> <span className="text-xs text-slate-500">({arr.length})</span></span>
                  <span className={`text-xs font-bold ${avg >= 8 ? 'text-emerald-600' : avg >= 6.5 ? 'text-blue-600' : avg >= 5 ? 'text-amber-600' : 'text-red-600'}`}>{trendIcon} {avg.toFixed(1)}</span>
                </button>
              );
            })}
          </div>
        </div>

        {/* Chi tiết HS */}
        <div className="lg:col-span-2">
          {!selected ? (
            <div className="bg-white rounded-xl border p-8 text-center text-slate-500 h-full flex items-center justify-center">
              <div><Icon name="UserCheck" size={48} className="mx-auto mb-3 text-slate-300" /><p>Chọn học sinh để xem chi tiết</p></div>
            </div>
          ) : (
            <StudentDetail arr={selected} name={selectedStudent} teacherName={teacherName} schoolName={schoolName} />
          )}
        </div>
      </div>
    </div>
  );
};

const StudentDetail = ({ arr, name, teacherName, schoolName }) => {
  const sorted = [...arr].sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
  const scores = sorted.map(i => i.result?.tongDiem || 0);
  const avg = scores.reduce((s, n) => s + n, 0) / scores.length;
  const max = Math.max(...scores);
  const min = Math.min(...scores);
  const xepLoaiMap = { 'Giỏi': 0, 'Khá': 0, 'Trung bình': 0, 'Yếu': 0 };
  sorted.forEach(i => { if (i.result?.xepLoai) xepLoaiMap[i.result.xepLoai]++; });

  // Thu thập điểm mạnh/yếu
  const diemYeu = {};
  sorted.forEach(i => {
    (i.result?.ketQua || []).forEach(k => {
      if (k.diemCham < k.diemMax * 0.7) {
        diemYeu[k.ten] = (diemYeu[k.ten] || 0) + 1;
      }
    });
  });
  const topYeu = Object.entries(diemYeu).sort((a, b) => b[1] - a[1]).slice(0, 3);

  // Vẽ biểu đồ sparkline đơn giản
  const chartW = 500, chartH = 140, pad = 30;
  const maxY = 10, minY = 0;
  const getX = (i) => pad + (i / Math.max(scores.length - 1, 1)) * (chartW - 2 * pad);
  const getY = (v) => chartH - pad - ((v - minY) / (maxY - minY)) * (chartH - 2 * pad);
  const pathD = scores.map((s, i) => (i === 0 ? 'M' : 'L') + getX(i) + ',' + getY(s)).join(' ');

  return (
    <div className="bg-white rounded-xl border p-5" id={`portfolio-${name.replace(/\s+/g, '_')}`}>
      <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
        <div>
          <h3 className="text-xl font-bold text-slate-800">{name}</h3>
          <p className="text-sm text-slate-600">{sorted.length} bài làm • Lớp {sorted[0].grade}</p>
        </div>
        <div className="flex gap-2">
          <button onClick={() => exportToPDF(`portfolio-${name.replace(/\s+/g, '_')}`, `SoTheoDoi_${name.replace(/\s+/g, '_')}`)} className="px-3 py-1.5 bg-red-500 text-white rounded text-sm flex items-center gap-1"><Icon name="FileText" size={14} /> PDF</button>
          <button onClick={() => exportToWord(`portfolio-${name.replace(/\s+/g, '_')}`, `SoTheoDoi_${name.replace(/\s+/g, '_')}`)} className="px-3 py-1.5 bg-blue-600 text-white rounded text-sm flex items-center gap-1"><Icon name="FileDown" size={14} /> Word</button>
        </div>
      </div>

      <div className="grid grid-cols-4 gap-2 mb-4">
        <div className="bg-rose-50 p-3 rounded text-center"><div className="text-xs text-slate-500">TB</div><div className="font-bold text-rose-700">{avg.toFixed(2)}</div></div>
        <div className="bg-emerald-50 p-3 rounded text-center"><div className="text-xs text-slate-500">Cao nhất</div><div className="font-bold text-emerald-600">{max.toFixed(1)}</div></div>
        <div className="bg-red-50 p-3 rounded text-center"><div className="text-xs text-slate-500">Thấp nhất</div><div className="font-bold text-red-600">{min.toFixed(1)}</div></div>
        <div className="bg-blue-50 p-3 rounded text-center"><div className="text-xs text-slate-500">Số bài</div><div className="font-bold text-blue-600">{sorted.length}</div></div>
      </div>

      {/* Biểu đồ tiến bộ */}
      <div className="mb-4">
        <h4 className="font-semibold text-sm mb-2">📈 Biểu đồ tiến bộ</h4>
        <div className="border rounded p-2 bg-slate-50 overflow-x-auto">
          <svg width={chartW} height={chartH} style={{maxWidth:'100%'}}>
            {[0, 2.5, 5, 7.5, 10].map((v, i) => (
              <g key={i}>
                <line x1={pad} y1={getY(v)} x2={chartW - pad} y2={getY(v)} stroke="#e2e8f0" strokeDasharray="3,3" />
                <text x={5} y={getY(v) + 4} fontSize="10" fill="#64748b">{v}</text>
              </g>
            ))}
            <path d={pathD} fill="none" stroke="#7c3aed" strokeWidth="2" />
            {scores.map((s, i) => (
              <g key={i}>
                <circle cx={getX(i)} cy={getY(s)} r="4" fill="#7c3aed" />
                <text x={getX(i)} y={getY(s) - 8} fontSize="10" fill="#334155" textAnchor="middle">{s.toFixed(1)}</text>
              </g>
            ))}
          </svg>
        </div>
      </div>

      <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div className="border rounded p-3">
          <h4 className="font-semibold text-sm mb-2">📊 Phân bố xếp loại</h4>
          {Object.entries(xepLoaiMap).map(([xl, c]) => (
            <div key={xl} className="flex justify-between text-sm py-1"><span>{xl}</span><span className="font-bold">{c}</span></div>
          ))}
        </div>
        <div className="border rounded p-3">
          <h4 className="font-semibold text-sm mb-2">⚠️ Điểm cần cải thiện</h4>
          {topYeu.length === 0 ? <p className="text-sm text-emerald-600">✅ Không có điểm yếu đáng chú ý</p> :
            topYeu.map(([ten, c]) => <div key={ten} className="text-sm py-1 flex justify-between"><span>{ten}</span><span className="text-red-600 font-bold">{c} lần</span></div>)
          }
        </div>
      </div>

      <div>
        <h4 className="font-semibold text-sm mb-2">📜 Lịch sử bài làm</h4>
        <table className="matrix-table w-full text-xs">
          <thead><tr><th>Ngày</th><th>Loại</th><th>Đề</th><th>Điểm</th><th>Xếp loại</th></tr></thead>
          <tbody>
            {sorted.map(i => (
              <tr key={i.id}>
                <td>{new Date(i.createdAt).toLocaleDateString('vi-VN')}</td>
                <td>{LOAI_BAI_CHAM.find(l => l.id === i.loaiBai)?.ten || '-'}</td>
                <td className="text-left">{(i.topic || i.title).substring(0, 40)}{(i.topic || i.title).length > 40 ? '...' : ''}</td>
                <td className="font-bold">{i.result?.tongDiem?.toFixed(2) || '-'}</td>
                <td>{i.result?.xepLoai || '-'}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
};

// ============== ⭐ PHASE 3.1: BÁO CÁO TỔNG HỢP LỚP ==============
const ClassReport = ({ items, selectedClass, teacherName, schoolName }) => {
  const [reportGrade, setReportGrade] = useState(selectedClass);
  const [reportPeriod, setReportPeriod] = useState('all');

  const now = new Date();
  const filtered = items.filter(i => {
    if (i.grade !== reportGrade) return false;
    if (reportPeriod === 'all') return true;
    const d = new Date(i.createdAt);
    const diffDays = (now - d) / (1000 * 60 * 60 * 24);
    if (reportPeriod === '7d') return diffDays <= 7;
    if (reportPeriod === '30d') return diffDays <= 30;
    if (reportPeriod === '90d') return diffDays <= 90;
    return true;
  });

  if (filtered.length === 0) return (
    <div className="space-y-4">
      <div className="bg-white rounded-xl p-4 border flex gap-3 flex-wrap items-center">
        <label className="text-sm font-medium">Lớp:</label>
        <select value={reportGrade} onChange={e => setReportGrade(Number(e.target.value))} className="px-3 py-2 border rounded-lg bg-white text-sm">
          {[6,7,8,9].map(c => <option key={c} value={c}>Lớp {c}</option>)}
        </select>
        <label className="text-sm font-medium ml-3">Thời gian:</label>
        <select value={reportPeriod} onChange={e => setReportPeriod(e.target.value)} className="px-3 py-2 border rounded-lg bg-white text-sm">
          <option value="all">Tất cả</option>
          <option value="7d">7 ngày qua</option>
          <option value="30d">30 ngày qua</option>
          <option value="90d">90 ngày qua</option>
        </select>
      </div>
      <div className="bg-white p-8 rounded-xl border text-center text-slate-500">Chưa có dữ liệu cho lớp {reportGrade} trong kỳ đã chọn.</div>
    </div>
  );

  // Tổng hợp
  const total = filtered.length;
  const xepLoaiCount = { 'Giỏi': 0, 'Khá': 0, 'Trung bình': 0, 'Yếu': 0 };
  filtered.forEach(i => { if (i.result?.xepLoai) xepLoaiCount[i.result.xepLoai]++; });
  const avgScore = filtered.reduce((s, i) => s + (i.result?.tongDiem || 0), 0) / total;
  const highScore = Math.max(...filtered.map(i => i.result?.tongDiem || 0));
  const lowScore = Math.min(...filtered.map(i => i.result?.tongDiem || 0));

  // Phân tích theo loại bài
  const byType = {};
  filtered.forEach(i => {
    const t = i.loaiBai;
    if (!byType[t]) byType[t] = [];
    byType[t].push(i.result?.tongDiem || 0);
  });

  // Top 5 HS
  const studentScores = {};
  filtered.forEach(i => {
    const k = (i.studentName || 'Không tên').trim();
    if (!studentScores[k]) studentScores[k] = [];
    studentScores[k].push(i.result?.tongDiem || 0);
  });
  const studentAvg = Object.entries(studentScores).map(([n, arr]) => ({ name: n, avg: arr.reduce((s,x)=>s+x,0)/arr.length, count: arr.length }));
  const top5 = [...studentAvg].sort((a,b)=>b.avg-a.avg).slice(0,5);
  const bot5 = [...studentAvg].sort((a,b)=>a.avg-b.avg).slice(0,5);

  // Điểm yếu chung
  const commonWeakness = {};
  filtered.forEach(i => {
    (i.result?.ketQua || []).forEach(k => {
      if (k.diemCham < k.diemMax * 0.7) {
        commonWeakness[k.ten] = (commonWeakness[k.ten] || 0) + 1;
      }
    });
  });
  const topWeak = Object.entries(commonWeakness).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const periodText = reportPeriod === 'all' ? 'toàn bộ kỳ' : reportPeriod === '7d' ? '7 ngày qua' : reportPeriod === '30d' ? '30 ngày qua' : '90 ngày qua';

  return (
    <div className="space-y-4">
      <div className="bg-white rounded-xl p-4 border flex gap-3 flex-wrap items-center">
        <label className="text-sm font-medium">Lớp:</label>
        <select value={reportGrade} onChange={e => setReportGrade(Number(e.target.value))} className="px-3 py-2 border rounded-lg bg-white text-sm">
          {[6,7,8,9].map(c => <option key={c} value={c}>Lớp {c}</option>)}
        </select>
        <label className="text-sm font-medium ml-3">Thời gian:</label>
        <select value={reportPeriod} onChange={e => setReportPeriod(e.target.value)} className="px-3 py-2 border rounded-lg bg-white text-sm">
          <option value="all">Tất cả</option>
          <option value="7d">7 ngày qua</option>
          <option value="30d">30 ngày qua</option>
          <option value="90d">90 ngày qua</option>
        </select>
        <div className="flex-1"></div>
        <button onClick={() => exportToPDF('class-report', `BaoCaoLop${reportGrade}`)} className="px-3 py-2 bg-red-500 text-white rounded text-sm flex items-center gap-1"><Icon name="FileText" size={14} /> PDF</button>
        <button onClick={() => exportToWord('class-report', `BaoCaoLop${reportGrade}`)} className="px-3 py-2 bg-blue-600 text-white rounded text-sm flex items-center gap-1"><Icon name="FileDown" size={14} /> Word</button>
      </div>

      <div id="class-report" className="bg-white rounded-xl p-6 border">
        <div className="text-center mb-4">
          <p className="font-bold text-sm">{schoolName || 'TRƯỜNG THCS ...'}</p>
          <p className="text-xs">Tổ Ngữ văn</p>
          <h2 className="text-2xl font-bold mt-2">BÁO CÁO TỔNG HỢP KẾT QUẢ CHẤM BÀI</h2>
          <p className="text-sm italic">Lớp {reportGrade} • {periodText} • Ngày lập: {now.toLocaleDateString('vi-VN')}</p>
        </div>

        <section className="mb-4">
          <h3 className="font-bold text-base border-b pb-1 mb-2">I. THÔNG TIN CHUNG</h3>
          <div className="grid grid-cols-2 gap-2 text-sm">
            <p><strong>Giáo viên:</strong> {teacherName || '—'}</p>
            <p><strong>Lớp:</strong> {reportGrade}</p>
            <p><strong>Kỳ báo cáo:</strong> {periodText}</p>
            <p><strong>Số bài chấm:</strong> {total}</p>
            <p><strong>Số học sinh:</strong> {studentAvg.length}</p>
            <p><strong>Điểm TB lớp:</strong> <span className="font-bold text-rose-700">{avgScore.toFixed(2)}</span></p>
          </div>
        </section>

        <section className="mb-4">
          <h3 className="font-bold text-base border-b pb-1 mb-2">II. PHÂN BỐ XẾP LOẠI</h3>
          <table className="matrix-table w-full text-sm">
            <thead><tr><th>Xếp loại</th><th>Số lượng</th><th>Tỉ lệ (%)</th></tr></thead>
            <tbody>
              {Object.entries(xepLoaiCount).map(([xl, c]) => (
                <tr key={xl}><td>{xl}</td><td>{c}</td><td>{(c / total * 100).toFixed(1)}%</td></tr>
              ))}
              <tr className="font-bold bg-slate-100"><td>Tổng</td><td>{total}</td><td>100%</td></tr>
            </tbody>
          </table>
        </section>

        <section className="mb-4">
          <h3 className="font-bold text-base border-b pb-1 mb-2">III. PHÂN TÍCH THEO LOẠI BÀI</h3>
          <table className="matrix-table w-full text-sm">
            <thead><tr><th>Loại bài</th><th>Số bài</th><th>Điểm TB</th><th>Cao nhất</th><th>Thấp nhất</th></tr></thead>
            <tbody>
              {Object.entries(byType).map(([t, arr]) => {
                const a = arr.reduce((s,x)=>s+x,0) / arr.length;
                return <tr key={t}><td className="text-left">{LOAI_BAI_CHAM.find(l => l.id === t)?.ten || t}</td><td>{arr.length}</td><td className="font-bold">{a.toFixed(2)}</td><td>{Math.max(...arr).toFixed(1)}</td><td>{Math.min(...arr).toFixed(1)}</td></tr>;
              })}
            </tbody>
          </table>
        </section>

        <section className="mb-4">
          <h3 className="font-bold text-base border-b pb-1 mb-2">IV. HỌC SINH TIÊU BIỂU</h3>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div>
              <h4 className="font-semibold text-sm mb-1 text-emerald-700">🏆 Top 5 điểm cao</h4>
              <table className="matrix-table w-full text-sm">
                <thead><tr><th>STT</th><th>Họ tên</th><th>Điểm TB</th><th>Số bài</th></tr></thead>
                <tbody>{top5.map((s, i) => <tr key={i}><td>{i+1}</td><td className="text-left">{s.name}</td><td className="font-bold text-emerald-600">{s.avg.toFixed(2)}</td><td>{s.count}</td></tr>)}</tbody>
              </table>
            </div>
            <div>
              <h4 className="font-semibold text-sm mb-1 text-red-700">⚠️ Cần hỗ trợ</h4>
              <table className="matrix-table w-full text-sm">
                <thead><tr><th>STT</th><th>Họ tên</th><th>Điểm TB</th><th>Số bài</th></tr></thead>
                <tbody>{bot5.map((s, i) => <tr key={i}><td>{i+1}</td><td className="text-left">{s.name}</td><td className="font-bold text-red-600">{s.avg.toFixed(2)}</td><td>{s.count}</td></tr>)}</tbody>
              </table>
            </div>
          </div>
        </section>

        <section className="mb-4">
          <h3 className="font-bold text-base border-b pb-1 mb-2">V. ĐIỂM YẾU CHUNG CỦA LỚP</h3>
          {topWeak.length === 0 ? <p className="text-sm text-emerald-600">✅ Không có điểm yếu chung đáng chú ý</p> : (
            <table className="matrix-table w-full text-sm">
              <thead><tr><th>Tiêu chí</th><th>Số lần</th><th>Tỉ lệ</th></tr></thead>
              <tbody>
                {topWeak.map(([ten, c]) => <tr key={ten}><td className="text-left">{ten}</td><td>{c}</td><td>{(c/total*100).toFixed(1)}%</td></tr>)}
              </tbody>
            </table>
          )}
        </section>

        <section className="mb-4">
          <h3 className="font-bold text-base border-b pb-1 mb-2">VI. NHẬN XÉT &amp; ĐỀ XUẤT</h3>
          <div className="text-sm space-y-2">
            <p><strong>Đánh giá chung:</strong> Điểm trung bình lớp đạt <strong>{avgScore.toFixed(2)}</strong> ({avgScore >= 8 ? 'loại Giỏi' : avgScore >= 6.5 ? 'loại Khá' : avgScore >= 5 ? 'loại Trung bình' : 'dưới Trung bình'}). Điểm cao nhất: {highScore.toFixed(1)}, thấp nhất: {lowScore.toFixed(1)}.</p>
            <p><strong>Đề xuất:</strong></p>
            <ul className="list-disc ml-6">
              {topWeak.slice(0, 3).map(([ten]) => <li key={ten}>Tăng cường luyện tập về: <em>{ten}</em></li>)}
              {xepLoaiCount['Yếu'] > 0 && <li>Tổ chức phụ đạo cho {xepLoaiCount['Yếu']} học sinh xếp loại Yếu.</li>}
              {xepLoaiCount['Giỏi'] > 0 && <li>Bồi dưỡng nâng cao cho {xepLoaiCount['Giỏi']} học sinh Giỏi để tham gia thi HSG.</li>}
              <li>Tiếp tục rèn kỹ năng viết, đọc hiểu và phân tích văn bản.</li>
            </ul>
          </div>
        </section>

        <div className="mt-8 flex justify-between text-sm">
          <div><p className="italic">Xác nhận của Tổ trưởng</p></div>
          <div className="text-center">
            <p className="italic">Ngày {now.getDate()} tháng {now.getMonth()+1} năm {now.getFullYear()}</p>
            <p className="italic">Giáo viên bộ môn</p>
            <p className="mt-12 font-bold">{teacherName || '...'}</p>
          </div>
        </div>
      </div>
    </div>
  );
};

// ============== GRADING MODAL - Core chấm bài ==============
const GradingModal = ({ item, data, setData, selectedClass, selectedBook, teacherName, schoolName, onClose }) => {
  const isEdit = !!item;
  const [form, setForm] = useState(item || {
    id: Date.now(),
    title: 'Bài làm của học sinh',
    studentName: '',
    grade: selectedClass,
    loaiBai: 'baivan',
    theme: '',
    topic: '',
    baiLam: '',
    result: null,
    teacherComment: '',
    createdAt: new Date().toISOString(),
  });
  const [isOCRProcessing, setIsOCRProcessing] = useState(false);
  const [ocrProgress, setOcrProgress] = useState(0);
  const [showPreview, setShowPreview] = useState(false);
  const fileInputRef = useRef(null);

  const handleSave = () => {
    if (!form.baiLam.trim()) { alert('Vui lòng nhập/tải bài làm'); return; }
    if (!form.result) { alert('Vui lòng bấm "Chấm bài tự động" trước khi lưu'); return; }
    const list = data.gradings || [];
    setData({ ...data, gradings: isEdit ? list.map(i => i.id === form.id ? form : i) : [...list, form] });
    onClose();
  };

  // OCR với EasyOCR Server
  const handleImageUpload = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setIsOCRProcessing(true);
    setOcrProgress(0);
    try {
      const reader = new FileReader();
      reader.onload = async (evt) => {
        setOcrProgress(30);
        const base64Data = evt.target.result.split(',')[1];
        const result = await recognizeWithEasyOCR(base64Data);
        setOcrProgress(100);
        if (result.error) {
          alert(`❌ ${result.error}`);
        } else {
          const confidence = result.confidence ? ` (độ tin cậy: ${(result.confidence * 100).toFixed(1)}%)` : '';
          setForm(prev => ({ ...prev, baiLam: (prev.baiLam ? prev.baiLam + '\n\n' : '') + result.text.trim() }));
          alert(`✅ OCR xong!${confidence}\nVăn bản được thêm vào bài làm. Hãy kiểm tra và chỉnh sửa nếu cần.`);
        }
      };
      reader.readAsDataURL(file);
    } catch (err) {
      alert(`❌ Lỗi upload ảnh: ${err.message}`);
    } finally {
      setIsOCRProcessing(false);
      setOcrProgress(0);
      if (fileInputRef.current) fileInputRef.current.value = '';
    }
  };

  // Chấm bài AI
  const handleAIGrade = () => {

  return (s || '').toString().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd')
    .replace(/[^a-z0-9]+/g, '');
};

      // Nếu chưa có dữ liệu → tự động load mẫu
      if (!data.shared || data.shared.length === 0) {
        localStorage.setItem('_library', JSON.stringify(SAMPLE_DATA));
        return SAMPLE_DATA;
      }
      return data;
    } catch { return SAMPLE_DATA; }
  };
  const saveLibraryData = (data) => localStorage.setItem('_library', JSON.stringify(data));

  const lib = getLibraryData();
  const classData = lib[currentClass] || [];
  const filtered = classData.filter(f => f.name.toLowerCase().includes(search.toLowerCase()));

  const handleFileUpload = (e) => {
    const files = Array.from(e.target.files || []);
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = (evt) => {
        const newFile = {
          id: Date.now() + Math.random(),
          name: file.name,
          size: Math.round(file.size / 1024) + ' KB',
          type: file.type,
          uploadedAt: new Date().toLocaleString('vi-VN'),
          content: evt.target.result.substring(0, 5000)
        };
        const updated = { ...lib, [currentClass]: [...(lib[currentClass] || []), newFile] };
        saveLibraryData(updated);
        alert('✅ Tải tệp thành công: ' + file.name);
      };
      reader.readAsText(file, 'utf-8');
    });
    e.target.value = '';
  };

  const deleteFile = (fileId) => {
    if (confirm('Xóa tệp này?')) {
      const updated = { ...lib, [currentClass]: classData.filter(f => f.id !== fileId) };
      saveLibraryData(updated);
    }
  };

  const downloadFile = (file) => {
    try {
      const blob = new Blob([file.content], { type: 'text/plain;charset=utf-8' });
      const url = window.URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = file.name.replace(/[^a-z0-9]/gi, '_').toLowerCase() + '.txt';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      window.URL.revokeObjectURL(url);
      alert('✅ Tải tệp thành công: ' + file.name);
    } catch (err) {
      alert('❌ Lỗi tải tệp: ' + err.message);
    }
  };

  return (
    <div className="space-y-4 fade-in">
      {setActive && <Breadcrumb onHome={() => setActive('dashboard')} items={[{ label: 'Thư viện tài liệu', icon: 'BookOpen' }]} />}
      <div><h2 className="text-3xl font-bold text-slate-800 mb-1 font-display">📚 Thư Viện Tài Liệu</h2><p className="text-slate-600">Quản lý tài liệu SGK, bài giảng, truyện, bài báo...</p></div>

      <div className="grid grid-cols-5 gap-2">
        {CLASSES.map(c => (
          <button key={c} onClick={() => setCurrentClass(c)} className={`px-3 py-2 rounded-lg font-medium transition ${currentClass === c ? 'bg-teal-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}>
            {CLASS_LABELS[c]}
          </button>
        ))}
      </div>

      <div className="bg-white p-4 rounded-xl border space-y-3">
        <div className="flex gap-2">
          <input type="text" placeholder="🔍 Tìm kiếm tài liệu..." value={search} onChange={(e) => setSearch(e.target.value)} className="flex-1 px-3 py-2 border rounded-lg text-sm" />
          <label className="px-4 py-2 bg-teal-600 text-white rounded-lg hover:bg-teal-700 cursor-pointer font-medium text-sm">
            📤 Tải lên
            <input type="file" multiple accept=".pdf,.docx,.txt,.doc" onChange={handleFileUpload} className="hidden" />
          </label>
        </div>

        {filtered.length === 0 ? (
          <div className="text-center py-8 text-slate-500">
            <p>📭 {search ? 'Không tìm thấy tài liệu' : 'Chưa có tài liệu'}</p>
            <p className="text-xs mt-1">Nhấn "📤 Tải lên" để thêm tài liệu (PDF, Word, TXT)</p>
          </div>
        ) : (
          <div className="space-y-2">
            {filtered.map(f => (
              <div key={f.id} className="flex items-center justify-between bg-slate-50 p-3 rounded-lg border hover:bg-slate-100 cursor-pointer transition">
                <div className="flex-1" onClick={() => setSelectedFile(f)}>
                  <p className="font-medium text-slate-800 hover:text-teal-700 cursor-pointer">📄 {f.name}</p>
                  <p className="text-xs text-slate-500">{f.size} • {f.uploadedAt}</p>
                </div>
                <button onClick={() => deleteFile(f.id)} className="px-3 py-1 text-red-600 hover:bg-red-50 rounded-lg text-sm font-medium">
                  🗑️ Xóa
                </button>
              </div>
            ))}
          </div>
        )}

        {selectedFile && (
          <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4 modal-overlay">
            <div className="bg-white rounded-xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
              <div className="sticky top-0 bg-gradient-to-r from-teal-600 to-teal-700 text-white p-4 flex justify-between items-center">
                <h3 className="text-lg font-bold">{selectedFile.name}</h3>
                <button onClick={() => setSelectedFile(null)} className="text-white hover:bg-white/20 rounded-lg p-2">
                  ✕
                </button>
              </div>

              <div className="p-6 space-y-4">

                  <span>📦 {selectedFile.size}</span>

                </div>

                <div className="bg-slate-50 p-4 rounded-lg border border-slate-200 max-h-[50vh] overflow-y-auto font-mono text-sm whitespace-pre-wrap text-slate-700">
                  {selectedFile.content || '(Không có nội dung để hiển thị)'}
                </div>

                <div className="flex gap-2 justify-end">
                  <button onClick={() => downloadFile(selectedFile)} className="px-4 py-2 bg-teal-600 text-white rounded-lg hover:bg-teal-700 font-medium flex items-center gap-2">
                    📥 Tải về
                  </button>
                  <button onClick={() => setSelectedFile(null)} className="px-4 py-2 bg-slate-200 text-slate-800 rounded-lg hover:bg-slate-300 font-medium">
                    Đóng
                  </button>
                </div>
              </div>
            </div>
          </div>
        )}

        <div className="bg-teal-50 border-l-4 border-teal-600 p-3 rounded text-sm text-teal-900">
          <p className="font-medium">💡 Mẹo sử dụng:</p>
          <ul className="text-xs mt-1 space-y-1">
            <li>✓ Tải lên SGK, bài giảng, truyện, bài báo</li>

  );
};

const ZaloSettingsView = ({ data, setData }) => {
  const [zaloPhone, setZaloPhone] = useState('');
  const [selectedGroups, setSelectedGroups] = useState([]);
  const [apiKey, setApiKey] = useState('');
  const [newGroupName, setNewGroupName] = useState('');
  const [saveMessage, setSaveMessage] = useState('');

  // Load Zalo settings on mount
  useEffect(() => {
    const zaloConfig = data.zaloConfig || {};
    setZaloPhone(zaloConfig.phone || '');
    setSelectedGroups(zaloConfig.groups || []);
    setApiKey(zaloConfig.apiKey || '');
  }, [data]);

  const handleSaveSettings = () => {
    const newData = {
      ...data,
      zaloConfig: {
        phone: zaloPhone,
        groups: selectedGroups,
        apiKey: apiKey,
        updatedAt: new Date().toLocaleString('vi-VN')
      }
    };
    setData(newData);
    setSaveMessage('✅ Đã lưu cài đặt Zalo!');
    setTimeout(() => setSaveMessage(''), 2000);
  };

  const handleAddGroup = () => {
    if (newGroupName.trim() && !selectedGroups.includes(newGroupName.trim())) {
      const updated = [...selectedGroups, newGroupName.trim()];
      setSelectedGroups(updated);
      setNewGroupName('');
      // Auto-save
      const newData = {
        ...data,
        zaloConfig: {
          phone: zaloPhone,
          groups: updated,
          apiKey: apiKey,
          updatedAt: new Date().toLocaleString('vi-VN')
        }
      };
      setData(newData);
      setSaveMessage('✅ Đã thêm nhóm mới!');
      setTimeout(() => setSaveMessage(''), 2000);
    }
  };

  const handleRemoveGroup = (groupToRemove) => {
    const updated = selectedGroups.filter(g => g !== groupToRemove);
    setSelectedGroups(updated);
    const newData = {
      ...data,
      zaloConfig: {
        phone: zaloPhone,
        groups: updated,
        apiKey: apiKey,
        updatedAt: new Date().toLocaleString('vi-VN')
      }
    };
    setData(newData);
    setSaveMessage('✅ Đã xóa nhóm!');
    setTimeout(() => setSaveMessage(''), 2000);
  };

  return (
    <div className="space-y-6">
      {saveMessage && (
        <div className="bg-emerald-50 border border-emerald-300 rounded-xl p-4">
          <p className="text-sm text-emerald-800 font-medium">{saveMessage}</p>
        </div>
      )}

      <div className="bg-white rounded-xl p-6 border">
        <h3 className="text-xl font-bold mb-4 flex items-center gap-2"><Icon name="Settings" size={20} /> ⚙️ Cài Đặt Zalo</h3>

        <div className="space-y-4">
          <div>
            <label className="block text-sm font-medium mb-2">📱 Số điện thoại Zalo (tài khoản cô)</label>
            <input
              value={zaloPhone}
              onChange={e => setZaloPhone(e.target.value)}
              placeholder="Ví dụ: 0912345678"
              className="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500"
            />
            <p className="text-xs text-slate-500 mt-1">Giúp app nhận diện tin nhắn của cô và gửi thông báo cho học sinh</p>
          </div>

          <div>
            <label className="block text-sm font-medium mb-3">👥 Quản Lý Nhóm Zalo Lớp Học</label>

            <div className="space-y-3 mb-4">
              <div className="flex gap-2">
                <input
                  value={newGroupName}
                  onChange={e => setNewGroupName(e.target.value)}
                  onKeyPress={e => e.key === 'Enter' && handleAddGroup()}
                  placeholder="Tên nhóm mới (VD: Ngữ Văn 7A1)"
                  className="flex-1 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm"
                />
                <button
                  onClick={handleAddGroup}
                  className="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-lg font-medium text-sm flex items-center gap-1 flex-shrink-0"
                >
                  <Icon name="Plus" size={16} /> Thêm
                </button>
              </div>

              <div className="bg-slate-50 border rounded-lg p-4 min-h-24">
                <p className="text-sm text-slate-600 mb-3 font-medium">Các nhóm đã thêm ({selectedGroups.length}):</p>
                {selectedGroups.length === 0 ? (
                  <p className="text-xs text-slate-500 italic">Chưa có nhóm nào. Hãy thêm nhóm Zalo lớp học của cô.</p>
                ) : (
                  <div className="space-y-2">
                    {selectedGroups.map(g => (
                      <div key={g} className="flex items-center justify-between bg-white p-3 rounded-lg border border-teal-200">
                        <span className="text-sm font-medium text-slate-800">📌 {g}</span>
                        <button
                          onClick={() => handleRemoveGroup(g)}
                          className="text-red-600 hover:text-red-800 text-xs font-medium px-2 py-1 hover:bg-red-50 rounded"
                        >
                          Xóa
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          </div>

          <div>
            <label className="block text-sm font-medium mb-2">🔑 API Key Zalo (tùy chọn)</label>
            <input
              type="password"
              value={apiKey}
              onChange={e => setApiKey(e.target.value)}
              placeholder="Để trống nếu chưa có"
              className="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500"
            />
            <p className="text-xs text-slate-500 mt-1">Hiện tại: App dùng copy-paste. API là tính năng nâng cao cho Phase 5+.</p>
          </div>

          <button
            onClick={handleSaveSettings}
            className="w-full btn-primary px-4 py-3 rounded-lg font-medium flex items-center justify-center gap-2"
          >
            <Icon name="Save" size={18} /> Lưu Tất Cả Cài Đặt
          </button>

          {data.zaloConfig?.updatedAt && (
            <p className="text-xs text-slate-500 text-center">Cập nhật lần cuối: {data.zaloConfig.updatedAt}</p>
          )}
        </div>
      </div>

      <div className="bg-blue-50 border border-blue-200 rounded-xl p-4">
        <p className="text-sm font-medium text-blue-900 mb-2">💡 Hướng dẫn sử dụng</p>
        <ul className="text-sm text-blue-800 space-y-2 ml-4 list-disc">
          <li>📱 <strong>Số điện thoại:</strong> Lưu số Zalo của cô để app nhận diện tin nhắn</li>
          <li>👥 <strong>Nhóm lớp:</strong> Thêm tất cả nhóm Zalo của các lớp để quản lý một chỗ</li>
          <li>📤 <strong>Hiện tại:</strong> Copy-paste tin nhắn từ Zalo vào các mục "Nhận bài", "Đôn đốc", v.v.</li>
          <li>🚀 <strong>Phase 5+:</strong> Sẽ kết nối API để tự động gửi/nhận tin mà không cần copy-paste</li>
        </ul>
      </div>
    </div>
  );
};

    if (!studentName.trim() || !submissionText.trim()) {
      alert('Vui lòng điền tên học sinh và nội dung bài!');
      return;
    }

    const newSubmission = {
      id: Date.now().toString(),
      studentName: studentName.trim(),
      assignmentTitle: assignmentTitle || 'Bài nộp từ Zalo',

      timestamp: new Date().toLocaleString('vi-VN'),

      ...data,
      zaloSubmissions: [newSubmission, ...zaloSubmissions]

    setSubmissionText('');

  const defaultReminder = selectedAssign

const ZaloHistoryView = ({ data }) => {
  const zaloSubmissions = data.zaloSubmissions || [];
  const assignments = data.assignments || [];

  // Create timeline of events
  const timeline = [
    ...assignments.map(a => ({
      type: 'assignment',
      title: `📧 Giao bài: ${a.title}`,
      timestamp: a.createdAt || 'Không rõ',
      detail: `Gửi đến: ${a.maxScore > 0 ? a.maxScore + ' điểm' : 'Bài tập mới'}`,
      color: 'teal'
    })),
    ...zaloSubmissions.map(s => ({
      type: 'submission',
      title: `📥 HS nộp bài: ${s.studentName}`,
      timestamp: s.timestamp,
      detail: `${s.assignmentTitle}`,
      color: 'green'
    }))
  ].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

  const getColorClass = (color) => {
    const colors = {
      teal: 'border-teal-500 bg-teal-50',
      green: 'border-green-500 bg-green-50',
      rose: 'border-rose-500 bg-rose-50'
    };
    return colors[color] || 'border-slate-300 bg-slate-50';
  };

  const getTextColorClass = (color) => {
    const colors = {
      teal: 'text-teal-900',
      green: 'text-green-900',
      rose: 'text-rose-900'
    };
    return colors[color] || 'text-slate-700';
  };

  return (
    <div className="space-y-4">
      <div className="bg-white rounded-xl p-6 border">
        <h3 className="text-xl font-bold mb-4 flex items-center gap-2"><Icon name="MessageSquare" size={20} /> 💬 Lịch Sử Tương Tác Zalo</h3>

        {timeline.length === 0 ? (
          <div className="text-center py-8 text-slate-500">
            <Icon name="History" size={40} className="mx-auto mb-2 text-slate-300" />
            <p>Chưa có lịch sử tương tác. Khi cô giao bài tập hoặc học sinh nộp bài, chúng sẽ hiển thị ở đây.</p>
          </div>
        ) : (
          <div className="space-y-3 max-h-[600px] overflow-y-auto">
            {timeline.map((event, idx) => (
              <div key={idx} className={`p-4 rounded-lg border-l-4 ${getColorClass(event.color)}`}>
                <div className="flex justify-between items-start mb-2">
                  <span className={`font-bold text-sm ${getTextColorClass(event.color)}`}>{event.title}</span>
                  <span className="text-xs text-slate-500">{event.timestamp}</span>
                </div>
                <p className="text-xs text-slate-600">{event.detail}</p>
              </div>
            ))}
          </div>
        )}
      </div>

      <div className="grid grid-cols-3 gap-4">
        <div className="bg-teal-50 border border-teal-200 rounded-lg p-4 text-center">
          <div className="text-2xl font-bold text-teal-600">{assignments.length}</div>
          <p className="text-xs text-teal-800 mt-1">Bài tập giao</p>
        </div>
        <div className="bg-green-50 border border-green-200 rounded-lg p-4 text-center">
          <div className="text-2xl font-bold text-green-600">{zaloSubmissions.length}</div>
          <p className="text-xs text-green-800 mt-1">Bài nộp nhận</p>
        </div>
        <div className="bg-rose-50 border border-rose-200 rounded-lg p-4 text-center">
          <div className="text-2xl font-bold text-rose-600">0</div>
          <p className="text-xs text-rose-800 mt-1">Phản hồi gửi</p>
        </div>
      </div>

      <div className="bg-blue-50 border border-blue-200 rounded-xl p-4">
        <p className="text-sm font-medium text-blue-900 mb-2">📊 Quy trình Zalo 5 bước:</p>
        <ol className="text-xs text-blue-800 space-y-1 ml-4 list-decimal">
          <li>✏️ Cô soạn bài tập trong app</li>
          <li>📤 Copy tin nhắn → dán vào nhóm Zalo để giao</li>
          <li>📥 HS nộp bài → Cô dán vào app ở "Nhận Bài"</li>
          <li>🤖 App OCR + chấm tự động, cho điểm</li>
          <li>💬 Copy phản hồi → dán vào Zalo trả bài cho em</li>
        </ol>
      </div>

};
