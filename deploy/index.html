const ClassListView = ({ data, setData, classes, activeClassId, setActiveClassId, teacherName }) => {
  const [showModal, setShowModal] = useState(false);
  const [editing, setEditing] = useState(null);
  const active = classes.find(c => c.id === activeClassId);

  const handleDelete = (id) => {
    if (!confirm('Xóa lớp này? (bài tập và bài nộp của lớp cũng sẽ bị xóa)')) return;
    const assignments = (data.assignments || []).filter(a => a.classId !== id);
    const assignmentIds = (data.assignments || []).filter(a => a.classId === id).map(a => a.id);
    const submissions = (data.submissions || []).filter(s => !assignmentIds.includes(s.assignmentId));
    setData({ ...data, classes: classes.filter(c => c.id !== id), assignments, submissions });
    if (activeClassId === id) setActiveClassId(null);
  };

  return (
    <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <div className="lg:col-span-1 space-y-3">
        <button onClick={() => { setEditing(null); setShowModal(true); }} className="w-full bg-teal-700 hover:bg-teal-800 text-white px-4 py-3 rounded-xl flex items-center justify-center gap-2 font-medium">
          <Icon name="Plus" size={18} /> Tạo lớp mới
        </button>
        {classes.length === 0 ? (
          <div className="bg-white rounded-xl p-8 border border-dashed border-slate-300 text-center text-slate-500"><Icon name="Users" size={40} className="mx-auto mb-2 text-slate-400"/>Chưa có lớp nào</div>
        ) : classes.map(c => (
          <div key={c.id} onClick={() => setActiveClassId(c.id)} className={`bg-white rounded-xl p-4 border cursor-pointer transition-all ${activeClassId===c.id?'border-teal-500 shadow-md':'border-slate-200 hover:border-teal-300'}`}>
            <div className="flex items-start justify-between">
              <div className="flex-1">
                <h3 className="font-bold text-slate-800">{c.name}</h3>
                <p className="text-xs text-slate-500">Lớp {c.grade} • {c.students?.length || 0} học sinh</p>
              </div>
              <div className="flex gap-1">
                <button onClick={e => { e.stopPropagation(); setEditing(c); setShowModal(true); }} className="p-1.5 hover:bg-slate-100 rounded"><Icon name="Edit" size={14}/></button>
                <button onClick={e => { e.stopPropagation(); handleDelete(c.id); }} className="p-1.5 hover:bg-red-100 text-red-600 rounded"><Icon name="Trash2" size={14}/></button>
              </div>
            </div>
            {c.zaloGroupName && <div className="mt-2 text-xs text-blue-600"><Icon name="MessageCircle" size={12} className="inline"/> {c.zaloGroupName}</div>}
          </div>
        ))}
      </div>

      <div className="lg:col-span-2">
        {active ? <ClassDetail cls={active} data={data} setData={setData}/> : (
          <div className="bg-white rounded-xl p-12 border text-center text-slate-500 h-full flex items-center justify-center">
            <div><Icon name="UserCheck" size={48} className="mx-auto mb-3 text-slate-300"/><p>Chọn lớp để xem danh sách học sinh</p></div>
          </div>
        )}
      </div>

      {showModal && <ClassModal item={editing} data={data} setData={setData} onClose={() => setShowModal(false)}/>}
    </div>
  );
};

const ClassModal = ({ item, data, setData, onClose }) => {
  const isEdit = !!item;
  const [form, setForm] = useState(item || { id: Date.now(), name: '', grade: 6, zaloGroupName: '', zaloGroupLink: '', students: [], createdAt: new Date().toISOString() });
  const [bulkText, setBulkText] = useState('');

  const addStudent = () => setForm({ ...form, students: [...(form.students || []), { id: Date.now()+Math.random(), name: '', parentName: '', parentPhone: '', zaloName: '', note: '' }] });
  const delStudent = (id) => setForm({ ...form, students: form.students.filter(s => s.id !== id) });
  const updStudent = (id, k, v) => setForm({ ...form, students: form.students.map(s => s.id === id ? { ...s, [k]: v } : s) });
  const importBulk = () => {
    const lines = bulkText.split('\n').map(l => l.trim()).filter(l => l);
    const newStudents = lines.map(l => {
      const parts = l.split(/[\t,;]/).map(p => p.trim());
      return { id: Date.now() + Math.random(), name: parts[0] || '', parentPhone: parts[1] || '', parentName: parts[2] || '', zaloName: parts[3] || '', note: '' };
    });
    setForm({ ...form, students: [...(form.students || []), ...newStudents] });
    setBulkText('');
  };
  const handleSave = () => {
    if (!form.name.trim()) { alert('Nhập tên lớp'); return; }
    const list = data.classes || [];
    setData({ ...data, classes: isEdit ? list.map(c => c.id === form.id ? form : c) : [...list, form] });
    onClose();
  };

  return (
    <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50 modal-overlay">
      <div className="bg-white rounded-xl w-full max-w-3xl max-h-[95vh] overflow-hidden flex flex-col modal-box">
        <div className="p-5 border-b flex items-center justify-between"><h3 className="text-xl font-bold">{isEdit?'Sửa lớp':'Tạo lớp mới'}</h3><button onClick={onClose} className="p-2 hover:bg-slate-100 rounded"><Icon name="X" size={20}/></button></div>
        <div className="flex-1 overflow-y-auto p-5 space-y-4">
          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div><label className="block text-sm font-medium mb-1">Tên lớp *</label><input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="VD: 8A1" className="w-full px-3 py-2 border rounded-lg"/></div>
            <div><label className="block text-sm font-medium mb-1">Khối</label><select value={form.grade} onChange={e=>setForm({...form,grade:Number(e.target.value)})} className="w-full px-3 py-2 border rounded-lg bg-white">{[6,7,8,9].map(c=><option key={c} value={c}>Lớp {c}</option>)}</select></div>
            <div><label className="block text-sm font-medium mb-1">Tên nhóm Zalo lớp</label><input value={form.zaloGroupName||''} onChange={e=>setForm({...form,zaloGroupName:e.target.value})} placeholder="VD: Ngữ Văn 8A1 - Cô Lan" className="w-full px-3 py-2 border rounded-lg"/></div>
            <div><label className="block text-sm font-medium mb-1">Link nhóm Zalo (tùy chọn)</label><input value={form.zaloGroupLink||''} onChange={e=>setForm({...form,zaloGroupLink:e.target.value})} placeholder="https://zalo.me/g/..." className="w-full px-3 py-2 border rounded-lg"/></div>
          </div>

          <div>
            <div className="flex items-center justify-between mb-2">
              <label className="font-semibold">Danh sách học sinh ({form.students?.length || 0})</label>
              <button onClick={addStudent} className="text-sm px-3 py-1.5 bg-teal-50 text-teal-700 rounded flex items-center gap-1"><Icon name="UserPlus" size={14}/> Thêm HS</button>
            </div>
            <div className="bg-amber-50 p-3 rounded-lg border border-amber-200 mb-2">
              <p className="text-xs font-semibold text-amber-900 mb-1">📝 Import nhanh (dán DS, mỗi HS 1 dòng, phân cách bằng tab/dấu phẩy):</p>
              <p className="text-[11px] text-amber-800 mb-2">Format: <code>Tên HS, SĐT phụ huynh, Tên phụ huynh, Tên Zalo</code></p>
              <textarea value={bulkText} onChange={e=>setBulkText(e.target.value)} rows={3} placeholder="Nguyễn Văn A, 0912345678, Nguyễn Văn B, Anh Bình&#10;Trần Thị C, 0987654321, Trần Thị D" className="w-full px-2 py-1 border border-amber-300 rounded text-xs"/>
              <button onClick={importBulk} disabled={!bulkText.trim()} className="mt-2 text-xs px-3 py-1 bg-amber-500 text-white rounded disabled:opacity-50">⬇️ Import vào danh sách</button>

const ClassDetail = ({ cls, data, setData }) => {
  const assignments = (data.assignments || []).filter(a => a.classId === cls.id);
  const submissions = data.submissions || [];
  const completionRate = assignments.length > 0 ? (assignments.reduce((acc, a) => {
    const total = cls.students?.length || 1;
    const submitted = submissions.filter(s => s.assignmentId === a.id && (s.status === 'submitted' || s.status === 'graded' || s.status === 'late')).length;
    return acc + submitted / total;
  }, 0) / assignments.length * 100).toFixed(0) : 0;

  return (
    <div className="bg-white rounded-xl border p-5">
      <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
        <div>
          <h3 className="text-xl font-bold">{cls.name}</h3>
          <p className="text-sm text-slate-600">Lớp {cls.grade} • {cls.students?.length || 0} HS</p>
        </div>
        {cls.zaloGroupLink && <a href={cls.zaloGroupLink} target="_blank" className="text-sm px-3 py-1.5 bg-blue-500 text-white rounded flex items-center gap-1"><Icon name="ExternalLink" size={14}/> Mở nhóm Zalo</a>}
      </div>

      <div className="grid grid-cols-3 gap-2 mb-4">
        <div className="bg-teal-50 p-3 rounded text-center"><div className="text-xs text-slate-500">HS</div><div className="font-bold text-teal-700">{cls.students?.length || 0}</div></div>
        <div className="bg-emerald-50 p-3 rounded text-center"><div className="text-xs text-slate-500">Bài tập</div><div className="font-bold text-emerald-600">{assignments.length}</div></div>
        <div className="bg-amber-50 p-3 rounded text-center"><div className="text-xs text-slate-500">Tỉ lệ nộp</div><div className="font-bold text-amber-600">{completionRate}%</div></div>
      </div>

      <h4 className="font-semibold text-sm mb-2">📋 Danh sách học sinh</h4>

        {(cls.students || []).length === 0 ? <p className="p-4 text-center text-slate-400 text-sm">Chưa có học sinh</p> : (
          <table className="matrix-table w-full text-xs">

// ============== ASSIGNMENT LIST ==============
const AssignmentListView = ({ data, setData, classes, assignments, submissions, teacherName, activeAssignmentId, setActiveAssignmentId }) => {
  const [showModal, setShowModal] = useState(false);
  const [editing, setEditing] = useState(null);
  const [filterClass, setFilterClass] = useState(0);

  const filtered = assignments.filter(a => filterClass === 0 || a.classId === filterClass).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

  const handleDelete = (id) => {
    if (!confirm('Xóa bài tập? Các bài nộp liên quan cũng sẽ bị xóa')) return;
    setData({ ...data, assignments: assignments.filter(a => a.id !== id), submissions: submissions.filter(s => s.assignmentId !== id) });
  };

  const getStats = (aid) => {
    const cls = classes.find(c => assignments.find(a => a.id === aid)?.classId === c.id);
    const totalSt = cls?.students?.length || 0;
    const subs = submissions.filter(s => s.assignmentId === aid);
    const submitted = subs.filter(s => s.status === 'submitted' || s.status === 'graded' || s.status === 'late').length;
    const graded = subs.filter(s => s.status === 'graded').length;
    return { totalSt, submitted, graded };
  };

  return (
    <div className="space-y-4">
      <div className="bg-white rounded-xl p-4 border flex gap-3 items-center flex-wrap">
        <label className="text-sm font-medium">Lớp:</label>
        <select value={filterClass} onChange={e=>setFilterClass(Number(e.target.value))} className="px-3 py-2 border rounded-lg bg-white text-sm">
          <option value={0}>Tất cả ({assignments.length})</option>
          {classes.map(c => <option key={c.id} value={c.id}>{c.name} ({assignments.filter(a=>a.classId===c.id).length})</option>)}
        </select>
        <div className="flex-1"></div>
        <button onClick={()=>{setEditing(null); setShowModal(true);}} disabled={classes.length === 0} className="bg-teal-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 font-medium disabled:opacity-50"><Icon name="Plus" size={18}/> Giao bài tập mới</button>
      </div>

      {classes.length === 0 && <div className="bg-amber-50 border border-amber-200 p-4 rounded-lg text-sm text-amber-800">⚠️ Hãy tạo ít nhất 1 lớp trước khi giao bài tập.</div>}

      {filtered.length === 0 ? (
        <div className="bg-white rounded-xl p-12 border border-dashed border-slate-300 text-center">
          <Icon name="ClipboardList" size={48} className="mx-auto text-slate-400 mb-3"/>
          <p className="text-slate-500 mb-4">Chưa có bài tập nào</p>
        </div>
      ) : (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          {filtered.map(a => {
            const cls = classes.find(c => c.id === a.classId);
            const { totalSt, submitted, graded } = getStats(a.id);
            const pct = totalSt > 0 ? Math.round(submitted / totalSt * 100) : 0;
            const isDue = a.deadline && new Date(a.deadline) < new Date();
            const loaiInfo = LOAI_BAITAP.find(l => l.id === a.type);
            return (
              <div key={a.id} className="bg-white rounded-xl p-5 border border-slate-200 card-hover">
                <div className="flex items-start justify-between mb-2">
                  <div className="flex-1">
                    <div className="flex items-center gap-2 mb-1 flex-wrap">
                      <span className="text-xs bg-teal-50 text-teal-700 px-2 py-0.5 rounded">{cls?.name || '?'}</span>
                      <span className="text-xs bg-slate-100 text-slate-700 px-2 py-0.5 rounded">{loaiInfo?.ten}</span>
                      {isDue && <span className="text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded">⏰ Quá hạn</span>}
                    </div>
                    <h3 className="font-bold text-slate-800">{a.title}</h3>
                    <p className="text-xs text-slate-500 mt-1">Hạn: {a.deadline ? new Date(a.deadline).toLocaleString('vi-VN', {dateStyle:'short',timeStyle:'short'}) : '(chưa đặt)'} • Max {a.maxScore || 10}đ</p>
                  </div>

                    <button onClick={()=>handleDelete(a.id)} className="p-1.5 hover:bg-red-100 text-red-600 rounded"><Icon name="Trash2" size={14}/></button>
                  </div>
                </div>

                <div className="mt-3">
                  <div className="flex justify-between text-xs text-slate-600 mb-1">
                    <span>Nộp: {submitted}/{totalSt} • Chấm: {graded}</span>
                    <span className="font-bold">{pct}%</span>
                  </div>
                  <div className="progress-bar"><div className="progress-fill" style={{width: pct + '%'}}></div></div>
                </div>

                <div className="flex gap-2 mt-3">
                  <button onClick={()=>setActiveAssignmentId(a.id)} className="flex-1 text-xs py-2 rounded bg-teal-50 text-teal-700 hover:bg-teal-50 flex items-center justify-center gap-1"><Icon name="Eye" size={12}/> Chi tiết</button>

  const [form, setForm] = useState(item || { id: Date.now(), classId: classes[0]?.id || 0, title: '', desc: '', type: 'lamvan', deadline: defaultDeadline, maxScore: 10, attachments: [], createdAt: new Date().toISOString(), reminders: { d1: false, h2: false } });
  const [showPreview, setShowPreview] = useState(false);

  const addAttachment = async (e) => {
    const files = Array.from(e.target.files || []);
    const atts = [...(form.attachments || [])];
    for (const f of files) {
      atts.push({ name: f.name, size: f.size, type: f.type });
    }
    setForm({ ...form, attachments: atts });
    e.target.value = '';
  };
  const removeAtt = (i) => setForm({ ...form, attachments: form.attachments.filter((_, idx) => idx !== i) });

const AssignmentDetailModal = ({ assignmentId, data, setData, classes, assignments, submissions, teacherName, onClose }) => {
  const a = assignments.find(x => x.id === assignmentId);
  if (!a) return null;
  const cls = classes.find(c => c.id === a.classId);
  const students = cls?.students || [];
  const subs = submissions.filter(s => s.assignmentId === a.id);
  const getSub = (studentId) => subs.find(s => s.studentId === studentId);

  const countByStatus = { pending: 0, submitted: 0, late: 0, graded: 0 };
  students.forEach(st => {
    const s = getSub(st.id);
    if (!s) countByStatus.pending++;
    else countByStatus[s.status]++;
  });

  return (
    <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50 modal-overlay">
      <div className="bg-white rounded-xl w-full max-w-4xl max-h-[95vh] overflow-hidden flex flex-col">
        <div className="p-5 border-b flex items-center justify-between">
          <div><h3 className="text-xl font-bold">{a.title}</h3><p className="text-sm text-slate-500">{cls?.name} • Hạn: {new Date(a.deadline).toLocaleString('vi-VN')}</p></div>
          <button onClick={onClose} className="p-2 hover:bg-slate-100 rounded"><Icon name="X" size={20}/></button>
        </div>
        <div className="flex-1 overflow-y-auto p-5">
          <div className="grid grid-cols-4 gap-2 mb-4">
            {Object.entries(STATUS_CONFIG).map(([k, v]) => (
              <div key={k} className={`p-3 rounded border ${v.color}`}><div className="text-xs">{v.ten}</div><div className="text-2xl font-bold">{countByStatus[k]}</div></div>
            ))}
          </div>

          <div className="mb-4">
            <h4 className="font-semibold mb-2">Tình trạng nộp của từng HS</h4>
            <div className="flex flex-wrap gap-1">
              {students.map(st => {
                const s = getSub(st.id);
                const status = s?.status || 'pending';
                const cfg = STATUS_CONFIG[status];
                return <span key={st.id} className={`student-chip ${status}`} title={s?.score ? `Điểm: ${s.score}` : ''}>{cfg.icon} {st.name}{s?.score ? ` (${s.score.toFixed(1)})` : ''}</span>;
              })}
            </div>
          </div>

          <div className="p-3 bg-slate-50 rounded border">
            <h4 className="font-semibold text-sm mb-1">📝 Nội dung yêu cầu:</h4>
            <p className="text-sm whitespace-pre-wrap">{a.desc || '(Chưa có mô tả)'}</p>
          </div>
        </div>
      </div>
    </div>
  );
};

// ============== TRACKING VIEW (Đôn đốc nộp bài) ==============
const TrackingView = ({ data, setData, classes, assignments, submissions, teacherName }) => {
  const [selectedAid, setSelectedAid] = useState('');
  const active = assignments.find(a => a.id == selectedAid);
  const cls = active ? classes.find(c => c.id === active.classId) : null;
  const [showReminder, setShowReminder] = useState(null);

  if (assignments.length === 0) return <div className="bg-white p-8 rounded-xl border text-center text-slate-500">Chưa có bài tập nào. Tạo bài tập ở tab "Bài tập" để bắt đầu theo dõi.</div>;

  const getStudentStatus = (student) => {
    if (!active) return null;
    const s = submissions.find(x => x.assignmentId === active.id && x.studentId === student.id);
    return s || { status: 'pending' };
  };

  const now = new Date();
  const deadline = active?.deadline ? new Date(active.deadline) : null;
  const hoursLeft = deadline ? (deadline - now) / (1000 * 60 * 60) : 0;

  return (
    <div className="space-y-4">
      <div className="bg-white rounded-xl p-4 border flex gap-3 items-center flex-wrap">
        <label className="text-sm font-medium">Chọn bài tập:</label>
        <select value={selectedAid} onChange={e=>setSelectedAid(e.target.value)} className="flex-1 min-w-[300px] px-3 py-2 border rounded-lg bg-white text-sm">
          <option value="">-- Chọn bài tập --</option>
          {assignments.map(a => {
            const c = classes.find(cc => cc.id === a.classId);
            return <option key={a.id} value={a.id}>{c?.name} • {a.title} • Hạn: {a.deadline ? new Date(a.deadline).toLocaleDateString('vi-VN') : '-'}</option>;
          })}
        </select>
      </div>

      {active && cls && (() => {
        const students = cls.students || [];
        const statuses = students.map(st => ({ student: st, sub: getStudentStatus(st) }));

const ReceiveSubmissionsView = ({ data, setData, classes, assignments, submissions }) => {
  const [selectedAid, setSelectedAid] = useState('');
  const [uploadQueue, setUploadQueue] = useState([]); // {file, dataURL, matchedStudentId, filename}

  const active = assignments.find(a => a.id == selectedAid);
  const cls = active ? classes.find(c => c.id === active.classId) : null;
  const students = cls?.students || [];

  const autoMatchStudent = (filename) => {
    const clean = slugifyVN(filename.replace(/\.[^.]+$/, ''));
    let best = null, bestScore = 0;
    students.forEach(st => {
      const stSlug = slugifyVN(st.name);
      if (clean.includes(stSlug) || stSlug.includes(clean.substring(0, Math.min(clean.length, 10)))) {
        const score = Math.min(clean.length, stSlug.length);
        if (score > bestScore) { best = st.id; bestScore = score; }
      }
    });
    return best;
  };

  const handleFiles = async (e) => {
    const files = Array.from(e.target.files || []);
    if (!active) { alert('Chọn bài tập trước'); return; }
    const queue = [];
    for (const f of files) {
      const rawURL = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f); });
      // 🗜️ Nén ảnh để tiết kiệm bộ nhớ (ảnh gốc 2-4MB → ~200-400KB), vẫn đủ rõ để đọc & OCR
      const dataURL = await compressImageDataURL(rawURL);
      queue.push({ file: f, dataURL, filename: f.name, matchedStudentId: autoMatchStudent(f.name), status: 'ready' });
    }
    setUploadQueue(q => [...q, ...queue]);
    e.target.value = '';
  };

  const saveQueue = () => {
    if (!active) return;
    const invalid = uploadQueue.filter(q => !q.matchedStudentId);
    if (invalid.length > 0) { alert(`⚠️ ${invalid.length} ảnh chưa được gán học sinh. Hãy chọn HS trước khi lưu.`); return; }
    const nowIso = new Date().toISOString();
    const isLate = active.deadline && new Date() > new Date(active.deadline);
    let newSubs = [...submissions];
    uploadQueue.forEach(q => {
      const existing = newSubs.find(s => s.assignmentId === active.id && s.studentId === q.matchedStudentId);
      const newImage = { dataURL: q.dataURL, filename: q.filename, uploadedAt: nowIso };
      if (existing) {
        existing.images = [...(existing.images || []), newImage];
        existing.attempts = [...(existing.attempts || []), { at: nowIso, filename: q.filename }];
        if (existing.status === 'pending') existing.status = isLate ? 'late' : 'submitted';
        existing.submittedAt = nowIso;
      } else {
        newSubs.push({ id: Date.now() + Math.random(), assignmentId: active.id, studentId: q.matchedStudentId, images: [newImage], ocrText: '', score: null, feedback: '', teacherComment: '', status: isLate ? 'late' : 'submitted', submittedAt: nowIso, attempts: [{ at: nowIso, filename: q.filename }] });
      }
    });
    setData({ ...data, submissions: newSubs });
    setUploadQueue([]);
    alert(`✅ Đã lưu ${uploadQueue.length} ảnh bài nộp vào hệ thống.`);
  };

  const updateMatch = (idx, studentId) => setUploadQueue(q => q.map((x, i) => i === idx ? { ...x, matchedStudentId: studentId } : x));
  const removeQ = (idx) => setUploadQueue(q => q.filter((_, i) => i !== idx));

  if (assignments.length === 0) return <div className="bg-white p-8 rounded-xl border text-center text-slate-500">Chưa có bài tập nào. Tạo bài tập ở tab "Bài tập" trước.</div>;

  return (
    <div className="space-y-4">
      <div className="bg-white rounded-xl p-4 border">
        <label className="block text-sm font-medium mb-1">Chọn bài tập để nhận bài nộp</label>
        <select value={selectedAid} onChange={e=>{setSelectedAid(e.target.value); setUploadQueue([]);}} className="w-full px-3 py-2 border rounded-lg bg-white text-sm">
          <option value="">-- Chọn bài tập --</option>
          {assignments.map(a => { const c = classes.find(cc=>cc.id===a.classId); return <option key={a.id} value={a.id}>{c?.name} • {a.title}</option>; })}
        </select>
      </div>

      {active && (
        <>
          <div className="bg-blue-50 border border-blue-200 rounded-xl p-4 text-sm text-blue-900">
            <strong>📱 Hướng dẫn forward ảnh từ Zalo:</strong>
            <ol className="list-decimal ml-5 mt-1 space-y-1">
              <li>Mở nhóm Zalo lớp → vào ảnh HS gửi → bấm <strong>Tải về</strong> (máy tính) hoặc <strong>Lưu vào máy</strong> (điện thoại).</li>
              <li>Đặt tên file theo tên HS (VD: <code>nguyen_van_a.jpg</code>) để tự động ghép. Hoặc upload rồi chọn HS thủ công.</li>
              <li>Upload hàng loạt vào khung dưới, hệ thống gợi ý ghép với HS.</li>
            </ol>
          </div>

          <div className="bg-white rounded-xl p-5 border">
            <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
              <h3 className="font-bold">📥 Upload ảnh bài làm</h3>
              <label className="cursor-pointer">
                <input type="file" multiple accept="image/*" onChange={handleFiles} className="hidden"/>
                <span className="px-4 py-2 bg-teal-700 text-white rounded-lg flex items-center gap-2 font-medium"><Icon name="UploadCloud" size={16}/> Chọn nhiều ảnh</span>
              </label>
            </div>

            {uploadQueue.length === 0 ? (
              <div className="border-2 border-dashed border-slate-300 rounded-lg p-8 text-center text-slate-500"><Icon name="ImagePlus" size={48} className="mx-auto mb-2 text-slate-400"/><p>Chưa có ảnh nào. Bấm "Chọn nhiều ảnh" để upload.</p></div>
            ) : (
              <>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 mb-4">
                  {uploadQueue.map((q, i) => {
                    const matched = students.find(s => s.id == q.matchedStudentId);
                    return (
                      <div key={i} className={`border rounded-lg p-2 ${q.matchedStudentId ? 'border-green-300 bg-green-50' : 'border-red-300 bg-red-50'}`}>
                        <img src={q.dataURL} alt={q.filename} className="w-full h-32 object-cover rounded mb-2"/>
                        <p className="text-xs truncate mb-1" title={q.filename}>{q.filename}</p>
                        <select value={q.matchedStudentId || ''} onChange={e=>updateMatch(i, Number(e.target.value))} className="w-full px-2 py-1 border rounded text-xs bg-white">
                          <option value="">-- Chọn HS --</option>
                          {students.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                        </select>
                        {matched && <p className="text-xs text-green-700 mt-1">✅ {matched.name}</p>}
                        <button onClick={()=>removeQ(i)} className="text-xs text-red-500 mt-1 flex items-center gap-1"><Icon name="Trash" size={10}/> Bỏ</button>
                      </div>
                    );
                  })}
                </div>
                <div className="flex gap-2">
                  <button onClick={saveQueue} className="flex-1 px-4 py-2 bg-emerald-600 text-white rounded-lg flex items-center justify-center gap-2 font-medium"><Icon name="Save" size={16}/> Lưu {uploadQueue.length} bài nộp</button>
                  <button onClick={()=>setUploadQueue([])} className="px-4 py-2 bg-slate-200 rounded-lg">Xóa hết</button>
                </div>
              </>
            )}
          </div>
        </>
      )}
    </div>
  );
};

const GradeModal = ({ sub, data, setData, classes, assignments, onClose }) => {
  const a = assignments.find(x => x.id === sub.assignmentId);
  const cls = classes.find(c => c.id === a?.classId);
  const student = cls?.students?.find(s => s.id === sub.studentId);
  const [form, setForm] = useState({ ...sub });
  const [activeImg, setActiveImg] = useState(0);
  const [ocrStatus, setOcrStatus] = useState({ running: false, progress: 0 });
  const [aiResult, setAiResult] = useState(null);
  const [manualMarks, setManualMarks] = useState(sub.manualMarks || []);
  const [markMode, setMarkMode] = useState(false);
  const [markColor, setMarkColor] = useState('red');

  const runOCR = async () => {
    if (!form.images?.[activeImg]) return;
    setOcrStatus({ running: true, progress: 0, message: 'Đang nhận dạng...' });
    try {
      const base64Data = form.images[activeImg].dataURL.split(',')[1];
      setOcrStatus({ running: true, progress: 40, message: 'Gửi tới EasyOCR...' });
      const result = await recognizeWithEasyOCR(base64Data);
      if (result.error) {
        alert(`❌ ${result.error}`);
        setOcrStatus({ running: false, progress: 0 });
        return;
      }
      setOcrStatus({ running: true, progress: 100, message: 'Hoàn thành!' });
      const confidence = result.confidence ? ` (độ tin cậy: ${(result.confidence * 100).toFixed(1)}%)` : '';
      setForm(f => ({ ...f, ocrText: (f.ocrText ? f.ocrText + '\n\n--- Ảnh ' + (activeImg+1) + ' ---' + confidence + ' ---\n' : '') + result.text.trim() }));
    } catch (err) {
      alert(`❌ Lỗi OCR: ${err.message}`);
    } finally {
      setOcrStatus({ running: false, progress: 0 });
    }
  };

  const runOCRAll = async () => {
    if (!form.images?.length) return;
    let result = '';
    setOcrStatus({ running: true, progress: 0 });
    for (let i = 0; i < form.images.length; i++) {
      try {
        const base64Data = form.images[i].dataURL.split(',')[1];
        setOcrStatus({ running: true, progress: Math.round((i / form.images.length) * 100), message: `Ảnh ${i+1}/${form.images.length}...` });
        const ocrResult = await recognizeWithEasyOCR(base64Data);
        if (!ocrResult.error) {
          const confidence = ocrResult.confidence ? ` (độ tin cậy: ${(ocrResult.confidence * 100).toFixed(1)}%)` : '';
          result += (i > 0 ? '\n\n--- Ảnh ' + (i+1) + ' ---' + confidence + ' ---\n' : '') + ocrResult.text.trim();
        }
      } catch (err) {
        console.error(`Lỗi OCR ảnh ${i+1}:`, err);
      }
    }
    setForm(f => ({ ...f, ocrText: result }));
    setOcrStatus({ running: false, progress: 0 });
  };

  const runAIGrade = () => {
    if (!form.ocrText?.trim()) { alert('Hãy OCR bài làm trước (hoặc gõ văn bản vào ô OCR).'); return; }
    const loaiMap = { 'lamvan':'baivan','phantich':'baivan','taplamvan':'baivan','onkynang':'baivan','dochieu':'doanvan','thuyetminh':'baivan','nghiluan':'baivan','baitaptv':'doanvan','khac':'baivan' };
    const loaiBai = loaiMap[a?.type] || 'baivan';
    const result = chamBaiTuDong(form.ocrText, loaiBai, a?.title || '');
    const maxScore = a?.maxScore || 10;
    const scaledScore = (result.tongDiem / result.tongDiemMax) * maxScore;
    const weak = result.ketQua.filter(k => k.diemCham < k.diemMax * 0.7);
    const strong = result.ketQua.filter(k => k.diemCham >= k.diemMax * 0.85);
    const improvements = [...new Set(result.ketQua.flatMap(k => k.goiYSuaChua))].slice(0, 5);
    const auto = `📝 NHẬN XÉT AI:

ĐIỂM MẠNH:
${strong.length === 0 ? '- (AI chưa ghi nhận điểm mạnh nổi bật)' : strong.map(k => `✅ ${k.ten}: đạt ${k.diemCham.toFixed(1)}/${k.diemMax}đ`).join('\n')}

ĐIỂM CẦN CẢI THIỆN:
${weak.length === 0 ? '- (Bài làm khá đồng đều, không có điểm yếu rõ rệt)' : weak.map(k => `⚠️ ${k.ten}: ${k.nhanXet}`).join('\n')}

GỢI Ý CẢI THIỆN:
${improvements.map((x, i) => (i+1) + '. ' + x).join('\n')}

THỐNG KÊ: ${result.thongKe.wordCount} từ, ${result.thongKe.sentenceCount} câu, ${result.thongKe.paragraphCount} đoạn. Chính tả: ${result.thongKe.loiChinhTaCount} lỗi. Độ phong phú từ: ${result.thongKe.doPhongPhu}%.`;
    setAiResult({ ...result, scaledScore, improvements, weak, strong, maxScore });
    setForm(f => ({ ...f, score: parseFloat(scaledScore.toFixed(2)), feedback: auto, improvements }));
  };

  const handleSave = () => {
    if (form.score === null || form.score === undefined) { alert('Nhập điểm cho bài làm'); return; }
    const updated = { ...form, manualMarks, status: 'graded', gradedAt: new Date().toISOString() };
    setData({ ...data, submissions: (data.submissions || []).map(s => s.id === sub.id ? updated : s) });
    alert('✅ Đã lưu kết quả chấm');
    onClose();
  };

  // Đánh dấu trực tiếp trên ảnh
  const handleImgClick = (e) => {
    if (!markMode) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;
    const note = prompt('Ghi chú đánh dấu (VD: lỗi chính tả, câu hay...):');
    if (note !== null) {
      setManualMarks(m => [...m, { imgIdx: activeImg, x, y, note, color: markColor, id: Date.now() }]);
    }
  };

  const removeMark = (id) => setManualMarks(m => m.filter(x => x.id !== id));

  return (
    <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-2 z-50 modal-overlay">
      <div className="bg-white rounded-xl w-full max-w-7xl max-h-[98vh] overflow-hidden flex flex-col">
        <div className="p-4 border-b flex items-center justify-between">
          <div><h3 className="font-bold">Chấm bài: {student?.name}</h3><p className="text-xs text-slate-500">{cls?.name} • {a?.title}</p></div>
          <button onClick={onClose} className="p-2 hover:bg-slate-100 rounded"><Icon name="X" size={20}/></button>
        </div>
        <div className="flex-1 overflow-y-auto p-4">
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
            {/* TRÁI: Ảnh */}
            <div>
              <div className="flex items-center justify-between mb-2 flex-wrap gap-2">
                <h4 className="font-semibold text-sm">📷 Ảnh bài làm ({form.images?.length || 0})</h4>
                <div className="flex gap-1">
                  <button onClick={()=>setMarkMode(!markMode)} className={`text-xs px-2 py-1 rounded ${markMode?'bg-red-500 text-white':'bg-slate-200'}`}><Icon name="Highlighter" size={12} className="inline"/> {markMode?'Tắt đánh dấu':'Đánh dấu'}</button>
                  {markMode && (
                    <select value={markColor} onChange={e=>setMarkColor(e.target.value)} className="text-xs px-2 py-1 border rounded">
                      <option value="red">🔴 Lỗi</option>
                      <option value="green">🟢 Hay</option>
                      <option value="orange">🟠 Lưu ý</option>
                      <option value="blue">🔵 Câu hỏi</option>
                    </select>
                  )}
                </div>
              </div>

              {form.images?.length > 1 && (
                <div className="flex gap-1 mb-2 overflow-x-auto">
                  {form.images.map((img, i) => <button key={i} onClick={()=>setActiveImg(i)} className={`flex-shrink-0 border-2 rounded ${activeImg===i?'border-teal-500':'border-transparent'}`}><img src={img.dataURL} className="w-16 h-16 object-cover rounded" alt={`p${i+1}`}/></button>)}
                </div>
              )}

              {form.images?.[activeImg] && (
                <div className="image-annotation-wrapper border rounded-lg" style={{cursor: markMode?'crosshair':'default'}}>
                  <img src={form.images[activeImg].dataURL} alt="bài" onClick={handleImgClick} style={{width:'100%'}}/>
                  <div className="annotation-layer">
                    {manualMarks.filter(m => m.imgIdx === activeImg).map(m => (
                      <div key={m.id} className="annotation-mark" style={{left: m.x+'%', top: m.y+'%', transform: 'translate(-50%,-50%)'}}>
                        <span onClick={e=>{e.stopPropagation(); if(confirm('Xóa đánh dấu này?')) removeMark(m.id);}} title={m.note} style={{background: m.color, color: 'white', padding: '2px 8px', borderRadius: '999px', fontSize: '11px', fontWeight: 'bold', border: '2px solid white', boxShadow: '0 2px 4px rgba(0,0,0,0.3)'}}>{m.note.substring(0,20)}{m.note.length>20?'…':''}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {manualMarks.filter(m=>m.imgIdx===activeImg).length > 0 && (
                <div className="mt-2 text-xs space-y-1 max-h-24 overflow-y-auto border rounded p-2 bg-slate-50">
                  {manualMarks.filter(m=>m.imgIdx===activeImg).map((m, i) => <div key={m.id} className="flex items-center gap-1"><span style={{color: m.color}}>●</span> {m.note} <button onClick={()=>removeMark(m.id)} className="text-red-500 ml-auto"><Icon name="X" size={10}/></button></div>)}
                </div>
              )}

              <div className="mt-3 grid grid-cols-2 gap-2">
                <button onClick={runOCR} disabled={ocrStatus.running} className="px-3 py-2 bg-blue-500 text-white rounded text-sm flex items-center justify-center gap-1 disabled:opacity-50"><Icon name="ScanText" size={14}/> OCR ảnh này</button>
                <button onClick={runOCRAll} disabled={ocrStatus.running || (form.images?.length || 0) < 2} className="px-3 py-2 bg-teal-600 text-white rounded text-sm flex items-center justify-center gap-1 disabled:opacity-50"><Icon name="Layers" size={14}/> OCR tất cả ảnh</button>
              </div>
              {ocrStatus.running && <div className="mt-2"><div className="progress-bar"><div className="progress-fill" style={{width: ocrStatus.progress + '%'}}></div></div><p className="text-xs text-center mt-1">🔄 {ocrStatus.message || 'Đang nhận dạng với EasyOCR...'} {ocrStatus.progress}%</p></div>}
            </div>

            {/* PHẢI: OCR text + chấm */}
            <div className="space-y-3">
              <div>
                <div className="flex items-center justify-between mb-1">
                  <label className="text-sm font-semibold">📄 Văn bản OCR (có thể chỉnh sửa)</label>
                  <span className="text-[10px] text-slate-500">{form.ocrText?.length || 0} ký tự</span>
                </div>
                <textarea value={form.ocrText || ''} onChange={e=>setForm({...form, ocrText:e.target.value})} rows={8} placeholder="Bấm OCR ảnh này để tự động nhận diện chữ viết tay. Giáo viên có thể chỉnh sửa lại nếu OCR sai." className="w-full px-3 py-2 border rounded text-sm font-mono focus:outline-none focus:ring-2 focus:ring-teal-500"/>

                <div className="flex gap-2 mt-2">
                  <button onClick={()=>setForm({...form, ocrText:''})} className="flex-1 px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm hover:bg-gray-300"><Icon name="Trash2" size={14} className="inline mr-1"/>Xóa</button>
                  <button onClick={()=>document.querySelector('[id^=img-]')?.click?.()} className="flex-1 px-3 py-1 bg-blue-200 text-blue-700 rounded text-sm hover:bg-blue-300"><Icon name="RotateCcw" size={14} className="inline mr-1"/>OCR lại</button>
                  <button onClick={()=>alert('✅ Văn bản đã lưu! Bây giờ bấm "AI chấm" để chấm bài.')} className="flex-1 px-3 py-1 bg-teal-200 text-teal-700 rounded text-sm hover:bg-teal-300"><Icon name="Save" size={14} className="inline mr-1"/>Lưu sửa</button>
                </div>

                <p className="text-[11px] text-slate-500 mt-2">💡 EasyOCR tiếng Việt: độ chính xác ~60-70% (tùy chất lượng ảnh). Hãy rà soát và sửa lại trước khi bấm "AI chấm".</p>
              </div>

              <button onClick={runAIGrade} disabled={!form.ocrText?.trim()} className="w-full px-4 py-2 bg-gradient-to-r from-rose-600 to-pink-600 text-white rounded-lg font-medium flex items-center justify-center gap-2 disabled:opacity-50 hover:from-rose-700 hover:to-pink-700"><Icon name="Sparkles" size={16}/> 🤖 AI chấm tự động &amp; gợi ý</button>

              {aiResult && (
                <div className="bg-rose-50 border border-rose-200 rounded p-3">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-sm">🎯 Điểm AI gợi ý:</span>
                    <span className="font-bold text-2xl text-rose-700">{aiResult.scaledScore.toFixed(2)}/{aiResult.maxScore}</span>
                  </div>
                  <details className="text-xs">
                    <summary className="cursor-pointer font-medium">Xem chi tiết theo tiêu chí</summary>
                    <table className="matrix-table w-full mt-2">
                      <thead><tr><th>Tiêu chí</th><th>Max</th><th>Chấm</th></tr></thead>
                      <tbody>{aiResult.ketQua.map(k=><tr key={k.id}><td className="text-left">{k.ten}</td><td>{k.diemMax}</td><td className="font-bold">{k.diemCham.toFixed(2)}</td></tr>)}</tbody>
                    </table>
                  </details>
                </div>
              )}

              <div>
                <label className="block text-sm font-semibold mb-1">🎯 Điểm (GV có thể chỉnh sửa)</label>
                <div className="flex gap-2">
                  <input type="number" step="0.25" min="0" max={a?.maxScore || 10} value={form.score || ''} onChange={e=>setForm({...form, score: parseFloat(e.target.value)})} className="w-32 px-3 py-2 border rounded text-center text-lg font-bold"/>
                  <span className="flex items-center text-sm text-slate-500">/ {a?.maxScore || 10}đ</span>
                </div>
              </div>

              <div>
                <label className="block text-sm font-semibold mb-1">💬 Nhận xét (GV có thể chỉnh sửa AI)</label>
                <textarea value={form.feedback || ''} onChange={e=>setForm({...form, feedback:e.target.value})} rows={8} className="w-full px-3 py-2 border rounded text-sm"/>
              </div>

              <div>
                <label className="block text-sm font-semibold mb-1">📌 Hướng cải thiện (dùng cho tin nhắn Zalo)</label>
                <textarea value={(form.improvements||[]).join('\n')} onChange={e=>setForm({...form, improvements: e.target.value.split('\n').filter(x=>x.trim())})} rows={4} placeholder="Mỗi dòng một gợi ý..." className="w-full px-3 py-2 border rounded text-sm"/>
              </div>
            </div>
          </div>
        </div>
        <div className="p-4 border-t flex justify-end gap-2 bg-slate-50">
          <button onClick={onClose} className="px-4 py-2 bg-slate-200 rounded-lg">Hủy</button>
          <button onClick={handleSave} className="px-4 py-2 bg-emerald-600 text-white rounded-lg flex items-center gap-2"><Icon name="Save" size={16}/> Lưu &amp; chấm xong</button>
        </div>
      </div>
    </div>
  );
};

// ============== RETURN FEEDBACK (Trả bài Zalo) ==============
const ReturnFeedbackView = ({ data, setData, classes, assignments, submissions, teacherName }) => {
  const [selectedAid, setSelectedAid] = useState('');
  const graded = submissions.filter(s => s.status === 'graded' && (selectedAid === '' || s.assignmentId == selectedAid));

  const getContext = (sub) => {
    const a = assignments.find(x => x.id === sub.assignmentId);
    const c = classes.find(cc => cc.id === a?.classId);
    const st = c?.students?.find(s => s.id === sub.studentId);
    return { a, c, st };
  };

  const copyAll = () => {
    const msgs = graded.map(s => {
      const { a, st } = getContext(s);
      return `━━━ ${st?.name || 'HS'} ━━━\n` + buildFeedbackZaloMessage(s, a, st, teacherName);
    }).join('\n\n═══════════════════════\n\n');
    navigator.clipboard.writeText(msgs);
    alert(`✅ Đã copy ${graded.length} tin nhắn phản hồi. Paste từng phần vào Zalo.`);
  };

  if (submissions.length === 0) return <div className="bg-white p-8 rounded-xl border text-center text-slate-500">Chưa có bài nộp đã chấm.</div>;

  return (
    <div className="space-y-4">
      <div className="bg-white rounded-xl p-4 border flex items-center gap-3 flex-wrap">
        <label className="text-sm font-medium">Bài tập:</label>
        <select value={selectedAid} onChange={e=>setSelectedAid(e.target.value)} className="flex-1 min-w-[300px] px-3 py-2 border rounded-lg bg-white text-sm">
          <option value="">Tất cả bài đã chấm ({submissions.filter(s=>s.status==='graded').length})</option>
          {assignments.map(a => { const c = classes.find(cc=>cc.id===a.classId); const n = submissions.filter(s=>s.assignmentId===a.id && s.status==='graded').length; return <option key={a.id} value={a.id}>{c?.name} • {a.title} ({n} đã chấm)</option>; })}
        </select>
        <button onClick={copyAll} disabled={graded.length===0} className="px-3 py-2 bg-emerald-600 text-white rounded text-sm flex items-center gap-1 disabled:opacity-50"><Icon name="Copy" size={14}/> Copy tất cả</button>
      </div>

      {graded.length === 0 ? <div className="bg-white p-8 rounded-xl border text-center text-slate-500">Chưa có bài nào đã chấm. Vào tab "OCR & Chấm bài".</div> : (
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
          {graded.map(s => {
            const { a, st } = getContext(s);
            const msg = buildFeedbackZaloMessage(s, a, st, teacherName);
            const zaloSent = s.zaloSent;
            return (
              <div key={s.id} className="bg-white rounded-xl p-4 border">
                <div className="flex items-center justify-between mb-2">
                  <div><h4 className="font-bold">{st?.name || '?'} • {s.score?.toFixed(2)}/{a?.maxScore || 10}đ</h4><p className="text-xs text-slate-500">{a?.title}</p></div>
                  {zaloSent ? <span className="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded">✅ Đã gửi</span> : <span className="text-xs bg-amber-100 text-amber-700 px-2 py-0.5 rounded">⏳ Chờ gửi</span>}
                </div>
                <details className="mb-2"><summary className="text-xs text-blue-600 cursor-pointer">👁️ Xem nội dung</summary><div className="zalo-preview mt-2 text-xs max-h-60 overflow-y-auto">{msg}</div></details>
                <div className="flex gap-2">
                  <button onClick={()=>{navigator.clipboard.writeText(msg); setData({...data, submissions: submissions.map(x=>x.id===s.id?{...x, zaloSent: true, zaloSentAt: new Date().toISOString()}:x)}); alert('✅ Đã copy. Paste vào Zalo cho em ' + (st?.name || ''));}} className="flex-1 text-xs px-3 py-1.5 bg-blue-500 text-white rounded flex items-center justify-center gap-1"><Icon name="Copy" size={12}/> Copy &amp; đánh dấu đã gửi</button>
                  {st?.parentPhone && <a href={`tel:${st.parentPhone}`} className="text-xs px-3 py-1.5 bg-slate-100 rounded flex items-center gap-1"><Icon name="Phone" size={12}/> Gọi PH</a>}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
};

// ============== CLASS ASSIGNMENT REPORT ==============
const ClassAssignmentReport = ({ data, classes, assignments, submissions, teacherName, schoolName }) => {
  const [reportCid, setReportCid] = useState('');
  const cls = classes.find(c => c.id == reportCid);
  const classAssignments = cls ? assignments.filter(a => a.classId === cls.id) : [];
  const classSubs = submissions.filter(s => classAssignments.some(a => a.id === s.assignmentId));

  if (classes.length === 0) return <div className="bg-white p-8 rounded-xl border text-center text-slate-500">Chưa có lớp nào.</div>;

  const exportExcel = () => {
    if (!cls) { alert('Chọn lớp'); return; }
    const rows = [];
    rows.push(['STT', 'Họ tên HS', 'SĐT PH', ...classAssignments.map(a => a.title), 'TB']);
    (cls.students || []).forEach((st, i) => {
      const scores = classAssignments.map(a => { const s = classSubs.find(x => x.assignmentId === a.id && x.studentId === st.id); return s?.score ?? ''; });
      const numericScores = scores.filter(x => typeof x === 'number');
      const avg = numericScores.length > 0 ? (numericScores.reduce((a,b)=>a+b,0)/numericScores.length).toFixed(2) : '';
      rows.push([i+1, st.name, st.parentPhone || '', ...scores, avg]);
    });
    const csv = rows.map(r => r.map(c => `"${(c+'').replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url; link.download = `BangDiemBT_${cls.name}.csv`;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 100);
  };

  // Thống kê
  const totalStudents = cls?.students?.length || 0;
  const submitRates = classAssignments.map(a => {
    const subs = classSubs.filter(s => s.assignmentId === a.id && (s.status === 'submitted' || s.status === 'late' || s.status === 'graded'));
    return { aid: a.id, title: a.title, total: totalStudents, submitted: subs.length, pct: totalStudents > 0 ? Math.round(subs.length/totalStudents*100) : 0 };
  });
  const avgRate = submitRates.length > 0 ? Math.round(submitRates.reduce((s,x)=>s+x.pct,0) / submitRates.length) : 0;

  // Chất lượng TB
  const gradedSubs = classSubs.filter(s => s.score !== null && s.score !== undefined);
  const avgQuality = gradedSubs.length > 0 ? gradedSubs.reduce((s,x)=>s+x.score, 0)/gradedSubs.length : 0;

  // Biểu đồ tiến bộ theo thời gian (avg score per assignment)
  const progress = classAssignments.map(a => {
    const subs = classSubs.filter(s => s.assignmentId === a.id && s.score !== null && s.score !== undefined);
    const avg = subs.length > 0 ? subs.reduce((sum, s) => sum + (s.score / (a.maxScore || 10) * 10), 0) / subs.length : 0;
    return { title: a.title, avg, count: subs.length, date: a.createdAt };
  }).sort((a, b) => new Date(a.date) - new Date(b.date));

  const chartW = 600, chartH = 180, pad = 30;
  const getX = (i) => pad + (i / Math.max(progress.length - 1, 1)) * (chartW - 2 * pad);
  const getY = (v) => chartH - pad - (v / 10) * (chartH - 2 * pad);
  const pathD = progress.filter(p => p.count > 0).map((p, i) => (i === 0 ? 'M' : 'L') + getX(i) + ',' + getY(p.avg)).join(' ');

  return (
    <div className="space-y-4">
      <div className="bg-white rounded-xl p-4 border flex items-center gap-3 flex-wrap">
        <label className="text-sm font-medium">Chọn lớp:</label>
        <select value={reportCid} onChange={e=>setReportCid(e.target.value)} className="flex-1 min-w-[250px] px-3 py-2 border rounded-lg bg-white text-sm">
          <option value="">-- Chọn lớp --</option>
          {classes.map(c => <option key={c.id} value={c.id}>{c.name} - Lớp {c.grade}</option>)}
        </select>
        {cls && (
          <div className="flex gap-2">
            <button onClick={exportExcel} className="px-3 py-2 bg-green-600 text-white rounded text-sm flex items-center gap-1"><Icon name="FileSpreadsheet" size={14}/> Excel (CSV)</button>
            <button onClick={() => exportToPDF('class-assignment-report', `BaoCaoBT_${cls.name}`)} className="px-3 py-2 bg-red-500 text-white rounded text-sm flex items-center gap-1"><Icon name="FileText" size={14}/> PDF</button>
            <button onClick={() => exportToWord('class-assignment-report', `BaoCaoBT_${cls.name}`)} className="px-3 py-2 bg-blue-600 text-white rounded text-sm flex items-center gap-1"><Icon name="FileDown" size={14}/> Word</button>
          </div>
        )}
      </div>

      {cls && (
        <div id="class-assignment-report" className="bg-white rounded-xl p-6 border space-y-4">
          <div className="text-center mb-4">
            <p className="font-bold text-sm">{schoolName || 'TRƯỜNG THCS ...'}</p>
            <p className="text-xs">Tổ Ngữ văn</p>
            <h2 className="text-2xl font-bold mt-2">BÁO CÁO BÀI TẬP - {cls.name}</h2>
            <p className="text-sm italic">GV: {teacherName || '—'} • Ngày: {new Date().toLocaleDateString('vi-VN')}</p>
          </div>

          <div className="grid grid-cols-4 gap-3">
            <div className="bg-teal-50 p-3 rounded text-center"><div className="text-xs">HS</div><div className="text-2xl font-bold text-teal-700">{totalStudents}</div></div>
            <div className="bg-emerald-50 p-3 rounded text-center"><div className="text-xs">Bài tập</div><div className="text-2xl font-bold text-emerald-600">{classAssignments.length}</div></div>
            <div className="bg-amber-50 p-3 rounded text-center"><div className="text-xs">Tỉ lệ nộp TB</div><div className="text-2xl font-bold text-amber-600">{avgRate}%</div></div>
            <div className="bg-rose-50 p-3 rounded text-center"><div className="text-xs">Điểm TB</div><div className="text-2xl font-bold text-rose-700">{avgQuality.toFixed(2)}</div></div>
          </div>

          <section>
            <h3 className="font-bold border-b pb-1 mb-2">📊 Tỉ lệ nộp bài theo bài tập</h3>
            <table className="matrix-table w-full text-sm">
              <thead><tr><th>Bài tập</th><th>Đã nộp</th><th>Tổng</th><th>Tỉ lệ</th></tr></thead>
              <tbody>{submitRates.map(r => <tr key={r.aid}><td className="text-left">{r.title}</td><td>{r.submitted}</td><td>{r.total}</td><td className="font-bold">{r.pct}%</td></tr>)}</tbody>
            </table>
          </section>

          {progress.filter(p => p.count > 0).length >= 2 && (
            <section>
              <h3 className="font-bold border-b pb-1 mb-2">📈 Biểu đồ chất lượng bài làm theo thời gian</h3>
              <svg width={chartW} height={chartH} style={{maxWidth:'100%'}}>
                {[0,2.5,5,7.5,10].map(v => <g key={v}><line x1={pad} y1={getY(v)} x2={chartW-pad} y2={getY(v)} stroke="#e2e8f0" strokeDasharray="3,3"/><text x={5} y={getY(v)+4} fontSize="10" fill="#64748b">{v}</text></g>)}
                <path d={pathD} fill="none" stroke="#7c3aed" strokeWidth="2"/>
                {progress.filter(p=>p.count>0).map((p, i) => <g key={i}><circle cx={getX(i)} cy={getY(p.avg)} r="4" fill="#7c3aed"/><text x={getX(i)} y={getY(p.avg)-8} fontSize="10" fill="#334155" textAnchor="middle">{p.avg.toFixed(1)}</text></g>)}
              </svg>
            </section>
          )}

          <section>
            <h3 className="font-bold border-b pb-1 mb-2">📋 Bảng điểm bài tập</h3>
            <div className="overflow-x-auto">
              <table className="matrix-table w-full text-sm">
                <thead>
                  <tr>
                    <th>STT</th><th>Họ tên</th>
                    {classAssignments.map(a => <th key={a.id} title={a.title}>{a.title.substring(0, 15)}{a.title.length>15?'…':''}</th>)}
                    <th className="bg-rose-50">TB</th>
                  </tr>
                </thead>
                <tbody>
                  {(cls.students || []).map((st, i) => {
                    const scores = classAssignments.map(a => { const s = classSubs.find(x => x.assignmentId === a.id && x.studentId === st.id); return s?.score; });
                    const valid = scores.filter(x => typeof x === 'number');
                    const avg = valid.length > 0 ? valid.reduce((a,b)=>a+b,0)/valid.length : null;
                    return (
                      <tr key={st.id}>
                        <td>{i+1}</td>
                        <td className="text-left">{st.name}</td>
                        {scores.map((sc, j) => <td key={j} className={sc==null?'text-slate-300':'font-medium'}>{sc==null?'-':sc.toFixed(1)}</td>)}
                        <td className={`bg-rose-50 font-bold ${avg==null?'text-slate-300':avg>=8?'text-emerald-600':avg>=6.5?'text-blue-600':avg>=5?'text-amber-600':'text-red-600'}`}>{avg==null?'-':avg.toFixed(2)}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </section>

          <div className="mt-8 flex justify-between text-sm">
            <div><p className="italic">Tổ trưởng chuyên môn</p></div>

// ============== 🛟 THẺ AN TOÀN DỮ LIỆU ==============
const DataSafetyCard = ({ onRestoreData }) => {
  const [usage, setUsage] = useState(getStorageUsage());
  const [lastBackup, setLastBackup] = useState(localStorage.getItem('last_backup_at') || '');
  const [fsName, setFsName] = useState(fsDirHandle ? fsDirHandle.name : '');
  const [fsGranted, setFsGranted] = useState(false);
  const [fsBusy, setFsBusy] = useState(false);
  const [serverMode, setServerMode] = useState(false);
  const [serverFile, setServerFile] = useState('');
  const refresh = () => setUsage(getStorageUsage());
  useEffect(() => { const t = setInterval(refresh, 4000); return () => clearInterval(t); }, []);
  useEffect(() => { (async () => { if (fsDirHandle) { setFsName(fsDirHandle.name); setFsGranted((await fsQueryPermission(fsDirHandle)) === 'granted'); } })(); }, []);
  // Phát hiện chế độ tự động (máy chủ nội bộ đang chạy?)
  useEffect(() => { fetch('/api/health', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(j => { if (j && j.ok) { setServerMode(true); setServerFile(j.file || ''); } }).catch(() => {}); }, []);

  const connectFolder = async (forceNew) => {
    setFsBusy(true);
    try {
      if (forceNew) await fsForget();
      let handle = forceNew ? null : fsDirHandle;
      if (handle) { if ((await fsRequestPermission(handle)) !== 'granted') handle = null; }
      if (!handle) handle = await fsPickDirectory();
      setFsName(handle.name); setFsGranted(true);
      const fileData = await fsReadData();
      const hasFile = fileData && fileData.items && Object.keys(fileData.items).length > 0;
      const cur = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      const curHas = cur.items && Object.keys(cur.items).length > 0;
      if (hasFile && (!curHas || confirm('📂 Thư mục này ĐÃ CÓ dữ liệu từ trước.\n\n• Bấm OK: TẢI dữ liệu từ thư mục vào chương trình (nên chọn nếu đây là máy/trình duyệt mới, hoặc muốn lấy lại bản đã lưu).\n• Bấm Hủy: GIỮ dữ liệu hiện tại và ghi đè lên file trong thư mục.'))) {
        onRestoreData && onRestoreData(fileData);
        alert('✅ Đã kết nối và TẢI dữ liệu từ thư mục "' + handle.name + '" vào chương trình.');
      } else {
        await fsWriteData(cur);
        alert('✅ Đã kết nối thư mục "' + handle.name + '".\nTừ giờ mọi dữ liệu (đề thi, giáo án, lớp, điểm...) sẽ TỰ ĐỘNG lưu vào file trong thư mục này.');
      }
    } catch (e) {
      if (e && e.name === 'AbortError') { /* cô bấm hủy hộp thoại */ }
      else alert('❌ ' + (e.message || e));
    } finally { setFsBusy(false); }
  };

  const doExport = () => {
    if (exportAllData()) {
      const now = new Date().toISOString();
      localStorage.setItem('last_backup_at', now);
      setLastBackup(now);
    }
  };

  const pct = usage.percent;
  const barColor = pct >= 85 ? 'bg-rose-500' : pct >= 60 ? 'bg-amber-500' : 'bg-teal-500';
  const textColor = pct >= 85 ? 'text-rose-600' : pct >= 60 ? 'text-amber-600' : 'text-teal-700';
  const daysSince = lastBackup ? Math.floor((Date.now() - new Date(lastBackup).getTime()) / 86400000) : null;
  const needBackup = daysSince === null || daysSince >= 7;

  return (
    <div className="bg-white rounded-2xl p-6 mb-6 border-2 border-teal-200 shadow-sm">
      <h2 className="text-lg font-bold text-slate-800 mb-1 flex items-center gap-2">
        <span className="text-xl">🛟</span> An toàn dữ liệu
      </h2>
      <p className="text-sm text-slate-500 mb-4">Dữ liệu lưu ngay trên máy này. Hãy <strong>sao lưu ra file</strong> thường xuyên để không lo mất khi đổi máy hay xoá trình duyệt.</p>

      {/* ⚡ Chế độ tự động (máy chủ nội bộ) — hiện khi mở qua nút "Mở Trợ Lý" */}
      {serverMode && (
        <div className="mb-5 rounded-xl border-2 border-teal-300 bg-gradient-to-br from-teal-50 to-emerald-50 p-4">
          <div className="flex items-center gap-2 mb-1">
            <span className="text-lg">⚡</span>
            <h3 className="font-bold text-teal-900">Chế độ TỰ ĐỘNG đang bật ✅</h3>
          </div>
          <p className="text-sm text-teal-800">Mọi dữ liệu (đề thi, giáo án, học sinh, lớp, điểm...) đang được <strong>tự động lưu thẳng vào file thật trên máy</strong> — cô không cần bấm gì cả. Mở lại app là dữ liệu còn nguyên.</p>
          {serverFile && <p className="text-[11px] text-teal-600 mt-2 break-all">📁 Lưu tại: <code className="bg-white px-1 rounded">{serverFile}</code></p>}
          <p className="text-[11px] text-teal-600 mt-1">🛡️ Có bản dự phòng <code className="bg-white px-1 rounded">.bak</code> và ảnh chụp theo ngày trong thư mục <code className="bg-white px-1 rounded">DuLieu/</code>.</p>
        </div>
      )}

      {/* 💾 Lưu tự động ra thư mục trên máy (cách thủ công — chỉ hiện khi CHƯA có chế độ tự động) */}
      {!serverMode && (
      <div className="mb-5 rounded-xl border-2 border-teal-100 bg-teal-50/50 p-4">
        <div className="flex items-center gap-2 mb-1">
          <span className="text-lg">💾</span>
          <h3 className="font-bold text-teal-900">Lưu ra thư mục trên máy</h3>
        </div>
        <p className="text-xs text-slate-600 mb-3">💡 Mẹo: mở app bằng nút <strong>"▶️ Mở Trợ Lý (lưu trên máy)"</strong> để bật <strong>chế độ tự động</strong> (khỏi bấm gì). Hoặc chọn thủ công một thư mục bên dưới — dữ liệu sẽ lưu vào file <code className="bg-white px-1 rounded">{FS_FILE_NAME}</code>.</p>

        {!FS_SUPPORTED ? (
          <div className="text-sm bg-amber-50 border border-amber-200 text-amber-800 rounded-lg p-3">
            ⚠️ Trình duyệt hiện tại không hỗ trợ (hoặc cô đang mở app bằng cách nhấp đúp file). Hãy dùng <strong>Chrome / Cốc Cốc</strong> và mở app bằng nút <strong>"Mở Trợ Lý"</strong>.
          </div>
        ) : fsName && fsGranted ? (
          <div>
            <div className="flex items-center gap-2 text-sm bg-white border border-teal-200 rounded-lg px-3 py-2 mb-2">
              <span className="text-teal-600">✅</span>
              <span className="text-slate-700">Đang tự lưu vào: <strong className="text-teal-800">{fsName}</strong> / {FS_FILE_NAME}</span>
            </div>
            <button onClick={() => connectFolder(true)} disabled={fsBusy} className="text-xs px-3 py-1.5 rounded-lg bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 disabled:opacity-50">📁 Đổi thư mục khác</button>
          </div>
        ) : fsName && !fsGranted ? (
          <div>
            <div className="text-sm bg-amber-50 border border-amber-200 text-amber-800 rounded-lg px-3 py-2 mb-2">🔗 Đã chọn thư mục <strong>{fsName}</strong> từ trước — bấm nút dưới để kết nối lại (mỗi lần mở app cần bấm 1 lần).</div>
            <button onClick={() => connectFolder(false)} disabled={fsBusy} className="px-4 py-2.5 rounded-xl font-semibold bg-gradient-to-r from-teal-600 to-teal-700 text-white hover:shadow-md flex items-center gap-2 disabled:opacity-60">
              <Icon name="FolderOpen" size={16} /> {fsBusy ? 'Đang kết nối...' : 'Kết nối lại thư mục'}
            </button>
          </div>
        ) : (
          <button onClick={() => connectFolder(false)} disabled={fsBusy} className="px-4 py-2.5 rounded-xl font-semibold bg-gradient-to-r from-teal-600 to-teal-700 text-white hover:shadow-md flex items-center gap-2 disabled:opacity-60">
            <Icon name="FolderOpen" size={16} /> {fsBusy ? 'Đang mở...' : 'Chọn thư mục lưu trên máy'}
          </button>
        )}
      </div>
      )}

      {/* Thanh dung lượng */}
      <div className="mb-4">
        <div className="flex justify-between items-center mb-1.5 text-sm">
          <span className="font-medium text-slate-700">Dung lượng đã dùng</span>
          <span className={`font-bold ${textColor}`}>{formatBytes(usage.totalBytes)} / ~{formatBytes(usage.limitBytes)} ({pct}%)</span>
        </div>
        <div className="w-full h-3 bg-slate-100 rounded-full overflow-hidden">
          <div className={`h-full ${barColor} transition-all duration-500`} style={{ width: pct + '%' }}></div>
        </div>
        {pct >= 85 && <p className="text-xs text-rose-600 mt-1.5 font-medium">⚠️ Gần đầy! Hãy sao lưu rồi xoá bớt ảnh bài cũ để có chỗ trống.</p>}
        {pct >= 60 && pct < 85 && <p className="text-xs text-amber-600 mt-1.5">Dung lượng đang tăng — nhớ sao lưu định kỳ nhé cô 🌸</p>}
      </div>

      {/* Nút Sao lưu / Khôi phục */}
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <button onClick={doExport}
          className="px-4 py-3 rounded-xl font-semibold bg-gradient-to-r from-teal-600 to-teal-700 text-white hover:shadow-md flex items-center justify-center gap-2 transition">
          <Icon name="Download" size={18} /> Sao lưu ra file
        </button>
        <label className="px-4 py-3 rounded-xl font-semibold bg-white border-2 border-rose-300 text-rose-700 hover:bg-rose-50 flex items-center justify-center gap-2 cursor-pointer transition">
          <Icon name="Upload" size={18} /> Khôi phục từ file
          <input type="file" accept="application/json,.json" className="hidden"
            onChange={(e) => { const f = e.target.files?.[0]; if (f) importAllData(f); e.target.value = ''; }} />
        </label>
      </div>

      {/* Nhắc sao lưu */}
      <div className={`mt-4 rounded-xl p-3 text-sm border ${needBackup ? 'bg-amber-50 border-amber-200 text-amber-800' : 'bg-teal-50 border-teal-100 text-teal-800'}`}>
        {lastBackup
          ? (needBackup
              ? <span>🔔 Đã <strong>{daysSince} ngày</strong> chưa sao lưu — nên sao lưu lại để an toàn.</span>
              : <span>✅ Lần sao lưu gần nhất: <strong>{new Date(lastBackup).toLocaleString('vi-VN')}</strong>.</span>)
          : <span>🔔 Cô <strong>chưa sao lưu lần nào</strong>. Hãy bấm "Sao lưu ra file" để giữ một bản dự phòng an toàn.</span>}
      </div>
    </div>
  );
};

// ============== AI INTENT PARSER ==============
const parseIntent = async (message) => {
  const prompt = `Phân tích ý định của giáo viên từ tin nhắn sau (Tiếng Việt):
"${message}"

Trả về JSON format:
{
  "action": "chat" hoặc "create_lesson" hoặc "create_exam" hoặc "create_slide",
  "lesson_name": "tên bài học nếu có",
  "grade": 6-9,
  "class": "tên lớp",
  "type": "lesson/exam/slide/advice",
  "details": "chi tiết bổ sung"
}

IMPORTANT: Chỉ trả JSON, không có text khác!`;

  const result = await callGroqAPI(prompt, 300);
  try {
    if (result.success) {
      return JSON.parse(result.text);
    }
  } catch (e) {
    return { action: 'chat', type: 'error' };
  }
  return { action: 'chat', type: 'help' };
};

// ============== WORKFLOW EXECUTOR ==============
const executeWorkflow = async (intent, data, setData, selectedClass, selectedBook) => {
  if (intent.action === 'create_lesson') {
    // Auto tạo kế hoạch bài + giáo án bằng Claude
    const prompt = `Hãy soạn một kế hoạch bài giảng CHI TIẾT VÀ CHUYÊN NGHIỆP cho bài "${intent.lesson_name}" dạy cho lớp ${intent.grade || selectedClass} (Tiếng Việt THCS):

**I. MỤC TIÊU BÀI HỌC** (3-5 mục tiêu cụ thể)
- Mục tiêu về kiến thức
- Mục tiêu về kỹ năng
- Mục tiêu về thái độ

**II. NỘI DUNG CHÍNH** (Chi tiết các nội dung dạy)
- Điểm chính cần giảng dạy
- Trọng tâm bài học
- Các khái niệm quan trọng

**III. HOẠT ĐỘNG LỚP HỌC** (Mô tả chi tiết 3-4 hoạt động)
- Hoạt động 1: [Tên hoạt động]
  - Phương pháp:
  - Thời gian:
  - Cách thực hiện:
- (Tiếp tục các hoạt động khác)

**IV. PHƯƠNG TIỆN VÀ THIẾT BỊ**
- SGK, tài liệu
- Công nghệ/đồ dùng dạy học

**V. ĐÁNH GIÁ KẾT QUẢ HỌC TẬP** (5-7 câu hỏi/bài tập)
- Câu hỏi kiểm tra kiến thức
- Bài tập vận dụng
- Phương pháp đánh giá

**VI. RÚT KINH NGHIỆM VÀ CÂU HỎI MỞ RỘNG**

Hãy viết chi tiết, cụ thể, phù hợp với chương trình THCS, dễ áp dụng thực tế. Sử dụng tiếng Việt chuyên nghiệp.`;

    const result = await callClaudeAPI(prompt, 2000);
    if (result.success) {
      const newLesson = {
        id: Date.now(),
        title: `Kế hoạch: ${intent.lesson_name}`,
        subtitle: `Lớp ${intent.grade || selectedClass}`,
        grade: intent.grade || selectedClass,
        book: selectedBook,
        theme: intent.lesson_name,
        lessonName: intent.lesson_name,
        duration: '2 tiết',
        mucTieu: result.text.substring(0, 200),
        content: result.text,
        hoatDong1: '(Xem full content)',
        createdAt: new Date().toISOString()
      };

      setData({
        ...data,
        lessons: [...(data.lessons || []), newLesson]
      });

      return { success: true, message: `✅ Tạo kế hoạch bài "${intent.lesson_name}" thành công! Nội dung chi tiết và chuyên nghiệp.`, data: newLesson };
    } else {
      return { success: false, message: result.error || '❌ Không thể tạo nội dung. Vui lòng thử lại!' };
    }
  }

  return { success: false, message: '❌ Không thể tạo nội dung. Vui lòng thử lại!' };
};

// ============== SLASH COMMAND HELPERS ==============
const parseSlashCommand = (input) => {
  const match = input.match(/^\/(\S+)\s*(.*)/);
  if (!match) return null;
  return { command: match[1].toLowerCase(), args: match[2].trim() };
};

const generateLessonContent = async (topic) => {
  const prompt = `Hãy soạn một bài giảng tiếng Việt THCS chi tiết về chủ đề "${topic}".
Cấu trúc:
1. Mục tiêu bài học
2. Khởi động (5 phút)
3. Hình thành kiến thức (20 phút)
4. Luyện tập (10 phút)
5. Đánh giá (5 phút)

Trả lời bằng tiếng Việt, chuyên nghiệp, chi tiết.`;

  let result = null;
  const useOllama = getUseOllama();
  if (useOllama) {
    result = await callOllamaAPI(prompt, 500);
  }
  if (!result || !result.success) {
