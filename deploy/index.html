        {navGroups.map(group => (
          <div key={group.label} className="mb-3">
            <p className="text-[10px] font-bold uppercase tracking-widest text-rose-300 px-2 py-2">{group.label}</p>
            <div className="grid grid-cols-2 gap-2">
              {group.items.map(item => (
                <button key={item.id} onClick={() => handleNav(item.id)}
                  className={`flex flex-col items-start gap-2 p-3.5 rounded-2xl border transition ${active === item.id ? 'border-rose-300 bg-rose-50 shadow-sm' : 'border-transparent bg-white/70 hover:bg-white'}`}>
                  <div className={`w-10 h-10 rounded-xl bg-gradient-to-br ${itemColors[item.id] || 'from-slate-100 to-slate-200 text-slate-600'} flex items-center justify-center`}>
                    <Icon name={item.icon} size={20} />
                  </div>
                  <div className="text-left">
                    <p className={`text-[13px] font-semibold ${active === item.id ? 'text-rose-800' : 'text-amber-900'}`}>{item.label}</p>
                    {item.phase === 4 && <span className="text-[9px] bg-rose-100 text-rose-600 px-1.5 py-0.5 rounded-full font-bold">MỚI</span>}
                  </div>
                </button>
              ))}
            </div>
          </div>
        ))}
      </div>

      {/* Footer */}
      <div className="px-6 py-4 border-t border-rose-100 bg-rose-50/50">
        <p className="text-[11px] text-rose-400 text-center italic">Trợ Lý Giáo Viên Ngữ Văn THCS · v4.3 🌸</p>
      </div>
    </div>
  );
};

// ============== APP ==============
// ============== ☁️ MÀN HÌNH ĐĂNG NHẬP ĐÁM MÂY ==============
const AuthScreen = () => {
  const [mode, setMode] = useState('login'); // 'login' | 'signup'
  const [email, setEmail] = useState('');
  const [pass, setPass] = useState('');
  const [pass2, setPass2] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);

  const prettyErr = (code) => {
    const m = {
      'auth/invalid-email': 'Email không hợp lệ.',
      'auth/user-not-found': 'Chưa có tài khoản này. Hãy bấm "Tạo tài khoản mới".',
      'auth/wrong-password': 'Sai mật khẩu.',
      'auth/invalid-credential': 'Sai email hoặc mật khẩu.',
      'auth/email-already-in-use': 'Email này đã có tài khoản. Hãy đăng nhập.',
      'auth/weak-password': 'Mật khẩu quá ngắn (cần ít nhất 6 ký tự).',
      'auth/network-request-failed': 'Lỗi mạng. Kiểm tra kết nối internet.',
    };
    return m[code] || ('Có lỗi: ' + code);
  };

  const submit = async () => {
    setErr('');
    if (!email.trim() || !pass) { setErr('Cô nhập email và mật khẩu nhé.'); return; }
    if (mode === 'signup' && pass !== pass2) { setErr('Hai ô mật khẩu chưa giống nhau.'); return; }
    setBusy(true);
    try {
      if (mode === 'login') await fbAuth.signInWithEmailAndPassword(email.trim(), pass);
      else await fbAuth.createUserWithEmailAndPassword(email.trim(), pass);
      // onAuthStateChanged ở App sẽ tự nhận và vào chương trình
    } catch (e) {
      setErr(prettyErr(e.code || e.message));
    } finally { setBusy(false); }
  };

  return (
    <div className="flex items-center justify-center min-h-screen gradient-bg p-4">
      <div className="w-full max-w-md">
        <div className="text-center mb-6">
          <div className="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-teal-600 to-rose-500 flex items-center justify-center text-white text-3xl mb-3 shadow-lg">📖</div>
          <h1 className="text-2xl font-bold text-slate-800 font-display">Trợ Lý Giáo Viên Ngữ Văn</h1>
          <p className="text-slate-500 text-sm mt-1">{mode === 'login' ? 'Đăng nhập để mở dữ liệu của cô ở mọi nơi 🌸' : 'Tạo tài khoản để bắt đầu 🌸'}</p>
        </div>

        <div className="bg-white rounded-2xl shadow-xl border border-teal-100 p-6">
          <label className="block text-sm font-medium text-slate-700 mb-1">Email</label>
          <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="vd: thinhdv1@gmail.com"
            className="w-full px-3 py-2.5 border border-slate-200 rounded-xl mb-3 focus:border-teal-400 outline-none" autoFocus />

          <label className="block text-sm font-medium text-slate-700 mb-1">Mật khẩu</label>
          <input type="password" value={pass} onChange={e => setPass(e.target.value)} placeholder="Ít nhất 6 ký tự"
            onKeyDown={e => { if (e.key === 'Enter' && mode === 'login') submit(); }}
            className="w-full px-3 py-2.5 border border-slate-200 rounded-xl mb-3 focus:border-teal-400 outline-none" />

          {mode === 'signup' && (
            <>
              <label className="block text-sm font-medium text-slate-700 mb-1">Nhập lại mật khẩu</label>
              <input type="password" value={pass2} onChange={e => setPass2(e.target.value)} placeholder="Gõ lại mật khẩu"
                onKeyDown={e => { if (e.key === 'Enter') submit(); }}
                className="w-full px-3 py-2.5 border border-slate-200 rounded-xl mb-3 focus:border-teal-400 outline-none" />
            </>
          )}

          {err && <div className="text-sm bg-rose-50 border border-rose-200 text-rose-700 rounded-lg px-3 py-2 mb-3">⚠️ {err}</div>}

          <button onClick={submit} disabled={busy}
            className="w-full py-3 rounded-xl font-semibold text-white bg-gradient-to-r from-teal-600 to-teal-700 hover:shadow-md disabled:opacity-60 transition">
            {busy ? 'Đang xử lý...' : (mode === 'login' ? 'Đăng nhập' : 'Tạo tài khoản')}
          </button>

          <div className="text-center mt-4 text-sm text-slate-500">
            {mode === 'login' ? (
              <>Chưa có tài khoản? <button onClick={() => { setMode('signup'); setErr(''); }} className="text-teal-700 font-semibold hover:underline">Tạo tài khoản mới</button></>
            ) : (
              <>Đã có tài khoản? <button onClick={() => { setMode('login'); setErr(''); }} className="text-teal-700 font-semibold hover:underline">Đăng nhập</button></>
            )}
          </div>
        </div>
        <p className="text-center text-[11px] text-slate-400 mt-4">Dữ liệu được đồng bộ an toàn qua tài khoản này. Đăng nhập cùng email trên máy/điện thoại khác là thấy y nguyên.</p>
      </div>
    </div>
  );
};

const App = () => {
  const [active, setActive] = useState('dashboard');
  const [collapsed, setCollapsed] = useState(false);
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
  const [data, setDataState] = useState({});
  const [selectedClass, setSelectedClass] = useState(6);
  const [selectedBook, setSelectedBook] = useState('ketnoi');
  const [teacherName, setTeacherName] = useState('');
  const [schoolName, setSchoolName] = useState('');
  const [showChat, setShowChat] = useState(false);
  const [fbUser, setFbUser] = useState(null);        // ☁️ tài khoản đám mây đang đăng nhập
  const [authReady, setAuthReady] = useState(false);  // đã kiểm tra tình trạng đăng nhập xong chưa
  const dataLoadedRef = useRef(false); // 🛟 chốt an toàn: chỉ cho phép lưu SAU khi đã nạp xong dữ liệu cũ
  const cloudRef = useRef(false);      // đám mây có dùng được không
  const fbUserRef = useRef(null);      // giữ uid mới nhất cho hàm lưu

  // Nạp một gói dữ liệu vào chương trình (dùng khi khôi phục từ file/đám mây)
  const applyRestoredPayload = (payload) => {
    if (!payload) return;
    if (payload.items) setDataState(payload.items);
    if (payload.selectedClass) setSelectedClass(payload.selectedClass);
    if (payload.selectedBook) setSelectedBook(payload.selectedBook);
    if (payload.teacherName != null) setTeacherName(payload.teacherName);
    if (payload.schoolName != null) setSchoolName(payload.schoolName);
    // 🔑 Khôi phục chìa khóa AI đã đồng bộ -> AI chạy được trên máy mới mà không phải nhập lại
    if (payload.apiKeys) {
      if (payload.apiKeys.groq) saveGroqApiKey(payload.apiKeys.groq);
      if (payload.apiKeys.claude) saveClaudeApiKey(payload.apiKeys.claude);
      if (payload.apiKeys.provider) localStorage.setItem('selectedAIProvider', payload.apiKeys.provider);
    }
  };

  useEffect(() => {
    const saved = loadData();
    setDataState(saved.items || {});
    setSelectedClass(saved.selectedClass || 6);
    setSelectedBook(saved.selectedBook || 'ketnoi');
    setTeacherName(saved.teacherName || '');
    setSchoolName(saved.schoolName || '');
    fsRestoreDirectory();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {}

    const cloud = initFirebase();
    cloudRef.current = cloud;
    if (cloud) {
      // ☁️ Đám mây là BẢN CHÍNH. Sau khi đăng nhập sẽ nạp dữ liệu từ đám mây về.
      fbAuth.onAuthStateChanged(async (user) => {
        fbUserRef.current = user || null;
        setFbUser(user || null);
        setAuthReady(true);
        if (user) {
          const remote = await fbReadData(user.uid);
          if (remote && remote.items && Object.keys(remote.items).length > 0) {
            applyRestoredPayload(remote); // đám mây có dữ liệu -> dùng bản đám mây
          } else {
            // đám mây trống -> đẩy dữ liệu hiện có trên máy này lên đám mây
            fbWriteDataNow(user.uid, { items: saved.items || {}, selectedClass: saved.selectedClass || 6, selectedBook: saved.selectedBook || 'ketnoi', teacherName: saved.teacherName || '', schoolName: saved.schoolName || '' });
          }
        }
      });
    } else {
      // Không có đám mây -> dùng máy chủ/localStorage như cũ
      setAuthReady(true);
      (async () => {
        const res = await serverLoadData();
        if (!res.available) return;
        if (res.data && res.data.items && Object.keys(res.data.items).length > 0) {
          applyRestoredPayload(res.data);
        } else {
          serverWriteData({ items: saved.items || {}, selectedClass: saved.selectedClass || 6, selectedBook: saved.selectedBook || 'ketnoi', teacherName: saved.teacherName || '', schoolName: saved.schoolName || '' });
        }
      })();
    }
  }, []);

  useEffect(() => {
    // Bỏ qua lần chạy ĐẦU TIÊN (lúc data còn rỗng, chưa nạp xong) để không ghi đè mất dữ liệu cũ
    if (!dataLoadedRef.current) { dataLoadedRef.current = true; return; }
    const payload = { items: data, selectedClass, selectedBook, teacherName, schoolName,
      apiKeys: { groq: getGroqApiKey(), claude: getClaudeApiKey(), provider: localStorage.getItem('selectedAIProvider') || '' } };
    saveData(payload);             // lưu vào trình duyệt (nhanh, luôn có - bản cache)
    fsWriteDataDebounced(payload);  // ghi ra file qua thư mục (nếu đã kết nối thủ công)
    serverWriteData(payload);       // ghi ra file qua máy chủ (nếu mở bằng nút Mở Trợ Lý)
    if (fbUserRef.current) fbWriteDataDebounced(fbUserRef.current.uid, payload); // ☁️ đồng bộ đám mây
  }, [data, selectedClass, selectedBook, teacherName, schoolName]);

  const setData = (d) => setDataState(d);
  const handleSignOut = async () => { try { if (fbAuth) await fbAuth.signOut(); } catch {} };
  const activeMenu = MENU_ITEMS.find(m => m.id === active);

  const handleNavAndClose = (id) => {
    setActive(id);
    setMobileMenuOpen(false);
  };

  const renderContent = () => {
    if (active === 'dashboard') return <Dashboard data={data} setActive={setActive} />;
    if (active === 'planning') return <PlanningTab data={data} setData={setData} selectedClass={selectedClass} selectedBook={selectedBook} teacherName={teacherName} schoolName={schoolName} setActive={handleNavAndClose} />;
    if (active === 'lesson') return <LessonTab data={data} setData={setData} selectedClass={selectedClass} selectedBook={selectedBook} teacherName={teacherName} schoolName={schoolName} setActive={handleNavAndClose} />;
    if (active === 'exam') return <ExamTab data={data} setData={setData} selectedClass={selectedClass} selectedBook={selectedBook} teacherName={teacherName} schoolName={schoolName} setActive={handleNavAndClose} />;
    if (active === 'classes') return <ClassesTab data={data} setData={setData} selectedClass={selectedClass} selectedBook={selectedBook} teacherName={teacherName} schoolName={schoolName} setActive={handleNavAndClose} />;
    if (active === 'library') return <LibraryTab setActive={handleNavAndClose} />;
    if (active === 'settings') return <SettingsTab data={data} setData={setData} setActive={handleNavAndClose} onRestoreData={applyRestoredPayload} fbUser={fbUser} onSignOut={handleSignOut} />;
    return <PhasePlaceholder item={activeMenu} />;
  };

  // ☁️ Cổng đăng nhập đám mây: nếu bật đám mây mà chưa đăng nhập -> hiện màn hình đăng nhập
  if (cloudRef.current && !authReady) {
    return <div className="flex items-center justify-center h-screen gradient-bg"><div className="text-center"><div className="text-4xl mb-3 animate-pulse">🌸</div><p className="text-teal-700 font-medium">Đang tải Trợ Lý Giáo Viên...</p></div></div>;
  }
  if (cloudRef.current && authReady && !fbUser) {
    return <AuthScreen />;
  }

  return (
    <div className="flex h-screen bg-slate-50 overflow-hidden">
      {/* Sidebar desktop + mobile drawer */}
      <Sidebar active={active} setActive={handleNavAndClose} collapsed={collapsed} setCollapsed={setCollapsed}
        onChatOpen={() => { setShowChat(true); setMobileMenuOpen(false); }}
        mobileOpen={mobileMenuOpen} />

      {/* Overlay backdrop khi sidebar mở trên mobile */}
      {mobileMenuOpen && (
        <div className="sidebar-overlay" onClick={() => setMobileMenuOpen(false)} />
      )}

      <div className="flex-1 flex flex-col overflow-hidden">
        <Header selectedClass={selectedClass} setSelectedClass={setSelectedClass}
          selectedBook={selectedBook} setSelectedBook={setSelectedBook}
          teacherName={teacherName} setTeacherName={setTeacherName}
          schoolName={schoolName} setSchoolName={setSchoolName}
          onMobileMenuToggle={() => setMobileMenuOpen(o => !o)}
          setActive={handleNavAndClose} />
        <main className="flex-1 overflow-y-auto scrollbar p-6 main-content-area">{renderContent()}</main>
      </div>

      {/* AI Chat Panel */}
      <AIChatPanel
        isOpen={showChat}
        onClose={() => setShowChat(false)}
        data={data}
        setData={setData}
        selectedClass={selectedClass}
        selectedBook={selectedBook}
      />

      {/* Hamburger full-screen overlay (mobile) */}
      {mobileMenuOpen && (
        <HamburgerOverlay active={active} setActive={handleNavAndClose} onChatOpen={() => setShowChat(true)} onClose={() => setMobileMenuOpen(false)} />
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>


<script>
// 💰 COST TRACKING SYSTEM
window.costHistory = [];
window.totalCostToday = 0;

window.recordCost = function(operation, inputTokens, outputTokens) {
  const INPUT_PRICE = 15;      // $15 per 1M tokens
  const OUTPUT_PRICE = 45;     // $45 per 1M tokens
  
  const inputCost = (inputTokens * INPUT_PRICE) / 1000000;
  const outputCost = (outputTokens * OUTPUT_PRICE) / 1000000;
  const totalCost = inputCost + outputCost;
  
  const now = new Date();
  const timeStr = now.getHours().toString().padStart(2, '0') + ':' + 
                  now.getMinutes().toString().padStart(2, '0') + ':' + 
                  now.getSeconds().toString().padStart(2, '0');
  
  const record = {
    time: timeStr,
    operation: operation,
    inputTokens: inputTokens,
    outputTokens: outputTokens,
    totalTokens: inputTokens + outputTokens,
    inputCost: inputCost,
    outputCost: outputCost,
    cost: totalCost
  };
  
  window.costHistory.push(record);
  window.totalCostToday += totalCost;
  
  // Update UI
  const costTodayEl = document.getElementById('costToday');
  if (costTodayEl) {
    costTodayEl.textContent = '$' + window.totalCostToday.toFixed(4);
  }
  
  // Update last operation
  const lastOpEl = document.getElementById('lastOperation');
  if (lastOpEl) {
    lastOpEl.innerHTML = 
      '<p style="margin: 2px 0; color: #333; font-weight: 600;">' + operation + '</p>' +
      '<p style="margin: 4px 0 2px 0; color: #666; font-size: 11px;">🔹 Input: ' + inputTokens.toLocaleString() + ' tokens</p>' +
      '<p style="margin: 2px 0; color: #666; font-size: 11px;">🔹 Output: ' + outputTokens.toLocaleString() + ' tokens</p>' +
      '<p style="margin: 4px 0 0 0; color: #0f766e; font-weight: 700; font-size: 13px;">💵 Cost: $' + totalCost.toFixed(4) + '</p>';
  }
  
  // Update history (last 5)
  const historyEl = document.getElementById('costHistory');
  if (historyEl) {
    const lastFive = window.costHistory.slice(-5).reverse();
    if (lastFive.length > 0) {
      historyEl.innerHTML = lastFive.map(r => 
        '<div style="padding: 8px; border-bottom: 1px solid #e5e7eb; margin-bottom: 4px;">' +
        '<div style="display: flex; justify-content: space-between; align-items: center;">' +
        '<span style="font-weight: 600; color: #333;">' + r.time + '</span>' +
        '<span style="color: #be185d; font-weight: 700;">$' + r.cost.toFixed(4) + '</span>' +
        '</div>' +
        '<p style="margin: 4px 0 0 0; color: #666; font-size: 10px;">' + r.operation + ' • ' + r.totalTokens.toLocaleString() + 'T</p>' +
        '</div>'
      ).join('');
    }
  }
  
  console.log('💰 [' + operation + '] Input: ' + inputTokens + ' tokens, Output: ' + outputTokens + ' tokens, Cost: $' + totalCost.toFixed(4));
};
</script>
