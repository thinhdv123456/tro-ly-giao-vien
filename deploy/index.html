  {
    id: 'TT_6_002', title: 'Sự kỳ diệu của đại dương', author: 'Tạp chí Khoa học & Tuổi trẻ', source: 'khoahocvatuoitre.vn, 2023',
    class: 6, genre: 'thong_tin', subgenre: 'bai_giai_thich', theme: 'thien_nhien', difficulty: 'de',
    copyright_status: 'education_use', approved: true, wordCount: 120,
    excerpt: 'Đại dương chiếm hơn 70% diện tích bề mặt Trái Đất và chứa đựng vô vàn điều kỳ diệu...',
    fullText: 'Đại dương chiếm hơn 70% diện tích bề mặt Trái Đất và chứa đựng vô vàn điều kỳ diệu chưa được khám phá hết. Độ sâu trung bình của đại dương là 3.688 mét, trong khi điểm sâu nhất — Rãnh Mariana ở Thái Bình Dương — xuống đến gần 11 km dưới mực nước biển. Tại đây tồn tại những sinh vật kỳ lạ có thể phát sáng trong bóng tối hoàn toàn. Đại dương còn điều hòa khí hậu Trái Đất bằng cách hấp thụ nhiệt từ mặt trời và phân phối nhiệt lượng qua các dòng hải lưu. Theo các nhà khoa học, đến nay con người mới khám phá được chưa đến 20% thế giới dưới đại dương.',
  },
  {
    id: 'TT_6_003', title: 'Bí quyết học tốt cho học sinh tiểu học và THCS', author: 'ThS. Nguyễn Lan Anh', source: 'Báo Giáo dục & Thời đại, giaoduc.net.vn, 2024',
    class: 6, genre: 'thong_tin', subgenre: 'bai_huong_dan', theme: 'hoc_tap', difficulty: 'de',
    copyright_status: 'education_use', approved: true, wordCount: 130,
    excerpt: 'Học tốt không chỉ phụ thuộc vào trí thông minh bẩm sinh mà còn đến từ phương pháp học đúng đắn...',
    fullText: 'Học tốt không chỉ phụ thuộc vào trí thông minh bẩm sinh mà còn đến từ phương pháp học đúng đắn. Theo nghiên cứu của các nhà tâm lý học giáo dục, có bốn yếu tố quyết định hiệu quả học tập: lập thời gian biểu khoa học, ôn bài trước khi ngủ, học theo nhóm và đặt câu hỏi chủ động. Đặc biệt, việc nghỉ ngơi đúng cách rất quan trọng — não bộ cần thời gian để xử lý và lưu trữ thông tin. Học sinh THCS nên ngủ đủ 8 tiếng mỗi đêm và tránh học nhồi nhét trước kỳ thi. Thay vào đó, hãy học đều đặn mỗi ngày, mỗi lần không quá 45 phút rồi nghỉ 10 phút.',
  },
  {
    id: 'TT_7_002', title: 'Ô nhiễm nhựa — Hiểm họa vô hình của đại dương', author: 'WWF Việt Nam', source: 'wwf.org.vn, 2023',
    class: 7, genre: 'thong_tin', subgenre: 'bai_bao', theme: 'moi_truong', difficulty: 'vua',
    copyright_status: 'education_use', approved: true, wordCount: 150,
    excerpt: 'Mỗi năm, khoảng 8 triệu tấn rác thải nhựa đổ ra đại dương — tương đương một xe tải rác mỗi phút...',
    fullText: 'Mỗi năm, khoảng 8 triệu tấn rác thải nhựa đổ ra đại dương — tương đương một xe tải rác đổ xuống biển mỗi phút. Những mảnh nhựa nhỏ li ti, gọi là vi nhựa, đã được tìm thấy trong cơ thể cá, trong muối ăn và thậm chí trong cơ thể người. Nhựa không phân hủy mà chỉ vỡ ra thành các mảnh nhỏ hơn, tồn tại hàng trăm năm trong môi trường. Việt Nam là một trong bốn quốc gia xả nhựa ra biển nhiều nhất thế giới, chủ yếu qua các con sông. Giải pháp không chỉ nằm ở luật pháp mà còn ở ý thức của từng người: hạn chế dùng đồ nhựa dùng một lần, phân loại rác trước khi bỏ, ủng hộ các sản phẩm thân thiện môi trường.',
  },
  {
    id: 'TT_7_003', title: 'Trí tuệ nhân tạo — Bạn hay thù của học sinh?', author: 'TS. Phạm Minh Tuấn', source: 'Tạp chí Công nghệ và Giáo dục, 2024',
    class: 7, genre: 'thong_tin', subgenre: 'bai_bao', theme: 'cong_nghe', difficulty: 'vua',
    copyright_status: 'education_use', approved: true, wordCount: 145,
    excerpt: 'Trí tuệ nhân tạo (AI) đang thay đổi cách chúng ta học và làm việc với tốc độ chóng mặt...',
    fullText: 'Trí tuệ nhân tạo (AI) đang thay đổi cách chúng ta học và làm việc với tốc độ chóng mặt. Các công cụ AI như ChatGPT có thể giải bài tập, soạn thảo văn bản, giải thích khái niệm khó chỉ trong vài giây. Nhiều học sinh coi đây là "người gia sư" tiện lợi nhất từ trước đến nay. Tuy nhiên, giới chuyên gia lo ngại rằng việc phụ thuộc quá nhiều vào AI có thể làm giảm khả năng tư duy độc lập, sáng tạo và giải quyết vấn đề của học sinh. Chìa khóa là biết sử dụng AI như một công cụ hỗ trợ — tra cứu, kiểm tra, gợi ý — chứ không phải thay thế hoàn toàn quá trình suy nghĩ. Học sinh biết khai thác AI đúng cách sẽ có lợi thế lớn; ngược lại, lạm dụng AI là tự tước đi cơ hội phát triển bản thân.',
  },
  {
    id: 'TT_8_002', title: 'Sức khỏe tâm thần tuổi học đường — Đừng im lặng một mình', author: 'BS. Nguyễn Thị Hoa', source: 'Báo Sức khỏe & Đời sống, suckhoedoisong.vn, 2024',
    class: 8, genre: 'thong_tin', subgenre: 'bai_bao', theme: 'con_nguoi', difficulty: 'vua',
    copyright_status: 'education_use', approved: true, wordCount: 155,
    excerpt: 'Theo khảo sát năm 2023, có đến 27% học sinh THCS tại Việt Nam từng trải qua các triệu chứng lo âu và căng thẳng học đường...',
    fullText: 'Theo khảo sát năm 2023, có đến 27% học sinh THCS tại Việt Nam từng trải qua các triệu chứng lo âu và căng thẳng học đường ở mức đáng lo ngại. Áp lực điểm số, kỳ vọng của gia đình, bạo lực học đường và sự cô đơn trên mạng xã hội là những nguyên nhân hàng đầu. Nhiều em không dám nói với ai vì sợ bị cho là "yếu đuối" hay bị hiểu lầm. Các chuyên gia khẳng định: sức khỏe tâm thần quan trọng không kém sức khỏe thể chất. Những dấu hiệu cần chú ý bao gồm: mất ngủ kéo dài, mất hứng học tập, thu mình khỏi bạn bè, hay cáu gắt hoặc buồn bã không rõ lý do. Nếu thấy những dấu hiệu này ở bản thân hoặc bạn bè, hãy tìm đến người tin tưởng để chia sẻ — đó là bước đầu tiên và can đảm nhất.',
  },
  {
    id: 'TT_8_003', title: 'Rác thải điện tử — Trách nhiệm của thế hệ số', author: 'Nguyễn Phương Linh', source: 'Báo Khoa học & Đời sống, 2025',
    class: 8, genre: 'thong_tin', subgenre: 'bai_bao', theme: 'moi_truong', difficulty: 'kho',
    copyright_status: 'education_use', approved: true, wordCount: 285,
    excerpt: 'Mỗi năm, thế giới thải ra hơn 53 triệu tấn rác điện tử — bao gồm điện thoại cũ, máy tính hỏng, tai nghe, pin lithium...',
    fullText: 'Mỗi năm, thế giới thải ra hơn 53 triệu tấn rác điện tử — bao gồm điện thoại cũ, máy tính hỏng, tai nghe, pin lithium. Tại Việt Nam, con số này tăng gần 20% chỉ trong vòng ba năm gần đây. Đáng lo ngại hơn, chưa đến 20% lượng rác đó được xử lý đúng cách.\n\nRác điện tử chứa nhiều kim loại độc hại: chì trong màn hình CRT, thủy ngân trong đèn huỳnh quang, cadmium trong pin sạc. Khi chôn lấp không đúng kỹ thuật, các chất này ngấm vào đất và nước ngầm, gây ô nhiễm nguồn nước sinh hoạt trong hàng chục năm. Một viên pin điện thoại có thể làm ô nhiễm 600.000 lít nước nếu không được tái chế đúng cách.\n\nTuy nhiên, vấn đề không chỉ nằm ở công nghệ xử lý. Thói quen tiêu dùng "thay máy mỗi năm" và áp lực từ các chiến dịch marketing công nghệ đang thúc đẩy vòng đời thiết bị ngày càng ngắn lại. Mỗi chiếc điện thoại mới tiêu thụ lượng điện đủ dùng cho một hộ gia đình trong hai tuần.\n\nThế hệ số — những người sinh ra cùng với internet — chính là thế hệ tạo ra nhiều rác điện tử nhất. Nhưng đây cũng là thế hệ có đủ kiến thức và công cụ để thay đổi. Mỗi quyết định mua sắm thông minh, mỗi lần sửa chữa thay vì vứt bỏ, mỗi thiết bị cũ được nộp vào điểm thu gom đều là một hành động cụ thể bảo vệ môi trường sống chung.',
  },
  {
    id: 'TT_9_002', title: 'Đô thị hóa và bảo tồn văn hóa truyền thống', author: 'PGS.TS. Trần Văn Hùng', source: 'Tạp chí Văn hóa Nghệ thuật, 2024',
    class: 9, genre: 'thong_tin', subgenre: 'bai_bao', theme: 'van_hoa', difficulty: 'kho',
    copyright_status: 'education_use', approved: true, wordCount: 160,
    excerpt: 'Tốc độ đô thị hóa tại Việt Nam đang diễn ra nhanh chưa từng có trong lịch sử...',
    fullText: 'Tốc độ đô thị hóa tại Việt Nam đang diễn ra nhanh chưa từng có trong lịch sử. Chỉ trong hai thập kỷ qua, tỷ lệ dân số đô thị đã tăng từ 23% lên gần 40%. Những con phố cổ, làng nghề truyền thống, đình làng, hội hè bắt đầu nhường chỗ cho chung cư cao tầng và trung tâm thương mại. Một bộ phận người trẻ ngày nay không còn biết hát dân ca, không biết về phong tục tập quán của cha ông. Tuy nhiên, nhiều địa phương đã thành công trong việc kết hợp phát triển kinh tế với bảo tồn văn hóa. Hội An, Huế, Hà Nội phố cổ là những ví dụ điển hình. Điều quan trọng là mỗi người trẻ cần hiểu rằng: bảo tồn văn hóa không phải là cản trở phát triển, mà là cách để giữ gìn bản sắc dân tộc trong dòng chảy toàn cầu hóa.',
  },
  {
    id: 'TT_9_003', title: 'Nước sạch — Cuộc khủng hoảng thầm lặng toàn cầu', author: 'UNICEF Việt Nam', source: 'unicef.org/vietnam, 2024',
    class: 9, genre: 'thong_tin', subgenre: 'bai_bao', theme: 'moi_truong', difficulty: 'kho',
    copyright_status: 'education_use', approved: true, wordCount: 165,
    excerpt: 'Hiện có hơn 2 tỷ người trên thế giới không được tiếp cận nước uống an toàn...',
    fullText: 'Hiện có hơn 2 tỷ người trên thế giới không được tiếp cận nước uống an toàn — tương đương gần 1/4 dân số toàn cầu. Tại Việt Nam, dù tỷ lệ người dùng nước sạch ở đô thị đạt 95%, khu vực nông thôn miền núi vẫn còn 20-30% hộ gia đình thiếu nước hợp vệ sinh. Ô nhiễm nước từ hoạt động nông nghiệp (thuốc trừ sâu, phân bón), công nghiệp (kim loại nặng) và sinh hoạt (rác thải nhựa, nước thải chưa xử lý) ngày càng nghiêm trọng. Biến đổi khí hậu làm tình trạng này tồi tệ hơn khi hạn hán và lũ lụt xảy ra thường xuyên hơn. Nước không chỉ là nhu cầu sinh tồn mà còn là nền tảng cho y tế, giáo dục và phát triển kinh tế. Mỗi đồng đầu tư vào nước sạch mang lại lợi ích kinh tế gấp 4 đến 8 lần theo tính toán của Ngân hàng Thế giới.',
  },

    fullText: 'Tình bạn là một trong những mối quan hệ đẹp đẽ và quý giá nhất trong cuộc đời mỗi người. Người bạn tốt là người sẵn sàng ở bên ta trong lúc khó khăn, không chỉ khi ta vui vẻ thành công. Bạn tốt giúp ta nhìn ra điểm mạnh của bản thân và can đảm nói ra những điểm yếu ta cần sửa. Tuy nhiên, tình bạn cũng cần được vun đắp bằng sự trung thực, tôn trọng và sẻ chia. Một tình bạn thật sự không phụ thuộc vào vật chất hay địa vị, mà được xây dựng trên sự tin tưởng lẫn nhau. Trong cuộc sống, có khi chỉ cần một người bạn hiểu ta, chúng ta đã thấy cuộc đời nhẹ nhàng và đáng sống hơn rất nhiều.',

  {

    excerpt: 'Học không phải chỉ để có bằng cấp. Học là để trở thành người có ích, biết tự lo cho mình và giúp ích cho đời...',
    fullText: 'Học không phải chỉ để có bằng cấp. Học là để trở thành người có ích, biết tự lo cho mình và giúp ích cho đời. Người học thật sự không bao giờ thỏa mãn với kiến thức đã có, luôn tự hỏi "tại sao" và "để làm gì". Học trong sách vở chỉ là một phần; học trong cuộc sống — từ mỗi trải nghiệm, mỗi thất bại, mỗi người ta gặp — mới là học suốt đời. Nhiều người có bằng đại học mà không biết học thật sự là gì; ngược lại, nhiều người không qua trường lớp nhưng lại có kiến thức sâu rộng và trí tuệ minh mẫn nhờ tự học. Điều quan trọng nhất không phải là học bao nhiêu, mà là học để sống tốt hơn, suy nghĩ sâu hơn và yêu người hơn.',
  },
  {
    id: 'NL_8_002', title: 'Lòng dũng cảm trong cuộc sống hiện đại', author: 'Biên soạn giáo dục (ngữ liệu giả định)', source: 'Ngữ liệu tham khảo GDPT 2018',

    copyright_status: 'education_use', approved: true, wordCount: 135,
    excerpt: 'Dũng cảm không phải là không sợ hãi. Dũng cảm là biết sợ nhưng vẫn dám làm điều đúng...',
    fullText: 'Dũng cảm không phải là không sợ hãi. Dũng cảm là biết sợ nhưng vẫn dám làm điều đúng. Trong xã hội hiện đại, lòng dũng cảm không chỉ thể hiện ở chiến trường hay thiên tai. Dũng cảm là dám nói sự thật khi xung quanh ai cũng im lặng; dũng cảm là dám thừa nhận sai lầm thay vì đổ lỗi cho người khác; dũng cảm là dám bảo vệ bạn bị bắt nạt dù biết có thể bị ghét. Đặc biệt trong kỷ nguyên mạng xã hội, khi một bình luận tiêu cực có thể lan ra hàng nghìn người trong vài phút, dũng cảm còn là biết nói "không" với những trào lưu sai trái và bảo vệ người bị tấn công không công. Lòng dũng cảm không tự nhiên có, mà cần được rèn luyện từ những việc nhỏ hằng ngày.',
  },

// 📊 Ước tính dung lượng đang dùng của kho dữ liệu này (byte). Giới hạn trình duyệt ~5MB.
const STORAGE_LIMIT_BYTES = 5 * 1024 * 1024;
const getStorageUsage = () => {
  try {
    let total = 0;
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      const v = localStorage.getItem(k) || '';
      total += (k.length + v.length) * 2; // UTF-16: 2 byte/ký tự

    return { totalBytes: total, appBytes, limitBytes: STORAGE_LIMIT_BYTES, percent: Math.min(100, Math.round(total / STORAGE_LIMIT_BYTES * 100)) };
  } catch { return { totalBytes: 0, appBytes: 0, limitBytes: STORAGE_LIMIT_BYTES, percent: 0 }; }
};

// 🗜️ Nén ảnh trước khi lưu: thu nhỏ + chuyển JPEG để không làm đầy bộ nhớ (ảnh 4MB → ~200-400KB)
const compressImageDataURL = (dataURL, maxDim = 1400, quality = 0.6) => new Promise((resolve) => {
  try {
    const img = new Image();
    img.onload = () => {
      try {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      } catch { resolve(dataURL); }
    };
    img.onerror = () => resolve(dataURL);
    img.src = dataURL;
  } catch { resolve(dataURL); }
});

// ============== 💾 LƯU RA FILE THẬT TRÊN MÁY (File System Access API) ==============
// Cho phép app ghi toàn bộ dữ liệu vào 1 file .json trong thư mục cô chọn trên máy này.
// Chạy trên Chrome / Cốc Cốc / Edge khi mở qua localhost hoặc web (không chạy khi mở bằng file://).
const FS_SUPPORTED = typeof window !== 'undefined' && 'showDirectoryPicker' in window;
const FS_FILE_NAME = 'TroLyGiaoVien_DuLieu.json';
let fsDirHandle = null;

// -- IndexedDB nhỏ để NHỚ thư mục cô đã chọn (giữ qua các lần mở lại app) --
const idbOpen = () => new Promise((resolve, reject) => {
  const req = indexedDB.open('trolygv_fs', 1);
  req.onupgradeneeded = () => req.result.createObjectStore('handles');
  req.onsuccess = () => resolve(req.result);
  req.onerror = () => reject(req.error);
});
const idbSet = async (key, val) => { const db = await idbOpen(); return new Promise((res, rej) => { const tx = db.transaction('handles', 'readwrite'); tx.objectStore('handles').put(val, key); tx.oncomplete = () => res(true); tx.onerror = () => rej(tx.error); }); };
const idbGet = async (key) => { const db = await idbOpen(); return new Promise((res, rej) => { const tx = db.transaction('handles', 'readonly'); const r = tx.objectStore('handles').get(key); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); };
const idbDel = async (key) => { const db = await idbOpen(); return new Promise((res) => { const tx = db.transaction('handles', 'readwrite'); tx.objectStore('handles').delete(key); tx.oncomplete = () => res(true); tx.onerror = () => res(false); }); };

const fsQueryPermission = async (handle) => { try { return await handle.queryPermission({ mode: 'readwrite' }); } catch { return 'prompt'; } };
const fsRequestPermission = async (handle) => { try { return await handle.requestPermission({ mode: 'readwrite' }); } catch { return 'denied'; } };

// Chọn thư mục lưu (cần cô bấm nút — trình duyệt bắt buộc)
const fsPickDirectory = async () => {
  if (!FS_SUPPORTED) throw new Error('Trình duyệt này không hỗ trợ lưu ra thư mục. Hãy dùng Chrome hoặc Cốc Cốc và mở app qua nút "Mở Trợ Lý".');
  const handle = await window.showDirectoryPicker({ id: 'trolygv', mode: 'readwrite' });
  const perm = (await fsQueryPermission(handle)) === 'granted' ? 'granted' : await fsRequestPermission(handle);
  if (perm !== 'granted') throw new Error('Cô chưa cho phép ghi vào thư mục.');
  fsDirHandle = handle;
  try { await idbSet('dataDir', handle); } catch {}
  return handle;
};

// Khôi phục thư mục đã chọn lần trước (không hiện hộp thoại — chỉ lấy lại "địa chỉ")
const fsRestoreDirectory = async () => {
  try { const h = await idbGet('dataDir'); if (h) { fsDirHandle = h; return h; } } catch {}
  return null;
};
const fsForget = async () => { fsDirHandle = null; try { await idbDel('dataDir'); } catch {} };

// Ghi dữ liệu ra file (chỉ ghi khi đã được cấp quyền)
const fsWriteData = async (payload) => {
  if (!fsDirHandle) return false;
  try {
    if ((await fsQueryPermission(fsDirHandle)) !== 'granted') return false;
    const fh = await fsDirHandle.getFileHandle(FS_FILE_NAME, { create: true });
    const w = await fh.createWritable();
    await w.write(JSON.stringify({ _meta: { app: 'TroLyGiaoVien', version: APP_VERSION, savedAt: new Date().toISOString() }, ...payload }, null, 2));
    await w.close();
    return true;
  } catch (e) { console.error('Lỗi ghi file trên máy:', e); return false; }
};
let __fsWriteTimer = null;
const fsWriteDataDebounced = (payload) => { if (__fsWriteTimer) clearTimeout(__fsWriteTimer); __fsWriteTimer = setTimeout(() => fsWriteData(payload), 800); };

// Đọc dữ liệu từ file (nếu cần quyền sẽ xin — nên gọi từ trong sự kiện bấm nút)
const fsReadData = async () => {
  if (!fsDirHandle) return null;
  try {
    if ((await fsQueryPermission(fsDirHandle)) !== 'granted') { if ((await fsRequestPermission(fsDirHandle)) !== 'granted') return null; }
    const fh = await fsDirHandle.getFileHandle(FS_FILE_NAME, { create: false });
    const file = await fh.getFile();
    const text = await file.text();
    return JSON.parse(text);
  } catch { return null; }
};

// Ghi payload lên Firestore: chia JSON thành nhiều mảnh trong users/{uid}/chunks
let __fbWriteTimer = null, __fbLastJson = '';
const fbWriteDataNow = async (uid, payload) => {
  if (!fbReady || !uid) return false;
  try {
    const json = JSON.stringify(payload);
    __fbLastJson = json;
    const parts = [];
    for (let i = 0; i < json.length; i += FB_CHUNK) parts.push(json.slice(i, i + FB_CHUNK));
    const userRef = fbDb.collection('users').doc(uid);
    const batch = fbDb.batch();
    parts.forEach((s, i) => batch.set(userRef.collection('chunks').doc('c' + i), { s }));
    batch.set(userRef, { chunkCount: parts.length, updatedAt: Date.now(), size: json.length });
    await batch.commit();
    // dọn các mảnh cũ dư (nếu lần trước nhiều mảnh hơn)
    try {
      const old = await userRef.collection('chunks').get();
      const delBatch = fbDb.batch();
      old.forEach(d => { const n = parseInt(d.id.slice(1), 10); if (n >= parts.length) delBatch.delete(d.ref); });
      await delBatch.commit();
    } catch {}
    return true;
  } catch (e) { console.error('Lỗi ghi đám mây:', e); return false; }
};
const fbWriteDataDebounced = (uid, payload) => {
  if (!fbReady || !uid) return;
  if (__fbWriteTimer) clearTimeout(__fbWriteTimer);
  __fbWriteTimer = setTimeout(() => fbWriteDataNow(uid, payload), 900);
};

// Đọc payload từ Firestore (ghép các mảnh lại)
const fbReadData = async (uid) => {
  if (!fbReady || !uid) return null;
  try {
    const userRef = fbDb.collection('users').doc(uid);
    const meta = await userRef.get();
    if (!meta.exists) return null;
    const n = (meta.data() || {}).chunkCount || 0;
    if (!n) return null;
    let json = '';
    for (let i = 0; i < n; i++) {
      const c = await userRef.collection('chunks').doc('c' + i).get();
      json += (c.exists ? (c.data().s || '') : '');
    }
    if (!json) return null;
    __fbLastJson = json;
    return JSON.parse(json);
  } catch (e) { console.error('Lỗi đọc đám mây:', e); return null; }
};

const GROQ_API_URL = 'https://api.groq.com/openai/v1/chat/completions';
const GROQ_MODEL = 'openai/gpt-oss-120b';

const getGroqApiKey = () => (localStorage.getItem('groq_api_key') || '').trim();
const saveGroqApiKey = (key) => localStorage.setItem('groq_api_key', (key || '').trim());
const getClaudeApiKey = () => (localStorage.getItem('claude_api_key') || '').trim();
const saveClaudeApiKey = (key) => localStorage.setItem('claude_api_key', (key || '').trim());
const CLAUDE_MODEL = 'claude-opus-4-8'; // model Claude cho tác vụ nặng
const getOllamaUrl = () => localStorage.getItem('ollama_url') || 'http://localhost:11434';
const saveOllamaUrl = (url) => localStorage.setItem('ollama_url', url);
const getUseOllama = () => localStorage.getItem('use_ollama') === 'true';
const setUseOllama = (val) => localStorage.setItem('use_ollama', val ? 'true' : 'false');

const callGroqAPI = async (prompt, maxTokens = 500) => {
  // 🔀 Tôn trọng NGUỒN AI cô đã chọn trong Cài đặt:
  //   - Chọn Claude  -> dùng Claude (chất lượng cao, chạy trên web qua cửa Netlify)
  //   - Chọn Ollama  -> dùng Ollama
  //   - Còn lại      -> dùng Groq (bên dưới)
  const provider = localStorage.getItem('selectedAIProvider') || '';
  if (provider === 'claude' && getClaudeApiKey()) return callClaudeAPI(prompt, maxTokens);

  const useOllama = getUseOllama();
  if (provider === 'ollama' || useOllama) return callOllamaAPI(prompt, maxTokens);

  const apiKey = getGroqApiKey();
  if (!apiKey) return { error: '❌ Chưa nhập Groq API Key' };

  try {
    const response = await fetch(GROQ_API_URL, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${apiKey}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: GROQ_MODEL,
        messages: [{ role: 'user', content: prompt }],
        max_tokens: maxTokens,
        temperature: 0.7
      })
    });

    if (!response.ok) {
      const errData = await response.json().catch(() => ({}));
      return { error: `❌ Groq API lỗi: ${errData.error?.message || 'Không xác định'}` };
    }
    const data = await response.json();
    return { success: true, text: data.choices[0].message.content };
  } catch (e) {
    return { error: `❌ Lỗi: ${e.message}` };
  }
};

const callOllamaAPI = async (prompt, maxTokens = 500) => {
  const ollamaUrl = localStorage.getItem('ollama_url') || 'http://localhost:11434';
  const selectedModel = localStorage.getItem('ollama_model') || 'mistral:latest';

  try {
    console.log(`📡 Ollama: Gọi ${selectedModel} ở ${ollamaUrl}`);

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 120000); // 2 min timeout

    const response = await fetch(`${ollamaUrl}/api/generate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: selectedModel,
        prompt: prompt,
        stream: false,
        temperature: 0.7,
        num_predict: Math.min(maxTokens, 2000)
      }),
      mode: 'cors',
      signal: controller.signal
    });

    clearTimeout(timeoutId);

    if (!response.ok) {
      console.error(`❌ Ollama HTTP ${response.status}`);
      return { success: false, error: `❌ Ollama HTTP ${response.status}\n💡 Ollama có chạy ở ${ollamaUrl} không?` };
    }

    const data = await response.json();
    if (!data.response) {
      console.warn('⚠️ Ollama trả về response rỗng');
      return { success: false, error: '❌ Ollama không trả lời. Model có bị crash không?' };
    }

    console.log(`✅ Ollama OK: ${data.response.length} ký tự`);
    return { success: true, text: data.response };
  } catch (e) {
    console.error('Ollama error:', e.message);

    if (e.name === 'AbortError') {
      return { success: false, error: '⏱️ Timeout! Ollama chạy quá lâu (>2 phút). Model quá nặng?' };
    }

    return { success: false, error: `❌ Lỗi kết nối Ollama: ${e.message}\n✅ Chạy: ollama serve` };
  }
};

// ============== CLAUDE API ==============
// Gọi THẲNG Anthropic từ trình duyệt (header 'anthropic-dangerous-direct-browser-access').
// Ưu điểm: không qua máy chủ trung gian -> KHÔNG bị giới hạn 10 giây, chạy trên mọi máy.
const callClaudeAPI = async (prompt, maxTokens = 1024) => {
  const apiKey = getClaudeApiKey();
  if (!apiKey) return { error: '❌ Chưa nhập Claude API Key' };

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: CLAUDE_MODEL,
        max_tokens: maxTokens,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      const msg = (data && data.error && data.error.message) || ('HTTP ' + response.status);
      return { error: `❌ Claude API lỗi: ${msg}` };
    }
    const text = (data.content || [])
      .filter(b => b.type === 'text')
      .map(b => b.text)
      .join('')
      .trim();
    return { success: true, text: text || '(Claude không trả về nội dung)' };
  } catch (e) {
    return { error: `❌ Lỗi kết nối Claude: ${e.message}` };
  }
};

// ============== AI CHẤM BÀI TỰ ĐỘNG ==============
const chamBaiTuDong = (text, loaiBai, topic = '') => {
  const tieuChi = TIEU_CHI_CHAM[loaiBai] || TIEU_CHI_CHAM.baivan;
  const loaiBaiInfo = LOAI_BAI_CHAM.find(l => l.id === loaiBai);

  // Phân tích cơ bản
  const words = text.trim().split(/\s+/).filter(w => w.length > 0);
  const wordCount = words.length;
  const sentences = text.split(/[.!?\n]+/).filter(s => s.trim().length > 5);
  const sentenceCount = sentences.length;
  const paragraphs = text.split(/\n\s*\n/).filter(p => p.trim().length > 0);
  const paragraphCount = paragraphs.length;

  // Kiểm tra chính tả
  const loiChinhTa = [];
  const textLower = text.toLowerCase();
  Object.entries(LOI_CHINH_TA_PHO_BIEN).forEach(([correct, wrongs]) => {
    wrongs.forEach(w => {
      const re = new RegExp('\\b' + w + '\\b', 'gi');
      const matches = textLower.match(re);
      if (matches) loiChinhTa.push({ sai: w, dung: correct, count: matches.length });
    });
  });

  // Kiểm tra liên kết câu
  const tuNoiDuocDung = TU_NOI.filter(t => textLower.includes(t));

  // Kiểm tra bố cục (cho bài văn)
  const coMoBai = paragraphs.length >= 2 && paragraphs[0].length > 50;
  const coKetBai = paragraphs.length >= 3 && paragraphs[paragraphs.length - 1].length > 30;
  const coThanBai = paragraphs.length >= 3;

  // Kiểm tra độ phong phú từ vựng (tỉ lệ từ độc nhất)
  const uniqueWords = new Set(words.map(w => w.toLowerCase()));
  const luongTuDocNhat = uniqueWords.size;
  const doPhongPhu = wordCount > 0 ? (luongTuDocNhat / wordCount) : 0;

  // Tính điểm theo từng tiêu chí
  const ketQua = tieuChi.map(tc => {
    let diem = tc.score;
    const nhanXet = [];
    let duoi = [];

    // Logic chấm cho từng tiêu chí
    if (tc.id === 'noidung' || tc.id === 'thanBai') {
      if (wordCount < (loaiBaiInfo?.minWords || 100)) {
        diem = Math.max(diem * 0.5, 0.5);
        nhanXet.push(`⚠️ Bài viết còn ngắn (${wordCount} từ, yêu cầu tối thiểu ${loaiBaiInfo?.minWords || 100} từ).`);
        duoi.push('Cần triển khai thêm ý, mở rộng lập luận');
      } else if (wordCount > (loaiBaiInfo?.maxWords || 500)) {
        diem = Math.max(diem * 0.85, diem - 0.5);
        nhanXet.push(`ℹ️ Bài viết hơi dài (${wordCount} từ), cần viết gọn hơn.`);
      } else {
        nhanXet.push(`✅ Độ dài bài phù hợp (${wordCount} từ).`);
      }
      if (doPhongPhu < 0.4) {
        diem = Math.max(diem * 0.8, diem - 0.5);
        nhanXet.push('⚠️ Từ vựng chưa phong phú, lặp lại nhiều.');
        duoi.push('Sử dụng đa dạng từ ngữ, tránh lặp');
      } else if (doPhongPhu > 0.6) {
        nhanXet.push('✅ Vốn từ phong phú, đa dạng.');
      }
    }

    if (tc.id === 'botcuc' || tc.id === 'moBai') {
      if (!coMoBai) {
        diem = Math.max(diem * 0.6, 0.5);
        nhanXet.push('⚠️ Mở bài chưa rõ ràng hoặc quá ngắn.');
        duoi.push('Cần giới thiệu đối tượng/vấn đề rõ hơn, dẫn dắt tự nhiên');
      } else {
        nhanXet.push('✅ Có mở bài dẫn dắt.');
      }
    }

    if (tc.id === 'ketBai') {
      if (!coKetBai) {
        diem = Math.max(diem * 0.5, 0.3);
        nhanXet.push('⚠️ Thiếu kết bài hoặc kết bài quá ngắn.');
        duoi.push('Viết kết bài khái quát lại vấn đề, nêu cảm xúc/bài học');
      } else {
        nhanXet.push('✅ Có kết bài rõ ràng.');
      }
    }

    if (tc.id === 'dienDat') {
      if (tuNoiDuocDung.length === 0 && wordCount > 100) {
        diem = Math.max(diem * 0.7, diem - 0.5);
        nhanXet.push('⚠️ Thiếu từ nối, liên kết giữa các ý.');
        duoi.push('Sử dụng từ nối như "tuy nhiên", "bên cạnh đó", "vì vậy"...');
      } else if (tuNoiDuocDung.length > 0) {
        nhanXet.push(`✅ Sử dụng ${tuNoiDuocDung.length} từ nối: ${tuNoiDuocDung.slice(0, 3).join(', ')}.`);
      }
      const avgSentLen = wordCount / Math.max(sentenceCount, 1);
      if (avgSentLen > 30) {
        nhanXet.push('⚠️ Câu văn dài (TB ' + avgSentLen.toFixed(0) + ' từ/câu), có thể khó hiểu.');
        duoi.push('Tách câu dài thành câu ngắn gọn hơn');
      } else if (avgSentLen < 8) {
        nhanXet.push('⚠️ Câu văn ngắn, cần triển khai sâu hơn.');
      }
    }

    if (tc.id === 'chinhTa') {
      if (loiChinhTa.length > 0) {
        const tong = loiChinhTa.reduce((s, l) => s + l.count, 0);
        if (tong >= 5) diem = Math.max(diem * 0.3, 0);
        else if (tong >= 3) diem = Math.max(diem * 0.5, 0.5);
        else diem = Math.max(diem * 0.8, 0.5);
        nhanXet.push(`⚠️ Phát hiện ${tong} lỗi chính tả: ${loiChinhTa.slice(0, 3).map(l => `"${l.sai}" → "${l.dung}"`).join('; ')}.`);
        duoi.push('Kiểm tra lại chính tả cẩn thận, dùng từ điển khi cần');
      } else {
        nhanXet.push('✅ Không phát hiện lỗi chính tả rõ ràng.');
      }
    }

    if (tc.id === 'sangTao') {
      if (doPhongPhu > 0.55 && wordCount > (loaiBaiInfo?.minWords || 100)) {
        nhanXet.push('✅ Có dấu hiệu sáng tạo trong cách dùng từ.');
      } else {
        diem = Math.max(diem * 0.7, diem - 0.3);
        nhanXet.push('ℹ️ Cần thêm sự sáng tạo, góc nhìn cá nhân.');
        duoi.push('Đưa ra cảm xúc, trải nghiệm riêng của bản thân');
      }
    }

    if (tc.id === 'luanCu') {
      // Kiểm tra có dấu "/" hoặc dẫn chứng (chữ hoa giữa câu...)
      const coDanChung = /"[^"]+"|'[^']+'|theo \w+|như \w+/i.test(text);
      if (!coDanChung) {
        diem = Math.max(diem * 0.6, 0.5);
        nhanXet.push('⚠️ Thiếu dẫn chứng cụ thể.');
        duoi.push('Cần dẫn chứng từ tác phẩm hoặc thực tế để minh họa');
      } else {
        nhanXet.push('✅ Có dẫn chứng/trích dẫn.');
      }
    }

    if (tc.id === 'chinhXac' || tc.id === 'dayDu') {
      if (wordCount < 20) {
        diem = Math.max(diem * 0.4, 0.5);
        nhanXet.push('⚠️ Câu trả lời quá ngắn.');
        duoi.push('Triển khai câu trả lời đầy đủ hơn');
      } else {
        nhanXet.push('✅ Câu trả lời có độ dài phù hợp.');
      }
    }

    diem = Math.round(diem * 4) / 4; // Làm tròn 0.25

    return {
      ...tc,
      diemCham: diem,
      diemMax: tc.score,
      phanTram: (diem / tc.score * 100).toFixed(0),
      nhanXet: nhanXet.join(' '),
      goiYSuaChua: duoi,
    };
  });

  const tongDiem = ketQua.reduce((s, k) => s + k.diemCham, 0);
  const tongDiemMax = ketQua.reduce((s, k) => s + k.diemMax, 0);

  // Xếp loại
  let xepLoai = 'Trung bình', mauXepLoai = 'text-amber-600';
  const tiLe = tongDiem / tongDiemMax;
  if (tiLe >= 0.9) { xepLoai = 'Giỏi'; mauXepLoai = 'text-emerald-600'; }
  else if (tiLe >= 0.75) { xepLoai = 'Khá'; mauXepLoai = 'text-blue-600'; }
  else if (tiLe >= 0.5) { xepLoai = 'Trung bình'; mauXepLoai = 'text-amber-600'; }
  else { xepLoai = 'Yếu'; mauXepLoai = 'text-red-600'; }

  // Nhận xét tổng
  const nhanXetTong = [];
  nhanXetTong.push(`📝 **Tổng quan:** Bài viết có ${wordCount} từ, ${sentenceCount} câu, ${paragraphCount} đoạn.`);
  if (doPhongPhu > 0.55) nhanXetTong.push('✅ Vốn từ vựng khá phong phú.');
  else nhanXetTong.push('⚠️ Vốn từ cần trau dồi thêm.');
  if (loiChinhTa.length === 0) nhanXetTong.push('✅ Chính tả ổn.');
  else nhanXetTong.push(`⚠️ Có ${loiChinhTa.reduce((s,l)=>s+l.count,0)} lỗi chính tả cần sửa.`);
  if (tuNoiDuocDung.length >= 2) nhanXetTong.push('✅ Có liên kết giữa các câu/đoạn.');
  else nhanXetTong.push('⚠️ Cần thêm từ nối để liên kết ý.');

  return {
    tongDiem, tongDiemMax, xepLoai, mauXepLoai, tiLe,
    ketQua, nhanXetTong: nhanXetTong.join('\n'),
    thongKe: { wordCount, sentenceCount, paragraphCount, uniqueWords: luongTuDocNhat, doPhongPhu: (doPhongPhu * 100).toFixed(1), loiChinhTaCount: loiChinhTa.reduce((s, l) => s + l.count, 0), tuNoiCount: tuNoiDuocDung.length, coMoBai, coThanBai, coKetBai },
    loiChinhTa, tuNoiDuocDung
  };
};

const Header = ({ selectedClass, setSelectedClass, selectedBook, setSelectedBook, teacherName, setTeacherName, schoolName, setSchoolName, onMobileMenuToggle, setActive }) => {
  const now = new Date();
  const hour = now.getHours();
  const greet = hour < 11 ? 'Chào buổi sáng ☕' : hour < 13 ? 'Chào buổi trưa 🌿' : hour < 18 ? 'Chào buổi chiều 🌸' : 'Chào buổi tối 🌙';
  const dateStr = now.toLocaleDateString('vi-VN', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
  // AI provider badge
  const [aiProvider, setAiProvider] = React.useState('');
  React.useEffect(() => {
    const refresh = () => {
      const p = localStorage.getItem('selectedAIProvider') || '';
      // Ưu tiên đúng NGUỒN cô đã chọn; nếu chưa chọn thì đoán theo key có sẵn
      if (p === 'ollama' || getUseOllama()) setAiProvider('Ollama');
      else if (p === 'groq') setAiProvider(getGroqApiKey() ? 'Groq' : '');
      else if (p === 'claude') setAiProvider(getClaudeApiKey() ? 'Claude' : '');
      else if (getClaudeApiKey()) setAiProvider('Claude');
      else if (getGroqApiKey()) setAiProvider('Groq');
      else setAiProvider('');
    };
    refresh();
    window.addEventListener('focus', refresh);
    window.addEventListener('ai-provider-changed', refresh); // đổi nguồn trong Cài đặt -> cập nhật ngay
    return () => { window.removeEventListener('focus', refresh); window.removeEventListener('ai-provider-changed', refresh); };
  }, []);
  const providerColor = aiProvider === 'Groq' ? 'bg-amber-50 text-amber-700 border-amber-200' :
                        aiProvider === 'Claude' ? 'bg-rose-50 text-rose-700 border-rose-200' :
                        aiProvider === 'Ollama' ? 'bg-teal-50 text-teal-700 border-teal-200' :
                        'bg-slate-50 text-slate-500 border-slate-200';
  const providerIcon = aiProvider === 'Groq' ? '⚡' : aiProvider === 'Claude' ? '🤖' : aiProvider === 'Ollama' ? '🦙' : '❓';
  return (
    <header className="glass-header px-6 py-3 sticky top-0 z-20">
      <div className="flex flex-wrap items-center gap-3">
        {/* Nút menu mobile */}
        <button onClick={onMobileMenuToggle} className="mobile-menu-btn p-2 rounded-xl bg-rose-50 text-rose-600 hover:bg-rose-100 items-center justify-center">
          <Icon name="Menu" size={20} />
        </button>
        <div className="hidden md:block pr-4 border-r border-rose-100">
          <p className="text-[11px] text-rose-500 italic">{greet}</p>
          <p className="text-[12px] font-medium text-amber-900 capitalize">{dateStr}</p>
        </div>
        <div className="flex-1 min-w-[150px] relative">
          <Icon name="User" size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-rose-300" />
          <input placeholder="Họ tên giáo viên..." value={teacherName} onChange={e => setTeacherName(e.target.value)} className="w-full pl-9 pr-3 py-2 border border-rose-100 bg-white/80 rounded-xl text-sm text-amber-900" />
        </div>
        <div className="flex-1 min-w-[150px] relative header-school-input">
          <Icon name="School" size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-teal-400" />
          <input placeholder="Tên trường..." value={schoolName} onChange={e => setSchoolName(e.target.value)} className="w-full pl-9 pr-3 py-2 border border-teal-100 bg-white/80 rounded-xl text-sm text-teal-900" />
        </div>
        <div>
          <select value={selectedClass} onChange={e => setSelectedClass(Number(e.target.value))} className="px-3 py-2 border border-amber-200 rounded-xl text-sm bg-amber-50/70 font-medium text-amber-900">
            {[6,7,8,9].map(c => <option key={c} value={c}>📚 Lớp {c}</option>)}
          </select>
        </div>
        <div className="header-book-select">
          <select value={selectedBook} onChange={e => setSelectedBook(e.target.value)} className="px-3 py-2 border border-teal-200 rounded-xl text-sm bg-teal-50/70 font-medium text-teal-900 max-w-[240px]">
            {SACH_GIAO_KHOA.map(b => <option key={b.id} value={b.id}>{b.ten}</option>)}
          </select>
        </div>
        {/* 🤖 AI Provider Badge */}
        <button onClick={() => setActive('settings')} title="Nhấn để vào cài đặt AI"
          className={`hidden sm:flex items-center gap-1.5 px-3 py-2 rounded-xl text-[12px] font-semibold border transition hover:shadow-sm ${providerColor}`}>
          <span>{providerIcon}</span>
          <span>{aiProvider || 'Chưa cài AI'}</span>
          <Icon name="Settings" size={12} />
        </button>
        <div className="flex items-center gap-1 pl-2 border-l border-rose-100">
          <button onClick={exportAllData} title="Xuất toàn bộ dữ liệu ra file .json"
            className="px-3 py-2 rounded-xl text-sm font-medium bg-gradient-to-r from-teal-600 to-teal-700 text-white hover:shadow-md flex items-center gap-1 transition">
            <Icon name="Download" size={14} /> <span className="hidden md:inline">Xuất</span>
          </button>
          <label title="Nhập dữ liệu từ file .json"
            className="px-3 py-2 rounded-xl text-sm font-medium bg-gradient-to-r from-rose-600 to-rose-700 text-white hover:shadow-md flex items-center gap-1 cursor-pointer transition">
            <Icon name="Upload" size={14} /> <span className="hidden md:inline">Nhập</span>
            <input type="file" accept="application/json,.json" className="hidden"
              onChange={(e) => { const f = e.target.files?.[0]; if (f) importAllData(f); e.target.value = ''; }} />
          </label>
        </div>
      </div>
    </header>
  );
};

const LessonModal = ({ subTab, item, data, setData, selectedClass, selectedBook, teacherName, schoolName, onClose }) => {
  const isEdit = !!item;
  const [form, setForm] = useState(item || { id: Date.now(), title: '', subtitle: '', grade: selectedClass, book: selectedBook, theme: '', lessonName: '', duration: '2 tiết', mucTieu: '', thietBi: '', hoatDong1: '', hoatDong2: '', hoatDong3: '', hoatDong4: '', phuLuc: '', slides: '', worksheetContent: '', activityContent: '', createdAt: new Date().toISOString() });
  const [showPreview, setShowPreview] = useState(false);
  const [showPptxDialog, setShowPptxDialog] = useState(false);
  const [pptxOptions, setPptxOptions] = useState({ style: 'professional', slideCount: 'auto', includeNotes: true, includeNumbers: true });
  const [isGeneratingPptx, setIsGeneratingPptx] = useState(false);
  const handleSave = () => {
    if (!form.title.trim()) { alert('Nhập tiêu đề'); return; }
    const list = data[subTab.dataKey] || [];
    setData({ ...data, [subTab.dataKey]: isEdit ? list.map(i => i.id === form.id ? form : i) : [...list, form] });
    onClose();
  };
  const generate = () => {
    const chuDe = form.theme || (CHU_DE_THEO_LOP[form.grade] || [])[0] || 'Chủ đề';
    setForm({ ...form, title: form.title || `Giáo án: ${form.lessonName || chuDe} - Lớp ${form.grade}`,
      mucTieu: `**1. Kiến thức:** Hiểu nội dung, nghệ thuật văn bản.\n**2. Năng lực:** ${NANG_LUC_DAC_THU.join('; ')}.\n**3. Phẩm chất:** ${PHAM_CHAT.join('; ')}.`,
      thietBi: `- SGK ${SACH_GIAO_KHOA.find(b => b.id === form.book)?.ten} Ngữ văn ${form.grade}\n- Máy chiếu, phiếu học tập.`,
      hoatDong1: `**HĐ1: MỞ ĐẦU (5p)**\nMục tiêu: Tạo hứng thú.\nNội dung: Xem video/tranh về "${chuDe}".`,
      hoatDong2: `**HĐ2: HÌNH THÀNH KIẾN THỨC (30p)**\nNV1: Tác giả, tác phẩm. NV2: Đọc-hiểu. NV3: Tổng kết.`,
      hoatDong3: `**HĐ3: LUYỆN TẬP (7p)**\nTrò chơi "Ai nhanh - Ai đúng".`,
      hoatDong4: `**HĐ4: VẬN DỤNG (3p)**\nViết đoạn 5-7 câu.`,
      phuLuc: `PHIẾU HỌC TẬP SỐ 1: Tác giả, thể loại, bố cục...`,
      slides: `Slide 1: Bìa\nSlide 2-4: Tác giả\nSlide 5-10: Phân tích\nSlide 11-13: Luyện tập`,
      worksheetContent: `PHIẾU HỌC TẬP\n1. PTBĐ? 2. Biện pháp tu từ? 3. Nội dung chính?`,
      activityContent: `HOẠT ĐỘNG TRẢI NGHIỆM (90p): Khai mạc → Vòng 1: Kiến thức → Vòng 2: Sân khấu hóa → Vòng 3: Viết → Tổng kết.` });
  };
  const generateAndExportPptx = async () => {
    if (!form.slides.trim()) { alert('Vui lòng nhập nội dung Outline trước'); return; }
    setIsGeneratingPptx(true);
    const prompt = `Bạn là một chuyên gia thiết kế slide. Hãy tạo nội dung cho ${pptxOptions.slideCount === 'auto' ? '5-7' : pptxOptions.slideCount} slide dựa trên outline sau:\n\n${form.slides}\n\nTRẢ VỀ ONLY JSON (KHÔNG CÓ MARKDOWN). Format:\n{"slides":[{"title":"Tiêu đề slide","bullets":["Điểm 1","Điểm 2"]}]}`;

    let aiResult = null;
    const useOllama = getUseOllama();
    if (useOllama) {
      aiResult = await callOllamaAPI(prompt, 800);
    }
    if (!aiResult || !aiResult.success) {
      const groqKey = getGroqApiKey();
      if (groqKey) {
        aiResult = await callGroqAPI(prompt, 800);
      }
    }

    if (aiResult && aiResult.success) {
      let slidesData = null;
      try {
        let jsonStr = aiResult.text.trim();
        const jsonMatch = jsonStr.match(/\{[\s\S]*\}/);
        if (jsonMatch) { jsonStr = jsonMatch[0]; }
        jsonStr = jsonStr.replace(/,(\s*[\]}])/g, '$1');
        slidesData = JSON.parse(jsonStr);
        if (!slidesData.slides || !Array.isArray(slidesData.slides)) { throw new Error('Format JSON không hợp lệ'); }

        const colorScheme = pptxOptions.style === 'colorful'
          ? { primary: '#0f766e', accent: '#be185d', bgFill: '#fdfaf6', textColor: '#333333' }
          : pptxOptions.style === 'minimalist'
          ? { primary: '#000000', accent: '#666666', bgFill: '#ffffff', textColor: '#000000' }
          : { primary: '#1a365d', accent: '#2c5282', bgFill: '#f7fafc', textColor: '#222222' };

        // ============ EXPORT PDF BẰNG jsPDF =============
        // Lấy jsPDF từ window
        const jsPDFLib = window.jspdf?.jsPDF || window.jsPDF;
        if (!jsPDFLib) {
          throw new Error('jsPDF không tìm thấy. Available: ' + Object.keys(window).filter(k => k.toLowerCase().includes('pdf')).join(', '));
        }

        const doc = new jsPDFLib('p', 'mm', 'a4');
        const pageWidth = doc.internal.pageSize.getWidth();
        const pageHeight = doc.internal.pageSize.getHeight();
        const margin = 15;
        let yPos = margin;

        // Set font
        doc.setFont('helvetica');

        // ===== SLIDE 1: TIÊU ĐỀ =====
        doc.setFillColor(parseInt(colorScheme.primary.slice(1, 3), 16), parseInt(colorScheme.primary.slice(3, 5), 16), parseInt(colorScheme.primary.slice(5, 7), 16));
        doc.rect(0, 0, pageWidth, pageHeight, 'F');

        // Tiêu đề
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(32);
        doc.text(form.title, pageWidth / 2, pageHeight / 2 - 20, { align: 'center' });

        // Subtitle
        doc.setFontSize(16);
        doc.text(form.subtitle || 'Outline Ngữ Văn', pageWidth / 2, pageHeight / 2 + 10, { align: 'center' });

        // ===== SLIDES NỘI DUNG =====
        slidesData.slides.forEach((slide, slideIdx) => {
          doc.addPage();
          yPos = margin;

          // Header màu
          const r = parseInt(colorScheme.primary.slice(1, 3), 16);
          const g = parseInt(colorScheme.primary.slice(3, 5), 16);
          const b = parseInt(colorScheme.primary.slice(5, 7), 16);
          doc.setFillColor(r, g, b);
          doc.rect(0, 0, pageWidth, 20, 'F');

          // Title
          doc.setTextColor(255, 255, 255);
          doc.setFontSize(18);
          doc.setFont('helvetica', 'bold');
          doc.text(slide.title || `Slide ${slideIdx + 2}`, margin, 14);
          yPos = 30;

          // Content
          doc.setTextColor(0, 0, 0);
          doc.setFontSize(12);
          doc.setFont('helvetica', 'normal');

          if (slide.bullets && Array.isArray(slide.bullets)) {
            slide.bullets.forEach(bullet => {
              if (yPos > pageHeight - margin - 10) {
                doc.addPage();
                yPos = margin;
              }
              const lines = doc.splitTextToSize('• ' + bullet, pageWidth - 2 * margin);
              doc.text(lines, margin, yPos);
              yPos += lines.length * 7 + 5;
            });
          }

          // Số slide
          if (pptxOptions.includeNumbers) {
            doc.setTextColor(100, 100, 100);
            doc.setFontSize(10);
            doc.text(`Slide ${slideIdx + 2}`, pageWidth - margin - 20, pageHeight - margin);
          }
        });

        // Download
        const fileName = `${form.title.replace(/\s+/g, '_')}_Outline.pdf`;
        doc.save(fileName);

        setShowPptxDialog(false);
        setIsGeneratingPptx(false);
        alert('✅ Slide PDF tạo thành công!\n\n📥 File đang tải về: ' + fileName);
      } catch (e) {
        setIsGeneratingPptx(false);
        console.error('Error details:', e);
        alert('❌ Lỗi: ' + e.message + '\n\nDebug: ' + JSON.stringify({aiSuccess: !!aiResult, slidesCount: slidesData?.slides?.length}));
      }
    } else {
      setIsGeneratingPptx(false);
      alert('❌ Lỗi AI: ' + (aiResult?.error || 'Không thể kết nối AI') + '\n\nUseOllama: ' + getUseOllama());
    }
  };
  const isLesson = subTab.id === 'lesson', isSlide = subTab.id === 'slide', isWorksheet = subTab.id === 'worksheet', isActivity = subTab.id === 'practice';
  return (
    <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50 modal-overlay">
      <div className="bg-white rounded-xl w-full max-w-6xl max-h-[95vh] overflow-hidden flex flex-col modal-box">
        <div className="p-5 border-b flex items-center justify-between">
          <h3 className="text-xl font-bold">{isEdit ? 'Sửa' : 'Tạo'} {subTab.label}</h3>
          <div className="flex items-center gap-2">
            <button onClick={() => setShowPreview(!showPreview)} className="px-3 py-1.5 bg-slate-100 rounded text-sm flex items-center gap-1"><Icon name={showPreview ? 'Edit' : 'Eye'} size={16} /> {showPreview ? 'Chỉnh sửa' : 'Xem trước'}</button>
            <button onClick={onClose} className="p-2 hover:bg-slate-100 rounded"><Icon name="X" size={20} /></button>
          </div>
        </div>
        <div className="flex-1 overflow-y-auto scrollbar p-5">
          <div style={{ display: showPreview ? 'none' : 'block' }} className="space-y-4">
            <div className="grid grid-cols-2 gap-4">
              <div><label className="block text-sm font-medium mb-1">Tiêu đề *</label><input value={form.title} onChange={e => setForm({ ...form, title: e.target.value })} className="w-full px-3 py-2 border rounded-lg" /></div>
              <div><label className="block text-sm font-medium mb-1">Lớp</label><select value={form.grade} onChange={e => setForm({ ...form, grade: Number(e.target.value) })} className="w-full px-3 py-2 border rounded-lg bg-white">{[6,7,8,9].map(c => <option key={c} value={c}>Lớp {c}</option>)}</select></div>
              <div><label className="block text-sm font-medium mb-1">Chủ đề</label><select value={form.theme} onChange={e => setForm({ ...form, theme: e.target.value })} className="w-full px-3 py-2 border rounded-lg bg-white"><option value="">--</option>{(CHU_DE_THEO_LOP[form.grade] || []).map(c => <option key={c} value={c}>{c}</option>)}</select></div>
              <div><label className="block text-sm font-medium mb-1">Tên bài</label><input value={form.lessonName} onChange={e => setForm({ ...form, lessonName: e.target.value })} className="w-full px-3 py-2 border rounded-lg" /></div>
              <div><label className="block text-sm font-medium mb-1">Thời lượng</label><input value={form.duration} onChange={e => setForm({ ...form, duration: e.target.value })} className="w-full px-3 py-2 border rounded-lg" /></div>
              <div><label className="block text-sm font-medium mb-1">Mô tả</label><input value={form.subtitle} onChange={e => setForm({ ...form, subtitle: e.target.value })} className="w-full px-3 py-2 border rounded-lg" /></div>
            </div>
            <button onClick={generate} className="bg-gradient-to-r from-emerald-500 to-teal-500 text-white px-4 py-2 rounded-lg flex items-center gap-2 font-medium"><Icon name="Sparkles" size={18} /> Tự động tạo theo CV 5512</button>
            {isLesson && ['mucTieu','thietBi','hoatDong1','hoatDong2','hoatDong3','hoatDong4','phuLuc'].map((f, i) => (
              <div key={f}><label className="block text-sm font-medium mb-1">{['I. MỤC TIÊU','II. THIẾT BỊ','III.1. MỞ ĐẦU','III.2. HÌNH THÀNH KT','III.3. LUYỆN TẬP','III.4. VẬN DỤNG','IV. PHỤ LỤC'][i]}</label><textarea value={form[f]} onChange={e => setForm({ ...form, [f]: e.target.value })} rows={4} className="w-full px-3 py-2 border rounded-lg font-mono text-sm" /></div>
            ))}
            {isSlide && <div><label className="block text-sm font-medium mb-1">CẤU TRÚC SLIDE</label><textarea value={form.slides} onChange={e => setForm({ ...form, slides: e.target.value })} rows={12} className="w-full px-3 py-2 border rounded-lg font-mono text-sm" /></div>}
            {isWorksheet && <div><label className="block text-sm font-medium mb-1">PHIẾU HỌC TẬP</label><textarea value={form.worksheetContent} onChange={e => setForm({ ...form, worksheetContent: e.target.value })} rows={12} className="w-full px-3 py-2 border rounded-lg font-mono text-sm" /></div>}
            {isActivity && <div><label className="block text-sm font-medium mb-1">HOẠT ĐỘNG TRẢI NGHIỆM</label><textarea value={form.activityContent} onChange={e => setForm({ ...form, activityContent: e.target.value })} rows={12} className="w-full px-3 py-2 border rounded-lg font-mono text-sm" /></div>}
          </div>
          <div id={'lesson-preview-' + form.id} className="bg-white p-8 border rounded-lg" style={{ fontFamily: 'Times New Roman, serif', display: showPreview ? 'block' : 'none' }}>
            <div className="text-center mb-6">
              <p className="font-bold">TRƯỜNG {schoolName?.toUpperCase() || 'THCS ...'}</p>
              <p className="italic text-sm">Giáo viên: {teacherName || '...'}</p>
              <h1 className="text-2xl font-bold mt-4 uppercase">{subTab.label.toUpperCase()}</h1>
              <p className="font-bold mt-1">{form.title}</p>
              <p className="text-sm mt-1">Ngữ văn {form.grade} - {form.duration}</p>
            </div>
            <div className="space-y-4 text-sm" style={{whiteSpace:'pre-wrap'}}>
              {isLesson && <>
                <section><h3 className="font-bold text-base">I. MỤC TIÊU</h3>{form.mucTieu}</section>
                <section><h3 className="font-bold text-base">II. THIẾT BỊ</h3>{form.thietBi}</section>
                <section><h3 className="font-bold text-base">III. TIẾN TRÌNH</h3>{form.hoatDong1}{"\n\n"}{form.hoatDong2}{"\n\n"}{form.hoatDong3}{"\n\n"}{form.hoatDong4}</section>
                <section><h3 className="font-bold text-base">IV. PHỤ LỤC</h3>{form.phuLuc}</section>
              </>}
              {isSlide && <section>{form.slides}</section>}
              {isWorksheet && <section>{form.worksheetContent}</section>}
              {isActivity && <section>{form.activityContent}</section>}
            </div>
          </div>
        </div>
        <div className="p-4 border-t flex items-center justify-between bg-slate-50">
          <div className="flex gap-2">
            <button onClick={() => exportToPDF('lesson-preview-' + form.id, `GiaoAn_${form.title.replace(/\s+/g, '_')}`)} className="px-4 py-2 bg-red-500 text-white rounded-lg flex items-center gap-2"><Icon name="FileText" size={16} /> PDF</button>
            <button onClick={() => exportToWord('lesson-preview-' + form.id, `GiaoAn_${form.title.replace(/\s+/g, '_')}`)} className="px-4 py-2 bg-blue-600 text-white rounded-lg flex items-center gap-2"><Icon name="FileDown" size={16} /> Word</button>
            {isSlide && <button onClick={() => setShowPptxDialog(true)} disabled={isGeneratingPptx} className="px-4 py-2 bg-orange-500 hover:bg-orange-600 disabled:bg-gray-400 text-white rounded-lg flex items-center gap-2"><Icon name="Presentation" size={16} /> {isGeneratingPptx ? '⏳ Đang tạo...' : '📊 PowerPoint'}</button>}
          </div>
          <div className="flex gap-2"><button onClick={onClose} className="px-4 py-2 bg-slate-200 rounded-lg">Hủy</button><button onClick={handleSave} className="px-4 py-2 bg-emerald-600 text-white rounded-lg flex items-center gap-2"><Icon name="Save" size={16} /> Lưu</button></div>
        </div>
      </div>
      {showPptxDialog && (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-[60] modal-overlay">
          <div className="bg-white rounded-xl w-full max-w-md p-6 space-y-4 modal-box">
            <h3 className="text-xl font-bold">📊 Tùy chọn PowerPoint</h3>
            <div>
              <label className="block text-sm font-medium mb-2">🎨 Style</label>
              <div className="space-y-2">
                {['professional', 'colorful', 'minimalist'].map(s => (
                  <label key={s} className="flex items-center gap-2 cursor-pointer">
                    <input type="radio" checked={pptxOptions.style === s} onChange={() => setPptxOptions({...pptxOptions, style: s})} />

const ExamModal = ({ item, data, setData, selectedClass, selectedBook, teacherName, schoolName, onClose }) => {

    matrixConfig: { dochieu: { nb: 2, th: 2, vd: 1, vdc: 0 }, viet: { nb: 0, th: 0, vd: 1, vdc: 0 } },

  const [showPreview, setShowPreview] = useState(false);

  const isVao10 = form.examType === 'vao10';

  const generateAnswerKeyAI = async () => {

    setGeneratingAnswer(true);
    try {
      const phan1 = form.questions.filter(q => q.phan === 1 || (!q.phan && q.field === 'dochieu'));
      const phan2 = form.questions.filter(q => q.phan === 2 || (!q.phan && q.field === 'viet'));
      const loaiTen = LOAI_DE.find(l => l.id === form.examType)?.ten || 'Kiểm tra';

      let passageInfo = '';
      if (form.passageContent) {

      }

      const phan1Text = phan1.map((q, i) => {
        let line = `Câu ${i+1} (${q.score||0.5}đ) [${q.levelLabel||q.level||'NB'}] [${q.type==='mc'?'Trắc nghiệm':'Tự luận'}]:\n${q.content}`;

          line += '\n' + ['A','B','C','D'].map((lbl,idx) => `  ${lbl}. ${q.options[idx]||'...'}`).join('\n');
          if (q.correctAnswer) line += `\n  → Đáp án đúng đã chọn: ${q.correctAnswer}`;
        }
        return line;
      }).join('\n\n');

      const phan2Text = phan2.map((q, i) => {
        return `Câu ${i+1} (${q.score||7}đ) [${q.levelLabel||q.level||'VD'}]:\n${q.content}`;
      }).join('\n\n');

      // Nếu không có questions array nhưng có questionText, dùng questionText
      const useQuestionText = form.questions.length === 0 && form.questionText;
      const prompt = `Bạn là chuyên gia soạn đáp án đề thi Ngữ văn THCS theo chương trình GDPT 2018.
Hãy tạo đáp án + hướng dẫn chấm chi tiết cho đề sau.

ĐỀ THI: ${form.title || `${loaiTen} Ngữ văn lớp ${form.grade}`} — Lớp ${form.grade}${passageInfo}

${useQuestionText ? `PHẦN CÂU HỎI:\n${form.questionText}` : `══════════════════════════════════
PHẦN I: ĐỌC HIỂU (3.0 điểm) — ${phan1.length} câu
══════════════════════════════════
${phan1Text}

══════════════════════════════════
PHẦN II: VIẾT (7.0 điểm) — ${phan2.length} câu
══════════════════════════════════
${phan2Text}`}

Yêu cầu: Viết đáp án trực tiếp, đầy đủ nội dung cho từng câu — KHÔNG phân biệt trắc nghiệm hay tự luận:
• Mọi câu đều viết thẳng NỘI DUNG đáp án đúng (không chỉ ghi "A" hay "B/C/D").
• Ví dụ câu hỏi "Phương thức biểu đạt chính là gì?" → viết "Phương thức biểu đạt chính là tự sự (kết hợp miêu tả)." — không ghi "Đáp án: B".
• Câu tự luận Đọc hiểu: nêu ý chính cần đạt + mức điểm (đủ ý / chưa đủ / sai).
• Câu viết NLXH: dàn bài gợi ý (mở bài → thân bài 2–3 ý → kết bài) + tiêu chí điểm từng phần.
• Câu viết NLVH: dàn bài phân tích (giới thiệu tác phẩm/đoạn trích → phân tích nội dung + nghệ thuật → đánh giá nâng cao) + tiêu chí điểm.
• Cuối: Lưu ý chung khi chấm (chấp nhận nhiều cách diễn đạt, khuyến khích sáng tạo…).
Viết bằng tiếng Việt, rõ ràng, thực dụng — GV đọc là dùng được ngay.`;

      const result = await callGroqAPI(prompt, 2500);

      8: { dh: 'Câu 1 (0.5đ - NB), Câu 2 (0.5đ - NB), Câu 3 (0.5đ - TH), Câu 4 (0.5đ - TH), Câu 5 (1.0đ - VD). Tổng Đọc hiểu: 3.0đ', viet: 'Câu 6 (2.0đ - Nghị luận xã hội ≤200 chữ), Câu 7 (5.0đ - Nghị luận văn học về ngữ liệu). Tổng Viết: 7.0đ' },
      9: { dh: 'Câu 1 (0.5đ - NB), Câu 2 (0.5đ - NB), Câu 3 (0.5đ - TH), Câu 4 (0.5đ - TH), Câu 5 (1.0đ - VD). Tổng Đọc hiểu: 3.0đ', viet: 'Câu 6 (2.0đ - Nghị luận xã hội ≤200 chữ), Câu 7 (5.0đ - Nghị luận văn học/thơ chuyên sâu). Tổng Viết: 7.0đ' },

                      ak += `Câu ${i + 1} (${q.score || 0.5}đ) [${q.levelLabel || q.level || 'NB'}]:\n`;
                      ak += `${q.content}\n`;
                      if (q.type === 'mc' && q.correctAnswer) {
                        ak += `→ Đáp án: ${q.correctAnswer}`;

                        ak += `   + Trình bày đầy đủ, rõ ràng: ${q.score || 1.0}đ\n`;

                          </div>
                        )}
                      </div>
                    );
                    const dhQs = qs.filter(q => q.field === 'dochieu' || q.phan === 1);

                    const otherQs = qs.filter(q => q.field !== 'dochieu' && q.field !== 'viet' && q.phan !== 1 && q.phan !== 2);
                    const hasGroups = dhQs.length > 0 || vietQs.length > 0;
                    if (!hasGroups) return (
                      <div className="mt-4">{qs.map((q, qi) => renderQ(q, qi))}</div>

              <div style={{fontFamily:'Times New Roman,serif', fontSize:'13pt', padding:'20px'}}>
                <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'16px', marginBottom:'16px', fontSize:'12pt'}}>
                  <div><strong>{schoolName?.toUpperCase() || 'TRƯỜNG THCS ...'}</strong><br/>TỔ KHXH - NHÓM NGỮ VĂN</div>
                  <div style={{textAlign:'right'}}>NĂM HỌC 2025-2026<br/><em>{LOAI_DE.find(l => l.id === form.examType)?.ten || ''}</em></div>
                </div>
                <h1 style={{textAlign:'center', fontSize:'16pt', fontWeight:'bold', textTransform:'uppercase', marginBottom:'8px'}}>
                  {isVao10 ? 'ĐỀ THI VÀO LỚP 10 MÔN NGỮ VĂN' : `ĐỀ KIỂM TRA MÔN NGỮ VĂN - LỚP ${form.grade}`}
                </h1>
                {form.title && <p style={{textAlign:'center', fontWeight:'600', marginBottom:'4px'}}>{form.title}</p>}
                <p style={{textAlign:'center', fontStyle:'italic', marginBottom:'24px'}}>Thời gian: {form.duration} phút · Tổng điểm: 10.0</p>
                <hr style={{border:'none', borderTop:'2px solid #333', marginBottom:'16px'}} />
                <h2 style={{fontSize:'14pt', fontWeight:'bold', textAlign:'center', marginBottom:'16px', textTransform:'uppercase'}}>HƯỚNG DẪN CHẤM VÀ BIỂU ĐIỂM</h2>
                <pre style={{whiteSpace:'pre-wrap', fontFamily:'Times New Roman,serif', fontSize:'12pt', lineHeight:'1.6'}}>
                  {form.answerKey || '(Chưa có đáp án)'}
                </pre>
              </div>
            </div>
          </div>
        </div>

        {/* FOOTER */}
        <div className="p-4 border-t flex items-center justify-between bg-slate-50 flex-wrap gap-2">
          <div className="flex gap-2 flex-wrap">
            <button onClick={() => {
              setShowPreview(true); setPreviewMode('de');
              setTimeout(() => exportToPDF('exam-preview-' + form.id, `De_${form.title.replace(/\s+/g,'_')}`), 500);
            }} className="px-3 py-2 bg-red-500 text-white rounded-lg flex items-center gap-1.5 text-xs hover:bg-red-600">
              <Icon name="FileText" size={13} /> PDF Đề
            </button>
            <button onClick={() => {
              // Append answer key vào exam-preview div (đang render tốt), export, rồi remove
              setShowPreview(true); setPreviewMode('de');
              setTimeout(() => {
                const examEl = document.getElementById('exam-preview-' + form.id);
                if (!examEl) { alert('Chưa mở xem trước'); return; }
                const akSec = document.createElement('div');
                akSec.id = 'tmp-ak-section';
                akSec.style.cssText = 'page-break-before:always;padding:20px 0;margin-top:30px;border-top:3px solid #333;font-family:Times New Roman,serif;';
                const h2ak = document.createElement('h2');
                h2ak.style.cssText = 'text-align:center;font-size:15pt;font-weight:bold;text-transform:uppercase;margin-bottom:16px;';
                h2ak.textContent = 'HƯỚNG DẪN CHẤM VÀ BIỂU ĐIỂM';
                akSec.appendChild(h2ak);
                if (form.title) { const ptit = document.createElement('p'); ptit.style.cssText='text-align:center;font-weight:600;margin-bottom:16px;'; ptit.textContent=form.title; akSec.appendChild(ptit); }
                const hr2 = document.createElement('hr'); hr2.style.cssText='border:none;border-top:1px solid #333;margin-bottom:16px;'; akSec.appendChild(hr2);
                const pre = document.createElement('pre');
                pre.style.cssText = 'white-space:pre-wrap;font-family:Times New Roman,serif;font-size:12pt;line-height:1.8;';
                pre.textContent = form.answerKey || '(Chưa có đáp án — nhấn "AI Tạo đáp án" để tạo)';
                akSec.appendChild(pre);
                examEl.appendChild(akSec);
                setTimeout(() => {
                  exportToPDF('exam-preview-' + form.id, 'De+DapAn_' + form.title.replace(/\s+/g,'_'));
                  setTimeout(() => { const s=document.getElementById('tmp-ak-section'); if(s)s.remove(); }, 3000);
                }, 400);
              }, 500);
            }} className="px-3 py-2 bg-rose-600 text-white rounded-lg flex items-center gap-1.5 text-xs hover:bg-rose-700">
              <Icon name="FileText" size={13} /> PDF Đề+Đáp án
            </button>
            <button onClick={() => {
              setShowPreview(true); setPreviewMode('de');
              setTimeout(() => exportToWord('exam-preview-' + form.id, `De_${form.title.replace(/\s+/g,'_')}`), 500);
            }} className="px-3 py-2 bg-blue-600 text-white rounded-lg flex items-center gap-1.5 text-xs hover:bg-blue-700">
              <Icon name="FileDown" size={13} /> Word Đề
            </button>
            <button onClick={() => {
              // Word Đề+Đáp án: append answer key vào exam-preview, export Word, remove
              setShowPreview(true); setPreviewMode('de');
              setTimeout(() => {
                const examEl = document.getElementById('exam-preview-' + form.id);
                if (!examEl) return;
                const akSec2 = document.createElement('div');
                akSec2.id = 'tmp-ak-section-word';
                akSec2.style.cssText = 'page-break-before:always;padding:20px 0;margin-top:30px;border-top:3px solid #333;';
                const h2w = document.createElement('h2'); h2w.style.cssText='text-align:center;font-size:1.2em;font-weight:bold;text-transform:uppercase;margin-bottom:16px;'; h2w.textContent='HƯỚNG DẪN CHẤM VÀ BIỂU ĐIỂM'; akSec2.appendChild(h2w);
                if (form.title) { const pw=document.createElement('p'); pw.style.cssText='text-align:center;font-weight:600;margin-bottom:12px;'; pw.textContent=form.title; akSec2.appendChild(pw); }
                const hrw=document.createElement('hr'); hrw.style.cssText='border:none;border-top:1px solid #333;margin-bottom:12px;'; akSec2.appendChild(hrw);
                const prew=document.createElement('pre'); prew.style.cssText='white-space:pre-wrap;font-family:Times New Roman,serif;font-size:12pt;line-height:1.8;'; prew.textContent=form.answerKey||'(Chưa có đáp án)'; akSec2.appendChild(prew);
                examEl.appendChild(akSec2);
                setTimeout(() => {
                  exportToWord('exam-preview-' + form.id, 'De+DapAn_' + form.title.replace(/\s+/g,'_'));
                  setTimeout(() => { const s=document.getElementById('tmp-ak-section-word'); if(s)s.remove(); }, 2000);
                }, 300);
              }, 500);
            }} className="px-3 py-2 bg-indigo-600 text-white rounded-lg flex items-center gap-1.5 text-xs hover:bg-indigo-700">
              <Icon name="FileDown" size={13} /> Word Đề+Đáp án
            </button>
          </div>
          <div className="flex gap-2">
            <button onClick={onClose} className="px-4 py-2 bg-slate-200 rounded-lg text-sm hover:bg-slate-300">Hủy</button>
            <button onClick={handleSave} className="px-4 py-2 bg-rose-600 text-white rounded-lg flex items-center gap-2 text-sm hover:bg-rose-700"><Icon name="Save" size={15} /> Lưu đề</button>
          </div>
        </div>
      </div>
    </div>
  );
};

const MatrixModal = ({ item, data, setData, selectedClass, teacherName, schoolName, onClose }) => {
  const isEdit = !!item;
  const [form, setForm] = useState(item || { id: Date.now(), title: '', grade: selectedClass, examType: '45p', subtitle: '', matrixConfig: { dochieu: { nb: 2, th: 2, vd: 1, vdc: 0 }, viet: { nb: 0, th: 0, vd: 1, vdc: 0 } }, notes: '', createdAt: new Date().toISOString() });
  const [showPreview, setShowPreview] = useState(false);
  const handleSave = () => {
    if (!form.title.trim()) { alert('Nhập tiêu đề'); return; }
    const list = data.matrices || [];
    setData({ ...data, matrices: isEdit ? list.map(i => i.id === form.id ? form : i) : [...list, form] });
    onClose();
  };
  const updateCell = (f, l, v) => setForm({ ...form, matrixConfig: { ...form.matrixConfig, [f]: { ...form.matrixConfig[f], [l]: Math.max(0, parseInt(v) || 0) } } });
  const getRowTotal = (f) => Object.values(form.matrixConfig[f] || {}).reduce((a, b) => a + b, 0);
  return (
    <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50 modal-overlay">
      <div className="bg-white rounded-xl w-full max-w-5xl max-h-[95vh] overflow-hidden flex flex-col modal-box">
        <div className="p-5 border-b flex items-center justify-between">
          <h3 className="text-xl font-bold">{isEdit ? 'Sửa' : 'Tạo'} ma trận</h3>
          <div className="flex items-center gap-2"><button onClick={() => setShowPreview(!showPreview)} className="px-3 py-1.5 bg-slate-100 rounded text-sm"><Icon name={showPreview ? 'Edit' : 'Eye'} size={16} className="inline" /> {showPreview ? 'Sửa' : 'Xem'}</button><button onClick={onClose} className="p-2 hover:bg-slate-100 rounded"><Icon name="X" size={20} /></button></div>
        </div>
        <div className="flex-1 overflow-y-auto scrollbar p-5">
          <div style={{ display: showPreview ? 'none' : 'block' }} className="space-y-4">
            <div className="grid grid-cols-2 gap-3">
              <div><label className="block text-sm font-medium mb-1">Tiêu đề</label><input value={form.title} onChange={e => setForm({ ...form, title: e.target.value })} className="w-full px-3 py-2 border rounded-lg" /></div>
              <div><label className="block text-sm font-medium mb-1">Lớp</label><select value={form.grade} onChange={e => setForm({ ...form, grade: Number(e.target.value) })} className="w-full px-3 py-2 border rounded-lg bg-white">{[6,7,8,9].map(c => <option key={c} value={c}>Lớp {c}</option>)}</select></div>
            </div>
