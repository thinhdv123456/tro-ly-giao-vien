# Cấu hình Netlify — tự động deploy từ GitHub
# Mỗi lần code đẩy lên nhánh main, Netlify tự build và cập nhật website.
# Nguồn duy nhất là TroLyGiaoVien_Phase4_REFACTORED.html -> sinh ra dist/index.html (tránh lệch bản).

[build]
  publish = "dist"
  # Sinh index.html + _redirects: định tuyến /api/claude/message tới Netlify Function TRƯỚC, rồi mới tới trang chính.
  command = "mkdir -p dist && cp TroLyGiaoVien_Phase4_REFACTORED.html dist/index.html && cp CongHocSinh.html dist/cong.html && printf '/api/claude/message  /.netlify/functions/claude  200\\n/cong  /cong.html  200\\n/*  /index.html  200\\n' > dist/_redirects"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=0, must-revalidate"
