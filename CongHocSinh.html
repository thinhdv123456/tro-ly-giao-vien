const dayIndex = (d) => Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
const getOccasion = (now = new Date()) => {
  const y = now.getFullYear(), md = (now.getMonth() + 1) * 100 + now.getDate(), di = dayIndex(now);
  const tet = TET_DATES[y]; if (tet) { const t = dayIndex(new Date(tet)); if (di >= t - 6 && di <= t + 7) return OCCASIONS.tet; }
  const tt = TRUNGTHU_DATES[y]; if (tt) { const t = dayIndex(new Date(tt)); if (Math.abs(di - t) <= 3) return OCCASIONS.trungthu; }

};

// ============== TÁCH ĐỀ THÀNH TỪNG CÂU (mỗi câu 1 ô trả lời) ==============
const parseQuestions = (body) => {
  const text = String(body || '').replace(/\r\n/g, '\n');
  const re = /(?:^|\n)[ \t]*(Câu\s*\d+)[ \t]*[\.\:\)]?/gi;
  const marks = []; let m;
  while ((m = re.exec(text))) { marks.push({ index: m.index + m[0].indexOf('Câu'), label: m[1].replace(/\s+/g, ' ').trim() }); }
  if (marks.length === 0) return { single: true, intro: '', questions: [{ label: '', prompt: text.trim() }] };
  const intro = text.slice(0, marks[0].index).trim();
  const questions = marks.map((mk, i) => {
    const end = i + 1 < marks.length ? marks[i + 1].index : text.length;
    return { label: mk.label, prompt: text.slice(mk.index, end).trim() };
  });
  return { single: false, intro, questions };
};
const stripLabel = (t) => String(t || '').replace(/^\s*Câu\s*\d+\s*[\.\:\)]?\s*/i, '').trim();
const countChars = (s) => (s || '').length;
const countWords = (s) => { const t = (s || '').trim(); return t ? t.split(/\s+/).length : 0; };

// Nén ảnh về tối đa ~1000px, JPEG chất lượng 0.7 để lưu gọn (chụp bài viết tay).
const fileToDataURL = (file, maxW = 1000, q = 0.72) => new Promise((res, rej) => {
  const rd = new FileReader();
  rd.onerror = () => rej(new Error('Không đọc được ảnh'));
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, maxW / img.width);
      const w = Math.round(img.width * sc), h = Math.round(img.height * sc);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      res(cv.toDataURL('image/jpeg', q));
    };
    img.onerror = () => rej(new Error('Ảnh không hợp lệ'));
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
});
// Vẽ icon app (nền gradient teal→rose + chữ tên lớp, vd "6A") → data URL PNG.
const makeIconPNG = (label, size) => {
  const cv = document.createElement('canvas'); cv.width = size; cv.height = size;
  const g = cv.getContext('2d');
  const gr = g.createLinearGradient(0, 0, size, size); gr.addColorStop(0, '#0f766e'); gr.addColorStop(1, '#be185d');
  g.fillStyle = gr; g.fillRect(0, 0, size, size);
  const txt = (label || 'Lớp').toString().slice(0, 4);
  let fr = 0.5; if (txt.length === 3) fr = 0.38; else if (txt.length >= 4) fr = 0.3;
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '700 ' + Math.round(size * fr) + 'px Georgia, serif';
  g.fillText(txt, size / 2, size * 0.54);
  return cv.toDataURL('image/png');
};

};
// "còn 2 ngày 3 giờ" / "sắp hết hạn" cho hạn nộp
const timeLeft = (deadline) => {
  if (!deadline) return '';
  const ms = deadline - Date.now();
  if (ms <= 0) return 'đã hết hạn';
  const d = Math.floor(ms / 86400000), h = Math.floor((ms % 86400000) / 3600000), m = Math.floor((ms % 3600000) / 60000);
  if (d > 0) return `còn ${d} ngày ${h} giờ`;
  if (h > 0) return `còn ${h} giờ ${m} phút`;
  return `còn ${m} phút`;
};

const SeasonalBg = ({ theme }) => {
  const motifs = React.useMemo(() => {
    const arr = [];
    for (let i = 0; i < 16; i++) arr.push({
      e: theme.motifs[i % theme.motifs.length],
      left: Math.round(Math.random() * 96),
      dur: (13 + Math.random() * 16).toFixed(1),
      delay: (Math.random() * 18).toFixed(1),
      size: 16 + Math.round(Math.random() * 24),
    });
    return arr;
  }, [theme.key]);
  return (
    <React.Fragment>
      <div className="seasonal-bg" style={{ background: theme.bg, backgroundSize: '300% 300%' }} />
      <div className="seasonal-veil" />
      {motifs.map((mo, i) => <span key={i} className="motif" style={{ left: mo.left + '%', animationDuration: mo.dur + 's', animationDelay: mo.delay + 's', fontSize: mo.size + 'px' }}>{mo.e}</span>)}

};

// ============== AI (dùng chung key với app chính vì cùng tên miền) ==============
const getClaudeKey = () => (localStorage.getItem('claude_api_key') || '').trim();
const getGroqKey = () => (localStorage.getItem('groq_api_key') || '').trim();
const getProvider = () => localStorage.getItem('selectedAIProvider') || (getClaudeKey() ? 'claude' : (getGroqKey() ? 'groq' : ''));

const callClaude = async (prompt, maxTokens = 1500) => {
  const key = getClaudeKey();
  if (!key) return { error: 'Chưa có Claude API Key' };
  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: 'claude-opus-4-8', max_tokens: maxTokens, messages: [{ role: 'user', content: prompt }] })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) return { error: (d.error && d.error.message) || ('HTTP ' + r.status) };
    return { text: (d.content || []).filter(b => b.type === 'text').map(b => b.text).join('').trim() };
  } catch (e) { return { error: e.message }; }
};
const callGroq = async (prompt, maxTokens = 1500) => {
  const key = getGroqKey();
  if (!key) return { error: 'Chưa có Groq API Key' };
  try {
    const r = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + key, 'content-type': 'application/json' },
      body: JSON.stringify({ model: 'openai/gpt-oss-120b', messages: [{ role: 'user', content: prompt }], max_tokens: maxTokens, temperature: 0.5 })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) return { error: (d.error && d.error.message) || ('HTTP ' + r.status) };
    return { text: d.choices[0].message.content };
  } catch (e) { return { error: e.message }; }
};
const callAI = async (prompt, maxTokens = 1500) => {
  const p = getProvider();
  if (p === 'claude') return callClaude(prompt, maxTokens);
  if (p === 'groq') return callGroq(prompt, maxTokens);
  if (getClaudeKey()) return callClaude(prompt, maxTokens);
  if (getGroqKey()) return callGroq(prompt, maxTokens);
  return { error: 'Chưa cấu hình AI (vào app chính ⚙️ Cài đặt AI để nhập key, cùng trình duyệt)' };
};

const GradeView = ({ cls, asg, sub, onBack }) => {
  const [score, setScore] = useState(sub.finalScore ?? sub.autoScore ?? '');
  const [fb, setFb] = useState(sub.finalFeedback ?? sub.autoFeedback ?? '');
  const [grading, setGrading] = useState(false);
  const ref = db.collection('classes').doc(cls.id).collection('submissions').doc(sub.id);
  const aiGrade = async () => {
    setGrading(true);
    const prompt = `Bạn là giáo viên Ngữ văn THCS. Hãy CHẤM bài làm của học sinh theo đề dưới đây. Trả lời bằng tiếng Việt.\n\n=== ĐỀ BÀI ===\n${asg.body}\n\n=== BÀI LÀM CỦA HỌC SINH ===\n${sub.answer || '(trống)'}\n\nYêu cầu: Cho ĐIỂM trên thang 10 và viết NHẬN XÉT ngắn gọn, cụ thể (ưu điểm + điều cần sửa), giọng động viên.\nĐỊNH DẠNG (JSON thuần, không markdown): {"diem": <số 0-10>, "nhanxet": "..."}`;
    const r = await callAI(prompt, 1200);
    setGrading(false);
    if (r.error) { alert('Lỗi AI: ' + r.error); return; }
    try {
      const txt = r.text.replace(/^```json\s*/i, '').replace(/^```\s*/, '').replace(/```\s*$/, '').trim();
      const j = JSON.parse(txt);
      setScore(j.diem); setFb(j.nhanxet);
      await ref.update({ autoScore: j.diem, autoFeedback: j.nhanxet, status: 'graded' });
    } catch {
      setFb(r.text); await ref.update({ autoFeedback: r.text, status: 'graded' });
    }
  };
  const release = async (mode) => {
    if (score === '' ) { alert('Cần có điểm trước khi gửi.'); return; }
    await ref.update({ finalScore: Number(score), finalFeedback: fb, status: 'released', releaseMode: mode, releasedAt: Date.now() });
    if (mode === 'all' && fb) {
      await db.collection('classes').doc(cls.id).collection('messages').add({ fromRole: 'teacher', fromName: 'Cô', text: `📊 Kết quả bài "${asg.title}" của ${sub.studentName}: ${score}đ — ${fb}`, at: Date.now() });
    }
    alert(mode === 'private' ? '✅ Đã gửi RIÊNG cho ' + sub.studentName : '✅ Đã gửi cho TẤT CẢ lớp.');
    onBack();
  };
  return (
    <div className="min-h-screen pb-10">
      <div className="btn-teal px-5 py-4 flex items-center gap-3 sticky top-0 z-10">
        <button onClick={onBack} className="text-xl">←</button>
        <div><p className="font-semibold">Chấm bài · {sub.studentName}</p><p className="text-[11px] text-teal-100">{asg.title}</p></div>
      </div>
      <div className="max-w-2xl mx-auto p-4 space-y-4">
        <div className="card p-4"><p className="text-xs font-bold text-slate-500 uppercase mb-2">Bài làm của học sinh</p><div className="text-sm whitespace-pre-wrap">{sub.answer || <span className="text-slate-400 italic">(trống)</span>}</div>
          {sub.images && sub.images.map((im, i) => <img key={i} src={im} className="mt-2 rounded-lg border max-w-full" alt="bài" />)}
        </div>

// ============== NÚT CÀI APP (Thêm vào màn hình chính) ==============
const InstallCard = ({ clsName, theme }) => {
  const standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent || '');
  const [canInstall, setCanInstall] = useState(!!window.__deferredPrompt);
  const [installed, setInstalled] = useState(standalone);
  const [help, setHelp] = useState(false);
  useEffect(() => {
    const on = () => setCanInstall(true);
    const oni = () => { setInstalled(true); setCanInstall(false); };
    window.addEventListener('pwa-installable', on);
    window.addEventListener('pwa-installed', oni);
    return () => { window.removeEventListener('pwa-installable', on); window.removeEventListener('pwa-installed', oni); };
  }, []);
  if (installed) return null;
  const doInstall = async () => {
    const dp = window.__deferredPrompt;
    if (dp) {
      dp.prompt();
      const r = await dp.userChoice.catch(() => ({ outcome: 'dismissed' }));
      if (r.outcome === 'accepted') setInstalled(true);
      window.__deferredPrompt = null; setCanInstall(false);
      return;
    }
    setHelp(true);
  };
  const label = (clsName || 'Lớp').toString().slice(0, 3);
  return (
    <div className="glass rounded-2xl p-3 mb-4 flex items-center gap-3 shadow-lg pop">
      <div className="w-12 h-12 rounded-2xl flex items-center justify-center text-white font-extrabold shadow shrink-0" style={{ background: `linear-gradient(135deg,${theme.a},${theme.b})`, fontSize: label.length > 2 ? 15 : 19 }}>{label}</div>
      <div className="flex-1 min-w-0">
        <p className="font-bold text-sm text-slate-800 leading-tight">Cài “Lớp cô Thu” vào máy</p>
        <p className="text-[11px] text-slate-500 leading-tight mt-0.5">{clsName ? ('Lớp ' + clsName + ' · ') : ''}Mở nhanh như một ứng dụng 📲</p>
      </div>
      <button onClick={doInstall} className="btn-grad text-xs font-bold px-4 py-2.5 rounded-xl whitespace-nowrap shrink-0" style={{ '--a': theme.a, '--b': theme.b }}>＋ Thêm</button>
      {help && <Modal title="📲 Thêm vào màn hình chính" onClose={() => setHelp(false)}>
        {isIOS ? (
          <div className="text-sm space-y-2">
            <p className="text-slate-600">Trên iPhone/iPad, dùng trình duyệt <b>Safari</b>:</p>
            <ol className="list-decimal ml-5 space-y-1.5 text-slate-700">
              <li>Bấm nút <b>Chia sẻ</b> ⬆️ ở thanh dưới màn hình.</li>
              <li>Kéo xuống, chọn <b>“Thêm vào MH chính”</b>.</li>
              <li>Bấm <b>Thêm</b> — biểu tượng “Lớp cô Thu” hiện ra như một app 🌸</li>
            </ol>
          </div>
        ) : (
          <div className="text-sm space-y-2">
            <p className="text-slate-600">Trên Android / máy tính (Chrome, Cốc Cốc, Edge):</p>
            <ol className="list-decimal ml-5 space-y-1.5 text-slate-700">
              <li>Bấm nút <b>⋮</b> (menu) ở góc trình duyệt.</li>
              <li>Chọn <b>“Thêm vào Màn hình chính”</b> hoặc <b>“Cài đặt ứng dụng”</b>.</li>
              <li>Xác nhận <b>Thêm / Cài đặt</b> — xong 🌸</li>
            </ol>
          </div>
        )}
      </Modal>}
    </div>
  );
};

// ============== HỌC SINH — VÀO LỚP ==============
const StudentJoin = ({ onBack, onJoined }) => {
  const [code, setCode] = useState(localStorage.getItem('sv_code') || '');
  const [name, setName] = useState(localStorage.getItem('sv_name') || '');
  const [err, setErr] = useState(''); const [busy, setBusy] = useState(false);
  const [clsName, setClsName] = useState('');
  // Khi gõ đủ mã lớp: tra tên lớp (vd "6A") để đặt icon app và trấn an em đã đúng lớp.
  useEffect(() => {
    let cancel = false;
    const C = code.trim().toUpperCase();
    if (C.length < 4) { setClsName(''); return; }
    const t = setTimeout(async () => {
      try {
        if (!auth.currentUser) await auth.signInAnonymously();
        const snap = await db.collection('classes').doc(C).get();
        if (!cancel) setClsName(snap.exists ? (snap.data().name || '') : '');
      } catch (e) { if (!cancel) setClsName(''); }
    }, 500);
    return () => { cancel = true; clearTimeout(t); };
  }, [code]);
  useEffect(() => { applyDynamicIcon(clsName); }, [clsName]);
  const join = async () => {
    setErr(''); const C = code.trim().toUpperCase();
    if (!C || !name.trim()) { setErr('Nhập mã lớp và họ tên.'); return; }
    // Chặn treo vô hạn: mọi bước mạng chỉ chờ tối đa 12 giây rồi báo lỗi rõ ràng.
    const withTimeout = (p, s, label) => Promise.race([
      p, new Promise((_, rej) => setTimeout(() => rej(new Error('__TIMEOUT__' + label)), s * 1000))
    ]);
    setBusy(true);
    try {
      await withTimeout(auth.signInAnonymously(), 12, 'dangnhap');
      const snap = await withTimeout(db.collection('classes').doc(C).get(), 12, 'doclop');
      if (!snap.exists) { setErr('Không tìm thấy lớp có mã "' + C + '". Kiểm tra lại mã cô cho (viết hoa, đủ ký tự).'); return; }
      const students = snap.data().students || [];
      // Thêm tên vào sổ lớp — nếu bước này lỗi/chậm cũng KHÔNG chặn em vào lớp.
      if (!students.find(s => s.name && s.name.toLowerCase() === name.trim().toLowerCase())) {
        try {
          await withTimeout(db.collection('classes').doc(C).update({ students: FV.arrayUnion({ id: uid4(), name: name.trim() }) }), 12, 'ghiten');
        } catch (e2) { /* ghi tên thất bại vẫn cho vào lớp; cô vẫn nhận được bài nộp */ }
      }
      localStorage.setItem('sv_code', C); localStorage.setItem('sv_name', name.trim());
      onJoined({ code: C, name: name.trim(), cls: { id: C, ...snap.data() } });
    } catch (e) {
      const m = e && e.message ? e.message : String(e);
      if (m.indexOf('__TIMEOUT__') === 0) {
        setErr('Mạng đang chậm hoặc chập chờn. Em kiểm tra wifi/4G rồi bấm "Vào lớp" lại nhé.');
      } else if (m.indexOf('admin-restricted') >= 0 || (e && e.code === 'auth/admin-restricted-operation')) {
        setErr('Lớp chưa mở đăng nhập cho học sinh. Nhờ cô bật "Anonymous" trong Firebase rồi thử lại.');
      } else if (e && e.code === 'permission-denied') {
        setErr('Không có quyền vào lớp. Nhờ cô kiểm tra lại "Quy tắc" (Rules) của Firebase.');
      } else {
        setErr('Không vào được lớp: ' + m);
      }
    } finally { setBusy(false); }
  };
  const theme = getOccasion();
  return (
    <div className="min-h-screen flex items-center justify-center p-5 relative">
      <SeasonalBg theme={theme} />
      <div className="w-full max-w-sm pop">
        {onBack && <button onClick={onBack} className="text-sm text-white/90 mb-3 drop-shadow">← Quay lại</button>}
        <div className="text-center mb-5">
          <div className="w-20 h-20 mx-auto rounded-[26px] flex items-center justify-center text-white text-4xl mb-3 shadow-2xl" style={{ background: `linear-gradient(135deg,${theme.a},${theme.b})` }}>🎒</div>
          <h1 className="font-bold text-3xl font-display hdr-title">Cổng Lớp Học</h1>
          <span className="inline-flex items-center gap-1.5 mt-2 text-xs font-semibold occ-chip px-3.5 py-1.5 rounded-full shadow">{theme.emoji} {theme.label}</span>
        </div>
        <InstallCard clsName={clsName} theme={theme} />
        <div className="glass rounded-[28px] p-6 shadow-2xl">
          <div className="text-center mb-5"><div className="text-3xl mb-1">✨</div><h2 className="font-bold text-lg">Vào lớp học của em</h2><p className="text-xs text-slate-500 mt-1">Nhập mã lớp cô cho và họ tên nhé</p></div>
          <label className="block text-sm font-semibold mb-1 text-slate-600">🔑 Mã lớp</label>
          <input value={code} onChange={e => setCode(e.target.value.toUpperCase())} placeholder="VD: ABC123" maxLength={8} className={`ans w-full px-3 py-3 border-2 rounded-2xl tracking-[.3em] text-center font-bold text-xl ${clsName ? 'border-emerald-300 mb-1' : 'border-slate-200 mb-4'}`} style={{ '--a': theme.a }} />
          {clsName && <p className="text-[12px] text-emerald-600 font-semibold mb-4 ml-1">✓ Lớp {clsName}</p>}
          <label className="block text-sm font-semibold mb-1 text-slate-600">🙋 Họ và tên</label>
          <input value={name} onChange={e => setName(e.target.value)} placeholder="VD: Nguyễn Văn An" onKeyDown={e => e.key === 'Enter' && join()} className="ans w-full px-3 py-3 border-2 border-slate-200 rounded-2xl mb-4 font-medium" style={{ '--a': theme.a }} />
          {err && <div className="text-sm bg-rose-50 text-rose-700 rounded-xl px-3 py-2 mb-3 pop">⚠️ {err}</div>}
          <button onClick={join} disabled={busy} className="btn-grad w-full py-3.5 rounded-2xl font-bold text-base disabled:opacity-60" style={{ '--a': theme.a, '--b': theme.b }}>{busy ? <Spinner /> : '🚀 Vào lớp'}</button>
        </div>
        <p className="text-center text-[11px] text-white/85 mt-4 drop-shadow">Học tập vui mỗi ngày · Trợ Lý Giáo Viên 🌸</p>
      </div>
    </div>
  );
};

const StudentHome = ({ sv, onLeave }) => {
  const [tab, setTab] = useState('bai');
  const [assignments, setAssignments] = useState([]);
  const [mySubs, setMySubs] = useState({});
  const [doing, setDoing] = useState(null);
  const [msgNewest, setMsgNewest] = useState(0);
  const [fs, setFs] = useState(() => parseInt(localStorage.getItem('cong_fs') || '16', 10));
  const seenKey = (t) => 'seen_' + t + '_' + sv.code;
  const [seen, setSeen] = useState(() => ({
    bai: +(localStorage.getItem(seenKey('bai')) || 0),
    diem: +(localStorage.getItem(seenKey('diem')) || 0),
    msg: +(localStorage.getItem(seenKey('msg')) || 0),
  }));
  useEffect(() => { document.documentElement.style.setProperty('--fs', fs + 'px'); localStorage.setItem('cong_fs', fs); }, [fs]);
  useEffect(() => {
    const un1 = db.collection('classes').doc(sv.code).collection('assignments').onSnapshot(s =>
      setAssignments(s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.createdAt - a.createdAt)),
      err => console.warn('assignments listener:', err && err.code));
    const un2 = db.collection('classes').doc(sv.code).collection('submissions').where('studentAuthUid', '==', auth.currentUser.uid).onSnapshot(s => {
      const m = {}; s.forEach(d => { m[d.data().assignmentId] = { id: d.id, ...d.data() }; }); setMySubs(m);
    }, err => console.warn('submissions listener:', err && err.code));
    const un3 = db.collection('classes').doc(sv.code).collection('messages').orderBy('at', 'desc').limit(20).onSnapshot(s => {
      const other = s.docs.map(d => d.data()).find(mm => mm.fromName !== sv.name);
      setMsgNewest(other ? (other.at || 0) : 0);
    }, err => console.warn('messages listener:', err && err.code));
    return () => { un1(); un2(); un3(); };
  }, [sv.code]);
  // Mốc "mới nhất" của từng mục để so với "đã xem"
  const asgNewest = assignments.reduce((mx, a) => Math.max(mx, a.createdAt || 0), 0);
  const gradeNewest = Object.values(mySubs).filter(s => s.status === 'released').reduce((mx, s) => Math.max(mx, s.releasedAt || s.submittedAt || 0), 0);
  const newestOf = { bai: asgNewest, diem: gradeNewest, msg: msgNewest };
  const unread = { bai: asgNewest > seen.bai, diem: gradeNewest > seen.diem, msg: msgNewest > seen.msg };
  // Xem tab nào thì đánh dấu tab đó "đã đọc"
  useEffect(() => {
    const v = newestOf[tab];
    if (v && v > (seen[tab] || 0)) { localStorage.setItem(seenKey(tab), v); setSeen(s => ({ ...s, [tab]: v })); }
  }, [tab, asgNewest, gradeNewest, msgNewest]);
  // Bài chưa làm, chưa hết hạn → để nhắc
  const todo = assignments.filter(a => {
    const sub = mySubs[a.id]; const done = sub && (sub.status === 'submitted' || sub.status === 'released');
    const expired = a.deadline && Date.now() > a.deadline;
    return !done && !expired;
  }).sort((a, b) => (a.deadline || Infinity) - (b.deadline || Infinity));
  if (doing) return <DoAssignment sv={sv} asg={doing} sub={mySubs[doing.id]} onDone={() => setDoing(null)} />;
  const theme = getOccasion();
  const tabs = [['bai', '📝', 'Bài tập'], ['diem', '📊', 'Điểm'], ['msg', '💬', 'Trò chuyện']];
  return (
    <div className="min-h-screen pb-12 relative">
      <SeasonalBg theme={theme} />
      <div className="px-5 py-4 flex items-center justify-between sticky top-0 z-20 shadow-lg" style={{ background: `linear-gradient(135deg,${theme.a},${theme.b})` }}>
        <div className="flex items-center gap-3">
          <div className="w-11 h-11 rounded-2xl bg-white/25 backdrop-blur flex items-center justify-center text-2xl">🎒</div>
          <div>
            <p className="font-bold hdr-title leading-tight">Lớp {sv.cls.name}</p>
            <p className="text-[11px] text-white/90">{sv.name} · {theme.emoji} {theme.label}</p>
          </div>
        </div>
        <div className="flex items-center gap-2">
          <div className="flex items-center bg-white/20 rounded-xl backdrop-blur overflow-hidden" title="Cỡ chữ">
            <button onClick={() => setFs(f => Math.max(14, f - 1))} className="text-white px-2 py-1.5 text-xs font-bold hover:bg-white/20">A−</button>
            <button onClick={() => setFs(f => Math.min(22, f + 1))} className="text-white px-2 py-1.5 text-sm font-bold hover:bg-white/20">A+</button>
          </div>
          <button onClick={onLeave} className="text-xs font-semibold bg-white/20 hover:bg-white/30 text-white px-3 py-2 rounded-xl backdrop-blur transition">Thoát</button>
        </div>
      </div>
      <div className="max-w-2xl mx-auto px-3 pt-3 sticky top-[68px] z-10">
        <div className="glass rounded-2xl p-1.5 flex gap-1 shadow">
          {tabs.map(([k, ic, l]) =>
            <button key={k} onClick={() => setTab(k)} className={`relative flex-1 py-2.5 rounded-xl text-sm font-semibold transition ${tab === k ? 'text-white shadow' : 'text-slate-500 hover:bg-white/60'}`} style={tab === k ? { background: `linear-gradient(135deg,${theme.a},${theme.b})` } : {}}>{ic} {l}{unread[k] && tab !== k && <span className="dot"></span>}</button>)}
        </div>
      </div>
      <div className="max-w-2xl mx-auto p-4">
        {tab === 'bai' && <div className="fade-in">
          {todo.length > 0 && <div className="rounded-2xl p-4 mb-3.5 text-white shadow-lg pop flex items-center gap-3" style={{ background: `linear-gradient(135deg,${theme.a},${theme.b})` }}>
            <div className="text-2xl">🔔</div>
            <div className="flex-1"><p className="font-bold text-sm">Em còn {todo.length} bài chưa làm</p>{todo[0].deadline && <p className="text-[11px] text-white/90 mt-0.5">Gần nhất: "{todo[0].title}" — {timeLeft(todo[0].deadline)}</p>}</div>
          </div>}
          {assignments.length === 0 && <div className="glass rounded-3xl p-10 text-center"><div className="text-5xl mb-2">🌱</div><p className="text-slate-500 font-medium">Chưa có bài tập nào.</p><p className="text-xs text-slate-400 mt-1">Cô giao bài là em sẽ thấy ở đây nhé!</p></div>}
          {assignments.map(a => {
            const sub = mySubs[a.id]; const expired = a.deadline && Date.now() > a.deadline;
            const done = sub && (sub.status === 'submitted' || sub.status === 'released');
            const inprog = sub && sub.status === 'in_progress';
            return <div key={a.id} className="glass rounded-3xl p-5 mb-3.5 shadow-lg pop">
              <div className="flex items-start justify-between gap-2">
                <div className="flex-1"><p className="font-bold text-[15px] text-slate-800 leading-snug">{a.title}</p><p className="text-xs text-slate-500 mt-1">⏱ {a.durationMin} phút · Hạn {fmtDate(a.deadline)}{a.deadline && !done && <span className={`ml-1 font-semibold ${(a.deadline - Date.now()) < 86400000 ? 'text-rose-600' : 'text-teal-700'}`}>({timeLeft(a.deadline)})</span>}</p></div>
                {done ? <Badge tone="green">Đã nộp ✓</Badge> : expired ? <Badge tone="gray">Hết hạn</Badge> : inprog ? <Badge tone="amber">Đang làm</Badge> : <Badge tone="rose">Chưa làm</Badge>}
              </div>
              {!done && !expired && <button onClick={() => setDoing(a)} className="btn-grad w-full py-3 rounded-2xl font-bold mt-4" style={{ '--a': theme.a, '--b': theme.b }}>{inprog ? '⏱ Tiếp tục làm bài' : '✍️ Bắt đầu làm bài'}</button>}
              {done && sub.status === 'released' && <div className="mt-4 rounded-2xl p-4 text-white" style={{ background: `linear-gradient(135deg,${theme.a},${theme.b})` }}><p className="text-sm">🎉 Điểm của em: <b className="text-2xl align-middle">{sub.finalScore}</b><span className="opacity-90">/10</span></p>{sub.finalFeedback && <p className="text-xs mt-1.5 bg-white/20 rounded-xl px-3 py-2">💬 {sub.finalFeedback}</p>}</div>}
              {done && sub.status === 'submitted' && <p className="text-xs text-amber-600 mt-3 text-center font-medium bg-amber-50 rounded-xl py-2">✅ Đã nộp — chờ cô chấm 🌸</p>}
            </div>;
          })}
        </div>}
        {tab === 'diem' && <div className="fade-in">
          {Object.values(mySubs).filter(s => s.status === 'released').length === 0 && <div className="glass rounded-3xl p-10 text-center"><div className="text-5xl mb-2">📊</div><p className="text-slate-500 font-medium">Chưa có điểm nào được trả.</p></div>}
          {Object.values(mySubs).filter(s => s.status === 'released').map(s => {
            const a = assignments.find(x => x.id === s.assignmentId);
            return <div key={s.id} className="glass rounded-3xl p-5 mb-3.5 shadow-lg pop"><div className="flex items-center justify-between"><p className="font-bold text-slate-800">{a ? a.title : 'Bài tập'}</p><p className="text-3xl font-extrabold" style={{ color: theme.a }}>{s.finalScore}</p></div>{s.finalFeedback && <div className="bg-slate-50 rounded-2xl p-3 mt-2.5 text-sm text-slate-700">💬 {s.finalFeedback}</div>}</div>;
          })}
        </div>}
        {tab === 'msg' && <div className="fade-in"><MessagesView cls={sv.cls} sender={{ role: 'student', name: sv.name }} /></div>}
      </div>
    </div>
  );
};

// ============== HỌC SINH — LÀM BÀI (CÓ ĐỒNG HỒ · MỖI CÂU 1 Ô) ==============
const DoAssignment = ({ sv, asg, sub, onDone }) => {
  const theme = getOccasion();
  const subId = asg.id + '_' + auth.currentUser.uid;
  const ref = db.collection('classes').doc(sv.code).collection('submissions').doc(subId);
  const parsed = React.useMemo(() => parseQuestions(asg.body), [asg.id]);
  const qs = parsed.questions;
  const initAnswers = () => {
    if (sub && sub.answersByQ && Object.keys(sub.answersByQ).length) return { ...sub.answersByQ };
    if (sub && sub.answer) return { 0: sub.answer };
    return {};
  };
  const [answers, setAnswers] = useState(initAnswers);
  const answersRef = useRef(answers); answersRef.current = answers;
  const [images, setImages] = useState(sub && sub.images ? sub.images : []);
  const imagesRef = useRef(images); imagesRef.current = images;
  const [imgBusy, setImgBusy] = useState(false);
  const fileRef = useRef(null);
  const [startedAt] = useState(sub && sub.startedAt ? sub.startedAt : Date.now());
  const [remain, setRemain] = useState(0);
  const submittedRef = useRef(false);
  const buildCombined = (ans) => qs.map((q, i) => `${q.label || (parsed.single ? 'Bài làm' : 'Câu ' + (i + 1))}:\n${(ans[i] || '').trim()}`).join('\n\n');
  useEffect(() => {
    if (!sub || !sub.startedAt) ref.set({ assignmentId: asg.id, studentAuthUid: auth.currentUser.uid, studentName: sv.name, answer: '', answersByQ: {}, startedAt, status: 'in_progress' }, { merge: true });
  }, []);
  const addImages = async (files) => {
    if (!files || !files.length) return;
    setImgBusy(true);
    const cur = [...imagesRef.current];
    for (const f of Array.from(files)) { if (cur.length >= 4) break; try { cur.push(await fileToDataURL(f)); } catch (e) {} }
    setImages(cur); setImgBusy(false);
    ref.update({ images: cur }).catch(() => {});
  };
  const removeImage = (idx) => { const cur = imagesRef.current.filter((_, i) => i !== idx); setImages(cur); ref.update({ images: cur }).catch(() => {}); };
  const doSubmit = async (auto) => {
    if (submittedRef.current) return; submittedRef.current = true;
    const ans = answersRef.current;
    await ref.set({ assignmentId: asg.id, studentAuthUid: auth.currentUser.uid, studentName: sv.name, answer: buildCombined(ans), answersByQ: ans, images: imagesRef.current, startedAt, submittedAt: Date.now(), status: 'submitted' }, { merge: true });
    alert(auto ? '⏰ Hết giờ! Bài đã tự nộp.' : '✅ Đã nộp bài. Chờ cô chấm nhé 🌸');
    onDone();
  };
  useEffect(() => {
    const tick = () => {
      const byDur = asg.durationMin * 60 - Math.floor((Date.now() - startedAt) / 1000);
      const byDl = asg.deadline ? Math.floor((asg.deadline - Date.now()) / 1000) : Infinity;
      const r = Math.min(byDur, byDl);
      setRemain(r);
      if (r <= 0) doSubmit(true);
    };
    tick(); const iv = setInterval(tick, 1000); return () => clearInterval(iv);
  }, []);
  useEffect(() => { const t = setTimeout(() => { ref.update({ answersByQ: answers, answer: buildCombined(answers) }).catch(() => {}); }, 800); return () => clearTimeout(t); }, [answers]);
  const setQ = (i, v) => setAnswers(a => ({ ...a, [i]: v }));
  const answeredCount = qs.filter((_, i) => (answers[i] || '').trim()).length;
  const totalWords = qs.reduce((n, _, i) => n + countWords(answers[i]), 0);
  const urgent = remain <= 60;
  // Dùng HÀM trả JSX (không phải component con) để ô nhập không bị mất con trỏ khi gõ.
  const renderField = (i, heading, prompt) => {
    const val = answers[i] || '';
    return (
      <div key={i} className="qcard p-4 mb-4">
        <div className="flex items-center gap-2 mb-2">
          <span className="inline-flex items-center justify-center min-w-[30px] h-7 px-2 rounded-full text-white text-xs font-bold" style={{ background: `linear-gradient(135deg,${theme.a},${theme.b})` }}>{parsed.single ? '✍️' : (i + 1)}</span>
          <p className="font-bold text-slate-800 text-sm">{heading}</p>
        </div>
        {prompt && <div className="text-[13px] text-slate-600 whitespace-pre-wrap leading-relaxed mb-2.5 bg-slate-50 rounded-xl px-3 py-2">{prompt}</div>}
        <textarea value={val} onChange={e => setQ(i, e.target.value)} rows={parsed.single ? 12 : 5} placeholder="Em trả lời câu này vào đây…" className="ans w-full px-3 py-3 border-2 border-slate-200 rounded-2xl text-sm leading-relaxed" style={{ '--a': theme.a }} />
        <div className="flex items-center justify-end gap-2 mt-2">
          <span className="cnt-pill" style={{ background: 'color-mix(in srgb,' + theme.a + ' 12%,transparent)', color: theme.a }}>✍️ {countWords(val)} từ</span>
          <span className="cnt-pill bg-slate-100 text-slate-500">🔤 {countChars(val)} ký tự</span>
        </div>
      </div>
    );
  };

  return (
    <div className="min-h-screen pb-28 relative">
      <SeasonalBg theme={theme} />
      <div className="px-5 py-3 flex items-center gap-3 sticky top-0 z-20 shadow-lg" style={{ background: `linear-gradient(135deg,${theme.a},${theme.b})` }}>
        <div className="flex-1"><p className="font-bold hdr-title text-sm leading-tight">{asg.title}</p><p className="text-[11px] text-white/90">Đã làm {answeredCount}/{qs.length} câu · {totalWords} từ</p></div>
      </div>
      <div className={`px-5 py-3 flex items-center justify-between sticky top-[56px] z-10 shadow ${urgent ? 'bg-red-500 text-white animate-pulse' : 'glass text-slate-700'}`}>
        <span className="text-sm font-medium">⏱ Thời gian còn lại</span>
        <span className="text-2xl font-extrabold tracking-wider tabular-nums">{fmtTime(remain)}</span>
      </div>
      <div className="max-w-2xl lg:max-w-5xl mx-auto p-4">
        <div className={(!parsed.single && parsed.intro) ? 'do-grid' : ''}>
          {!parsed.single && parsed.intro &&
            <div className="do-intro">
              <div className="qcard p-4 mb-4">
                <p className="text-[11px] font-bold uppercase tracking-wide mb-2" style={{ color: theme.a }}>📖 Đề bài / Ngữ liệu</p>
                <div className="text-[13px] whitespace-pre-wrap leading-relaxed text-slate-700">{parsed.intro}</div>
              </div>
            </div>}
          <div>
            {qs.map((q, i) => renderField(i, parsed.single ? 'Bài làm của em' : q.label, parsed.single ? '' : stripLabel(q.prompt)))}
            <div className="qcard p-4 mb-4">
              <div className="flex items-center justify-between mb-2">
                <p className="font-bold text-slate-800 text-sm">📷 Ảnh bài viết tay (nếu có)</p>
                <span className="text-[11px] text-slate-400">{images.length}/4</span>
              </div>
              <input ref={fileRef} type="file" accept="image/*" multiple className="hidden" onChange={e => { addImages(e.target.files); e.target.value = ''; }} />
              <div className="flex flex-wrap gap-2 items-center">
                {images.map((im, i) => <div key={i} className="relative"><img src={im} className="thumb" alt="bài" /><button onClick={() => removeImage(i)} className="absolute -top-2 -right-2 w-6 h-6 rounded-full bg-rose-600 text-white text-xs shadow flex items-center justify-center">✕</button></div>)}
                {images.length < 4 && <button onClick={() => fileRef.current && fileRef.current.click()} disabled={imgBusy} className="w-[76px] h-[76px] rounded-2xl border-2 border-dashed border-slate-300 text-slate-400 flex flex-col items-center justify-center text-xs hover:border-slate-400 disabled:opacity-60">{imgBusy ? '⏳' : <><span className="text-xl leading-none">＋</span>Thêm</>}</button>}
              </div>
              <p className="text-[11px] text-slate-400 mt-2">Chụp hoặc chọn ảnh bài làm viết tay — cô sẽ xem cùng bài gõ.</p>
            </div>
            <p className="text-[11px] text-slate-500 text-center mt-1">💾 Bài tự lưu liên tục — không lo mất. Hết giờ hệ thống tự nộp.</p>
          </div>
        </div>
      </div>
      <div className="fixed bottom-0 inset-x-0 p-3 glass border-t border-white/40 z-20">
        <div className="max-w-2xl mx-auto">
          <button onClick={() => { if (confirm('Nộp bài ngay bây giờ? Sau khi nộp không sửa được nữa.')) doSubmit(false); }} className="btn-grad w-full py-3.5 rounded-2xl font-bold text-base" style={{ '--a': theme.a, '--b': theme.b }}>📨 Nộp bài</button>
        </div>
      </div>
    </div>
  );
};

// ============== MODAL CHUNG ==============
const Modal = ({ title, children, onClose }) => (
  <div className="fixed inset-0 bg-black/40 flex items-end sm:items-center justify-center z-50 p-0 sm:p-4" onClick={onClose}>
    <div className="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-5 fade-in max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
      <div className="flex items-center justify-between mb-4"><h3 className="font-bold text-lg">{title}</h3><button onClick={onClose} className="w-8 h-8 rounded-full bg-slate-100 text-slate-500">✕</button></div>
      {children}
    </div>
  </div>
);

// ============== APP ==============
const App = () => {
  const [role, setRole] = useState(null);       // null | 'teacher' | 'student'
  const [user, setUser] = useState(null);       // teacher firebase user
  const [ready, setReady] = useState(false);
  const [sv, setSv] = useState(null);           // student session
  useEffect(() => { document.documentElement.style.setProperty('--fs', (localStorage.getItem('cong_fs') || '16') + 'px'); }, []);
  useEffect(() => {
    const un = auth.onAuthStateChanged(u => {
      // GV = tài khoản có email; HS = ẩn danh (isAnonymous)
      if (u && !u.isAnonymous) { setUser(u); if (!role) setRole('teacher'); }
      else setUser(null);
      setReady(true);
    });
    // Phòng khi Firebase khởi động chậm/kẹt: sau 4 giây vẫn hiện màn hình vào lớp (không treo).
    const fallback = setTimeout(() => setReady(true), 4000);
    // Khôi phục phiên học sinh nếu có
    const savedCode = localStorage.getItem('sv_code'), savedName = localStorage.getItem('sv_name');
    if (savedCode && savedName && !role) {
      // chỉ gợi ý, không tự vào — để tránh nhầm; đợi user chọn
    }
    return () => { un(); clearTimeout(fallback); };
  }, []);
  // Cho phép giáo viên mở phần GV bằng ?gv (chủ yếu để thử); mặc định là app HỌC SINH / PHỤ HUYNH
  const teacherMode = new URLSearchParams(location.search).has('gv');
  if (!ready) return <div className="min-h-screen flex items-center justify-center"><div className="text-center"><div className="text-4xl animate-pulse mb-2">🎒</div><p className="text-slate-500">Đang tải...</p></div></div>;

  if (teacherMode) {
    if (user) return <TeacherHome user={user} />;
    return <TeacherLogin onBack={() => { location.href = location.pathname; }} />;
  }
  // ===== APP HỌC SINH / PHỤ HUYNH =====
  if (sv) return <StudentHome sv={sv} onLeave={() => { setSv(null); auth.signOut(); }} />;
  return <StudentJoin onJoined={setSv} />;
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
